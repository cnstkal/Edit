(()=>{
  const q=(s,r=document)=>r.querySelector(s);
  const qa=(s,r=document)=>Array.from(r.querySelectorAll(s));
  function fixed(){
    const top=q('.top'); if(!top)return;
    const home=qa('.top a,.top .home,.top .unified-home',top)[0];
    if(home){home.textContent='홈으로';home.classList.add('unified-home');}
    let save=qa('button,a',document).find(x=>((x.textContent||'').replace(/\\s/g,'').includes('PNG로저장'))||x.id==='save'||x.id==='savePng');
    if(save){let wrap=q('.editor-save-wrap',top);if(!wrap){wrap=document.createElement('div');wrap.className='editor-save-wrap';top.appendChild(wrap)}wrap.appendChild(save);save.textContent='PNG로 저장';}
    const settings=q('.settings');
    if(settings){
      let reset=qa('button',document).find(x=>((x.textContent||'').includes('기본값 복원')));
      if(reset){reset.classList.add('editor-reset-fixed');settings.appendChild(reset);}
      const preview=q('.preview-wrap,.preview');
      if(preview && window.matchMedia('(min-width:901px)').matches){
        settings.style.height=Math.max(0,preview.scrollHeight)+'px';
      }else if(settings){settings.style.height='auto';}
    }
  }
  window.addEventListener('DOMContentLoaded',fixed);window.addEventListener('load',fixed);window.addEventListener('resize',fixed);setTimeout(fixed,250);setTimeout(fixed,1000);
})();

    if(home){home.classList.add('home');home.textContent='홈으로';home.setAttribute('aria-label','홈으로')}
    let save=findText(document,/PNG\s*로\s*저장|PNG\s*저장/i);
    if(save){let box=top.querySelector('.top-right');if(!box){box=document.createElement('div');box.className='top-right';top.appendChild(box)}box.appendChild(save);save.textContent='PNG로 저장';save.classList.add('save')}

ue="24">24시간 형식으로 표시하세요.</option></select></div></div><div class="group"><div class="gtitle">✦ 메시지 추가</div><div class="field"><textarea id="newText" maxlength="500" placeholder="여기에 메시지 내용을 입력하세요."></textarea></div><div class="row"><select id="newAuthor"></select><button class="btn" id="add">＋ 추가</button></div><div class="toggle" style="margin-top:12px"><span style="font-size:13px;font-weight:650">내 메시지로 추가하세요.</span><label class="switch"><input id="newMine" type="checkbox"><span class="slider"></span></label></div><div class="toggle" style="margin-top:12px"><span style="font-size:13px;font-weight:650">읽음 표시를 사용하세요.</span><label class="switch"><input id="newRead" type="checkbox"><span class="slider"></span></label></div><div class="field" style="margin-top:10px"><div class="sub">읽음 숫자 (1~999)</div><input class="input" id="readText" inputmode="numeric" maxlength="3" value="1" placeholder="읽음 숫자를 입력하세요. (1~999)"></div><div class="sub" style="margin-top:12px">메시지 목록</div><div id="editor"></div></div><div class="group"><div class="gtitle">▣ 화면 옵션</div><div class="field"><div class="sub">배경 이미지 (선택)</div><div class="previewbg"><div class="swatch" id="swatch"></div><input id="bgImage" class="file" type="file" accept="image/*"></div><button class="mini" id="clearBg" style="margin-top:7px">삭제</button></div><div class="field"><div class="sub">테마 색상</div><input id="bg" type="color" value="#b8cbdc"></div><div class="toggle"><span style="font-size:13px">하단 입력창을 표시하세요.</span><label class="switch"><input id="composerOn" type="checkbox" checked><span class="slider"></span></label></div></div><div class="actions"><button class="btn" id="reset">기본값 복원</button><button class="btn dark" id="png">PNG로 저장</button></div></section></main><script>
(()=>{const $=id=>document.getElementById(id),KEY='kakao-editor-v7';const D={brand:'여기에 채팅방 이름을 입력하세요.',timeFormat:'12',bg:'#b8cbdc',bgImage:'',composerOn:true,profiles:[{id:'p1',name:'이름',image:''}],items:[{type:'date',text:'여기에 날짜를 입력하세요.'},{type:'msg',author:'p1',mine:false,text:'여기에 메시지를 입력하세요.',time:'시간',read:false,readCount:'1'},{type:'msg',author:'p1',mine:true,text:'여기에 메시지를 입력하세요.',time:'시간',read:true,readCount:'1'},{type:'msg',author:'p1',mine:false,text:'여기에 메시지를 입력하세요.',time:'시간',read:false,readCount:'1'}]};let d=JSON.parse(JSON.stringify(D)),panX=0,panY=0;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function persist(){try{localStorage.setItem(KEY,JSON.stringify({d,panX,panY,zoom:+$('zoom').value}))}catch(e){}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;d=Object.assign(JSON.parse(JSON.stringify(D)),x.d||{});if(!d.items){d.items=(d.messages||[]).map(m=>({type:'msg',...m}))}d.profiles=d.profiles?.length?d.profiles:D.profiles;panX=+x.panX||0;panY=+x.panY||0;if(x.zoom)$('zoom').value=x.zoom}catch(e){localStorage.removeItem(KEY)}}function prof(id){return d.profiles.find(p=>p.id===id)||d.profiles[0]}function fmtTime(t){if(!t)return '';if(d.timeFormat==='24')return t.replace(/^(오전|오후)\s*/,'');let m=t.match(/^(?:오전|오후)?\s*(\d{1,2}):(\d{2})$/);if(!m)return t;let h=+m[1],min=m[2],ap=h>=12?'오후':'오전';if(h>12)h-=12;return ap+' '+String(h).padStart(2,'0')+':'+min}function tail(i){const prev=d.items.slice(0,i).reverse().find(x=>x.type==='msg');const cur=d.items[i];if(!prev||cur.type!=='msg')return true;return prev.author!==cur.author||prev.time!==cur.time||prev.mine!==cur.mine}function renderProfiles(){const box=$('profiles');box.innerHTML=d.profiles.map(p=>`<div class="person"><img src="${p.image||''}" alt=""><input data-p="${p.id}" value="${esc(p.name)}"><button class="mini" data-del="${p.id}">×</button><div class="photo"><input type="file" accept="image/
