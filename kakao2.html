*{box-sizing:border-box;letter-spacing:-.04em}html,body{margin:0;background:#f3f1ed;color:#202124;font-family:Arial,'Noto Sans KR',sans-serif}body{padding:12px 10px 40px}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{width:min(1120px,100%);margin:auto auto 10px;display:flex;justify-content:center;align-items:center}.home{position:absolute;left:10px;border:1px solid #ddd9d2;border-radius:10px;background:#fff;padding:9px 13px;font-size:12px;font-weight:700}.layout{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(520px,760px);gap:24px}.tools,.panel{background:#fff;border:1px solid #dedbd6;border-radius:16px;box-shadow:0 4px 18px #0000000c}.tools{padding:10px 12px;display:flex;gap:8px;align-items:center;margin-bottom:10px}.tools select{width:auto;height:36px;padding:0 10px;border:1px solid #ddd9d2;border-radius:10px;background:#fff;font-size:12px}.zoom{margin-left:auto;display:flex;gap:5px;align-items:center}.zoom button{min-width:34px;padding:7px;border:1px solid #ddd9d2;background:#fff;border-radius:8px}.zoom input{width:130px}.stage{width:100%;max-width:429px;aspect-ratio:9/16;margin:auto;overflow:hidden;background:#ddd9d2;border-radius:14px;display:flex;align-items:center;justify-content:center;touch-action:none}.scale{transform-origin:center;flex:none}.chat{width:720px;height:auto;min-height:1280px;position:relative;overflow:hidden;background:#b8cbdc;display:flex;flex-direction:column}.chat.ratio-2to3{min-height:1080px}.chat.ratio-4to3{min-height:540px}.chat.pc{width:1600px;min-height:900px}.chat.ratio-9to16{min-height:1280px}.chat .messages{position:static;left:auto;right:auto;top:auto;bottom:auto;flex:0 0 auto;overflow:visible;padding:12px 25px 25px}.chat .composer{position:static;left:auto;right:auto;bottom:auto;flex:0 0 96px;margin-top:auto}.nav{height:118px;display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:0 22px}.room{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 180px);text-align:center;font-size:28px;font-weight:800;line-height:1.15}.navicons,.back{display:none}.tools select{width:auto;height:36px;padding:0 10px;border:1px solid #ddd9d2;border-radius:10px;background:#fff;font-size:12px}.stage.pc-frame{max-width:720px;aspect-ratio:16/9}.stage.pc-frame{max-width:720px;aspect-ratio:16/9}.chat.pc{width:1600px;min-height:900px}.messages{position:absolute;left:0;right:0;top:118px;bottom:96px;overflow:hidden;padding:12px 25px 25px}.day{display:flex;justify-content:center;margin:0 0 28px}.day span{background:#8fa5b7d9;color:#fff;border-radius:22px;padding:10px 22px;font-size:19px}.msg{display:flex;gap:22px;margin:0 0 24px;align-items:flex-start}.msg.mine{justify-content:flex-end}.avatar{width:58px;height:58px;flex:none;border-radius:26px;background:#ddd center/cover no-repeat}.msg.mine .avatar{display:none}.msgbody{max-width:570px}.name{font-size:20px;margin:1px 0 6px}.msg.mine .name{display:none}.bubbleline{display:flex;align-items:flex-end;gap:7px}.msg.mine .bubbleline{flex-direction:row-reverse}.bubble{position:relative;max-width:500px;background:#fff;border-radius:0 20px 20px 20px;padding:13px 18px;font-size:24px;line-height:1.35;white-space:pre-wrap;word-break:break-word}.msg.mine .bubble{background:#ffe347;border-radius:20px 0 20px 20px}.bubble.tail:before{content:'';position:absolute;left:-9px;top:0;border-top:11px solid #fff;border-left:10px solid transparent}.msg.mine .bubble.tail:before{left:auto;right:-9px;border-top-color:#ffe347;border-left:0;border-right:10px solid transparent}.bubbletime{font-size:15px;color:#77808a;white-space:nowrap}.read{font-size:14px;color:#ffd400;font-weight:700;margin-bottom:4px;line-height:1}.timebox{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;min-width:28px}.msg:not(.mine) .timebox{align-items:flex-start}.composer{position:absolute;left:0;right:0;bottom:0;height:96px;background:#fff;display:flex;align-items:center;padding:12px 20px;gap:10px;border-top:1px solid #ddd}.composer .circle{width:48px;height:48px;border:1px solid #ddd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:29px;background:#fff}.inputbar{height:56px;flex:1;background:#f6f6f6;border:1px solid #ddd;border-radius:28px;padding:0 20px;color:#777;font-size:20px;outline:0}.send{width:56px;height:56px;flex:none;border:0;background:#fee500;border-radius:50%;font-size:0;position:relative;display:flex;align-items:center;justify-content:center}.send:before{content:'';position:absolute;width:5px;height:27px;background:#222;border-radius:3px;left:25.5px;top:15px}.send:after{content:'';position:absolute;width:17px;height:17px;border-left:5px solid #222;border-top:5px solid #222;transform:rotate(45deg);left:17px;top:12px;border-radius:2px}.bgimage{background-size:cover!important;background-position:center!important}.panel{padding:14px;align-self:start;width:100%;max-width:760px;justify-self:center}.group{border-bottom:1px solid #eeeae4;padding:18px 8px}.group:first-child{padding-top:5px}.group:last-child{border-bottom:0}.gtitle{font-size:15px;font-weight:800;margin-bottom:14px}.field{margin-bottom:13px}.sub{font-size:12px;color:#777;margin-bottom:6px}.input,textarea,select{width:100%;padding:10px;border:1px solid #ddd9d2;border-radius:10px;background:#faf9f7}.date-add{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.date-add .btn{height:42px;width:72px}.date-item{display:flex;justify-content:center;margin-top:8px}.date-item span{background:#8fa5b7d9;color:#fff;border-radius:22px;padding:7px 14px;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file{font-size:11px}.toggle{display:flex;justify-content:space-between;align-items:center}.switch{position:relative;width:48px;height:28px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:20px;background:#d4d4d4}.slider:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:#3f8eea}.switch input:checked+.slider:before{transform:translateX(20px)}.profiles{display:grid;gap:8px}.person{border:1px solid #e5e1db;border-radius:10px;padding:9px;display:grid;grid-template-columns:48px 1fr 28px;gap:8px;align-items:center}.person img{width:48px;height:48px;border-radius:17px;object-fit:cover;background:#eee}.person input{width:100%;padding:7px;border:1px solid #ddd9d2;border-radius:8px}.person .photo{grid-column:1 / -1;display:flex;gap:7px;align-items:center}.person .photo input{font-size:10px;min-width:0}.mini{border:1px solid #ddd9d2;background:#fff;border-radius:8px;padding:7px 9px;font-size:12px}.editor{border:1px solid #e5e1db;border-radius:11px;padding:10px;margin-top:8px}.editor b{font-size:12px}.editor .delete{float:right;border:0;background:transparent;font-size:18px;color:#777}.msgrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.btn{width:100%;border:1px solid #ddd9d2;background:#fff;border-radius:9px;padding:9px;font-size:12px}.dark{background:#171717;color:#fff;border-color:#171717}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:11px;color:#999;line-height:1.5;margin-top:6px}.previewbg{display:flex;gap:8px;align-items:center}.previewbg .swatch{width:54px;height:54px;border-radius:9px;background:#b8cbdc;border:1px solid #ddd9d2;background-size:cover;background-position:center}@media(max-width:900px){.layout{display:flex;flex-direction:column}.preview{order:1}.panel{order:2;width:100%;max-width:760px;margin:auto}.zoom{width:100%;margin-left:0}.zoom input{flex:1}.home{left:10px}}@media(max-width:760px){.layout{display:flex;flex-direction:column}.preview{order:1}.panel{order:2}.zoom{width:100%;margin-left:0}.zoom input{flex:1}}

</style></style></head><body><div class="top"><button class="home" onclick="location.href='index.html'">← 홈으로</button><b>카톡 편집기</b></div><main class="layout"><section class="preview"><div class="tools"><select id="mode"><option value="mobile">모바일 · 9:16</option><option value="2to3">모바일 · 2:3</option><option value="4to3">모바일 · 4:3</option><option value="pc">PC · 16:9</option></select><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="10" max="100" value="45"><span id="zt">45%</span></div></div><div class="stage" id="stage"><div class="scale" id="scale"><section class="chat" id="chat"><div class="nav"><div class="back"></div><div class="room"><div id="pvBrand">여기에 채팅방 이름을 입력하세요.</div></div><div class="navicons"></div></div><div class="messages" id="messages"></div><footer class="composer" id="composer"><div class="circle">＋</div><input class="inputbar" id="pvInput" placeholder="여기에 메시지를 입력하세요."><button class="send" id="send" aria-label="전송"></button></footer></section></div></div></section><section class="panel"><div class="group"><div class="gtitle">✚ 기본 설정</div><div class="field"><div class="sub">상단 이름</div><input class="input" id="brand" maxlength="20" value="여기에 채팅방 이름을 입력하세요."></div></div><div class="group"><div class="gtitle">▣ 프로필 설정</div><div class="profiles" id="profiles"></div><button class="btn" id="addProfile" style="margin-top:8px">＋ 프로필 추가</button><div class="hint">프로필을 여러 개 만들고 메시지마다 발신자를 선택하면 단체방처럼 사용할 수 있습니다.</div></div><div class="group"><div class="gtitle">✚ 날짜 추가</div><div class="date-add"><input class="input" id="dateText" placeholder="여기에 날짜를 입력하세요."><button class="btn" id="addDate">＋ 추가</button></div><div id="dateList"></div><div class="hint">날짜도 메시지처럼 원하는 위치에 추가하고 순서를 드래그해 정리할 수 있습니다.</div></div><div class="group"><div class="gtitle">✚ 대화 설정</div><div class="field"><div class="sub">대화 시간 형식</div><select id="timeFormat"><option value="12">12시간 형식으로 표시하세요.</option><option value="24">24시간 형식으로 표시하세요.</option></select></div></div><div class="group"><div class="gtitle">✦ 메시지 추가</div><div class="field"><textarea id="newText" maxlength="500" placeholder="여기에 메시지 내용을 입력하세요."></textarea></div><div class="row"><select id="newAuthor"></select><button class="btn" id="add">＋ 추가</button></div><div class="toggle" style="margin-top:12px"><span style="font-size:13px;font-weight:650">내 메시지로 추가하세요.</span><label class="switch"><input id="newMine" type="checkbox"><span class="slider"></span></label></div><div class="toggle" style="margin-top:12px"><span style="font-size:13px;font-weight:650">읽음 표시를 사용하세요.</span><label class="switch"><input id="newRead" type="checkbox"><span class="slider"></span></label></div><div class="field" style="margin-top:10px"><div class="sub">읽음 숫자 (1~999)</div><input class="input" id="readText" inputmode="numeric" maxlength="3" value="1" placeholder="읽음 숫자를 입력하세요. (1~999)"></div><div class="sub" style="margin-top:12px">메시지 목록</div><div id="editor"></div></div><div class="group"><div class="gtitle">▣ 화면 옵션</div><div class="field"><div class="sub">배경 이미지 (선택)</div><div class="previewbg"><div class="swatch" id="swatch"></div><input id="bgImage" class="file" type="file" accept="image/*"></div><button class="mini" id="clearBg" style="margin-top:7px">삭제</button></div><div class="field"><div class="sub">테마 색상</div><input id="bg" type="color" value="#b8cbdc"></div><div class="toggle"><span style="font-size:13px">하단 입력창을 표시하세요.</span><label class="switch"><input id="composerOn" type="checkbox" checked><span class="slider"></span></label></div></div><div class="actions"><button class="btn" id="reset">기본값 복원</button><button class="btn dark" id="png">PNG로 저장</button></div></section></main><script>
(()=>{const $=id=>document.getElementById(id),KEY='kakao-editor-v7';const D={brand:'여기에 채팅방 이름을 입력하세요.',timeFormat:'12',bg:'#b8cbdc',bgImage:'',composerOn:true,profiles:[{id:'p1',name:'여기에 이름을 입력하세요.',image:''}],items:[{type:'date',text:'여기에 날짜를 입력하세요.'},{type:'msg',author:'p1',mine:false,text:'여기에 메시지를 입력하세요.',time:'여기에 시간을 입력하세요.',read:false,readCount:'1'},{type:'msg',author:'p1',mine:true,text:'여기에 메시지를 입력하세요.',time:'여기에 시간을 입력하세요.',read:true,readCount:'1'},{type:'msg',author:'p1',mine:false,text:'여기에 메시지를 입력하세요.',time:'여기에 시간을 입력하세요.',read:false,readCount:'1'}]};let d=JSON.parse(JSON.stringify(D)),panX=0,panY=0;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function persist(){try{localStorage.setItem(KEY,JSON.stringify({d,panX,panY,zoom:+$('zoom').value}))}catch(e){}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;d=Object.assign(JSON.parse(JSON.stringify(D)),x.d||{});if(!d.items){d.items=(d.messages||[]).map(m=>({type:'msg',...m}))}d.profiles=d.profiles?.length?d.profiles:D.profiles;panX=+x.panX||0;panY=+x.panY||0;if(x.zoom)$('zoom').value=x.zoom}catch(e){localStorage.removeItem(KEY)}}function prof(id){return d.profiles.find(p=>p.id===id)||d.profiles[0]}function fmtTime(t){if(!t)return '';if(d.timeFormat==='24')return t.replace(/^(오전|오후)\s*/,'');let m=t.match(/^(?:오전|오후)?\s*(\d{1,2}):(\d{2})$/);if(!m)return t;let h=+m[1],min=m[2],ap=h>=12?'오후':'오전';if(h>12)h-=12;return ap+' '+String(h).padStart(2,'0')+':'+min}function tail(i){const prev=d.items.slice(0,i).reverse().find(x=>x.type==='msg');const cur=d.items[i];if(!prev||cur.type!=='msg')return true;return prev.author!==cur.author||prev.time!==cur.time||prev.mine!==cur.mine}function renderProfiles(){const box=$('profiles');box.innerHTML=d.profiles.map(p=>`<div class="person"><img src="${p.image||''}" alt=""><input data-p="${p.id}" value="${esc(p.name)}"><button class="mini" data-del="${p.id}">×</button><div class="photo"><input type="file" accept="image/*" data-img="${p.id}"></div></div>`).join('');box.querySelectorAll('[data-p]').forEach(el=>el.oninput=()=>{const p=prof(el.dataset.p);p.name=el.value;renderAuthors();render()});box.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{if(d.profiles.length<=1)return;const id=el.dataset.del;d.profiles=d.profiles.filter(p=>p.id!==id);d.items=d.items.map(x=>x.type==='msg'&&x.author===id?{...x,author:d.profiles[0].id}:x);renderProfiles();renderAuthors();render()});box.querySelectorAll('[data-img]').forEach(el=>el.onchange=e=>{const f=e.target.files?.[0];if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{prof(el.dataset.img).image=r.result;renderProfiles();render()};r.readAsDataURL(f)})}function renderAuthors(){const s=$('newAuthor'),old=s.value;s.innerHTML=d.profiles.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');s.value=d.profiles.some(p=>p.id===old)?old:d.profiles[0].id}function renderDates(){const box=$('dateList');box.innerHTML=d.items.map((x,i)=>x.type==='date'?`<div class="date-item"><span>${esc(x.text)} <button class="mini" data-date-del="${i}" style="padding:2px 6px;margin-left:5px">×</button></span></div>`:'').join('');box.querySelectorAll('[data-date-del]').forEach(e=>e.onclick=()=>{d.items.splice(+e.dataset.dateDel,1);renderDates();render()})}function renderEditor(){const box=$('editor');box.innerHTML=d.items.map((x,i)=>x.type==='msg'?`<div class="editor"><button class="delete" data-x="${i}">×</button><b>${x.mine?'내 메시지':esc(prof(x.author).name)}</b><div class="msgrow"><select data-a="${i}">${d.profiles.map(p=>`<option value="${p.id}" ${p.id===x.author?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input class="input" data-t="${i}" value="${esc(x.time)}" placeholder="여기에 시간을 입력하세요."></div><textarea data-m="${i}" placeholder="여기에 메시지 내용을 입력하세요.">${esc(x.text)}</textarea><div class="toggle"><span style="font-size:12px">읽음 표시를 사용하세요.</span><label class="switch"><input type="checkbox" data-r="${i}" ${x.read?'checked':''}><span class="slider"></span></label></div><input class="input" style="margin-top:7px" data-n="${i}" value="${esc(x.readCount||'1')}" inputmode="numeric" maxlength="3" placeholder="읽음 숫자를 입력하세요. (1~999)"></div>`:'').join('');box.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{d.items.splice(+e.dataset.x,1);renderEditor();render()});box.querySelectorAll('[data-a]').forEach(e=>e.onchange=()=>{d.items[+e.dataset.a].author=e.value;renderEditor();render()});box.querySelectorAll('[data-t]').forEach(e=>e.oninput=()=>{d.items[+e.dataset.t].time=e.value;render()});box.querySelectorAll('[data-m]').forEach(e=>e.oninput=()=>{d.items[+e.dataset.m].text=e.value;render()});box.querySelectorAll('[data-r]').forEach(e=>e.onchange=()=>{d.items[+e.dataset.r].read=e.checked;render()});box.querySelectorAll('[data-n]').forEach(e=>e.oninput=()=>{let v=e.value.replace(/\D/g,'').slice(0,3);if(v&&+v>999)v='999';if(v==='0')v='1';e.value=v;d.items[+e.dataset.n].readCount=v||'1';render()})}function render(){ $('pvBrand').textContent=d.brand||'';$('composer').style.display=d.composerOn?'flex':'none';$('messages').style.bottom=d.composerOn?'96px':'0';const chat=$('chat');chat.style.backgroundColor=d.bg;chat.classList.toggle('bgimage',!!d.bgImage);chat.style.backgroundImage=d.bgImage?`url(${d.bgImage})`:'';$('swatch').style.backgroundColor=d.bg;$('swatch').style.backgroundImage=d.bgImage?`url(${d.bgImage})`:'';$('messages').innerHTML=d.items.map((x,i)=>{if(x.type==='date')return `<div class="day"><span>${esc(x.text)}</span></div>`;const p=prof(x.author),t=tail(i);return `<div class="msg ${x.mine?'mine':''}"><div class="avatar" style="background-image:url(${p.image||''})"></div><div class="msgbody">${!x.mine?`<div class="name">${esc(p.name)}</div>`:''}<div class="bubbleline"><div class="bubble ${t?'tail':''}">${esc(x.text)}</div><div class="timebox">${x.read?`<span class="read">${esc(x.readCount||'1')}</span>`:''}<span class="bubbletime">${esc(fmtTime(x.time))}</span></div></div></div></div>`}).join('');renderDates();renderEditor();applyTransform();persist()}function applyTransform(){const z=(+$('zoom').value||45)/100;$('scale').style.transform=`translate(${panX}px,${panY}px) scale(${z})`;$('zt').textContent=Math.round(z*100)+'%'}function fit(){const pc=$('chat').classList.contains('pc'),cw=pc?1600:720,ch=pc?900:1280,r=$('stage').getBoundingClientRect(),z=Math.min((r.width-8)/cw,(r.height-8)/ch)*100;$('zoom').value=Math.max(10,Math.min(100,z));panX=panY=0;applyTransform();persist()}function addMessage(text,author,mine=false){const now=new Date();let h=now.getHours(),m=String(now.getMinutes()).padStart(2,'0'),ap=h>=12?'오후':'오전';if(d.timeFormat==='12'){h=h%12||12;h=String(h).padStart(2,'0')}else h=String(h).padStart(2,'0');d.items.push({type:'msg',author,mine,text,time:d.timeFormat==='12'?ap+' '+h+':'+m: h+':'+m,read:false,readCount:'1'});render()}$('brand').oninput=e=>{d.brand=e.target.value;render()};$('timeFormat').onchange=e=>{d.timeFormat=e.target.value;render()};$('composerOn').onchange=e=>{d.composerOn=e.target.checked;render()};$('bg').oninput=e=>{d.bg=e.target.value;render()};$('addProfile').onclick=()=>{d.profiles.push({id:'p'+Date.now(),name:'여기에 이름을 입력하세요.',image:''});renderProfiles();renderAuthors();render()};$('add').onclick=()=>{const text=$('newText').value.trim();if(!text)return;const rc=Math.max(1,Math.min(999,parseInt($('readText').value||'1',10)||1));d.items.push({type:'msg',author:$('newAuthor').value,mine:$('newMine').checked,text,time:'여기에 시간을 입력하세요.',read:$('newRead').checked,readCount:String(rc)});$('newText').value='';render()};$('addDate').onclick=()=>{const text=$('dateText').value.trim();if(!text)return;d.items.push({type:'date',text});$('dateText').value='';render()};$('send').onclick=()=>{const x=$('pvInput').value.trim();if(!x)return;addMessage(x,d.profiles[0].id,true);$('pvInput').value=''};$('pvInput').addEventListener('keydown',e=>{if(e.key==='Enter (()=>{
  const m=document.getElementById('mode'),st=document.getElementById('stage'),ch=document.getElementById('chat');
  if(!m||!st||!ch)return;
  function applyKakaoRatio(){
    const v=m.value;
    st.classList.remove('pc-frame','ratio-2to3','ratio-4to3');
    ch.classList.remove('pc','ratio-2to3','ratio-4to3');
    if(v==='pc'){st.classList.add('pc-frame');ch.classList.add('pc')}

  }
  m.addEventListener('change',applyKakaoRatio);
  applyKakaoRatio();
})();
