<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>카톡 편집기</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');*{box-sizing:border-box;letter-spacing:-.04em}html,body{margin:0;background:#f3efe7;color:#222;font-family:Pretendard,sans-serif}body{padding:12px 10px 40px}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{width:min(1120px,100%);margin:auto auto 10px;display:flex;justify-content:space-between;align-items:center}.home,.save{border:1px solid #d8d2c8;border-radius:10px;background:#fffdf9;padding:9px 13px;font-size:12px;font-weight:700}.layout{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px}.tools,.panel{background:#fffdf8;border:1px solid #dfd9ce;border-radius:16px;box-shadow:0 5px 18px #7771}.tools{padding:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.zoom{margin-left:auto;display:flex;gap:5px;align-items:center}.zoom button{min-width:34px;padding:7px;border:1px solid #ddd6ca;background:#fffdf8;border-radius:8px}.zoom input{width:130px}.stage{width:100%;max-width:520px;aspect-ratio:9/16;margin:auto;overflow:hidden;background:#d9d4ca;border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;touch-action:none}.scale{transform-origin:center;flex:none}.chat{width:720px;height:1280px;position:relative;overflow:hidden;background:#a1b9cb}.head{height:115px;display:flex;justify-content:center;padding-top:20px;position:relative;z-index:2}.brand{background:#fff;border-radius:34px;padding:16px 22px;font-size:25px;font-weight:650}.scroll{position:absolute;left:0;right:0;top:115px;bottom:95px;overflow:auto;padding:18px 0 28px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.day{display:flex;justify-content:center;margin:0 0 28px}.day span{background:#9ab3c5;border-radius:30px;padding:11px 26px;font-size:22px}.msg{display:grid;grid-template-columns:78px 1fr;gap:9px;margin:0 34px 16px;align-items:start}.msg.me{grid-template-columns:1fr}.msg.me .avatar{display:none}.msg.me .body{justify-self:end;display:flex;flex-direction:column;align-items:flex-end}.avatar{width:64px;height:64px;border-radius:23px;background:#777 center/cover no-repeat}.name{font-size:20px;margin:0 0 7px}.brow{display:flex;align-items:flex-end;gap:6px;margin-bottom:4px}.msg.me .brow{flex-direction:row-reverse}.bubble{position:relative;display:block;max-width:510px;background:#fff;border-radius:0 25px 25px 25px;padding:13px 18px;font-size:26px;line-height:1.38;white-space:pre-wrap;word-break:break-word}.msg.me .bubble{background:#ffea58;border-radius:25px 0 25px 25px}.bubble.tail:before{content:'';position:absolute;left:-10px;top:0;border-top:12px solid #fff;border-left:11px solid transparent}.msg.me .bubble.tail:before{left:auto;right:-10px;border-top-color:#ffea58;border-left:0;border-right:11px solid transparent}.bubble time{display:inline-block;font-size:13px;color:#999;margin-left:9px;white-space:nowrap;vertical-align:bottom}.msg.me .bubble time{color:#777}.read{font-size:13px;color:#777;align-self:end;margin-bottom:4px}.composer{position:absolute;left:0;right:0;bottom:0;height:95px;background:#fff;display:flex;align-items:center;padding:15px 34px;gap:14px;z-index:5}.circle{width:54px;height:54px;border-radius:50%;background:#f1f1f1;display:flex;align-items:center;justify-content:center;font-size:31px}.inputbar{height:58px;flex:1;background:#f1f1f1;border-radius:31px;display:flex;align-items:center;padding:0 22px;color:#aaa;font-size:22px}.inputbar input{width:100%;border:0;background:transparent;outline:0;color:#555;font-size:22px}.send{width:50px;height:50px;border:0;border-radius:50%;background:#ffea58;font-size:22px}.hash{font-size:31px;font-weight:700}.panel{padding:16px;align-self:start}.group{border-top:1px solid #eee8de;padding:18px 0}.group:first-child{border-top:0;padding-top:0}.label{font-size:14px;font-weight:650;margin-bottom:9px}.sub{font-size:11px;color:#999;margin-bottom:7px}.field{margin-bottom:11px}input,textarea,select{width:100%;padding:9px 10px;border:1px solid #ddd6ca;border-radius:9px;background:#f9f6ef}textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file{font-size:11px}.toggle{display:flex;justify-content:space-between;align-items:center}.switch{position:relative;width:48px;height:28px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:20px;background:#d8d8d8}.slider:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:#2479e8}.switch input:checked+.slider:before{transform:translateX(20px)}.editor{border:1px solid #e7e0d5;border-radius:10px;padding:10px;margin-top:8px}.editor>*{margin-bottom:7px}.btn{width:100%;border:1px solid #d9d2c7;background:#fffdf8;border-radius:9px;padding:9px;font-size:12px}.dark{background:#171717;color:#fff;border-color:#171717}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.profileline{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:end}.mini{font-size:10px}.danger{color:#c33}.sendrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:760px){.layout{display:flex;flex-direction:column}.preview{order:1}.panel{order:2}.zoom{width:100%;margin-left:0}.zoom input{flex:1}}</style></head><body><div class="top"><button class="home" onclick="location.href='index.html'">← 홈으로</button><b>카톡 편집기</b><button class="save" id="save">PNG 저장</button></div><main class="layout"><section class="preview"><div class="tools"><b>프리뷰</b><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="10" max="100" value="40"><span id="zt">40%</span></div></div><div class="stage" id="stage"><div class="scale" id="scale"><section class="chat" id="chat"><header class="head"><div class="brand" id="pvBrand"></div></header><div class="scroll" id="messages"></div><footer class="composer" id="composer"><div class="circle">＋</div><div class="inputbar"><input id="compose" placeholder="메시지 입력"></div><button class="send" id="send">➤</button><div class="hash">#</div></footer></section></div></div></section><section class="panel"><div class="group"><div class="label">채팅 기본 설정</div><div class="field"><div class="sub">채팅방 이름</div><input id="brand" value="치킨시와"></div><div class="row"><div><div class="sub">배경색</div><input id="bg" type="color" value="#a1b9cb"></div><div><div class="sub">배경 이미지</div><input id="bgImg" class="file" type="file" accept="image/*"></div></div><div class="toggle" style="margin-top:14px"><span style="font-size:13px;font-weight:600">채팅 입력창 표시</span><label class="switch"><input id="composerOn" type="checkbox" checked><span class="slider"></span></label></div><div class="toggle" style="margin-top:14px"><span style="font-size:13px;font-weight:600">날짜 표시</span><label class="switch"><input id="dateOn" type="checkbox"><span class="slider"></span></label></div></div><div class="group"><div class="label">프로필</div><div class="sub">여러 명을 추가하고 '나'를 지정할 수 있습니다.</div><div id="profiles"></div><button class="btn" id="addProfile">＋ 프로필 추가</button></div><div class="group"><div class="label">메시지</div><div class="sub">같은 사람이 같은 시간에 연속으로 보낸 말풍선은 첫 번째에만 꼬리가 생깁니다.</div><div id="editor"></div><div class="sendrow"><button class="btn" id="add">＋ 메시지 추가</button><button class="btn" id="addMe">＋ 내 메시지 추가</button></div></div><div class="actions"><button class="btn" id="reset">기본값 복원</button><button class="btn dark" id="png">PNG로 저장</button></div></section></main><script>(()=>{const $=id=>document.getElementById(id),S='kakao-editor-v2',D={brand:'치킨시와',bg:'#a1b9cb',bgImg:'',composerOn:true,dateOn:false,profiles:[{id:'p1',name:'송민기',img:'',me:false},{id:'me',name:'나',img:'',me:true}],messages:[{date:'2026년 3월 25일 수요일',sender:'p1',text:'작실 ㄱ',time:'',read:''},{date:'2026년 3월 25일 수요일',sender:'p1',text:'저녁 먹지 말고 와',time:'',read:''},{date:'2026년 3월 26일 목요일',sender:'p1',text:'작실 ㄱ',time:'',read:''},{date:'2026년 3월 29일 일요일',sender:'p1',text:'ㅈㅅ ㄱ',time:'',read:''},{date:'2026년 4월 1일 수요일',sender:'p1',text:'ㄱ',time:'',read:''},{date:'2026년 4월 9일 목요일',sender:'p1',text:'쇼미에 너 전남친 나오는데\n\n뭐냐 이거',time:'',read:''}]};let d=JSON.parse(JSON.stringify(D)),panX=0,panY=0;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){try{localStorage.setItem(S,JSON.stringify({d,panX,panY,zoom:+$('zoom').value}))}catch(e){}}function load(){try{let x=JSON.parse(localStorage.getItem(S)||'null');if(!x)return;d=Object.assign(JSON.parse(JSON.stringify(D)),x.d||{});if(x.d?.profile&&!d.profiles?.some(p=>p.img===x.d.profile)){d.profiles=[{id:'p1',name:x.d.messages?.[0]?.name||'송민기',img:x.d.profile,me:false},{id:'me',name:'나',img:'',me:true}]}if(!Array.isArray(d.profiles))d.profiles=JSON.parse(JSON.stringify(D.profiles));d.messages=(d.messages||[]).map(m=>({date:m.date||'',sender:m.sender||'p1',text:m.text||'',time:m.time??(m.times?.[0]||''),read:m.read||'',...m}));if(x.panX)panX=+x.panX;if(x.panY)panY=+x.panY;if(x.zoom)$('zoom').value=x.zoom}catch(e){localStorage.removeItem(S)}}function prof(id){return d.profiles.find(p=>p.id===id)||d.profiles[0]||{id:'p1',name:'이름',img:'',me:false}}function render(){$('pvBrand').textContent=d.brand;$('chat').style.backgroundColor=d.bg;$('chat').style.backgroundImage=d.bgImg?'url("'+d.bgImg+'")':'none';$('composer').style.display=d.composerOn?'flex':'none';let out='';d.messages.forEach((m,i)=>{let p=prof(m.sender),me=!!p.me,prev=d.messages[i-1],same=prev&&prev.sender===m.sender&&prev.time===m.time,first=!same,date=d.dateOn&&m.date&&(!prev||prev.date!==m.date);if(date)out+='<div class="day"><span>'+esc(m.date)+'</span></div>';if(first){out+='<div class="msg '+(me?'me':'')+'">';if(!me)out+='<span class="avatar" style="background-image:'+(p.img?'url("'+p.img+'")':'none')+'"></span>';out+='<div class="body">';if(!me)out+='<div class="name">'+esc(p.name)+'</div>'}else out+='<div class="msg '+(me?'me':'')+' compact"><div class="body">';out+='<div class="brow"><div class="bubble '+(first?'tail':'')+'">'+esc(m.text).replace(/\n/g,'<br>')+(m.time?'<time>'+esc(m.time)+'</time>':'')+'</div>'+(me&&m.read?'<span class="read">'+esc(m.read)+'</span>':'')+'</div></div></div>'});$('messages').innerHTML=out;$('brand').value=d.brand;$('bg').value=d.bg;$('composerOn').checked=d.composerOn;$('dateOn').checked=d.dateOn}function profiles(){let e=$('profiles');e.innerHTML=d.profiles.map((p,i)=>'<div class="editor"><div class="profileline"><div><b>'+esc(p.name||'프로필')+'</b><div class="mini">'+(p.me?'내 프로필':'상대 프로필')+'</div></div><button class="btn danger" data-pdel="'+i+'">삭제</button></div><input data-pname="'+i+'" value="'+esc(p.name)+'" placeholder="이름"><input data-pimg="'+i+'" class="file" type="file" accept="image/*"><label class="toggle" style="margin-top:7px;font-size:12px">내 프로필 <input data-pme="'+i+'" type="checkbox" '+(p.me?'checked':'')+'></label></div>').join('');e.querySelectorAll('[data-pname]').forEach(x=>x.oninput=()=>{d.profiles[+x.dataset.pname].name=x.value;render();save()});e.querySelectorAll('[data-pme]').forEach(x=>x.onchange=()=>{d.profiles.forEach((p,i)=>p.me=i===+x.dataset.pme&&x.checked);profiles();editors();render();save()});e.querySelectorAll('[data-pimg]').forEach(x=>x.onchange=ev=>{let f=ev.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>15*1024*1024)return alert('15MB 이하 이미지 파일만 사용할 수 있습니다.');let r=new FileReader;r.onload=()=>{d.profiles[+x.dataset.pimg].img=r.result;render();save()};r.readAsDataURL(f)});e.querySelectorAll('[data-pdel]').forEach(x=>x.onclick=()=>{if(d.profiles.length<=1)return;let id=d.profiles[+x.dataset.pdel].id;if(d.messages.some(m=>m.sender===id))return alert('이 프로필을 사용하는 메시지가 있어 삭제할 수 없습니다.');d.profiles.splice(+x.dataset.pdel,1);profiles();editors();render();save()})}function editors(){let e=$('editor');e.innerHTML=d.messages.map((m,i)=>'<div class="editor"><b>메시지 '+(i+1)+'</b><select data-sender="'+i+'">'+d.profiles.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===m.sender?'selected':'')+'>'+esc(p.name)+(p.me?' (나)':'')+'</option>').join('')+'</select><input data-date="'+i+'" value="'+esc(m.date)+'" placeholder="날짜"><textarea data-text="'+i+'">'+esc(m.text)+'</textarea><div class="row"><input data-time="'+i+'" value="'+esc(m.time||'')+'" placeholder="보낸 시간"><input data-read="'+i+'" value="'+esc(m.read||'')+'" placeholder="읽음 수 (예: 1)"></div><button class="btn danger" data-del="'+i+'">삭제</button></div>').join('');e.querySelectorAll('[data-sender]').forEach(x=>x.onchange=()=>{d.messages[+x.dataset.sender].sender=x.value;render();save()});e.querySelectorAll('[data-date]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.date].date=x.value;render();save()});e.querySelectorAll('[data-text]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.text].text=x.value;render();save()});e.querySelectorAll('[data-time]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.time].time=x.value;render();save()});e.querySelectorAll('[data-read]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.read].read=x.value;render();save()});e.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{d.messages.splice(+x.dataset.del,1);editors();render();save()})}function addMsg(sender){d.messages.push({date:'2026년 4월 10일 금요일',sender:sender||d.profiles[0]?.id,text:'메시지를 입력하세요.',time:'12:00',read:sender===d.profiles.find(p=>p.me)?.id?'1':''});editors();render();save();setTimeout(()=>{$('messages').scrollTop=$('messages').scrollHeight},0)}function clamp(){let st=$('stage'),n=$('chat'),z=+$('zoom').value/100,mx=Math.max(0,(n.offsetWidth*z-st.clientWidth)/2),my=Math.max(0,(n.offsetHeight*z-st.clientHeight)/2);panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY))}function tr(){let z=+$('zoom').value/100;$('zt').textContent=Math.round(z*100)+'%';$('scale').style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+z+')'}function zoom(v,r){let old=+$('zoom').value;v=Math.max(10,Math.min(100,+v));$('zoom').value=v;if(r)panX=panY=0;else{let q=v/old;panX*=q;panY*=q}clamp();tr();save()}function fit(){let s=$('stage');zoom(Math.max(10,Math.min(100,Math.min((s.clientWidth-20)/720,(s.clientHeight-20)/1280)*100*.92)),true)}$('brand').oninput=()=>{d.brand=$('brand').value;render();save()};$('bg').oninput=()=>{d.bg=$('bg').value;render();save()};$('composerOn').onchange=()=>{d.composerOn=$('composerOn').checked;render();save()};$('dateOn').onchange=()=>{d.dateOn=$('dateOn').checked;render();save()};$('bgImg').onchange=e=>{let f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>15*1024*1024)return alert('15MB 이하 이미지 파일만 사용할 수 있습니다.');let r=new FileReader;r.onload=()=>{d.bgImg=r.result;render();save()};r.readAsDataURL(f)};$('addProfile').onclick=()=>{d.profiles.push({id:'p'+Date.now(),name:'새로운 친구',img:'',me:false});profiles();editors();render();save()};$('add').onclick=()=>addMsg(d.profiles.find(p=>!p.me)?.id||d.profiles[0]?.id);$('addMe').onclick=()=>addMsg(d.profiles.find(p=>p.me)?.id||d.profiles[0]?.id);$('send').onclick=()=>{let v=$('compose').value.trim();if(!v)return;let me=d.profiles.find(p=>p.me)||d.profiles[0];d.messages.push({date:'',sender:me.id,text:v,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),read:'1'});$('compose').value='';editors();render();save();setTimeout(()=>{$('messages').scrollTop=$('messages').scrollHeight},0)};$('compose').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('send').click()}};$('reset').onclick=()=>{if(!confirm('기본값으로 복원할까요?'))return;d=JSON.parse(JSON.stringify(D));panX=panY=0;$('zoom').value=40;render();profiles();editors();fit();save()};$('zoom').oninput=e=>zoom(e.target.value);$('minus').onclick=()=>zoom(+$('zoom').value-5);$('plus').onclick=()=>zoom(+$('zoom').value+5);$('fit').onclick=fit;async function png(){try{let c=await html2canvas($('chat'),{backgroundColor:d.bg,scale:2});let a=document.createElement('a');a.download='kakao-preview.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장에 실패했습니다.')}}$('save').onclick=png;$('png').onclick=png;let drag=false,sx=0,sy=0,ox=0,oy=0;$('stage').onpointerdown=e=>{if(e.target.closest('input,textarea,button,select'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=panX;oy=panY;$('stage').setPointerCapture(e.pointerId)};$('stage').onpointermove=e=>{if(!drag)return;panX=ox+e.clientX-sx;panY=oy+e.clientY-sy;clamp();tr()};$('stage').onpointerup=e=>{drag=false;try{$('stage').releasePointerCapture(e.pointerId)}catch(_){}save()};load();render();profiles();editors();requestAnimationFrame(fit)})();</script></body></html>
