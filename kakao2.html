<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>카톡 편집기</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>*{box-sizing:border-box;letter-spacing:-.04em}html,body{margin:0;background:#f3f1ed;color:#202124;font-family:Arial,'Noto Sans KR',sans-serif}body{padding:12px 10px 40px}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{width:min(1120px,100%);margin:auto auto 10px;display:flex;justify-content:space-between;align-items:center}.home,.save{border:1px solid #ddd9d2;border-radius:10px;background:#fff;padding:9px 13px;font-size:12px;font-weight:700}.layout{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.tools,.panel{background:#fff;border:1px solid #dedbd6;border-radius:16px;box-shadow:0 4px 18px #0000000c}.tools{padding:11px;display:flex;gap:8px;align-items:center;margin-bottom:10px}.zoom{margin-left:auto;display:flex;gap:5px;align-items:center}.zoom button{min-width:34px;padding:7px;border:1px solid #ddd9d2;background:#fff;border-radius:8px}.zoom input{width:130px}.stage{width:100%;max-width:429px;aspect-ratio:9/16;margin:auto;overflow:hidden;background:#ddd9d2;border-radius:14px;display:flex;align-items:center;justify-content:center;touch-action:none}.scale{transform-origin:center;flex:none}.chat{width:720px;height:1280px;position:relative;overflow:hidden;background:#b8cbdc}.status{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:19px;font-weight:700}.status .right{display:flex;gap:12px;font-size:16px}.nav{height:82px;display:grid;grid-template-columns:100px 1fr 100px;align-items:center;padding:0 22px}.back{font-size:24px}.room{text-align:center;font-size:25px;font-weight:700;line-height:1.15}.roomStatus{font-size:12px;font-weight:400;color:#707983;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.navicons{display:flex;justify-content:flex-end;gap:22px;font-size:27px}.messages{position:absolute;left:0;right:0;top:130px;bottom:96px;overflow:hidden;padding:8px 25px 25px}.day{display:flex;justify-content:center;margin:0 0 28px}.day span{background:#8fa5b7d9;color:#fff;border-radius:22px;padding:9px 20px;font-size:17px}.msg{display:flex;gap:20px;margin:0 0 24px;align-items:flex-start}.msg.mine{justify-content:flex-end}.avatar{width:55px;height:55px;flex:none;border-radius:13px;background:#ddd center/cover no-repeat}.msg.mine .avatar{display:none}.msgbody{max-width:570px}.name{font-size:17px;margin:1px 0 8px}.msg.mine .name{display:none}.bubbleline{display:flex;align-items:flex-end;gap:7px}.msg.mine .bubbleline{flex-direction:row-reverse}.bubble{position:relative;max-width:500px;background:#fff;border-radius:0 23px 23px 23px;padding:12px 17px;font-size:23px;line-height:1.35;white-space:pre-wrap;word-break:break-word}.msg.mine .bubble{background:#ffe347;border-radius:23px 0 23px 23px}.bubble.tail:before{content:'';position:absolute;left:-9px;top:0;border-top:11px solid #fff;border-left:10px solid transparent}.msg.mine .bubble.tail:before{left:auto;right:-9px;border-top-color:#ffe347;border-left:0;border-right:10px solid transparent}.bubbletime{font-size:13px;color:#77808a;white-space:nowrap}.read{font-size:13px;color:#ffd400;font-weight:700;margin-bottom:3px;line-height:1}.timebox{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;min-width:28px}.msg:not(.mine) .timebox{align-items:flex-start}.composer{position:absolute;left:0;right:0;bottom:0;height:96px;background:#fff;display:flex;align-items:center;padding:12px 20px;gap:10px;border-top:1px solid #ddd}.composer .circle{width:48px;height:48px;border:1px solid #ddd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:29px;background:#fff}.inputbar{height:56px;flex:1;background:#f6f6f6;border:1px solid #ddd;border-radius:28px;padding:0 20px;color:#777;font-size:20px;outline:0}.send{border:0;background:transparent;font-size:27px}.bgimage{background-size:cover!important;background-position:center!important}.panel{padding:14px;align-self:start}.group{border-bottom:1px solid #eeeae4;padding:18px 8px}.group:first-child{padding-top:5px}.group:last-child{border-bottom:0}.gtitle{font-size:15px;font-weight:800;margin-bottom:14px}.field{margin-bottom:13px}.sub{font-size:12px;color:#777;margin-bottom:6px}.input,textarea,select{width:100%;padding:10px;border:1px solid #ddd9d2;border-radius:10px;background:#faf9f7}textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file{font-size:11px}.toggle{display:flex;justify-content:space-between;align-items:center}.switch{position:relative;width:48px;height:28px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:20px;background:#d4d4d4}.slider:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:#3f8eea}.switch input:checked+.slider:before{transform:translateX(20px)}.profiles{display:grid;gap:8px}.person{border:1px solid #e5e1db;border-radius:10px;padding:9px;display:grid;grid-template-columns:48px 1fr 28px;gap:8px;align-items:center}.person img{width:48px;height:48px;border-radius:13px;object-fit:cover;background:#eee}.person input{width:100%;padding:7px;border:1px solid #ddd9d2;border-radius:8px}.person .photo{grid-column:1 / -1;display:flex;gap:7px;align-items:center}.person .photo input{font-size:10px;min-width:0}.mini{border:1px solid #ddd9d2;background:#fff;border-radius:8px;padding:7px 9px;font-size:12px}.editor{border:1px solid #e5e1db;border-radius:11px;padding:10px;margin-top:8px}.editor b{font-size:12px}.editor .delete{float:right;border:0;background:transparent;font-size:18px;color:#777}.msgrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.btn{width:100%;border:1px solid #ddd9d2;background:#fff;border-radius:9px;padding:9px;font-size:12px}.dark{background:#171717;color:#fff;border-color:#171717}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:11px;color:#999;line-height:1.5;margin-top:6px}.previewbg{display:flex;gap:8px;align-items:center}.previewbg .swatch{width:54px;height:54px;border-radius:9px;background:#b8cbdc;border:1px solid #ddd9d2;background-size:cover;background-position:center}.dateRow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.dateToggle{padding-bottom:8px}@media(max-width:760px){.layout{display:flex;flex-direction:column}.preview{order:1}.panel{order:2}.zoom{width:100%;margin-left:0}.zoom input{flex:1}}@media(max-width:480px){.dateRow{grid-template-columns:1fr}.dateToggle{padding-bottom:0}.nav{grid-template-columns:80px 1fr 80px;padding:0 14px}.navicons{gap:14px}.room{font-size:23px}}</style></head><body><div class="top"><button class="home" onclick="location.href='index.html'">← 홈으로</button><b>카톡 편집기</b><button class="save" id="save">PNG 저장</button></div><main class="layout"><section class="preview"><div class="tools"><b>프리뷰</b><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="10" max="100" value="45"><span id="zt">45%</span></div></div><div class="stage" id="stage"><div class="scale" id="scale"><section class="chat" id="chat"><div class="status" id="status"><span id="pvClock">2:24</span><span class="right">▮▮▮　◉　74</span></div><div class="nav"><div class="back">‹ <span id="pvCount">3</span></div><div class="room"><div id="pvBrand">정윤호</div><div class="roomStatus" id="pvStatus"></div></div><div class="navicons">⌕　☰</div></div><div class="messages" id="messages"></div><footer class="composer" id="composer"><div class="circle">＋</div><input class="inputbar" id="pvInput" placeholder="메시지 입력"><button class="send" id="send">➤</button></footer></section></div></div></section><section class="panel"><div class="group"><div class="gtitle">✚ 기본 설정</div><div class="field"><div class="sub">상단 이름</div><input class="input" id="brand" maxlength="20" value="정윤호"></div><div class="field"><div class="sub">상태 메시지 (선택)</div><input class="input" id="statusText" maxlength="30" placeholder="예) 방금 접속함"></div></div><div class="group"><div class="gtitle">▣ 프로필 설정</div><div class="profiles" id="profiles"></div><button class="btn" id="addProfile" style="margin-top:8px">＋ 프로필 추가</button><div class="hint">프로필을 여러 개 만들고 메시지마다 발신자를 선택하면 단체방처럼 사용할 수 있습니다.</div></div><div class="group"><div class="gtitle">✚ 대화 설정</div><div class="dateRow"><div><div class="sub">대화 날짜</div><input class="input" id="date" type="date" value="2026-09-03"></div><div class="dateToggle"><div class="sub">날짜 표시</div><label class="switch"><input id="dateOn" type="checkbox"><span class="slider"></span></label></div></div><div class="field" style="margin-top:12px"><div class="sub">대화 시간 형식</div><select id="timeFormat"><option value="12">오후 02:22 (12시간)</option><option value="24">14:22 (24시간)</option></select></div><div class="field"><div class="sub">상단 바 표시</div><label class="switch"><input id="statusOn" type="checkbox"><span class="slider"></span></label></div></div><div class="group"><div class="gtitle">✦ 메시지 추가</div><div class="field"><textarea id="newText" maxlength="500" placeholder="메시지 내용을 입력하세요."></textarea></div><div class="row"><select id="newAuthor"></select><button class="btn" id="add">＋ 추가</button></div><div class="toggle" style="margin-top:12px"><span style="font-size:13px;font-weight:650">내 메시지로 추가</span><label class="switch"><input id="newMine" type="checkbox"><span class="slider"></span></label></div><div class="toggle" style="margin-top:12px"><span style="font-size:13px;font-weight:650">읽음 표시</span><label class="switch"><input id="newRead" type="checkbox"><span class="slider"></span></label></div><div class="field" style="margin-top:10px"><div class="sub">읽음 숫자 (1~999)</div><input class="input" id="readText" inputmode="numeric" maxlength="3" value="1" placeholder="1~999"></div><div class="sub" style="margin-top:12px">메시지 목록</div><div id="editor"></div></div><div class="group"><div class="gtitle">▣ 화면 옵션</div><div class="field"><div class="sub">배경 이미지 (선택)</div><div class="previewbg"><div class="swatch" id="swatch"></div><input id="bgImage" class="file" type="file" accept="image/*"></div><button class="mini" id="clearBg" style="margin-top:7px">삭제</button></div><div class="field"><div class="sub">테마 색상</div><input id="bg" type="color" value="#b8cbdc"></div><div class="toggle"><span style="font-size:13px">하단 입력창 표시</span><label class="switch"><input id="composerOn" type="checkbox" checked><span class="slider"></span></label></div></div><div class="actions"><button class="btn" id="reset">기본값 복원</button><button class="btn dark" id="png">PNG로 저장</button></div></section></main><script>(()=>{const $=id=>document.getElementById(id),KEY='kakao-editor-v5';const D={brand:'정윤호',statusText:'',date:'2026-09-03',dateOn:false,timeFormat:'12',statusOn:false,bg:'#b8cbdc',bgImage:'',composerOn:true,profiles:[{id:'p1',name:'정윤호',image:''}],messages:[{author:'p1',mine:false,text:'너 뭐해?',time:'02:21',read:false,readCount:'1'},{author:'p1',mine:true,text:'지금 나갈 준비중 ㅎㅎ',time:'02:22',read:true,readCount:'1'},{author:'p1',mine:false,text:'오늘 진짜 꼭 봐야 돼 ㅠㅠ',time:'02:23',read:false,readCount:'1'}]};let d=JSON.parse(JSON.stringify(D)),panX=0,panY=0;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function persist(){try{localStorage.setItem(KEY,JSON.stringify({d,panX,panY,zoom:+$('zoom').value}))}catch(e){}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;d=Object.assign(JSON.parse(JSON.stringify(D)),x.d||{});d.profiles=d.profiles?.length?d.profiles:D.profiles;d.messages=d.messages||D.messages;panX=+x.panX||0;panY=+x.panY||0;if(x.zoom)$('zoom').value=x.zoom}catch(e){localStorage.removeItem(KEY)}}function prof(id){return d.profiles.find(p=>p.id===id)||d.profiles[0]}function fmtTime(t){if(!t)return '';if(d.timeFormat==='24')return t.replace(/^(오전|오후)\s*/,'');let m=t.match(/^(?:오전|오후)?\s*(\d{1,2}):(\d{2})$/);if(!m)return t;let h=+m[1],min=m[2],ap=h>=12?'오후':'오전';if(h>12)h-=12;return ap+' '+String(h).padStart(2,'0')+':'+min}function tail(i){if(i===0)return true;const a=d.messages[i-1],b=d.messages[i];return a.author!==b.author||a.time!==b.time||a.mine!==b.mine}function dateLabel(v){if(!v)return '';const a=v.split('-').map(Number),dt=new Date(a[0],a[1]-1,a[2]),days=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];return a[0]+'년 '+a[1]+'월 '+a[2]+'일 '+days[dt.getDay()]}function renderProfiles(){const box=$('profiles');box.innerHTML=d.profiles.map((p,i)=>`<div class="person"><img src="${p.image||''}" alt=""><input data-p="${p.id}" value="${esc(p.name)}"><button class="mini" data-del="${p.id}">×</button><div class="photo"><input type="file" accept="image/*" data-img="${p.id}"></div></div>`).join('');box.querySelectorAll('[data-p]').forEach(el=>el.oninput=()=>{const p=prof(el.dataset.p);p.name=el.value;renderAuthors();render()});box.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{if(d.profiles.length<=1)return;const id=el.dataset.del;d.profiles=d.profiles.filter(p=>p.id!==id);d.messages=d.messages.map(m=>m.author===id?{...m,author:d.profiles[0].id}:m);renderProfiles();renderAuthors();render()});box.querySelectorAll('[data-img]').forEach(el=>el.onchange=e=>{const f=e.target.files?.[0];if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{prof(el.dataset.img).image=r.result;renderProfiles();render()};r.readAsDataURL(f)})}function renderAuthors(){const s=$('newAuthor');const old=s.value;s.innerHTML=d.profiles.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');s.value=d.profiles.some(p=>p.id===old)?old:d.profiles[0].id}function renderEditor(){const box=$('editor');box.innerHTML=d.messages.map((m,i)=>`<div class="editor"><button class="delete" data-x="${i}">×</button><b>${m.mine?'내 메시지':esc(prof(m.author).name)}</b><div class="msgrow"><select data-a="${i}">${d.profiles.map(p=>`<option value="${p.id}" ${p.id===m.author?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input class="input" data-t="${i}" value="${esc(m.time)}" placeholder="시간"></div><textarea data-m="${i}">${esc(m.text)}</textarea><div class="toggle"><span style="font-size:12px">읽음 ${esc(m.readCount||'1')}</span><label class="switch"><input type="checkbox" data-r="${i}" ${m.read?'checked':''}><span class="slider"></span></label></div><input class="input" style="margin-top:7px" data-n="${i}" value="${esc(m.readCount||'1')}" inputmode="numeric" maxlength="3" placeholder="읽음 숫자 1~999"></div>`).join('');box.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{d.messages.splice(+e.dataset.x,1);renderEditor();render()});box.querySelectorAll('[data-a]').forEach(e=>e.onchange=()=>{d.messages[+e.dataset.a].author=e.value;renderEditor();render()});box.querySelectorAll('[data-t]').forEach(e=>e.oninput=()=>{d.messages[+e.dataset.t].time=e.value;render()});box.querySelectorAll('[data-m]').forEach(e=>e.oninput=()=>{d.messages[+e.dataset.m].text=e.value;render()});box.querySelectorAll('[data-r]').forEach(e=>e.onchange=()=>{d.messages[+e.dataset.r].read=e.checked;render()});box.querySelectorAll('[data-n]').forEach(e=>e.oninput=()=>{let v=e.value.replace(/\D/g,'').slice(0,3);if(v&&+v>999)v='999';if(v==='0')v='1';e.value=v;d.messages[+e.dataset.n].readCount=v||'1';render()})}function render(){ $('pvBrand').textContent=d.brand||'';$('pvStatus').textContent=d.statusText||'';$('pvStatus').style.display=d.statusText?'block':'none';$('status').style.display=d.statusOn?'flex':'none';$('composer').style.display=d.composerOn?'flex':'none';const chat=$('chat');chat.style.backgroundColor=d.bg;chat.classList.toggle('bgimage',!!d.bgImage);if(d.bgImage)chat.style.backgroundImage=`url(${d.bgImage})`;else chat.style.backgroundImage='';$('swatch').style.backgroundColor=d.bg;$('swatch').style.backgroundImage=d.bgImage?`url(${d.bgImage})`:'';$('messages').style.bottom=d.composerOn?'96px':'0';$('messages').innerHTML=(d.dateOn?`<div class="day"><span>${dateLabel(d.date)}</span></div>`:'')+d.messages.map((m,i)=>{const p=prof(m.author),isMine=m.mine,t=tail(i);return `<div class="msg ${isMine?'mine':''}"><div class="avatar" style="background-image:url(${p.image||''})"></div><div class="msgbody">${!isMine?`<div class="name">${esc(p.name)}</div>`:''}<div class="bubbleline"><div class="bubble ${t?'tail':''}">${esc(m.text)}</div><div class="timebox">${m.read?`<span class="read">${esc(m.readCount||'1')}</span>`:''}<span class="bubbletime">${esc(fmtTime(m.time))}</span></div></div></div></div>`}).join('');renderEditor();applyTransform();persist()}function applyTransform(){const z=(+$('zoom').value||45)/100;$('scale').style.transform=`translate(${panX}px,${panY}px) scale(${z})`;$('zt').textContent=Math.round(z*100)+'%'}function fit(){const r=$('stage').getBoundingClientRect(),z=Math.min((r.width-8)/720,(r.height-8)/1280)*100;$('zoom').value=Math.max(10,Math.min(100,z));panX=panY=0;applyTransform();persist()}function addMessage(text,author,mine=false){const now=new Date();let h=now.getHours(),m=String(now.getMinutes()).padStart(2,'0'),ap=h>=12?'오후':'오전';if(d.timeFormat==='12'){h=h%12||12;h=String(h).padStart(2,'0');}else h=String(h).padStart(2,'0');d.messages.push({author,mine,text,time:d.timeFormat==='12'?ap+' '+h+':'+m:h+':'+m,read:false,readCount:'1'});render()}$('brand').oninput=e=>{d.brand=e.target.value;render()};$('statusText').oninput=e=>{d.statusText=e.target.value;render()};$('date').onchange=e=>{d.date=e.target.value;render()};$('dateOn').onchange=e=>{d.dateOn=e.target.checked;render()};$('timeFormat').onchange=e=>{d.timeFormat=e.target.value;render()};$('statusOn').onchange=e=>{d.statusOn=e.target.checked;render()};$('bg').oninput=e=>{d.bg=e.target.value;render()};$('composerOn').onchange=e=>{d.composerOn=e.target.checked;render()};$('addProfile').onclick=()=>{d.profiles.push({id:'p'+Date.now(),name:'새 프로필',image:''});renderProfiles();renderAuthors();render()};$('add').onclick=()=>{const text=$('newText').value.trim();if(!text)return;const mine=$('newMine').checked;const rc=Math.max(1,Math.min(999,parseInt($('readText').value||'1',10)||1));d.messages.push({author:$('newAuthor').value,mine,text,time:'오후 02:22',read:$('newRead').checked,readCount:String(rc)});$('newText').value='';render()};$('send').onclick=()=>{const x=$('pvInput').value.trim();if(!x)return;addMessage(x,d.profiles[0].id,true);$('pvInput').value=''};$('pvInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}});$('bgImage').onchange=e=>{const f=e.target.files?.[0];if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{d.bgImage=r.result;render()};r.readAsDataURL(f)};$('clearBg').onclick=()=>{d.bgImage='';$('bgImage').value='';render()};$('minus').onclick=()=>{$('zoom').value=Math.max(10,+$('zoom').value-5);applyTransform();persist()};$('plus').onclick=()=>{$('zoom').value=Math.min(100,+$('zoom').value+5);applyTransform();persist()};$('fit').onclick=fit;$('zoom').oninput=()=>{applyTransform();persist()};$('reset').onclick=()=>{d=JSON.parse(JSON.stringify(D));panX=panY=0;renderProfiles();renderAuthors();sync();render()};$('save').onclick=savePNG;$('png').onclick=savePNG;function sync(){Object.entries({brand:d.brand,statusText:d.statusText,date:d.date,dateOn:d.dateOn,timeFormat:d.timeFormat,statusOn:d.statusOn,bg:d.bg,composerOn:d.composerOn}).forEach(([k,v])=>{if($(k))$(k).value=v;if($(k)?.type==='checkbox')$(k).checked=v});$('dateOn').checked=d.dateOn;$('statusOn').checked=d.statusOn;$('composerOn').checked=d.composerOn}async function savePNG(){try{const canvas=await html2canvas($('chat'),{scale:1,useCORS:true,backgroundColor:null});const a=document.createElement('a');a.download='kakao-preview.png';a.href=canvas.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장에 실패했습니다.')}}const stage=$('stage');let dragging=false,sx=0,sy=0,ox=0,oy=0;stage.addEventListener('pointerdown',e=>{dragging=true;sx=e.clientX;sy=e.clientY;ox=panX;oy=panY;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!dragging)return;panX=ox+(e.clientX-sx);panY=oy+(e.clientY-sy);applyTransform()});stage.addEventListener('pointerup',()=>{dragging=false;persist()});load();renderProfiles();renderAuthors();sync();render();})();</script></body></html>
