<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>카톡 편집기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box;letter-spacing:-.04em}html,body{margin:0;background:#f3f1ed;color:#202124;font-family:Pretendard,sans-serif}body{padding:12px 10px 40px}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{width:min(1120px,100%);margin:auto auto 10px;display:flex;justify-content:space-between;align-items:center}.home,.save{border:1px solid #ddd9d2;border-radius:10px;background:#fff;padding:9px 13px;font-size:12px;font-weight:700}.layout{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.tools,.panel{background:#fff;border:1px solid #dedbd6;border-radius:16px;box-shadow:0 4px 18px #0000000c}.tools{padding:11px;display:flex;gap:8px;align-items:center;margin-bottom:10px}.zoom{margin-left:auto;display:flex;gap:5px;align-items:center}.zoom button{min-width:34px;padding:7px;border:1px solid #ddd9d2;background:#fff;border-radius:8px}.zoom input{width:130px}.stage{width:100%;max-width:429px;aspect-ratio:9/16;margin:auto;overflow:hidden;background:#ddd9d2;border-radius:14px;display:flex;align-items:center;justify-content:center;touch-action:none}.scale{transform-origin:center;flex:none}.chat{width:720px;height:1280px;position:relative;overflow:hidden;background:#b8cbdc}.status{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:19px;font-weight:700}.status .right{display:flex;gap:12px;font-size:16px}.nav{height:70px;display:grid;grid-template-columns:70px 1fr 120px;align-items:center;padding:0 22px}.back{font-size:24px}.room{font-size:25px;font-weight:700;text-align:center}.navicons{display:flex;justify-content:flex-end;gap:22px;font-size:27px}.messages{position:absolute;left:0;right:0;top:118px;bottom:96px;overflow:hidden;padding:0 25px 25px}.day{display:flex;justify-content:center;margin:10px 0 28px}.day span{background:#8fa5b7d9;color:#fff;border-radius:22px;padding:9px 20px;font-size:17px}.msg{display:flex;gap:13px;margin:0 0 24px;align-items:flex-start}.msg.mine{justify-content:flex-end}.avatar{width:55px;height:55px;flex:none;border-radius:50%;background:#ddd center/cover no-repeat}.msg.mine .avatar{display:none}.msgbody{max-width:570px}.name{font-size:17px;margin:1px 0 6px}.msg.mine .name{display:none}.bubbleline{display:flex;align-items:flex-end;gap:7px}.msg.mine .bubbleline{flex-direction:row-reverse}.bubble{position:relative;max-width:500px;background:#fff;border-radius:0 20px 20px 20px;padding:12px 16px;font-size:23px;line-height:1.35;white-space:pre-wrap;word-break:break-word}.msg.mine .bubble{background:#ffe347;border-radius:20px 0 20px 20px}.bubble.tail:before{content:'';position:absolute;left:-9px;top:0;border-top:11px solid #fff;border-left:10px solid transparent}.msg.mine .bubble.tail:before{left:auto;right:-9px;border-top-color:#ffe347;border-left:0;border-right:10px solid transparent}.bubbletime{font-size:13px;color:#77808a;white-space:nowrap}.read{font-size:12px;color:#777;margin-bottom:2px}.composer{position:absolute;left:0;right:0;bottom:0;height:96px;background:#fff;display:flex;align-items:center;padding:12px 20px;gap:10px;border-top:1px solid #ddd}.composer .circle{width:48px;height:48px;border:1px solid #ddd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:29px;background:#fff}.inputbar{height:56px;flex:1;background:#f6f6f6;border:1px solid #ddd;border-radius:28px;padding:0 20px;color:#777;font-size:20px;outline:0}.send{border:0;background:transparent;font-size:27px}.bgimage{background-size:cover!important;background-position:center!important}.panel{padding:14px;align-self:start}.group{border-bottom:1px solid #eeeae4;padding:18px 8px}.group:first-child{padding-top:5px}.group:last-child{border-bottom:0}.gtitle{font-size:15px;font-weight:800;margin-bottom:14px}.field{margin-bottom:13px}.sub{font-size:12px;color:#777;margin-bottom:6px}.input,textarea,select{width:100%;padding:10px;border:1px solid #ddd9d2;border-radius:10px;background:#faf9f7}textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file{font-size:11px}.toggle{display:flex;justify-content:space-between;align-items:center}.switch{position:relative;width:48px;height:28px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:20px;background:#d4d4d4}.slider:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:#3f8eea}.switch input:checked+.slider:before{transform:translateX(20px)}.profiles{display:grid;gap:8px}.person{border:1px solid #e5e1db;border-radius:10px;padding:9px;display:grid;grid-template-columns:42px 1fr 28px;gap:8px;align-items:center}.person img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#eee}.person input[type=text]{width:100%;padding:7px;border:1px solid #ddd9d2;border-radius:8px}.person .photo{grid-column:1 / -1;display:flex;gap:7px;align-items:center}.person .photo input{font-size:10px;min-width:0}.mini{border:1px solid #ddd9d2;background:#fff;border-radius:8px;padding:7px 9px;font-size:12px}.editor{border:1px solid #e5e1db;border-radius:11px;padding:10px;margin-top:8px}.editor b{font-size:12px}.editor .delete{float:right;border:0;background:transparent;font-size:18px;color:#777}.msgrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.btn{width:100%;border:1px solid #ddd9d2;background:#fff;border-radius:9px;padding:9px;font-size:12px}.dark{background:#171717;color:#fff;border-color:#171717}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:11px;color:#999;line-height:1.5;margin-top:6px}.previewbg{display:flex;gap:8px;align-items:center}.previewbg .swatch{width:54px;height:54px;border-radius:9px;background:#b8cbdc;border:1px solid #ddd9d2;background-size:cover;background-position:center}.range{width:100%}@media(max-width:760px){.layout{display:flex;flex-direction:column}.preview{order:1}.panel{order:2}.zoom{width:100%;margin-left:0}.zoom input{flex:1}}
</style>
</head>
<body>
<div class="top"><button class="home" onclick="location.href='index.html'">← 홈으로</button><b>카톡 편집기</b><button class="save" id="save">PNG 저장</button></div>
<main class="layout">
<section class="preview"><div class="tools"><b>프리뷰</b><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="10" max="100" value="45"><span id="zt">45%</span></div></div>
<div class="stage" id="stage"><div class="scale" id="scale"><section class="chat" id="chat"><div class="status" id="status"><span id="pvClock">2:24</span><span class="right">▮▮▮　◉　74</span></div><div class="nav"><div class="back">‹ <span id="pvCount">3</span></div><div class="room" id="pvBrand">정윤호</div><div class="navicons">⌕　☰</div></div><div class="messages" id="messages"></div><footer class="composer" id="composer"><div class="circle">＋</div><input class="inputbar" id="pvInput" placeholder="메시지 입력"><button class="send" id="send">➤</button></footer></section></div></div></section>
<section class="panel">
<div class="group"><div class="gtitle">✚ 기본 설정</div><div class="field"><div class="sub">상단 이름</div><input class="input" id="brand" maxlength="20" value="정윤호"></div><div class="field"><div class="sub">상태 메시지 (선택)</div><input class="input" id="statusText" maxlength="30" placeholder="예) 방금 접속함"></div></div>
<div class="group"><div class="gtitle">▣ 프로필 설정</div><div class="profiles" id="profiles"></div><button class="btn" id="addProfile" style="margin-top:8px">＋ 프로필 추가</button><div class="hint">프로필을 여러 개 만들고 메시지마다 발신자를 선택하면 단체방처럼 사용할 수 있습니다.</div></div>
<div class="group"><div class="gtitle">✚ 대화 설정</div><div class="row"><div><div class="sub">대화 날짜</div><input class="input" id="date" type="date" value="2026-09-03"></div><div><div class="sub">날짜 표시</div><label class="switch"><input id="dateOn" type="checkbox"><span class="slider"></span></label></div></div><div class="field" style="margin-top:12px"><div class="sub">대화 시간 형식</div><select id="timeFormat"><option value="12">오후 02:22 (12시간)</option><option value="24">14:22 (24시간)</option></select></div><div class="field"><div class="sub">상단 바 표시</div><label class="switch"><input id="statusOn" type="checkbox" checked><span class="slider"></span></label></div></div>
<div class="group"><div class="gtitle">✦ 메시지 추가</div><div class="field"><textarea id="newText" maxlength="500" placeholder="메시지 내용을 입력하세요."></textarea></div><div class="row"><select id="newAuthor"></select><button class="btn" id="add">＋ 추가</button></div><div class="toggle" style="margin-top:12px"><span style="font-size:13px;font-weight:650">내 메시지로 추가</span><label class="switch"><input id="newMine" type="checkbox"><span class="slider"></span></label></div><div class="toggle" style="margin-top:12px"><span style="font-size:13px;font-weight:650">읽음 표시 1</span><label class="switch"><input id="newRead" type="checkbox"><span class="slider"></span></label></div><div class="sub" style="margin-top:12px">메시지 목록</div><div id="editor"></div></div>
<div class="group"><div class="gtitle">▣ 화면 옵션</div><div class="field"><div class="sub">배경 이미지 (선택)</div><div class="previewbg"><div class="swatch" id="swatch"></div><input id="bgImage" class="file" type="file" accept="image/*"></div><button class="mini" id="clearBg" style="margin-top:7px">삭제</button></div><div class="field"><div class="sub">테마 색상</div><input id="bg" type="color" value="#b8cbdc"></div><div class="toggle"><span style="font-size:13px">하단 입력창 표시</span><label class="switch"><input id="composerOn" type="checkbox" checked><span class="slider"></span></label></div></div>
<div class="actions"><button class="btn" id="reset">기본값 복원</button><button class="btn dark" id="png">PNG로 저장</button></div>
</section></main>
<script>
(()=>{
const $=id=>document.getElementById(id),KEY='kakao-editor-v4';
const D={brand:'정윤호',statusText:'',date:'2026-09-03',dateOn:false,timeFormat:'12',statusOn:true,bg:'#b8cbdc',bgImage:'',placeholder:'메시지 입력',composerOn:true,profiles:[{id:'p1',name:'정윤호',image:''}],messages:[{author:'p1',mine:false,text:'너 뭐해?',time:'02:21',read:false},{author:'p1',mine:true,text:'지금 나갈 준비중 ㅎㅎ',time:'02:22',read:true},{author:'p1',mine:false,text:'오늘 진짜 꼭 봐야 돼 ㅠㅠ',time:'02:23',read:false}]};
let d=JSON.parse(JSON.stringify(D)),panX=0,panY=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify({d,panX,panY,zoom:+$('zoom').value}))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;d=Object.assign(JSON.parse(JSON.stringify(D)),x.d||{});d.profiles=d.profiles?.length?d.profiles:D.profiles;d.messages=d.messages||D.messages;panX=+x.panX||0;panY=+x.panY||0;if(x.zoom)$('zoom').value=x.zoom}catch(e){localStorage.removeItem(KEY)}}
function prof(id){return d.profiles.find(p=>p.id===id)||d.profiles[0]}
function fmtTime(t){if(!t)return '';if(d.timeFormat==='24')return t.replace(/^(오전|오후)\s*/,'');let m=t.match(/^(?:오전|오후)?\s*(\d{1,2}):(\d{2})$/);if(!m)return t;let h=+m[1],min=m[2],ap=h>=12?'오후':'오전';if(h>12)h-=12;return ap+' '+String(h).padStart(2,'0')+':'+min}
function tail(i){if(i===0)return true;const a=d.messages[i-1],b=d.messages[i];return a.author!==b.author||a.time!==b.time||a.mine!==b.mine}
function dateLabel(v){if(!v)return '';const a=v.split('-').map(Number),dt=new Date(a[0],a[1]-1,a[2]),days=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];return a[0]+'년 '+a[1]+'월 '+a[2]+'일 '+days[dt.getDay()]}
function render(){
$('pvBrand').textContent=d.brand;$('status').style.display=d.statusOn?'flex':'none';$('composer').style.display=d.composerOn?'flex':'none';$('chat').style.backgroundColor=d.bg;$('chat').style.backgroundImage=d.bgImage?'url("'+d.bgImage+'")':'none';$('swatch').style.backgroundImage=d.bgImage?'url("'+d.bgImage+'")':'none';$('brand').value=d.brand;$('statusText').value=d.statusText;$('date').value=d.date;$('dateOn').checked=d.dateOn;$('timeFormat').value=d.timeFormat;$('statusOn').checked=d.statusOn;$('bg').value=d.bg;$('composerOn').checked=d.composerOn;$('pvCount').textContent=Math.max(1,d.profiles.length);
let out='';if(d.dateOn)out+='<div class="day"><span>'+esc(dateLabel(d.date))+'</span></div>';
d.messages.forEach((m,i)=>{let p=prof(m.author),t=tail(i),time=fmtTime(m.time);out+='<div class="msg '+(m.mine?'mine':'')+'">'+(m.mine?'':'<span class="avatar" style="background-image:'+(p.image?'url("'+p.image+'")':'none')+'"></span>')+'<div class="msgbody">'+(m.mine?'':'<div class="name">'+esc(p.name)+'</div>')+'<div class="bubbleline"><div class="bubble '+(t?'tail':'')+'">'+esc(m.text).replace(/\n/g,'<br>')+'</div>'+(m.read?'<span class="read">1</span>':'')+'<span class="bubbletime">'+esc(time)+'</span></div></div></div>'});
$('messages').innerHTML=out;renderEditors();renderProfiles();refreshAuthor();persist()}
function renderProfiles(){let e=$('profiles');e.innerHTML=d.profiles.map((p,i)=>'<div class="person"><img src="'+(p.image||'')+'" onerror="this.style.visibility=\'hidden\'"><input type="text" data-pname="'+i+'" value="'+esc(p.name)+'"><button class="mini" data-pdel="'+i+'">×</button><div class="photo"><span class="sub">사진</span><input type="file" accept="image/*" data-pfile="'+i+'"></div></div>').join('');e.querySelectorAll('[data-pname]').forEach(x=>x.oninput=()=>{d.profiles[+x.dataset.pname].name=x.value;render()});e.querySelectorAll('[data-pfile]').forEach(x=>x.onchange=ev=>{let f=ev.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('이미지 파일만 선택할 수 있습니다.');if(f.size>15*1024*1024)return alert('15MB 이하 이미지를 사용해주세요.');let r=new FileReader;r.onload=()=>{d.profiles[+ev.target.dataset.pfile].image=r.result;render()};r.readAsDataURL(f)});e.querySelectorAll('[data-pdel]').forEach(x=>x.onclick=()=>{if(d.profiles.length===1)return alert('프로필은 최소 1개가 필요합니다.');let idx=+x.dataset.pdel,id=d.profiles[idx].id;d.profiles.splice(idx,1);d.messages.forEach(m=>{if(m.author===id)m.author=d.profiles[0].id});render()})}
function renderEditors(){let e=$('editor');e.innerHTML=d.messages.map((m,i)=>{let opts=d.profiles.map(p=>'<option value="'+p.id+'" '+(p.id===m.author?'selected':'')+'>'+esc(p.name)+'</option>').join('');return '<div class="editor"><button class="delete" data-del="'+i+'">×</button><b>메시지 '+(i+1)+'</b><textarea data-text="'+i+'">'+esc(m.text)+'</textarea><div class="msgrow"><select data-author="'+i+'">'+opts+'</select><input data-time="'+i+'" value="'+esc(m.time||'')+'" placeholder="시간 예: 02:22"></div><div class="toggle" style="margin-top:8px"><span style="font-size:12px">내 메시지</span><label class="switch"><input data-mine="'+i+'" type="checkbox" '+(m.mine?'checked':'')+'><span class="slider"></span></label></div><div class="toggle" style="margin-top:8px"><span style="font-size:12px">읽음 1 표시</span><label class="switch"><input data-read="'+i+'" type="checkbox" '+(m.read?'checked':'')+'><span class="slider"></span></label></div></div>'}).join('');e.querySelectorAll('[data-text]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.text].text=x.value;render()});e.querySelectorAll('[data-author]').forEach(x=>x.onchange=()=>{d.messages[+x.dataset.author].author=x.value;render()});e.querySelectorAll('[data-time]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.time].time=x.value;render()});e.querySelectorAll('[data-mine]').forEach(x=>x.onchange=()=>{d.messages[+x.dataset.mine].mine=x.checked;render()});e.querySelectorAll('[data-read]').forEach(x=>x.onchange=()=>{d.messages[+x.dataset.read].read=x.checked;render()});e.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{d.messages.splice(+x.dataset.del,1);render()})}
function refreshAuthor(){let opts=d.profiles.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');$('newAuthor').innerHTML=opts}
function addOwnText(text){text=text.trim();if(!text)return;d.messages.push({author:d.profiles[0].id,mine:true,text,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),read:true});render()}
function clamp(){let st=$('stage'),n=$('chat'),z=+$('zoom').value/100,mx=Math.max(0,(n.offsetWidth*z-st.clientWidth)/2),my=Math.max(0,(n.offsetHeight*z-st.clientHeight)/2);panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY))}
function tr(){let z=+$('zoom').value/100;$('zt').textContent=Math.round(z*100)+'%';$('scale').style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+z+')'}
function zoom(v,reset=false){let old=+$('zoom').value;v=Math.max(10,Math.min(100,+v));$('zoom').value=v;if(reset)panX=panY=0;else{let q=v/old;panX*=q;panY*=q}clamp();tr();persist()}
function fit(){let s=$('stage');zoom(Math.min(100,Math.min(s.clientWidth/720,s.clientHeight/1280)*100),true)}
$('brand').oninput=()=>{d.brand=$('brand').value;render()};$('statusText').oninput=()=>{d.statusText=$('statusText').value;render()};$('date').onchange=()=>{d.date=$('date').value;render()};$('dateOn').onchange=()=>{d.dateOn=$('dateOn').checked;render()};$('timeFormat').onchange=()=>{d.timeFormat=$('timeFormat').value;render()};$('statusOn').onchange=()=>{d.statusOn=$('statusOn').checked;render()};$('bg').oninput=()=>{d.bg=$('bg').value;render()};$('composerOn').onchange=()=>{d.composerOn=$('composerOn').checked;render()};$('pvInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addOwnText(e.target.value);e.target.value=''}};
$('bgImage').onchange=e=>{let f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('이미지 파일만 선택할 수 있습니다.');if(f.size>15*1024*1024)return alert('15MB 이하 이미지를 사용해주세요.');let r=new FileReader;r.onload=()=>{d.bgImage=r.result;render()};r.readAsDataURL(f)};$('clearBg').onclick=()=>{d.bgImage='';$('bgImage').value='';render()};
$('addProfile').onclick=()=>{d.profiles.push({id:'p'+Date.now(),name:'새로운 친구',image:''});render()};$('add').onclick=()=>{let text=$('newText').value.trim();if(!text)return;d.messages.push({author:$('newAuthor').value||d.profiles[0].id,mine:$('newMine').checked,text,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),read:$('newRead').checked});$('newText').value='';render()};$('send').onclick=()=>{addOwnText($('pvInput').value);$('pvInput').value='';};
$('reset').onclick=()=>{if(!confirm('기본값으로 복원할까요?'))return;d=JSON.parse(JSON.stringify(D));panX=panY=0;$('zoom').value=45;render();fit()};$('zoom').oninput=e=>zoom(e.target.value);$('minus').onclick=()=>zoom(+$('zoom').value-5);$('plus').onclick=()=>zoom(+$('zoom').value+5);$('fit').onclick=fit;
async function png(){try{let c=await html2canvas($('chat'),{backgroundColor:d.bg,scale:2,useCORS:true});let a=document.createElement('a');a.download='kakao-preview.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장에 실패했습니다.')}}$('save').onclick=png;$('png').onclick=png;
let drag=false,sx=0,sy=0,ox=0,oy=0;$('stage').onpointerdown=e=>{if(e.target.closest('input,textarea,button,select'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=panX;oy=panY;$('stage').setPointerCapture(e.pointerId)};$('stage').onpointermove=e=>{if(!drag)return;panX=ox+e.clientX-sx;panY=oy+e.clientY-sy;clamp();tr()};$('stage').onpointerup=e=>{drag=false;try{$('stage').releasePointerCapture(e.pointerId)}catch(_){}persist()};
load();refreshAuthor();render();requestAnimationFrame(fit);
})();
</script>
</body></html>
