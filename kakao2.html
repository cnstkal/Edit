<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>카톡 편집기</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');*{box-sizing:border-box;letter-spacing:-.04em}html,body{margin:0;background:#f3efe7;color:#222;font-family:Pretendard,sans-serif}body{padding:12px 10px 40px}button,input,textarea{font:inherit}button{cursor:pointer}.top{width:min(1120px,100%);margin:auto 0 10px;display:flex;justify-content:space-between;align-items:center}.home,.save{border:1px solid #d8d2c8;border-radius:10px;background:#fffdf9;padding:9px 13px;font-size:12px;font-weight:700}.layout{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.tools,.panel{background:#fffdf8;border:1px solid #dfd9ce;border-radius:16px;box-shadow:0 5px 18px #7771}.tools{padding:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.zoom{margin-left:auto;display:flex;gap:5px;align-items:center}.zoom button{min-width:34px;padding:7px;border:1px solid #ddd6ca;background:#fffdf8;border-radius:8px}.zoom input{width:130px}.stage{width:100%;max-width:520px;aspect-ratio:9/16;margin:auto;overflow:hidden;background:#d9d4ca;border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;touch-action:none}.scale{transform-origin:center;flex:none}.chat{width:720px;height:1280px;background:#a1b9cb;position:relative;overflow:hidden}.head{height:115px;display:flex;justify-content:center;padding-top:20px}.brand{background:#fff;border-radius:34px;padding:16px 22px;font-size:25px;font-weight:650}.scroll{position:absolute;left:0;right:0;top:115px;bottom:95px;overflow:hidden;padding-bottom:28px}.day{display:flex;justify-content:center;margin:18px 0 28px}.day span{background:#9ab3c5;border-radius:30px;padding:11px 26px;font-size:22px}.msg{display:grid;grid-template-columns:86px 1fr;gap:10px;margin:0 34px 34px}.profile{width:76px;height:76px;border-radius:27px;background:#333 center/cover no-repeat}.name{font-size:21px;margin:1px 0 9px}.bubble{position:relative;display:table;max-width:calc(100% - 25px);background:#fff;border-radius:0 28px 28px 28px;padding:14px 19px;font-size:24px;line-height:1.38;white-space:pre-wrap;margin-bottom:9px}.bubble:before{content:'';position:absolute;left:-11px;top:0;border-top:12px solid #fff;border-left:12px solid transparent}.bubble time{display:block;font-size:13px;color:#999;margin-top:7px;text-align:right}.composer{position:absolute;left:0;right:0;bottom:0;height:95px;background:#fff;display:flex;align-items:center;padding:15px 34px;gap:14px}.circle{width:54px;height:54px;border-radius:50%;background:#f1f1f1;display:flex;align-items:center;justify-content:center;font-size:31px}.inputbar{height:58px;flex:1;background:#f1f1f1;border-radius:31px;display:flex;align-items:center;padding:0 22px;color:#aaa;font-size:22px}.hash{font-size:31px;font-weight:700}.panel{padding:16px;align-self:start}.group{border-top:1px solid #eee8de;padding:18px 0}.group:first-child{border-top:0;padding-top:0}.label{font-size:14px;font-weight:650;margin-bottom:9px}.sub{font-size:11px;color:#999;margin-bottom:7px}.field{margin-bottom:11px}input,textarea{width:100%;padding:9px 10px;border:1px solid #ddd6ca;border-radius:9px;background:#f9f6ef}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file{font-size:11px}.toggle{display:flex;justify-content:space-between;align-items:center}.switch{position:relative;width:48px;height:28px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:20px;background:#d8d8d8}.slider:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:#2479e8}.switch input:checked+.slider:before{transform:translateX(20px)}.editor{border:1px solid #e7e0d5;border-radius:10px;padding:10px;margin-top:8px}.editor>*{margin-bottom:7px}.btn{width:100%;border:1px solid #d9d2c7;background:#fffdf8;border-radius:9px;padding:9px;font-size:12px}.dark{background:#171717;color:#fff;border-color:#171717}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:760px){.layout{display:flex;flex-direction:column}.preview{order:1}.panel{order:2}.zoom{width:100%;margin-left:0}.zoom input{flex:1}}
</style></head><body><div class="top"><button class="home" onclick="location.href='index.html'">← 홈으로</button><b>카톡 편집기</b><button class="save" id="save">PNG 저장</button></div><main class="layout"><section class="preview"><div class="tools"><b>프리뷰</b><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="10" max="100" value="40"><span id="zt">40%</span></div></div><div class="stage" id="stage"><div class="scale" id="scale"><section class="chat" id="chat"><header class="head"><div class="brand" id="pvBrand">치킨시와</div></header><div class="scroll" id="messages"></div><footer class="composer" id="composer"><div class="circle">＋</div><div class="inputbar" id="pvPlaceholder">메시지 입력</div><div class="circle">☻</div><div class="hash">#</div></footer></section></div></div></section><section class="panel"><div class="group"><div class="label">채팅 기본 설정</div><div class="field"><div class="sub">채팅방 이름</div><input id="brand" value="치킨시와"></div><div class="field"><div class="sub">프로필 사진</div><input id="profile" class="file" type="file" accept="image/*"></div><div class="row"><div><div class="sub">배경색</div><input id="bg" type="color" value="#a1b9cb"></div><div><div class="sub">입력창 문구</div><input id="placeholder" value="메시지 입력"></div></div><div class="toggle" style="margin-top:14px"><span style="font-size:13px;font-weight:600">채팅 입력창 표시</span><label class="switch"><input id="composerOn" type="checkbox" checked><span class="slider"></span></label></div></div><div class="group"><div class="label">메시지</div><div class="sub">날짜 · 이름 · 메시지 · 시간을 설정할 수 있습니다.</div><div id="editor"></div><button class="btn" id="add">＋ 메시지 추가</button></div><div class="actions"><button class="btn" id="reset">기본값 복원</button><button class="btn dark" id="png">PNG로 저장</button></div></section></main><script>(()=>{const $=id=>document.getElementById(id),S='kakao-editor-v2',D={brand:'치킨시와',bg:'#a1b9cb',placeholder:'메시지 입력',composerOn:true,profile:'',messages:[{date:'2026년 3월 25일 수요일',name:'송민기',text:'작실 ㄱ\n\n저녁 먹지 말고 와',times:['','']},{date:'2026년 3월 26일 목요일',name:'송민기',text:'작실 ㄱ',times:['']},{date:'2026년 3월 29일 일요일',name:'송민기',text:'ㅈㅅ ㄱ',times:['']},{date:'2026년 4월 1일 수요일',name:'송민기',text:'ㄱ',times:['']},{date:'2026년 4월 9일 목요일',name:'송민기',text:'쇼미에 너 전남친 나오는데\n\n뭐냐 이거',times:['','']}]};let d=JSON.parse(JSON.stringify(D)),panX=0,panY=0;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){try{localStorage.setItem(S,JSON.stringify({d,panX,panY,zoom:+$('zoom').value}))}catch(e){}}function load(){try{let x=JSON.parse(localStorage.getItem(S)||'null');if(!x)return;d=Object.assign(JSON.parse(JSON.stringify(D)),x.d||{});panX=+x.panX||0;panY=+x.panY||0;if(x.zoom)$('zoom').value=x.zoom}catch(e){localStorage.removeItem(S)}}function render(){ $('pvBrand').textContent=d.brand;$('chat').style.background=d.bg;$('pvPlaceholder').textContent=d.placeholder;$('composer').style.display=d.composerOn?'flex':'none';$('messages').innerHTML=d.messages.map(m=>'<div class="day"><span>'+esc(m.date)+'</span></div><div class="msg"><span class="profile" style="background-image:'+(d.profile?'url("'+d.profile+'")':'none')+'"></span><div><div class="name">'+esc(m.name)+'</div>'+m.text.split('\n\n').filter(Boolean).map((x,i)=>'<div class="bubble">'+esc(x).replace(/\n/g,'<br>')+(m.times[i]?'<time>'+esc(m.times[i])+'</time>':'')+'</div>').join('')+'</div></div>').join('');$('brand').value=d.brand;$('bg').value=d.bg;$('placeholder').value=d.placeholder;$('composerOn').checked=d.composerOn}function editors(){let e=$('editor');e.innerHTML=d.messages.map((m,i)=>'<div class="editor"><b>메시지 '+(i+1)+'</b><input data-date="'+i+'" value="'+esc(m.date)+'"><input data-name="'+i+'" value="'+esc(m.name)+'"><textarea data-text="'+i+'">'+esc(m.text)+'</textarea><div class="row"><input data-t0="'+i+'" placeholder="첫 말풍선 시간" value="'+esc(m.times[0]||'')+'"><input data-t1="'+i+'" placeholder="둘째 말풍선 시간" value="'+esc(m.times[1]||'')+'"></div><button class="btn" data-del="'+i+'">삭제</button></div>').join('');e.querySelectorAll('[data-date]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.date].date=x.value;render();save()});e.querySelectorAll('[data-name]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.name].name=x.value;render();save()});e.querySelectorAll('[data-text]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.text].text=x.value;render();save()});e.querySelectorAll('[data-t0]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.t0].times[0]=x.value;render();save()});e.querySelectorAll('[data-t1]').forEach(x=>x.oninput=()=>{d.messages[+x.dataset.t1].times[1]=x.value;render();save()});e.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{d.messages.splice(+x.dataset.del,1);editors();render();save()})}function clamp(){let st=$('stage'),n=$('chat'),z=+$('zoom').value/100,mx=Math.max(0,(n.offsetWidth*z-st.clientWidth)/2),my=Math.max(0,(n.offsetHeight*z-st.clientHeight)/2);panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY))}function tr(){let z=+$('zoom').value/100;$('zt').textContent=Math.round(z*100)+'%';$('scale').style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+z+')'}function zoom(v,r){let old=+$('zoom').value;v=Math.max(10,Math.min(100,+v));$('zoom').value=v;if(r)panX=panY=0;else{let q=v/old;panX*=q;panY*=q}clamp();tr();save()}function fit(){let s=$('stage');zoom(Math.max(10,Math.min(100,Math.min((s.clientWidth-20)/720,(s.clientHeight-20)/1280)*100*.92)),true)}$('brand').oninput=()=>{d.brand=$('brand').value;render();save()};$('bg').oninput=()=>{d.bg=$('bg').value;render();save()};$('placeholder').oninput=()=>{d.placeholder=$('placeholder').value;render();save()};$('composerOn').onchange=()=>{d.composerOn=$('composerOn').checked;render();save()};$('profile').onchange=e=>{let f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('이미지 파일만 선택할 수 있습니다.');if(f.size>15*1024*1024)return alert('15MB 이하 이미지를 사용해주세요.');let r=new FileReader;r.onload=()=>{d.profile=r.result;render();save()};r.readAsDataURL(f)};$('add').onclick=()=>{d.messages.push({date:'2026년 4월 10일 금요일',name:'새로운 친구',text:'메시지를 입력하세요.',times:['12:00']});editors();render();save()};$('reset').onclick=()=>{if(!confirm('기본값으로 복원할까요?'))return;d=JSON.parse(JSON.stringify(D));panX=panY=0;$('zoom').value=40;render();editors();fit();save()};$('zoom').oninput=e=>zoom(e.target.value);$('minus').onclick=()=>zoom(+$('zoom').value-5);$('plus').onclick=()=>zoom(+$('zoom').value+5);$('fit').onclick=fit;async function png(){try{let c=await html2canvas($('chat'),{backgroundColor:d.bg,scale:2});let a=document.createElement('a');a.download='kakao-preview.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장에 실패했습니다.')}}$('save').onclick=png;$('png').onclick=png;let drag=false,sx=0,sy=0,ox=0,oy=0;$('stage').onpointerdown=e=>{if(e.target.closest('input,textarea,button'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=panX;oy=panY;$('stage').setPointerCapture(e.pointerId)};$('stage').onpointermove=e=>{if(!drag)return;panX=ox+e.clientX-sx;panY=oy+e.clientY-sy;clamp();tr()};$('stage').onpointerup=e=>{drag=false;try{$('stage').releasePointerCapture(e.pointerId)}catch(_){}save()};load();render();editors();requestAnimationFrame(fit)})();</script></body></html>
