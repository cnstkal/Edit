 const extra=`<script>\nlet pinchStart=0,pinchZoom=50;const stageEl=document.getElementById('stage');stageEl.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchZoom=+document.getElementById('zoom').value}}, {passive:true});stageEl.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchStart){e.preventDefault();const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom(pinchZoom*(dist/pinchStart))}}, {passive:false});stageEl.addEventListener('touchend',e=>{if(e.touches.length<2)pinchStart=0});\n<\/script>`;
