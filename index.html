ht:2px;cursor:ns-resize}.group{border-top:1px solid #eee8de;padding:11px 0}.group:first-child{border-top:0;padding-top:0}.label{font-size:12px;color:#777;font-weight:500;margin-bottom:5px}input,textarea,select{width:100%;padding:9px 10px;border:1px solid #ddd6ca;border-radius:9px;background:#f9f6ef;color:#222;outline:0;font-weight:400!important}textarea{min-height:105px;resize:vertical;line-height:1.55}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}.btn{border:1px solid #d9d2c7;background:#fffdf8;border-radius:9px;padding:9px;font-size:13px;font-weight:500!important}.dark{background:#171717;color:#fff;border-color:#171717;width:100%}.reaction-editor{display:grid;grid-template-columns:1fr 1fr;gap:6px}.reaction-editor label{font-size:11px;color:#666;font-weight:500}.comment-editor{border:1px solid #e7e0d5;border-radius:9px;padding:8px;margin-top:6px}.comment-head{display:flex;justify-content:space-between;align-items:center;font-size:12px}.remove{border:0;background:none;color:#999;font-size:18px;padding:0}.small{font-size:10px;color:#999;line-height:1.45;margin-top:4px}@media(min-width:761px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;align-items:start}.preview{grid-column:1;grid-row:1}.panel{grid-column:2;grid-row:1;position:sticky;top:68px;max-height:calc(100vh - 80px);overflow:auto}.news.pc .article{padding-left:55px;padding-right:55px}.news.pc .title{font-size:52px}.news.pc .body{font-size:25px}.news.pc .comments{padding-left:55px;padding-right:55px}}@media(max-width:760px){.layout{padding:7px}.tools{top:55px}.zoom{width:100%;margin-left:0}.zoom input{flex:1}.stage{padding:6px}}
</style></head><body><header class="top"><div class="topin"><div class="brand">에딧 소스 생성기 · 뉴스</div><div class="ver">v1.4 · 2026.09.08</div></div></header><main class="layout"><section class="preview"><div class="tools"><b>프리뷰</b><select id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="20" max="150" value="50"><span id="ztext">50%</span></div></div><div class="stage" id="stage"><div class="scale" id="scale"><article class="news" id="news"><div class="article"><div class="publisher"><span class="publogo" id="pubLogo"></span><span id="pvPublisher">기사일보</span><span class="pick">PiCK <i></i></span></div><img id="pvPhoto" class="photo" src="" alt=""><h1 class="title" id="pvTitle">제목을 입력하세요</h1><div class="meta"><span id="pvDate">입력 2026.09.07. 오후 12:22</span><span class="pill" id="pvSource">기사원문</span></div><div class="body" id="pvBody"></div></div><section class="reaction"><img class="reaction-strip" src="./이미지/img-ba868ac486f5.webp" alt="감정 반응"><div class="reaction-numbers" id="pvReactions"></div></section><section class="comments"><div class="chead"><div class="count"><span id="pvTotal">103</span>개의 댓글</div><button class="my">MY댓글</button></div><div class="stats">현재 댓글 <b id="pvCurrent">98</b>　|　작성자 삭제 <b id="pvDeleted">5</b>　|　규정 미준수 <b id="pvRule">0</b></div><div class="sort">최신순</div><div id="pvComments"></div></section></article></div><div class="guides" id="guides"></div></div></section><section class="panel"><div class="group"><div class="label">기본 정보</div><input id="publisher" value="기사일보"><div class="label" style="margin-top:7px">언론사 프로필 사진</div><input id="publisherFile" type="file" accept="image/*"><input id="title" value="제목을 입력하세요" style="margin-top:7px"><input id="date" value="입력 2026.09.07. 오후 12:22"><div class="label">기사 사진</div><input id="photoFile" type="file" accept="image/*"><div class="small">업로드 사진은 기사 최상단에 16:9로 들어갑니다.</div></div><div class="group"><div class="label">기사 본문</div><textarea id="bodyText">여기에 기사 본문을 입력하세요.\n\n굵게 하고 싶은 부분을 선택한 뒤 아래 버튼을 누르세요.</textarea><div class="btnrow"><button class="btn" id="bold">B 굵게</button><button class="btn" id="source">기사원문 ON/OFF</button></div></div><div class="group"><div class="label">감정 반응 숫자</div><div class="reaction-editor" id="reactionEditor"></div></div><div class="group"><div class="label">댓글 설정</div><div class="row"><input id="total" type="number" value="103"><input id="current" type="number" value="98"></div><div class="row"><input id="deleted" type="number" value="5"><input id="rule" type="number" value="0"></div><div id="commentEditor"></div><button class="btn" id="add" style="width:100%;margin-top:6px">＋ 댓글 추가</button></div><div class="group"><div class="label">안내선</div><div class="btnrow"><button class="btn" id="guideBtn">안내선 OFF</button><button class="btn" id="reset">기본값 복원</button></div><div class="small">안내선을 켠 뒤 선을 직접 드래그해 수평·수직 위치를 맞출 수 있습니다.</div></div><button class="btn dark" id="save">PNG로 저장</button></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>
const N=['좋아요','응원해요','축하해요','기대해요','놀랐어요','슬퍼요'],D={publisher:'기사일보',title:'제목을 입력하세요',date:'입력 2026.09.07. 오후 12:22',body:'여기에 기사 본문을 입력하세요.\n\n굵게 하고 싶은 부분을 선택한 뒤 아래 버튼을 누르세요.',r:[16,19,406,5,215,11],total:103,current:98,deleted:5,rule:0,comments:[{n:'stee****',t:'2026.09.07 11:23',x:'쇼츠의 시대에 핵심만 보여주는 능력이 대단하네요.'},{n:'heav****',t:'2026.09.07 11:20',x:'정치판에서 사라져야 할 사람들, 서로 잘잘못만 따지네요.'}]};let d=structuredClone(D),photo='',logo='',guide=false,pos={v:50,h:35};const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function zoom(v){v=Math.max(20,Math.min(150,+v));$('zoom').value=v;$('ztext').textContent=v+'%';$('scale').style.transform=`scale(${v/100})`}function mode(m){$('news').classList.toggle('pc',m==='pc');$('scale').style.width=m==='pc'?'1600px':'900px';zoom($('zoom').value)}
function reactions(){ $('pvReactions').innerHTML=d.r.map(x=>`<div class="reactnum">${(+x||0).toLocaleString()}</div>`).join('');$('reactionEditor').innerHTML=d.r.map((x,i)=>`<label>${N[i]}<input type="number" min="0" value="${x}" data-r="${i}"></label>`).join('');document.querySelectorAll('[data-r]').forEach(e=>e.oninput=()=>{d.r[+e.dataset.r]=+e.value||0;reactions()})}
function comments(){ $('commentEditor').innerHTML=d.comments.map((c,i)=>`<div class="comment-editor"><div class="comment-head"><b>댓글 ${i+1}</b><button class="remove" data-del="${i}">×</button></div><div class="row"><input data-n="${i}" value="${esc(c.n)}"><input data-t="${i}" value="${esc(c.t)}"></div><textarea data-x="${i}">${esc(c.x)}</textarea></div>`).join('');document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{d.comments.splice(+e.dataset.del,1);comments();render()});document.querySelectorAll('[data-n]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.n].n=e.value;render()});document.querySelectorAll('[data-t]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.t].t=e.value;render()});document.querySelectorAll('[data-x]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.x].x=e.value;render()})}
function render(){ $('pvPublisher').textContent=d.publisher;$('pvTitle').textContent=d.title;$('pvDate').textContent=d.date;$('pvBody').innerHTML=esc(d.body).replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/\n/g,'<br>');$('pvTotal').textContent=d.total;$('pvCurrent').textContent=d.current;$('pvDeleted').textContent=d.deleted;$('pvRule').textContent=d.rule;$('pvSource').style.display=sourceOn?'inline-block':'none';$('pvPhoto').src=photo;$('pvPhoto').classList.toggle('show',!!photo);$('pubLogo').style.backgroundImage=logo?`url("${logo}")`:'';reactions();$('pvComments').innerHTML=d.comments.map(c=>`<div class="comment"><div class="user"><span class="avatar"></span><div><div class="uname">${esc(c.n)}</div><div class="time">${esc(c.t)}</div></div></div><div class="ctext">${esc(c.x).replace(/\n/g,'<br>')}</div><div class="reply">답글</div></div>`).join('')}
function guides(){const g=$('guides');g.innerHTML='';if(!guide)return;let v=document.createElement('div'),h=document.createElement('div');v.className='guide gv';h.className='guide gh';v.style.left=pos.v+'%';h.style.top=pos.h+'%';g.append(v,h);let drag=null;const move=e=>{const r=$('news').getBoundingClientRect();if(drag==='v')pos.v=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));if(drag==='h')pos.h=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));guides()};const stop=()=>{drag=null;window.removeEventListener('pointermove',move)};v.onpointerdown=e=>{e.preventDefault();drag='v';window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop,{once:true})};h.onpointerdown=e=>{e.preventDefault();drag='h';window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop,{once:true})}}
let sourceOn=true;function bind(){['publisher','title','date','bodyText','total','current','deleted','rule'].forEach(id=>$(id).oninput=()=>{d.publisher=$('publisher').value;d.title=$('title').value;d.date=$('date').value;d.body=$('bodyText').value;d.total=+$('total').value||0;d.current=+$('current').value||0;d.deleted=+$('deleted').value||0;d.rule=+$('rule').value||0;render()});$('zoom').oninput=e=>zoom(e.target.value);$('minus').onclick=()=>zoom(+$('zoom').value-10);$('plus').onclick=()=>zoom(+$('zoom').value+10);$('fit').onclick=()=>{let w=$('stage').clientWidth-16,n=$('news').offsetWidth;zoom(Math.max(20,Math.min(100,Math.floor(w/n*100))))};$('mode').onchange=e=>mode(e.target.value);$('guideBtn').onclick=()=>{guide=!guide;$('guideBtn').textContent='안내선 '+(guide?'ON':'OFF');guides()};$('add').onclick=()=>{d.comments.push({n:'new*****',t:'2026.09.08 19:00',x:'새 댓글을 입력하세요.'});comments();render()};$('source').onclick=()=>{sourceOn=!sourceOn;render()};$('bold').onclick=()=>{let t=$('bodyText'),a=t.selectionStart,b=t.selectionEnd;if(a!==b){t.value=t.value.slice(0,a)+'**'+t.value.slice(a,b)+'**'+t.value.slice(b);t.dispatchEvent(new Event('input'))}};$('photoFile').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader;r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)}};$('publisherFile').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader;r.onload=()=>{logo=r.result;render()};r.readAsDataURL(f)}};$('reset').onclick=()=>{if(confirm('기본값으로 복원할까요?')){d=structuredClone(D);photo='';logo='';sourceOn=true;guide=false;pos={v:50,h:35};$('photoFile').value='';$('publisherFile').value='';fill();comments();render();guides()}};$('save').onclick=savePNG}
function fill(){$('publisher').value=d.publisher;$('title').value=d.title;$('date').value=d.date;$('bodyText').value=d.body;$('total').value=d.total;$('current').value=d.current;$('deleted').value=d.deleted;$('rule').value=d.rule}
async function savePNG(){let old=guide,st=$('scale').style.transform;guide=false;guides();$('scale').style.transform='none';let c=await html2canvas($('news'),{scale:2,useCORS:true,backgroundColor:'#fffdf9'});$('scale').style.transform=st;guide=old;guides();let a=document.createElement('a');a.download='news-edit.png';a.href=c.toDataURL('image/png');a.click()}
bind();fill();comments();render();mode('mobile');zoom(50);guides();
</script></body></html>
