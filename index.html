blisherFile" type="file" accept="image/*"></div><div class="field"><input id="title" value="제목을 입력하세요"></div><div class="field"><input id="date" value="입력 2026.09.07. 오후 12:22"></div><div class="field"><div class="sub">기사 사진</div><input id="photoFile" type="file" accept="image/*"></div></div><div class="group"><div class="label">기사 본문</div><div class="field"><textarea id="bodyText">여기에 기사 본문을 입력하세요.\n\n굵게 하고 싶은 부분을 선택한 뒤 아래 버튼을 누르세요.</textarea></div><div class="row field"><label><span class="sub">본문 글자 크기</span><input id="bodySize" class="number-box" type="number" min="10" max="50" step="1" value="19"></label><label><span class="sub">제목 글자 크기</span><input id="titleSize" class="number-box" type="number" min="18" max="70" step="1" value="26"></label></div><div class="btnrow"><button class="btn" id="bold">B 굵게</button><button class="btn" id="source">기사원문 ON/OFF</button></div></div><div class="group"><div class="label">감정 반응 숫자</div><div class="reaction-editor" id="reactionEditor"></div></div><div class="group"><div class="label">댓글 설정</div><div class="sub">표시할 댓글 수와 삭제/규정 미준수 수치를 설정할 수 있어요.</div><div class="row field"><input id="total" type="number" value="103"><input id="current" type="number" value="98"></div><div class="row field"><input id="deleted" type="number" value="5"><input id="rule" type="number" value="0"></div><div id="commentEditor"></div><button class="btn" id="add" style="width:100%;margin-top:10px">＋ 댓글 추가</button></div><div class="save-wrap"><div class="btnrow"><button class="btn" id="reset">기본값 복원</button><button class="btn dark" id="save">PNG로 저장</button></div></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>const N=['좋아요','응원해요','축하해요','기대해요','놀랐어요','슬퍼요'],D={publisher:'기사일보',title:'제목을 입력하세요',date:'입력 2026.09.07. 오후 12:22',body:'여기에 기사 본문을 입력하세요.\n\n굵게 하고 싶은 부분을 선택한 뒤 아래 버튼을 누르세요.',bodySize:19,titleSize:26,r:[16,19,406,5,215,11],total:103,current:98,deleted:5,rule:0,comments:[{n:'stee****',t:'2026.09.07 11:23',x:'쇼츠의 시대에 핵심만 보여주는 능력이 대단하네요.'},{n:'heav****',t:'2026.09.07 11:20',x:'정치판에서 사라져야 할 사람들, 서로 잘잘못만 따지네요.'}]};let d=structuredClone(D),photo='',logo='',sourceOn=true;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function zoom(v){v=Math.max(20,Math.min(150,+v));$('zoom').value=v;$('ztext').textContent=v+'%';$('scale').style.transform=`scale(${v/100})`}function mode(m){$('news').classList.toggle('pc',m==='pc');$('scale').style.width=m==='pc'?'1600px':'720px';zoom($('zoom').value)}function reactions(){$('pvReactions').innerHTML=d.r.map(x=>`<div class="reactnum">${(+x||0).toLocaleString()}</div>`).join('');$('reactionEditor').innerHTML=d.r.map((x,i)=>`<label>${N[i]}<input type="number" min="0" value="${x}" data-r="${i}"></label>`).join('');document.querySelectorAll('[data-r]').forEach(e=>e.oninput=()=>{d.r[+e.dataset.r]=+e.value||0;reactions()})}function comments(){const ed=$('commentEditor');ed.innerHTML=d.comments.map((c,i)=>`<div class="comment-editor"><div class="comment-head"><b>댓글 ${i+1}</b><button class="remove" data-del="${i}">×</button></div><input data-cn="${i}" value="${esc(c.n)}"><input data-ct="${i}" value="${esc(c.t)}"><textarea data-cx="${i}">${esc(c.x)}</textarea></div>`).join('');document.querySelectorAll('[data-cn]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.cn].n=e.value;render()});document.querySelectorAll('[data-ct]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.ct].t=e.value;render()});document.querySelectorAll('[data-cx]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.cx].x=e.value;render()});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{d.comments.splice(+e.dataset.del,1);comments();render()})}function render(){$('pvPublisher').textContent=d.publisher;$('pvTitle').textContent=d.title;$('pvDate').textContent=d.date;$('pvBody').style.fontSize=(+d.bodySize||19)+'px';$('pvTitle').style.fontSize=(+d.titleSize||26)+'px';$('pvBody').innerHTML=esc(d.body).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');$('pvTotal').textContent=d.total;$('pvCurrent').textContent=d.current;$('pvDeleted').textContent=d.deleted;$('pvRule').textContent=d.rule;$('pvSource').style.display=sourceOn?'inline-block':'none';$('pvPhoto').src=photo;$('pvPhoto').classList.toggle('show',!!photo);$('pubLogo').style.backgroundImage=logo?`url("${logo}")`:'';reactions();$('pvComments').innerHTML=d.comments.map(c=>`<div class="comment"><div class="user"><span class="avatar"></span><div><div class="uname">${esc(c.n)}</div><div class="time">${esc(c.t)}</div></div></div><div class="ctext">${esc(c.x)}</div><div class="reply">답글</div></div>`).join('');$('publisher').value=d.publisher;$('title').value=d.title;$('date').value=d.date;$('bodyText').value=d.body;$('bodySize').value=d.bodySize;$('titleSize').value=d.titleSize;$('total').value=d.total;$('current').value=d.current;$('deleted').value=d.deleted;$('rule').value=d.rule}function bind(){['publisher','title','date','bodyText','bodySize','titleSize','total','current','deleted','rule'].forEach(id=>$(id).oninput=()=>{d.publisher=$('publisher').value;d.title=$('title').value;d.date=$('date').value;d.body=$('bodyText').value;d.bodySize=Math.max(10,Math.min(50,+$('bodySize').value||19));d.titleSize=Math.max(18,Math.min(70,+$('titleSize').value||26));d.total=Math.max(0,+$('total').value||0);d.current=Math.max(0,+$('current').value||0);d.deleted=Math.max(0,+$('deleted').value||0);d.rule=Math.max(0,+$('rule').value||0);render();comments()});$('mode').onchange=e=>mode(e.target.value);$('zoom').oninput=e=>zoom(e.target.value);$('minus').onclick=()=>zoom(+$('zoom').value-10);$('plus').onclick=()=>zoom(+$('zoom').value+10);$('fit').onclick=()=>zoom(innerWidth<761?45:50);$('add').onclick=()=>{d.comments.push({n:'새댓글****',t:'2026.09.08 12:00',x:'댓글 내용을 입력하세요.'});comments();render()};$('source').onclick=()=>{sourceOn=!sourceOn;render()};$('bold').onclick=()=>{const ta=$('bodyText'),a=ta.selectionStart,b=ta.selectionEnd;if(a!==b){ta.setRangeText('**'+ta.value.slice(a,b)+'**',a,b,'select');ta.dispatchEvent(new Event('input'))}};$('photoFile').onchange=e=>{const f=e.target.files?.[0];if(f){const r=new FileReader();r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)}};$('publisherFile').onchange=e=>{const f=e.target.files?.[0];if(f){const r=new FileReader();r.onload=()=>{logo=r.result;render()};r.readAsDataURL(f)}};$('reset').onclick=()=>{d=structuredClone(D);photo='';logo='';sourceOn=true;$('photoFile').value='';$('publisherFile').value='';comments();render()};$('save').onclick=savePNG}async function savePNG(){const g=$('news'),old=g.style.boxShadow;g.style.boxShadow='none';try{const canvas=await html2canvas(g,{backgroundColor:'#fff',scale:2,useCORS:true,allowTaint:false});const a=document.createElement('a');a.download='news-preview.png';a.href=canvas.toDataURL('image/png');a.click()}finally{g.style.boxShadow=old}}comments();render();bind();zoom(50);</script></body></html>
