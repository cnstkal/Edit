argin-bottom:0}input,textarea,select{width:100%;padding:10px 11px;border:1px solid #ddd6ca;border-radius:10px;background:#f9f6ef;color:#222;outline:0;font-weight:400!important}textarea{min-height:120px;resize:vertical;line-height:1.55}.row,.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid #d9d2c7;background:#fffdf8;border-radius:10px;padding:10px;font-size:13px;font-weight:550}.dark{background:#171717;color:#fff;border-color:#171717;width:100%}.comment-editor{border:1px solid #e7e0d5;border-radius:11px;padding:11px;margin-top:10px;background:#fcfaf5}.comment-editor>*{margin-bottom:8px}.number-box{max-width:180px}.save-wrap{padding-top:4px}@media(min-width:761px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px}.preview{grid-column:1}.panel{grid-column:2;grid-row:1;position:sticky;top:68px;max-height:calc(100vh - 80px);overflow:auto}.news.pc .article{padding-left:55px;padding-right:55px}.news.pc .title{font-size:46px}.news.pc .body{font-size:25px}}@media(max-width:760px){.layout{padding:5px}.tools{width:100%;border-radius:14px}.zoom{width:100%;margin-left:0}.zoom input{flex:1}.stage{padding:10px;max-width:100%}.article{padding-left:24px;padding-right:24px}.comments{padding-left:24px;padding-right:24px}.panel{padding:20px 16px}.group{padding:20px 0 22px}.label{font-size:15px;margin-bottom:10px}.field{margin-bottom:14px}}</style></head><body><header class="top"><div class="topin"><div class="brand">에딧 소스 생성기 · 뉴스</div><div class="ver">v2.4 · 2026.09.08</div></div></header><main class="layout"><section class="preview"><div class="tools"><b>프리뷰</b><select id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="10" max="300" value="40"><span id="ztext">40%</span></div></div><div class="stage" id="stage"><div class="scale" id="scale"><article class="news" id="news"><div class="article"><div class="publisher"><span class="publogo" id="pubLogo"></span><span id="pvPublisher">기사일보</span></div><img id="pvPhoto" class="photo"><h1 class="title" id="pvTitle">제목을 입력하세요</h1><div class="meta"><span id="pvDate">입력 2026.09.07. 오후 12:22</span><span class="pill" id="pvSource">기사원문</span></div><div class="body" id="pvBody"></div></div><section class="comments"><div class="chead"><div class="count"><span id="pvTotal">103</span>개의 댓글</div><button class="my">MY댓글</button></div><div class="stats"><span>현재 댓글 <b id="pvCurrent">98</b></span><span class="sep">|</span><span>작성자 삭제 <b id="pvDeleted">5</b></span><span class="sep">|</span><span>규정 미준수 <b id="pvRule">0</b></span></div><div class="sort">최신순</div><div id="pvComments"></div></section></article></div></div></section><section class="panel"><div class="group"><div class="label">기본 정보</div><div class="field"><input id="publisher" value="기사일보"></div><div class="field"><div class="sub">언론사 프로필 사진</div><input id="publisherFile" type="file" accept="image/*"></div><div class="field"><input id="title" value="제목을 입력하세요"></div><div class="field"><input id="date" value="입력 2026.09.07. 오후 12:22"></div><div class="field"><div class="sub">기사 사진</div><input id="photoFile" type="file" accept="image/*"></div></div><div class="group"><div class="label">기사 본문</div><div class="field"><textarea id="bodyText">여기에 기사 본문을 입력하세요.</textarea></div><div class="row field"><label><span class="sub">본문 글자 크기</span><input id="bodySize" class="number-box" type="number" min="10" max="50" value="19"></label><label><span class="sub">제목 글자 크기</span><input id="titleSize" class="number-box" type="number" min="18" max="70" value="26"></label></div><div class="btnrow"><button class="btn" id="bold">B 굵게</button><button class="btn" id="source">기사원문 ON/OFF</button></div></div><div class="group"><div class="label">댓글 설정</div><div class="row field"><input id="total" type="number" value="103"><input id="current" type="number" value="98"></div><div class="row field"><input id="deleted" type="number" value="5"><input id="rule" type="number" value="0"></div><div id="commentEditor"></div><button class="btn" id="add" style="width:100%">＋ 댓글 추가</button></div><div class="save-wrap"><div class="btnrow"><button class="btn" id="reset">기본값 복원</button><button class="btn dark" id="save">PNG로 저장</button></div></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>const D={publisher:'기사일보',title:'제목을 입력하세요',date:'입력 2026.09.07. 오후 12:22',body:'여기에 기사 본문을 입력하세요.',bodySize:19,titleSize:26,total:103,current:98,deleted:5,rule:0,comments:[{n:'stee****',t:'2026.09.07 11:23',x:'쇼츠의 시대에 핵심만 보여주는 능력이 대단하네요.'},{n:'heav****',t:'2026.09.07 11:20',x:'정치판에서 사라져야 할 사람들, 서로 잘잘못만 따지네요.'}]};const STORE='news-editor-local-v1';let d=structuredClone(D),photo='',logo='',sourceOn=true,panX=0,panY=0;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify({d,photo,logo,sourceOn,panX,panY,zoom:+$('zoom').value,mode:$('mode').value,savedAt:Date.now()}))}catch(e){try{localStorage.setItem(STORE,JSON.stringify({d,sourceOn,panX,panY,zoom:+$('zoom').value,mode:$('mode').value,savedAt:Date.now()}))}catch(_){}}}function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(!x)return;if(x.d)d=Object.assign(structuredClone(D),x.d);photo=x.photo||'';logo=x.logo||'';sourceOn=x.sourceOn!==false;panX=+x.panX||0;panY=+x.panY||0;if(x.mode)$('mode').value=x.mode;if(x.zoom)$('zoom').value=Math.max(10,Math.min(300,+x.zoom))}catch(e){}}function applyTransform(){const z=(+$('zoom').value||10)/100;$('scale').style.transform=`translate3d(${panX}px,${panY}px,0) scale(${z})`}function clampPan(){const st=$('stage'),nw=$('news'),z=(+$('zoom').value||10)/100,cw=nw.offsetWidth*z,ch=nw.offsetHeight*z;const maxX=Math.max(0,(cw-st.clientWidth)/2),maxY=Math.max(0,(ch-st.clientHeight)/2);panX=Math.max(-maxX,Math.min(maxX,panX));panY=Math.max(-maxY,Math.min(maxY,panY))}function setZoom(v,reset=false){v=Math.max(10,Math.min(300,Number(v)||10));const old=+$('zoom').value||v;$('zoom').value=v;$('ztext').textContent=Math.round(v)+'%';if(reset){panX=0;panY=0}else{const ratio=v/old;panX*=ratio;panY*=ratio}clampPan();applyTransform();saveLocal()}function fitPreview(){const n=$('news'),s=$('stage'),w=n.classList.contains('pc')?1600:720,h=n.classList.contains('pc')?900:1280;const v=Math.min((s.clientWidth-20)/w,(s.clientHeight-20)/h)*100;setZoom(Math.max(10,Math.min(100,v*.92)),true)}function mode(m){$('news').classList.toggle('pc',m==='pc');$('scale').style.width=m==='pc'?'1600px':'720px';fitPreview();saveLocal()}function comments(){const ed=$('commentEditor');ed.innerHTML=d.comments.map((c,i)=>'<div class="comment-editor"><b>댓글 '+(i+1)+'</b><input data-cn="'+i+'" value="'+esc(c.n)+'"><input data-ct="'+i+'" value="'+esc(c.t)+'"><textarea data-cx="'+i+'">'+esc(c.x)+'</textarea><button data-del="'+i+'">삭제</button></div>').join('');document.querySelectorAll('[data-cn]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.cn].n=e.value;render();saveLocal()});document.querySelectorAll('[data-ct]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.ct].t=e.value;render();saveLocal()});document.querySelectorAll('[data-cx]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.cx].x=e.value;render();saveLocal()});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{d.comments.splice(+e.dataset.del,1);comments();render();saveLocal()})}function render(){$('pvPublisher').textContent=d.publisher;$('pvTitle').textContent=d.title;$('pvTitle').style.fontSize=d.titleSize+'px';$('pvDate').textContent=d.date;$('pvBody').style.fontSize=d.bodySize+'px';$('pvBody').innerHTML=esc(d.body).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');$('pvTotal').textContent=d.total;$('pvCurrent').textContent=d.current;$('pvDeleted').textContent=d.deleted;$('pvRule').textContent=d.rule;$('pvSource').style.display=sourceOn?'inline-block':'none';$('pvPhoto').src=photo;$('pvPhoto').classList.toggle('show',!!photo);$('pubLogo').style.backgroundImage=logo?'url("'+logo+'")':'';$('pvComments').innerHTML=d.comments.map(c=>'<div class="comment"><div class="user"><span class="avatar"></span><div><div class="uname">'+esc(c.n)+'</div><div class="time">'+esc(c.t)+'</div></div></div><div class="ctext">'+esc(c.x)+'</div><div class="reply">답글</div></div>').join('');$('publisher').value=d.publisher;$('title').value=d.title;$('date').value=d.date;$('bodyText').value=d.body;$('bodySize').value=d.bodySize;$('titleSize').value=d.titleSize;$('total').value=d.total;$('current').value=d.current;$('deleted').value=d.deleted;$('rule').value=d.rule}function bind(){['publisher','title','date','bodyText','bodySize','titleSize','total','current','deleted','rule'].forEach(id=>$(id).oninput=()=>{d.publisher=$('publisher').value;d.title=$('title').value;d.date=$('date').value;d.body=$('bodyText').value;d.bodySize=Math.max(10,Math.min(50,+$('bodySize').value||19));d.titleSize=Math.max(18,Math.min(70,+$('titleSize').value||26));d.total=Math.max(0,+$('total').value||0);d.current=Math.max(0,+$('current').value||0);d.deleted=Math.max(0,+$('deleted').value||0);d.rule=Math.max(0,+$('rule').value||0);render();comments();saveLocal()});$('mode').onchange=e=>mode(e.target.value);$('zoom').oninput=e=>setZoom(e.target.value);$('minus').onclick=()=>setZoom(+$('zoom').value-10);$('plus').onclick=()=>setZoom(+$('zoom').value+10);$('fit').onclick=fitPreview;$('add').onclick=()=>{d.comments.push({n:'새댓글****',t:'2026.09.08 12:00',x:'댓글 내용을 입력하세요.'});comments();render();saveLocal()};$('source').onclick=()=>{sourceOn=!sourceOn;render();saveLocal()};$('bold').onclick=()=>{let t=$('bodyText'),a=t.selectionStart,b=t.selectionEnd;if(a!==b){t.setRangeText('**'+t.value.slice(a,b)+'**',a,b,'select');t.dispatchEvent(new Event('input'))}};$('photoFile').onchange=e=>{let f=e.target.files?.[0];if(f){let r=new FileReader;r.onload=()=>{photo=r.result;render();saveLocal()};r.readAsDataURL(f)}};$('publisherFile').onchange=e=>{let f=e.target.files?.[0];if(f){let r=new FileReader;r.onload=()=>{logo=r.result;render();saveLocal()};r.readAsDataURL(f)}};$('reset').onclick=()=>{d=structuredClone(D);photo='';logo='';sourceOn=true;panX=0;panY=0;localStorage.removeItem(STORE);$('zoom').value=40;$('mode').value='mobile';comments();render();fitPreview()};$('save').onclick=async()=>{let c=await html2canvas($('news'),{backgroundColor:'#fff',scale:2,useCORS:true});let a=document.createElement('a');a.download='news-preview.png';a.href=c.toDataURL('image/png');a.click()};let dragging=false,sx=0,sy=0,ox=0,oy=0;$('stage').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(e.target.closest('button,input,textarea,select'))return;dragging=true;sx=e.clientX;sy=e.clientY;ox=panX;oy=panY;$('stage').setPointerCapture(e.pointerId);$('stage').classList.add('dragging')});$('stage').addEventListener('pointermove',e=>{if(!dragging)return;panX=ox+e.clientX-sx;panY=oy+e.clientY-sy;clampPan();applyTransform()});function endDrag(e){if(!dragging)return;dragging=false;try{$('stage').releasePointerCapture(e.pointerId)}catch(_){}$('stage').classList.remove('dragging');saveLocal()}$('stage').addEventListener('pointerup',endDrag);$('stage').addEventListener('pointercancel',endDrag);window.addEventListener('resize',()=>{clampPan();applyTransform()});loadLocal();comments();render();bind();if($('mode').value==='pc')$('news').classList.add('pc');fitPreview();const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved?.zoom)setZoom(saved.zoom);</script></body></html>
