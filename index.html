ckground:#171717;color:#fff}.comment-editor{border:1px solid #e7e0d5;border-radius:11px;padding:11px;margin-top:10px}.comment-editor>*{margin-bottom:8px}.reaction-editor label{font-size:12px}.number-box{max-width:180px}@media(min-width:761px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px}.preview{grid-column:1}.panel{grid-column:2;grid-row:1;position:sticky;top:68px;max-height:calc(100vh - 80px);overflow:auto}.news.pc .title{font-size:46px}.news.pc .body{font-size:25px}}@media(max-width:760px){.layout{padding:5px}.zoom{width:100%;margin-left:0}.zoom input{flex:1}}</style></head><body><header class="top"><div class="topin"><div class="brand">에딧 소스 생성기 · 뉴스</div><div class="ver">v2.1 · 2026.09.08</div></div></header><main class="layout"><section class="preview"><div class="tools"><b>프리뷰</b><select id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="5" max="150" value="20"><span id="ztext">20%</span></div></div><div class="stage" id="stage"><div class="scale" id="scale"><article class="news" id="news"><div class="article"><div class="publisher"><span class="publogo" id="pubLogo"></span><span id="pvPublisher">기사일보</span></div><img id="pvPhoto" class="photo"><h1 class="title" id="pvTitle">제목을 입력하세요</h1><div class="meta"><span id="pvDate">입력 2026.09.07. 오후 12:22</span><span class="pill" id="pvSource">기사원문</span></div><div class="body" id="pvBody"></div></div><section class="reaction"><div class="reaction-strip"><i class="reaction-cell r0"></i><i class="reaction-cell r1"></i><i class="reaction-cell r2"></i><i class="reaction-cell r3"></i><i class="reaction-cell r4"></i><i class="reaction-cell r5"></i></div><div class="reaction-numbers" id="pvReactions"></div></section><section class="comments"><div class="chead"><div class="count"><span id="pvTotal">103</span>개의 댓글</div><button class="my">MY댓글</button></div><div class="stats">현재 댓글 <b id="pvCurrent">98</b> | 작성자 삭제 <b id="pvDeleted">5</b> | 규정 미준수 <b id="pvRule">0</b></div><div class="sort">최신순</div><div id="pvComments"></div></section></article></div></div></section><section class="panel"><div class="group"><div class="label">기본 정보</div><div class="field"><input id="publisher" value="기사일보"></div><div class="field"><div class="sub">언론사 프로필 사진</div><input id="publisherFile" type="file" accept="image/*"></div><div class="field"><input id="title" value="제목을 입력하세요"></div><div class="field"><input id="date" value="입력 2026.09.07. 오후 12:22"></div><div class="field"><div class="sub">기사 사진</div><input id="photoFile" type="file" accept="image/*"></div></div><div class="group"><div class="label">기사 본문</div><div class="field"><textarea id="bodyText">여기에 기사 본문을 입력하세요.</textarea></div><div class="row field"><label><span class="sub">본문 글자 크기</span><input id="bodySize" class="number-box" type="number" value="19"></label><label><span class="sub">제목 글자 크기</span><input id="titleSize" class="number-box" type="number" value="26"></label></div><div class="btnrow"><button class="btn" id="bold">B 굵게</button><button class="btn" id="source">기사원문 ON/OFF</button></div></div><div class="group"><div class="label">감정 반응 숫자</div><div class="reaction-editor" id="reactionEditor"></div></div><div class="group"><div class="label">댓글 설정</div><div class="row field"><input id="total" type="number" value="103"><input id="current" type="number" value="98"></div><div class="row field"><input id="deleted" type="number" value="5"><input id="rule" type="number" value="0"></div><div id="commentEditor"></div><button class="btn" id="add" style="width:100%">＋ 댓글 추가</button></div><div class="btnrow"><button class="btn" id="reset">기본값 복원</button><button class="btn dark" id="save">PNG로 저장</button></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>const N=['좋아요','응원해요','축하해요','기대해요','놀랐어요','슬퍼요'],D={publisher:'기사일보',title:'제목을 입력하세요',date:'입력 2026.09.07. 오후 12:22',body:'여기에 기사 본문을 입력하세요.',bodySize:19,titleSize:26,r:[16,19,406,5,215,11],total:103,current:98,deleted:5,rule:0,comments:[{n:'stee****',t:'2026.09.07 11:23',x:'쇼츠의 시대에 핵심만 보여주는 능력이 대단하네요.'}]};let d=structuredClone(D),photo='',logo='',sourceOn=true;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function zoom(v){v=Math.max(5,Math.min(150,+v));$('zoom').value=v;$('ztext').textContent=Math.round(v)+'%';$('scale').style.transform='scale('+(v/100)+')'}function fitPreview(){let n=$('news'),s=$('stage'),w=n.classList.contains('pc')?1600:720,h=n.classList.contains('pc')?900:1280,v=Math.min((s.clientWidth-20)/w,(s.clientHeight-20)/h)*(n.classList.contains('pc')?.95:.9);zoom(Math.max(5,Math.min(150,v*100)))}function mode(m){$('news').classList.toggle('pc',m==='pc');$('scale').style.width=m==='pc'?'1600px':'720px';fitPreview()}function reactions(){$('pvReactions').innerHTML=d.r.map(x=>'<div class="reactnum">'+(+x||0).toLocaleString()+'</div>').join('');$('reactionEditor').innerHTML=d.r.map((x,i)=>'<label>'+N[i]+'<input type="number" value="'+x+'" data-r="'+i+'"></label>').join('');document.querySelectorAll('[data-r]').forEach(e=>e.oninput=()=>{d.r[+e.dataset.r]=+e.value||0;reactions()})}function comments(){document.querySelector('#commentEditor').innerHTML=d.comments.map((c,i)=>'<div class="comment-editor"><b>댓글 '+(i+1)+'</b><input data-cn="'+i+'" value="'+esc(c.n)+'"><input data-ct="'+i+'" value="'+esc(c.t)+'"><textarea data-cx="'+i+'">'+esc(c.x)+'</textarea><button data-del="'+i+'">삭제</button></div>').join('');document.querySelectorAll('[data-cn]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.cn].n=e.value;render()});document.querySelectorAll('[data-ct]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.ct].t=e.value;render()});document.querySelectorAll('[data-cx]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.cx].x=e.value;render()});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{d.comments.splice(+e.dataset.del,1);comments();render()})}function render(){$('pvPublisher').textContent=d.publisher;$('pvTitle').textContent=d.title;$('pvTitle').style.fontSize=d.titleSize+'px';$('pvDate').textContent=d.date;$('pvBody').style.fontSize=d.bodySize+'px';$('pvBody').innerHTML=esc(d.body).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');$('pvTotal').textContent=d.total;$('pvCurrent').textContent=d.current;$('pvDeleted').textContent=d.deleted;$('pvRule').textContent=d.rule;$('pvSource').style.display=sourceOn?'inline-block':'none';$('pvPhoto').src=photo;$('pvPhoto').classList.toggle('show',!!photo);$('pubLogo').style.backgroundImage=logo?'url("'+logo+'")':'';$('pvComments').innerHTML=d.comments.map(c=>'<div class="comment"><div class="user"><span class="avatar"></span><div><div class="uname">'+esc(c.n)+'</div><div class="time">'+esc(c.t)+'</div></div></div><div class="ctext">'+esc(c.x)+'</div><div class="reply">답글</div></div>').join('');reactions();$('publisher').value=d.publisher;$('title').value=d.title;$('date').value=d.date;$('bodyText').value=d.body}function bind(){['publisher','title','date','bodyText','bodySize','titleSize','total','current','deleted','rule'].forEach(id=>$(id).oninput=()=>{d.publisher=$('publisher').value;d.title=$('title').value;d.date=$('date').value;d.body=$('bodyText').value;d.bodySize=+$('bodySize').value||19;d.titleSize=+$('titleSize').value||26;d.total=+$('total').value||0;d.current=+$('current').value||0;d.deleted=+$('deleted').value||0;d.rule=+$('rule').value||0;render();comments()});$('mode').onchange=e=>mode(e.target.value);$('zoom').oninput=e=>zoom(e.target.value);$('minus').onclick=()=>zoom(+$('zoom').value-5);$('plus').onclick=()=>zoom(+$('zoom').value+5);$('fit').onclick=fitPreview;$('add').onclick=()=>{d.comments.push({n:'새댓글****',t:'2026.09.08 12:00',x:'댓글 내용을 입력하세요.'});comments();render()};$('source').onclick=()=>{sourceOn=!sourceOn;render()};$('bold').onclick=()=>{let t=$('bodyText'),a=t.selectionStart,b=t.selectionEnd;if(a!==b){t.setRangeText('**'+t.value.slice(a,b)+'**',a,b,'select');t.dispatchEvent(new Event('input'))}};$('photoFile').onchange=e=>{let f=e.target.files?.[0];if(f){let r=new FileReader;r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)}};$('publisherFile').onchange=e=>{let f=e.target.files?.[0];if(f){let r=new FileReader;r.onload=()=>{logo=r.result;render()};r.readAsDataURL(f)}};$('reset').onclick=()=>{d=structuredClone(D);photo='';logo='';sourceOn=true;comments();render();fitPreview()};$('save').onclick=async()=>{let c=await html2canvas($('news'),{backgroundColor:'#fffdf9',scale:2,useCORS:true});let a=document.createElement('a');a.download='news-preview.png';a.href=c.toDataURL('image/png');a.click()}}comments();render();bind();fitPreview();</script></body></html>
