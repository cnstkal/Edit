ght:40px}.news.pc-mode .divider{margin-left:-55px;margin-right:-55px}

s="panel"><h2>뉴스 편집</h2><div class="group"><div class="label">기본 정보</div><div><input id="publisher" placeholder="언론사" value="기사일보"></div><div style="margin-top:7px"><div class="label">언론사 프로필 사진</div><input id="publisherFile" type="file" accept="image/*"></div><div style="margin-top:7px"><input id="title" placeholder="기사 제목" value="제목을 입력하세요"></div><div style="margin-top:7px"><input id="date" value="입력 2026.09.07. 오후 12:22"></div><div style="margin-top:7px"><div class="label">기사 사진</div><input id="photoFile" type="file" accept="image/*"><div class="small">사진을 선택하면 기사 최상단에 16:9 비율로 표시됩니다.</div></div></div><div class="group"><div class="label">기사 본문</div><textarea id="bodyText">여기에 기사 본문을 입력하세요.

굵게 하고 싶은 부분은 아래 굵게 버튼을 사용해 강조할 수 있습니다.</textarea><div class="btnrow" style="margin-top:7px"><button class="btn" id="boldBtn"><b>B</b> 굵게</button><button class="btn" id="sourceBtn">기사원문 표시</button></div></div><div class="group"><div class="label">감정 반응 숫자</div><div class="reaction-editor" id="reactionEditor"></div></div><div class="group"><div class="label">댓글 설정</div><div class="row"><input id="totalComments" type="number" value="103" placeholder="전체 댓글"><input id="currentComments" type="number" value="98" placeholder="현재 댓글"></div><div class="row" style="margin-top:7px"><input id="deletedComments" type="number" value="5" placeholder="작성자 삭제"><input id="ruleComments" type="number" value="0" placeholder="규정 미준수"></div><div id="commentEditor"></div><button class="btn" id="addComment" style="width:100%;margin-top:7px">＋ 댓글 추가</button></div><div class="group"><div class="label">프리뷰</div><div class="btnrow"><button class="btn" id="gridBtn">안내선 OFF</button><button class="btn" id="resetBtn">기본값 복원</button></div></div><div class="group"><button class="btn dark" id="saveBtn" style="width:100%">PNG로 저장</button><div class="small">저장 시 편집 UI와 안내선은 제외되고 뉴스 결과물만 출력됩니다.</div></div></section></main></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>
const reactionNames=['좋아요','응원해요','축하해요','기대해요','놀랐어요','슬퍼요'];const defaults={publisher:'기사일보',category:'사회',title:'제목을 입력하세요',date:'입력 2026.09.07. 오후 12:22',likes:8,articleComments:40,body:'여기에 기사 본문을 입력하세요.\n\n굵게 하고 싶은 부분은 아래 굵게 버튼을 사용해 강조할 수 있습니다.',reactions:[16,19,406,5,215,11],total:103,current:98,deleted:5,rule:0,comments:[{name:'stee****',time:'2026.09.07 11:23',text:'쇼츠의 시대에 핵심만 보여주는 능력이 대단하네요.'},{name:'heav****',time:'2026.09.07 11:20',text:'정치판에서 사라져야 할 사람들, 서로 잘잘못만 따지네요.'}]};let data=structuredClone(defaults),guide=false,photoSrc='',publisherSrc='';const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setViewMode(mode){const news=$('news');news.classList.toggle('mobile-mode',mode==='mobile');news.classList.toggle('pc-mode',mode==='pc');news.dataset.aspect=mode==='pc'?'16':'9';$('scale').style.width=(mode==='pc'?'1600':'900')+'px';setZoom($('zoom').value)}function setZoom(v){v=Math.max(20,Math.min(150,v));$('zoom').value=v;$('zoomText').textContent=v+'%';$('scale').style.transform=`scale(${v/100})`}function bind(){['publisher','title','date','bodyText','totalComments','currentComments','deletedComments','ruleComments'].forEach(id=>$(id).addEventListener('input',()=>{data.publisher=$('publisher').value;data.title=$('title').value;data.date=$('date').value;data.body=$('bodyText').value;data.total=+$('totalComments').value||0;data.current=+$('currentComments').value||0;data.deleted=+$('deletedComments').value||0;data.rule=+$('ruleComments').value||0;render()}));$('zoom').addEventListener('input',()=>setZoom(+$('zoom').value));$('zoomOut').onclick=()=>setZoom(+$('zoom').value-10);$('zoomIn').onclick=()=>setZoom(+$('zoom').value+10);$('zoomFit').onclick=()=>{const w=$('stage').clientWidth-30,nw=$('news').offsetWidth;setZoom(Math.max(20,Math.min(100,Math.round(w/nw*100))))};$('viewMode').addEventListener('change',e=>setViewMode(e.target.value));$('photoFile').addEventListener('change',e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{photoSrc=r.result;render()};r.readAsDataURL(f)}});$('publisherFile').addEventListener('change',e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{publisherSrc=r.result;render()};r.readAsDataURL(f)}});$('gridBtn').onclick=()=>{guide=!guide;$('gridBtn').textContent=`안내선 ${guide?'ON':'OFF'}`;$('news').classList.toggle('guides-on',guide)};$('addComment').onclick=()=>{data.comments.push({name:'new*****',time:'2026.09.08 18:58',text:'새 댓글을 입력하세요.'});renderCommentsEditor();render()};$('resetBtn').onclick=()=>{if(confirm('모든 입력 내용을 기본값으로 되돌릴까요?')){data=structuredClone(defaults);photoSrc='';publisherSrc='';fill();$('photoFile').value='';$('publisherFile').value='';guide=false;$('gridBtn').textContent='안내선 OFF';$('news').classList.remove('guides-on');renderCommentsEditor();render()}};$('sourceBtn').onclick=()=>{$('sourcePreview').style.display=$('sourcePreview').style.display==='none'?'inline-block':'none'};$('boldBtn').onclick=()=>{const ta=$('bodyText');if(ta.selectionStart!==ta.selectionEnd){const s=ta.value;ta.value=s.slice(0,ta.selectionStart)+'**'+s.slice(ta.selectionStart,ta.selectionEnd)+'**'+s.slice(ta.selectionEnd);ta.dispatchEvent(new Event('input'))}};$('saveBtn').onclick=savePNG}function fill(){$('publisher').value=data.publisher;$('title').value=data.title;$('date').value=data.date;$('bodyText').value=data.body;$('totalComments').value=data.total;$('currentComments').value=data.current;$('deletedComments').value=data.deleted;$('ruleComments').value=data.rule;$('zoom').value=60;$('zoomText').textContent='60%';$('scale').style.transform='scale(.6)'}function renderReactions(){$('reactionPreview').innerHTML=data.reactions.map(n=>`<div class="react-num">${n.toLocaleString()}</div>`).join('');$('reactionEditor').innerHTML=data.reactions.map((n,i)=>`<label>${reactionNames[i]}<input type="number" min="0" value="${n}" data-ri="${i}"></label>`).join('');document.querySelectorAll('[data-ri]').forEach(x=>x.oninput=()=>{data.reactions[+x.dataset.ri]=+x.value||0;renderReactions()})}function renderCommentsEditor(){$('commentEditor').innerHTML=data.comments.map((c,i)=>`<div class="comment-editor"><div class="comment-editor-head"><b style="font-weight:600">댓글 ${i+1}</b><button class="remove" data-del="${i}">×</button></div><div class="row"><input data-cn="${i}" value="${esc(c.name)}"><input data-ct="${i}" value="${esc(c.time)}"></div><textarea data-cx="${i}" style="margin-top:7px;min-height:65px">${esc(c.text)}</textarea></div>`).join('');document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{data.comments.splice(+x.dataset.del,1);renderCommentsEditor();render()});document.querySelectorAll('[data-cn]').forEach(x=>x.oninput=()=>{data.comments[+x.dataset.cn].name=x.value;render()});document.querySelectorAll('[data-ct]').forEach(x=>x.oninput=()=>{data.comments[+x.dataset.ct].time=x.value;render()});document.querySelectorAll('[data-cx]').forEach(x=>x.oninput=()=>{data.comments[+x.dataset.cx].text=x.value;render()})}function render(){$('pubPreview').textContent=data.publisher;$('photoPreview').src=photoSrc;$('photoPreview').classList.toggle('is-hidden',!photoSrc);$('pubLogo').style.backgroundImage=publisherSrc?`url(${publisherSrc})`:'';$('titlePreview').textContent=data.title;$('datePreview').textContent=data.date;$('bodyPreview').innerHTML=esc(data.body).replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/\n/g,'<br>');$('totalPreview').textContent=data.total;$('currentPreview').textContent=data.current;$('deletedPreview').textContent=data.deleted;$('rulePreview').textContent=data.rule;renderReactions();$('commentsPreview').innerHTML=data.comments.map(c=>`<div class="comment"><div class="comment-user"><span class="avatar"></span><div><div class="user-name">${esc(c.name)}</div><div class="time">${esc(c.time)}</div></div></div><div class="comment-text">${esc(c.text).replace(/\n/g,'<br>')}</div><div class="reply">답글</div></div>`).join('')}async function savePNG(){const news=$('news'),old=guide;news.classList.remove('guides-on');const oldTransform=$('scale').style.transform;$('scale').style.transform='none';const canvas=await html2canvas(news,{scale:2,useCORS:true,backgroundColor:'#fff',windowWidth:news.scrollWidth,windowHeight:news.scrollHeight});$('scale').style.transform=oldTransform;if(old)news.classList.add('guides-on');const a=document.createElement('a');a.download='news-edit.png';a.href=canvas.toDataURL('image/png');a.click()}bind();fill();renderCommentsEditor();render();setViewMode('mobile');
</script></body></html>
