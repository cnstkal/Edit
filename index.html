let d=structuredClone(D),photo='',logo='',guide=false,guidesData=[],sourceOn=true;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function setupRuler(el,type){el.onpointerdown=e=>{if(!guide)return;const r=$('news').getBoundingClientRect();const move=ev=>{const p=type==='v'?(ev.clientX-r.left)/r.width*100:(ev.clientY-r.top)/r.height*100;if(p>=0&&p<=100){if(!el._active){el._active=true;addGuide(type,p);el._created=guidesData.length-1}else{guidesData[el._created].pos=Math.max(0,Math.min(100,p));renderGuides()}}};const stop=()=>{el._active=false;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop)} }

function dragFromRuler(type,e){e.preventDefault();const move=ev=>{const r=$('news').getBoundingClientRect();const p=type==='v'?(ev.clientX-r.left)/r.width*100:(ev.clientY-r.top)/r.height*100;if(p>=0&&p<=100&&!dragFromRuler.active){dragFromRuler.active=true;addGuide(type,p);dragFromRuler.index=guidesData.length-1}else if(p>=0&&p<=100&&dragFromRuler.index!=null){guidesData[dragFromRuler.index].pos=p;renderGuides()}};const stop=()=>{dragFromRuler.active=false;dragFromRuler.index=null;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop)}
