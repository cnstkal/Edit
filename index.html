<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>에딧 소스 생성기 · 뉴스</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;letter-spacing:-.04em}html,body{margin:0;background:#f3efe7;color:#222;font-family:Pretendard,sans-serif}body{touch-action:pan-y}button,input,textarea,select{font:inherit;letter-spacing:-.04em}button{cursor:pointer}.top{position:sticky;top:0;z-index:100;background:#faf7f0f2;backdrop-filter:blur(12px);border-bottom:1px solid #e4ded3}.topin{padding:11px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:17px;font-weight:650}.ver{font-size:11px;color:#999}.layout{max-width:1120px;margin:auto;padding:10px;display:flex;flex-direction:column;gap:14px}.preview{order:1}.panel{order:2}.tools{background:#fffdf8;border:1px solid #dfd9ce;border-radius:16px;padding:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;width:100%;box-shadow:0 5px 18px #7771}.tools b{font-size:13px;font-weight:650}.tools select{width:auto;margin:0}.zoom{display:flex;align-items:center;gap:5px;margin-left:auto}.zoom button{min-width:36px;padding:8px;font-weight:500}.zoom input{width:150px;margin:0}.zoom span{font-size:12px;color:#888}.stage{position:relative;overflow:hidden;background:#fff;border-radius:14px;padding:10px;display:flex;justify-content:center;align-items:center;touch-action:none;cursor:grab;user-select:none;width:100%;max-width:520px;aspect-ratio:3/4;margin:0 auto}.stage.dragging{cursor:grabbing}.scale{transform-origin:center center;position:relative;flex:none;will-change:transform}.news{width:720px;min-width:720px;min-height:1280px;height:auto;aspect-ratio:9/16;background:#fff;position:relative;box-shadow:0 5px 24px #7772}.news.pc{width:1600px;min-width:1600px;min-height:900px;height:auto;aspect-ratio:16/9}.article{padding:24px 28px 0}.publisher{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:650}.publogo,.avatar{border-radius:50%;background:#111 center/cover no-repeat;flex:none}.publogo{width:26px;height:26px}.photo{display:none;width:100%;aspect-ratio:16/9;object-fit:cover;margin:17px 0}.photo.show{display:block}.title{font-size:30px;line-height:1.18;font-weight:650;margin:12px 0 9px}.meta{display:flex;align-items:center;gap:6px;color:#aaa;font-size:14px}.pill{border:1px solid #ddd6ca;border-radius:18px;padding:2px 6px;color:#777;font-size:9px}.body{padding:21px 0 25px;font-size:19px;line-height:1.72;white-space:pre-wrap;word-break:keep-all;border-bottom:1px solid #eee8de}.body strong{font-weight:650}.comments{padding:17px 24px 24px;font-size:13px}.chead{display:flex;align-items:center;justify-content:space-between}.count{font-size:13px;font-weight:600}.my{background:#171717;color:#fff;border:0;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600}.stats{display:flex;align-items:center;gap:5px;font-size:12px;color:#aaa;margin:4px 0 11px;white-space:nowrap}.stats .sep{color:#bbb}.stats b{color:#555;font-weight:500}.sort{font-size:10px;font-weight:600;padding-bottom:8px;border-bottom:1px solid #eee8de}.comment{padding:13px 0;border-bottom:1px solid #eee8de}.user{display:flex;align-items:center;gap:9px}.avatar{width:30px;height:30px}.uname{font-size:14px;font-weight:600}.time{font-size:11px;color:#aaa;margin-top:1px}.ctext{font-size:8px;line-height:1.45;margin:6px 0 0}.reply{display:inline-block;font-size:11px;line-height:1;color:#111;margin:5px 0 0}.panel{background:#fffdf8;border:1px solid #dfd9ce;border-radius:18px;padding:18px 16px;box-shadow:0 5px 20px #7771}.group{border-top:1px solid #eee8de;padding:18px 0 20px}.group:first-child{border-top:0;padding-top:2px}.label{font-size:14px;color:#555;font-weight:650;margin-bottom:9px}.sub{font-size:11px;color:#999;margin:-3px 0 10px}.field{margin-bottom:12px}.field:last-child{margin-bottom:0}input,textarea,select{width:100%;padding:10px 11px;border:1px solid #ddd6ca;border-radius:10px;background:#f9f6ef;color:#222;outline:0;font-weight:400!important}textarea{min-height:120px;resize:vertical;line-height:1.55}.row,.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid #d9d2c7;background:#fffdf8;border-radius:10px;padding:10px;font-size:13px;font-weight:550}.dark{background:#171717;color:#fff;border-color:#171717;width:100%}.comment-editor{border:1px solid #e7e0d5;border-radius:11px;padding:11px;margin-top:10px;background:#fcfaf5}.comment-editor>*{margin-bottom:8px}.number-box{max-width:180px}.save-wrap{padding-top:4px}@media(min-width:761px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px}.preview{grid-column:1}.panel{grid-column:2;grid-row:1;position:sticky;top:68px;max-height:calc(100vh - 80px);overflow:auto}.news.pc .article{padding-left:55px;padding-right:55px}.news.pc .title{font-size:46px}.news.pc .body{font-size:25px}}@media(max-width:760px){.layout{padding:5px}.tools{border-radius:14px}.zoom{width:100%;margin-left:0}.zoom input{flex:1}.stage{padding:10px;max-width:100%}.article{padding-left:24px;padding-right:24px}.comments{padding-left:24px;padding-right:24px}.panel{padding:20px 16px}.group{padding:20px 0 22px}.label{font-size:15px;margin-bottom:10px}.field{margin-bottom:14px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">에딧 소스 생성기 · 뉴스</div><div class="ver" id="updatedAt">KST --:--</div></div></header>
<main class="layout">
<section class="preview">
<div class="tools"><b>프리뷰</b><select id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select><div class="zoom"><button type="button" id="minus">−</button><button type="button" id="fit">맞춤</button><button type="button" id="plus">＋</button><input id="zoom" type="range" min="10" max="300" value="40"><span id="ztext">40%</span></div></div>
<div class="stage" id="stage"><div class="scale" id="scale"><article class="news" id="news"><div class="article"><div class="publisher"><span class="publogo" id="pubLogo"></span><span id="pvPublisher">기사일보</span></div><h1 class="title" id="pvTitle">제목을 입력하세요</h1><div class="meta"><span id="pvDate">입력 2026.09.07. 오후 12:22</span><span class="pill" id="pvSource">기사원문</span></div><img id="pvPhoto" class="photo"><div class="body" id="pvBody">여기에 기사 본문을 입력하세요.</div></div><section class="comments"><div class="chead"><div class="count"><span id="pvTotal">103</span>개의 댓글</div><button type="button" class="my">MY댓글</button></div><div class="stats"><span>현재 댓글 <b id="pvCurrent">98</b></span><span class="sep">|</span><span>작성자 삭제 <b id="pvDeleted">5</b></span><span class="sep">|</span><span>규정 미준수 <b id="pvRule">0</b></span></div><div class="sort">최신순</div><div id="pvComments"></div></section></article></div></div>
</section>
<section class="panel">
<div class="group"><div class="label">기본 정보</div><div class="field"><input id="publisher" value="기사일보"></div><div class="field"><div class="sub">언론사 프로필 사진</div><input id="publisherFile" type="file" accept="image/*"></div><div class="field"><input id="title" value="제목을 입력하세요"></div><div class="field"><input id="date" value="입력 2026.09.07. 오후 12:22"></div><div class="field"><div class="sub">기사 사진</div><input id="photoFile" type="file" accept="image/*"></div></div>
<div class="group"><div class="label">기사 본문</div><div class="field"><textarea id="bodyText">여기에 기사 본문을 입력하세요.</textarea></div><div class="row field"><label><span class="sub">본문 글자 크기</span><input id="bodySize" class="number-box" type="number" min="10" max="50" value="19"></label><label><span class="sub">제목 글자 크기</span><input id="titleSize" class="number-box" type="number" min="18" max="70" value="26"></label></div><div class="btnrow"><button type="button" class="btn" id="bold">B 굵게</button><button type="button" class="btn" id="source">기사원문 ON/OFF</button></div></div>
<div class="group"><div class="label">댓글 설정</div><div class="row field"><input id="total" type="number" value="103"><input id="current" type="number" value="98"></div><div class="row field"><input id="deleted" type="number" value="5"><input id="rule" type="number" value="0"></div><div id="commentEditor"></div><button type="button" class="btn" id="add" style="width:100%">＋ 댓글 추가</button></div>
<div class="save-wrap"><div class="btnrow"><button type="button" class="btn" id="reset">기본값 복원</button><button type="button" class="btn dark" id="save">PNG로 저장</button></div></div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){'use strict';
const D={publisher:'기사일보',title:'제목을 입력하세요',date:'입력 2026.09.07. 오후 12:22',body:'여기에 기사 본문을 입력하세요.',bodySize:19,titleSize:26,total:103,current:98,deleted:5,rule:0,comments:[{n:'stee****',t:'2026.09.07 11:23',x:'쇼츠의 시대에 핵심만 보여주는 능력이 대단하네요.'},{n:'heav****',t:'2026.09.07 11:20',x:'정치판에서 사라져야 할 사람들, 서로 잘잘못만 따지네요.'}]};
const STORE='news-editor-local-v1',$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let d=structuredClone(D),photo='',logo='',sourceOn=true,panX=0,panY=0;
function setUpdateTime(){const s=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date());$('updatedAt').textContent='KST '+s}
function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify({d,photo,logo,sourceOn,panX,panY,zoom:Number($('zoom').value),mode:$('mode').value,savedAt:Date.now()}))}catch(e){}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(!x)return;if(x.d)d=Object.assign(structuredClone(D),x.d);photo=x.photo||'';logo=x.logo||'';sourceOn=x.sourceOn!==false;panX=Number(x.panX)||0;panY=Number(x.panY)||0;if(x.mode)$('mode').value=x.mode;if(Number.isFinite(Number(x.zoom)))$('zoom').value=Math.max(10,Math.min(300,Number(x.zoom)))}catch(e){}}
function render(){$('pvPublisher').textContent=d.publisher;$('pvTitle').textContent=d.title;$('pvTitle').style.fontSize=d.titleSize+'px';$('pvDate').textContent=d.date;$('pvBody').style.fontSize=d.bodySize+'px';$('pvBody').innerHTML=esc(d.body).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');$('pvTotal').textContent=d.total;$('pvCurrent').textContent=d.current;$('pvDeleted').textContent=d.deleted;$('pvRule').textContent=d.rule;$('pvSource').style.display=sourceOn?'inline-block':'none';$('pvPhoto').src=photo;$('pvPhoto').classList.toggle('show',!!photo);$('pubLogo').style.backgroundImage=logo?'url("'+logo+'")':'';$('pvComments').innerHTML=d.comments.map(c=>'<div class="comment"><div class="user"><span class="avatar"></span><div><div class="uname">'+esc(c.n)+'</div><div class="time">'+esc(c.t)+'</div></div></div><div class="ctext">'+esc(c.x)+'</div><div class="reply">답글</div></div>').join('');$('publisher').value=d.publisher;$('title').value=d.title;$('date').value=d.date;$('bodyText').value=d.body;$('bodySize').value=d.bodySize;$('titleSize').value=d.titleSize;$('total').value=d.total;$('current').value=d.current;$('deleted').value=d.deleted;$('rule').value=d.rule}
function comments(){const ed=$('commentEditor');ed.innerHTML=d.comments.map((c,i)=>'<div class="comment-editor"><b>댓글 '+(i+1)+'</b><input data-cn="'+i+'" value="'+esc(c.n)+'"><input data-ct="'+i+'" value="'+esc(c.t)+'"><textarea data-cx="'+i+'">'+esc(c.x)+'</textarea><button type="button" data-del="'+i+'">삭제</button></div>').join('');ed.querySelectorAll('[data-cn]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.cn].n=e.value;render();saveLocal()});ed.querySelectorAll('[data-ct]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.ct].t=e.value;render();saveLocal()});ed.querySelectorAll('[data-cx]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.cx].x=e.value;render();saveLocal()});ed.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{d.comments.splice(+e.dataset.del,1);comments();render();saveLocal()})}
function clampPan(){const st=$('stage'),n=$('news'),z=Number($('zoom').value)/100,cw=n.offsetWidth*z,ch=n.offsetHeight*z,mx=Math.max(0,(cw-st.clientWidth)/2),my=Math.max(0,(ch-st.clientHeight)/2);panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY))}
function applyTransform(){const z=Number($('zoom').value)/100;$('ztext').textContent=Math.round(z*100)+'%';$('scale').style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+z+')'}
function setZoom(v,reset){v=Math.max(10,Math.min(300,Number(v)||10));const old=Number($('zoom').value)||v;$('zoom').value=v;if(reset){panX=0;panY=0}else{const r=v/old;panX*=r;panY*=r}clampPan();applyTransform();saveLocal()}
function fitPreview(){const n=$('news'),s=$('stage'),w=n.classList.contains('pc')?1600:720,h=n.offsetHeight||1280,v=Math.min((s.clientWidth-20)/w,(s.clientHeight-20)/h)*100;setZoom(Math.max(10,Math.min(100,v*.92)),true)}
function mode(m){$('news').classList.toggle('pc',m==='pc');$('scale').style.width=m==='pc'?'1600px':'720px';requestAnimationFrame(fitPreview)}
function bind(){['publisher','title','date','bodyText','bodySize','titleSize','total','current','deleted','rule'].forEach(id=>$(id).addEventListener('input',function(){d.publisher=$('publisher').value;d.title=$('title').value;d.date=$('date').value;d.body=$('bodyText').value;d.bodySize=Math.max(10,Math.min(50,Number($('bodySize').value)||19));d.titleSize=Math.max(18,Math.min(70,Number($('titleSize').value)||26));d.total=Math.max(0,Number($('total').value)||0);d.current=Math.max(0,Number($('current').value)||0);d.deleted=Math.max(0,Number($('deleted').value)||0);d.rule=Math.max(0,Number($('rule').value)||0);render();comments();saveLocal()}));$('mode').onchange=e=>mode(e.target.value);$('zoom').oninput=e=>setZoom(e.target.value,false);$('minus').onclick=()=>setZoom(Number($('zoom').value)-10,false);$('plus').onclick=()=>setZoom(Number($('zoom').value)+10,false);$('fit').onclick=()=>fitPreview();$('add').onclick=()=>{d.comments.push({n:'새댓글****',t:'2026.09.08 12:00',x:'댓글 내용을 입력하세요.'});comments();render();saveLocal()};$('source').onclick=()=>{sourceOn=!sourceOn;render();saveLocal()};$('bold').onclick=()=>{const t=$('bodyText'),a=t.selectionStart,b=t.selectionEnd;if(a!==b){t.setRangeText('**'+t.value.slice(a,b)+'**',a,b,'select');t.dispatchEvent(new Event('input',{bubbles:true}))}};$('photoFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{photo=r.result;render();requestAnimationFrame(()=>{clampPan();fitPreview()});saveLocal()};r.readAsDataURL(f)};$('publisherFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{logo=r.result;render();saveLocal()};r.readAsDataURL(f)};$('reset').onclick=()=>{d=structuredClone(D);photo='';logo='';sourceOn=true;panX=0;panY=0;localStorage.removeItem(STORE);$('mode').value='mobile';$('zoom').value=40;comments();render();requestAnimationFrame(fitPreview)};$('save').onclick=async()=>{try{const c=await html2canvas($('news'),{backgroundColor:'#fff',scale:2,useCORS:true}),a=document.createElement('a');a.download='news-preview.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장에 실패했습니다.')}}}
let dragging=false,sx=0,sy=0,ox=0,oy=0;$('stage').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(e.target.closest('button,input,textarea,select'))return;dragging=true;sx=e.clientX;sy=e.clientY;ox=panX;oy=panY;$('stage').setPointerCapture(e.pointerId);$('stage').classList.add('dragging')});$('stage').addEventListener('pointermove',e=>{if(!dragging)return;panX=ox+e.clientX-sx;panY=oy+e.clientY-sy;clampPan();applyTransform()});function endDrag(e){if(!dragging)return;dragging=false;try{$('stage').releasePointerCapture(e.pointerId)}catch(_){}$('stage').classList.remove('dragging');saveLocal()}$('stage').addEventListener('pointerup',endDrag);$('stage').addEventListener('pointercancel',endDrag);window.addEventListener('resize',()=>{clampPan();applyTransform()});loadLocal();comments();render();bind();setUpdateTime();if($('mode').value==='pc')$('news').classList.add('pc');requestAnimationFrame(()=>{fitPreview();const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&Number.isFinite(Number(saved.zoom)))setZoom(Number(saved.zoom),false)})})();
</script>
</body>
</html>
