er{display:none}.body{padding:30px 0 35px;font-size:20px;line-height:1.82;letter-spacing:-.75px;white-space:pre-wrap;word-break:keep-all}.body strong{font-weight:600}.reaction{border-top:10px solid #f5f5f5;border-bottom:10px solid #f5f5f5;padding:20px 28px 22px;overflow:hidden}.reaction-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;align-items:end}.reaction-item{text-align:center;min-width:0}.reaction-item img{display:block;width:100%;height:auto}.reaction-numbers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:1px;text-align:center}.reaction-numbers .react-num{font-size:16px;font-weight:450;letter-spacing:-.4px}.comments{padding:34px 34px 65px}.comments-head{display:flex;align-items:center;justify-content:space-between}.comments-count{font-size:23px;font-weight:550;letter-spacing:-.8px}.mycomment{background:#171717;color:#fff;border-radius:22px;padding:9px 17px;font-size:14px;font-weight:700}.comment-stats{display:flex;align-items:center;gap:7px;font-size:14px;color:#aaa;margin:8px 0 20px}.comment-stats i{font-style:normal;color:#bbb}.comment-stats b{color:#333;font-weight:500}.sort{font-size:15px;font-weight:650;padding-bottom:12px;border-bottom:1px solid #eee8de}.comment{padding:18px 0;border-bottom:1px solid #eee8de}.comment-user{display:flex;gap:12px;align-items:center}.avatar{width:43px;height:43px;border-radius:50%;background:#111}.user-name{font-size:15px;font-weight:700}.time{font-size:12px;color:#aaa;margin-top:2px}.comment-text{font-size:13px;line-height:1.48;margin:6px 0 0 0;letter-spacing:-.4px}.reply{font-size:12px;color:#aaa;margin:3px 0 0 0}.guides{position:absolute;inset:0;z-index:40;pointer-events:none}.guide{position:absolute;background:#1683ff;box-shadow:0 0 0 1px #fff;opacity:.85;pointer-events:auto;touch-action:none}.gv{top:0;bottom:0;width:2px;cursor:ew-resize}.gh{left:0;right:0;height:2px;cursor:ns-resize}.guides-on:before,.guides-on:after{content:"";position:absolute;z-index:20;pointe </style></head><body><div class="app"><header class="topbar"><div class="topbar-inner"><div class="brand">에딧 소스 생성기 · 뉴스</div><div class="ver">v1.5 · 2026.09.08</div></div></header><main class="layout"><section class="preview-wrap"><div class="preview-tools"><div class="tools-left"><b style="font-size:13px">프리뷰</b><select id="viewMode" style="width:auto;padding:7px 9px;font-size:12px"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select><span id="zoomText" style="font-size:12px;color:#888">60%</span></div><div class="zoom-buttons"><button id="zoomOut">−</button><button id="zoomFit">맞춤</button><button id="zoomIn">＋</button></div><input id="zoom" class="zoom" type="range" min="20" max="150" value="60"></div><div class="preview-stage" id="stage"><div class="preview-scale" id="scale"><article class="news mobile-mode" id="news"><div class="article"><div class="media-line"><div class="publisher"><span class="pub-logo" id="pubLogo"></span><span id="pubPreview">기사일보</span></div><div class="pick">PiCK <i></i></div></div><img id="photoPreview" class="article-photo is-hidden" src="" alt="기사 사진"><h1 class="title" id="titlePreview">제목을 입력하세요</h1><div class="meta"><span id="datePreview">입력 2026.09.07. 오후 12:22</span><span class="source-pill" id="sourcePreview">기사원문</span></div><div class="divider"></div><div class="body" id="bodyPreview"></div></div><section class="reaction"><div class="reaction-grid"><div class="reaction-item"><img src="data:image/webp;base64,REPLACE1" alt="좋아요"></div><div class="reaction-item"><img src="data:image/webp;base64,REPLACE2" alt="응원해요"></div><div class="reaction-item"><img src="data:image/webp;base64,REPLACE3" alt="축하해요"></div><div class="reaction-item"><img src="data:image/webp;base64,REPLACE4" alt="기대해요"></div><div class="reaction-item"><img src="data:image/webp;base64,REPLACE5" alt="놀랐어요"></div><div class="reaction-item"><img src="data:image/webp;base64,REPLACE6" alt="슬퍼요"></div></div><div class="reaction-numbers" id="reactionPreview"></div></section><section class="comments"><div class="comments-head"><div class="comments-count"><span id="totalPreview">103</span>개의 댓글</div><div class="mycomment">MY댓글</div></div><div class="comment-stats"><span>현재 댓글 <b id="currentPreview">98</b></span><i>|</i><span>작성자 삭제 <b id="deletedPreview">5</b></span><i>|</i><span>규정 미준수 <b id="rulePreview">0</b></span></div><div class="sort">최신순</div><div id="commentsPreview"></div></section></article></div><div class="guides-layer" id="guidesLayer"></div></div></section><section class="panel"><h2>뉴스 편집</h2><div class="group"><div class="label">기본 정보</div><div><input id="publisher" placeholder="언론사" value="기사일보"></div><div style="margin-top:7px"><div class="label">언론사 프로필 사진</div><input id="publisherFile" type="file" accept="image/*"></div><div style="margin-top:7px"><input id="title" placeholder="기사 제목" value="제목을 입력하세요"></div><div style="margin-top:7px"><input id="date" value="입력 2026.09.07. 오후 12:22"></div><div style="margin-top:7px"><div class="label">기사 사진</div><input id="photoFile" type="file" accept="image/*"><div class="small">사진을 선택하면 기사 최상단에 16:9 비율로 표시됩니다.</div></div></div><div class="group"><div class="label">기사 본문</div><textarea id="bodyText">여기에 기사 본문을 입력하세요.\n\n굵게 하고 싶은 부분을 선택한 뒤 아래 버튼을 누르세요.</textarea><div class="btnrow" style="margin-top:7px"><button class="btn" id="boldBtn"><b>B</b> 굵게</button><button class="btn" id="sourceBtn">기사원문 표시</button></div></div><div class="group"><div class="label">감정 반응 숫자</div><div class="reaction-editor" id="reactionEditor"></div></div><div class="group"><div class="label">댓글 설정</div><div class="row"><input id="totalComments" type="number" value="103" placeholder="전체 댓글"><input id="currentComments" type="number" value="98" placeholder="현재 댓글"></div><div class="row" style="margin-top:7px"><input id="deletedComments" type="number" value="5" placeholder="작성자 삭제"><input id="ruleComments" type="number" value="0" placeholder="규정 미준수"></div><div id="commentEditor"></div><button class="btn" id="addComment" style="width:100%;margin-top:7px">＋ 댓글 추가</button></div><div class="group"><div class="label">프리뷰</div><div class="btnrow"><button class="btn" id="gridBtn">안내선 OFF</button><button class="btn" id="resetBtn">기본값 복원</button></div></div><div class="group"><button class="btn dark" id="saveBtn" style="width:100%">PNG로 저장</button><div class="small">저장 시 편집 UI와 안내선은 제외되고 뉴스 결과물만 출력됩니다.</div></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>const reactionNames=['좋아요','응원해요','축하해요','기대해요','놀랐어요','슬퍼요'];const defaults={publisher:'기사일보',category:'사회',title:'제목을 입력하세요',date:'입력 2026.09.07. 오후 12:22',likes:8,articleComments:40,body:'여기에 기사 본문을 입력하세요.\n\n굵게 하고 싶은 부분을 선택한 뒤 아래 버튼을 누르세요.',reactions:[16,19,406,5,215,11],total:103,current:98,deleted:5,rule:0,comments:[{name:'stee****',time:'2026.09.07 11:23',text:'쇼츠의 시대에 핵심만 보여주는 능력이 대단하네요.'},{name:'heav****',time:'2026.09.07 11:20',text:'정치판에서 사라져야 할 사람들, 서로 잘잘못만 따지네요.'}]};let data=structuredClone(defaults),guide=false,photoSrc='',publisherSrc='';const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function setViewMode(mode){const news=$('news');news.classList.toggle('mobile-mode',mode==='mobile');news.classList.toggle('pc-mode',mode==='pc');news.classList.toggle('pc',mode==='pc');$('scale').style.width=mode==='pc'?'1600px':'900px';setZoom($('zoom').value)}function setZoom(v){v=Math.max(20,Math.min(150,+v));$('zoom').value=v;$('zoomText').textContent=v+'%';$('scale').style.transform=`scale(${v/100})`}function renderReactions(){$('reactionPreview').innerHTML=data.reactions.map(n=>`<div class="react-num">${(+n||0).toLocaleString()}</div>`).join('');$('reactionEditor').innerHTML=data.reactions.map((n,i)=>`<label>${reactionNames[i]}<input type="number" min="0" value="${n}" data-ri="${i}"></label>`).join('');document.querySelectorAll('[data-ri]').forEach(x=>x.oninput=()=>{data.reactions[+x.dataset.ri]=+x.value||0;renderReactions()})}function renderCommentsEditor(){$('commentEditor').innerHTML=data.comments.map((c,i)=>`<div class="comment-editor"><div class="comment-editor-head"><b>댓글 ${i+1}</b><button class="remove" data-del="${i}">×</button></div><div class="row"><input data-cn="${i}" value="${esc(c.name)}"><input data-ct="${i}" value="${esc(c.time)}"></div><textarea data-cx="${i}" style="margin-top:7px;min-height:65px">${esc(c.text)}</textarea></div>`).join('');document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{data.comments.splice(+x.dataset.del,1);renderCommentsEditor();render()});document.querySelectorAll('[data-cn]').forEach(x=>x.oninput=()=>{data.comments[+x.dataset.cn].name=x.value;render()});document.querySelectorAll('[data-ct]').forEach(x=>x.oninput=()=>{data.comments[+x.dataset.ct].time=x.value;render()});document.querySelectorAll('[data-cx]').forEach(x=>x.oninput=()=>{data.comments[+x.dataset.cx].text=x.value;render()})}function render(){ $('pubPreview').textContent=data.publisher;$('photoPreview').src=photoSrc;$('photoPreview').classList.toggle('is-hidden',!photoSrc);$('photoPreview').alt=photoSrc?'기사 사진':'';$('photoPreview').style.display=photoSrc?'block':'none';$('titlePreview').textContent=data.title;$('datePreview').textContent=data.date;$('news .pub-logo').style.backgroundImage=publisherSrc?`url(${publisherSrc})`:'';$('news .pub-logo').style.backgroundSize='cover';$('bodyPreview').innerHTML=esc(data.body).replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/\n/g,'<br>');$('totalPreview').textContent=data.total;$('currentPreview').textContent=data.current;$('deletedPreview').textContent=data.deleted;$('rulePreview').textContent=data.rule;$('sourcePreview').style.display=sourceOn?'inline-block':'none';renderReactions();$('commentsPreview').innerHTML=data.comments.map(c=>`<div class="comment"><div class="comment-user"><span class="avatar"></span><div><div class="user-name">${esc(c.name)}</div><div class="time">${esc(c.time)}</div></div></div><div class="comment-text">${esc(c.text).replace(/\n/g,'<br>')}</div><div class="reply">답글</div></div>`).join('')}let sourceOn=true;function bind(){$('viewMode').onchange=e=>setViewMode(e.target.value);$('zoom').oninput=e=>setZoom(e.target.value);$('zoomOut').onclick=()=>setZoom(+$('zoom').value-10);$('zoomIn').onclick=()=>setZoom(+$('zoom').value+10);$('zoomFit').onclick=()=>setZoom(50);['publisher','title','date','bodyText','totalComments','currentComments','deletedComments','ruleComments'].forEach(id=>$(id).addEventListener('input',()=>{data.publisher=$('publisher').value;data.title=$('title').value;data.date=$('date').value;data.body=$('bodyText').value;data.total=+$('totalComments').value||0;data.current=+$('currentComments').value||0;data.deleted=+$('deletedComments').value||0;data.rule=+$('ruleComments').value||0;render()}));$('publisherFile').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{publisherSrc=r.result;render()};r.readAsDataURL(f)}};$('photoFile').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{photoSrc=r.result;render()};r.readAsDataURL(f)}};$('sourceBtn').onclick=()=>{sourceOn=!sourceOn;render()};$('boldBtn').onclick=()=>{const t=$('bodyText'),s=t.selectionStart,e=t.selectionEnd;if(s!==e){const v=t.value;t.value=v.slice(0,s)+'**'+v.slice(s,e)+'**'+v.slice(e);data.body=t.value;render()}};$('addComment').onclick=()=>{data.comments.push({name:'new*****',time:'2026.09.08 19:00',text:'새 댓글을 입력하세요.'});renderCommentsEditor();render()};$('gridBtn').onclick=()=>{guide=!guide;renderGuides()};$('resetBtn').onclick=()=>{data=structuredClone(defaults);photoSrc='';publisherSrc='';sourceOn=true;fill();renderCommentsEditor();render()};$('saveBtn').onclick=savePNG}function fill(){$('publisher').value=data.publisher;$('title').value=data.title;$('date').value=data.date;$('bodyText').value=data.body;$('totalComments').value=data.total;$('currentComments').value=data.current;$('deletedComments').value=data.deleted;$('ruleComments').value=data.rule}function renderGuides(){const layer=$('guidesLayer');layer.innerHTML='';layer.style.display=guide?'block':'none';if(!guide)return;const v=document.createElement('div'),hh=document.createElement('div');v.className='guide gv';hh.className='guide gh';v.style.left=pos.v+'%';hh.style.top=pos.h+'%';layer.append(v,hh);function drag(el,type){const move=e=>{const r=$('news').getBoundingClientRect();const x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(type==='v')pos.v=Math.max(0,Math.min(100,x));else pos.h=Math.max(0,Math.min(100,y));el.style[type==='v'?'left':'top']=(type==='v'?pos.v:pos.h)+'%'};el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);el.onpointermove=move;el.onpointerup=()=>{el.onpointermove=null}}}drag(v,'v');drag(hh,'h')}async function savePNG(){const oldGuide=guide;guide=false;renderGuides();const oldTransform=$('scale').style.transform;$('scale').style.transform='none';const canvas=await html2canvas($('news'),{scale:2,useCORS:true,backgroundColor:'#fff',windowWidth:$('news').scrollWidth,windowHeight:$('news').scrollHeight});$('scale').style.transform=oldTransform;guide=oldGuide;renderGuides();const a=document.createElement('a');a.download='news-edit.png';a.href=canvas.toDataURL('image/png');a.click()}bind();fill();renderCommentsEditor();render();setViewMode('mobile');renderGuides();
</script></body></html>
