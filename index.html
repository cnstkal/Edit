<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>에딧 소스 생성기 · 뉴스</title><style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f3efe7;color:#171717;font-family:Pretendard,sans-serif;overscroll-behavior:none}body{touch-action:pan-y}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;background:#faf7f0ee;backdrop-filter:blur(12px);border-bottom:1px solid #e4ded3;padding:11px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:16px;font-weight:800}.ver{font-size:11px;color:#999}.layout{max-width:1120px;margin:auto;padding:12px;display:grid;grid-template-columns:330px 1fr;gap:12px}.panel,.tools{background:#fffdf8;border:1px solid #e1dbd0;border-radius:15px;padding:12px}.panel{position:sticky;top:61px;height:max-content;max-height:calc(100vh - 74px);overflow:auto}.g{border-top:1px solid #eee8de;padding:11px 0}.g:first-child{border-top:0}.lab,label{font-size:12px;color:#777;font-weight:750}input,textarea,select{width:100%;padding:9px 10px;border:1px solid #ddd6ca;border-radius:9px;background:#f9f6ef;margin:5px 0;outline:0;color:#222}input:focus,textarea:focus,select:focus{background:#fffdf8;border-color:#aaa}textarea{min-height:100px;resize:vertical;line-height:1.55}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}button{border:1px solid #d9d2c7;background:#fffdf8;border-radius:9px;padding:9px;font-weight:750;color:#222}.dark{background:#171717;color:white;border-color:#171717;width:100%}.re{display:grid;grid-template-columns:1fr 1fr;gap:5px}.re label{font-size:10px}.ce{border:1px solid #e7e0d5;border-radius:9px;padding:8px;margin:5px 0}.ce h4{margin:0 0 3px;font-size:12px}.ce textarea{min-height:52px}.del{float:right;border:0;background:none;color:#999;padding:0;font-size:18px}.small{font-size:10px;color:#999;line-height:1.45}.preview{min-width:0}.tools{display:flex;gap:8px;align-items:center;position:sticky;top:61px;z-index:20;margin-bottom:10px;flex-wrap:wrap}.tools select{width:auto;margin:0}.zoombar{display:flex;align-items:center;gap:5px;margin-left:auto}.zoombar button{min-width:34px;padding:7px}.zoombar input{width:150px;margin:0}.stage{overflow:auto;background:#e4dfd6;border-radius:14px;padding:15px;min-height:80vh;display:flex;justify-content:center;align-items:flex-start;touch-action:pan-x pan-y}.scale{transform-origin:top center;will-change:transform}.news{width:900px;min-height:100px;background:#fffdf9;overflow:hidden;box-shadow:0 5px 25px #8f887533}.news.pc{width:1600px}.article{padding:34px}.pub{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:800}.logo{width:38px;height:38px;border-radius:50%;background:#111;display:inline-block}.photo{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;margin:0 0 30px;background:#ece6db}.title{font-size:40px;line-height:1.2;letter-spacing:-2px;margin:26px 0 20px;font-weight:850}.meta{color:#aaa;font-size:16px}.pill{border:1px solid #ddd6ca;border-radius:16px;padding:4px 10px;color:#777;margin-left:8px}.line{height:9px;background:#efebe3;margin:24px -34px 0}.body{padding:30px 0;font-size:20px;line-height:1.8;white-space:pre-wrap;word-break:keep-all}.reaction{border-block:9px solid #efebe3;padding:23px 16px}.rg{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}.ri{text-align:center;min-width:0}.sprite{height:92px;background-image:url('./이미지/img-ba868ac486f5.webp');background-repeat:no-repeat;background-size:600% 100%;background-position-y:center}.ri:nth-child(1) .sprite{background-position-x:0}.ri:nth-child(2) .sprite{background-position-x:20%}.ri:nth-child(3) .sprite{background-position-x:40%}.ri:nth-child(4) .sprite{background-position-x:60%}.ri:nth-child(5) .sprite{background-position-x:80%}.ri:nth-child(6) .sprite{background-position-x:100%}.rname{font-size:15px;color:#777;margin-top:0}.rnum{font-size:21px;font-weight:650;letter-spacing:-.5px;margin-top:2px}.comments{padding:38px 34px 65px}.chead{display:flex;align-items:center;justify-content:space-between}.ccount{font-size:25px;font-weight:850;letter-spacing:-1px}.my{background:#171717;color:#fff;border-radius:22px;padding:9px 17px;font-size:14px;font-weight:800}.stats{font-size:14px;color:#aaa;margin:10px 0 25px}.stats b{color:#333}.sort{font-size:15px;font-weight:800;padding-bottom:12px;border-bottom:1px solid #eee8de}.comment{padding:19px 0;border-bottom:1px solid #eee8de}.user{display:flex;gap:12px;align-items:center}.avatar{width:43px;height:43px;border-radius:50%;background:#111}.uname{font-size:16px;font-weight:800}.time{font-size:12px;color:#aaa;margin-top:3px}.ctext{font-size:15px;line-height:1.5;margin:8px 0 0 55px;letter-spacing:-.35px}.reply{font-size:12px;color:#aaa;margin:5px 0 0 55px}.grid-on{background-image:linear-gradient(rgba(80,120,180,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(80,120,180,.14) 1px,transparent 1px);background-size:20px 20px}.news.grid-on:after{content:"";position:absolute;inset:0;pointer-events:none;border:1px dashed rgba(80,120,180,.35)}.news{position:relative}.pc .photo{aspect-ratio:16/9}.news.pc .title{font-size:52px}.news.pc .body{font-size:25px}.news.pc .article{padding:50px}.news.pc .line{margin-left:-50px;margin-right:-50px}.news.pc .comments{padding-left:50px;padding-right:50px}@media(max-width:760px){.layout{display:block;padding:7px}.panel{position:relative;top:auto;max-height:none;margin-bottom:7px}.tools{top:55px}.zoombar{margin-left:0;width:100%}.zoombar input{flex:1}.stage{padding:8px}.news{width:900px}}
</style></head><body>
<header class="top"><div class="brand">에딧 소스 생성기 · 뉴스</div><div class="ver">v1.2 · 2026.09.08 19:05</div></header>
<main class="layout"><section class="panel"><div class="g"><div class="lab">언론사</div><input id="publisher" value="기사일보"><div class="lab">기사 제목</div><input id="title" value="제목을 입력하세요"><div class="row"><div><div class="lab">입력 시간</div><input id="date" value="입력 2026.09.07. 오후 12:22"></div><div><div class="lab">기사원문</div><select id="source"><option>기사원문</option><option>숨김</option></select></div></div></div>
<div class="g"><div class="lab">기사 사진 · 항상 본문 최상단</div><input id="photoFile" type="file" accept="image/*"><div class="small">기본 경로: 이미지/image_02.png · 16:9 비율</div></div>
<div class="g"><div class="lab">기사 본문</div><textarea id="body">여기에 기사 본문을 입력하세요.\n\n굵게 하고 싶은 부분은 아래 버튼을 누른 뒤 선택 영역에 적용할 수 있습니다.</textarea><button id="bold" style="width:100%"><b>B</b> 선택 영역 굵게</button></div>
<div class="g"><div class="lab">감정 반응 숫자</div><div class="re" id="reEdit"></div></div>
<div class="g"><div class="lab">댓글</div><div class="row"><input id="total" type="number" value="103" placeholder="전체"><input id="current" type="number" value="98" placeholder="현재"></div><div class="row"><input id="deleted" type="number" value="5" placeholder="삭제"><input id="rule" type="number" value="0" placeholder="미준수"></div><div id="ce"></div><button id="add" style="width:100%">＋ 댓글 추가</button></div>
<div class="g"><div class="row"><button id="grid">격자 OFF</button><button id="reset">기본값 복원</button></div><button id="save" class="dark" style="margin-top:7px">PNG로 저장</button></div></section>
<section class="preview"><div class="tools"><b style="font-size:13px">프리뷰</b><select id="mode"><option value="mobile">모바일 · 9:가변</option><option value="pc">PC · 16:가변</option></select><div class="zoombar"><button id="minus">−</button><button id="fit">맞춤</button><input id="zoom" type="range" min="20" max="150" value="60"><button id="plus">＋</button><span id="zt">60%</span></div></div><div class="stage" id="stage"><div class="scale" id="scale"><article class="news" id="news"><div class="article"><div class="pub"><span class="logo"></span><span id="pvPub">기사일보</span></div><img id="photo" class="photo" src="./이미지/image_02.png" alt="기사 사진"><h1 class="title" id="pvTitle">제목을 입력하세요</h1><div class="meta"><span id="pvDate">입력 2026.09.07. 오후 12:22</span><span id="pvSource" class="pill">기사원문</span></div><div class="line"></div><div class="body" id="pvBody"></div></div><section class="reaction"><div class="rg" id="rg"></div></section><section class="comments"><div class="chead"><div class="ccount"><span id="pvTotal">103</span>개의 댓글</div><div class="my">MY댓글</div></div><div class="stats">현재 댓글 <b id="pvCurrent">98</b>　|　작성자 삭제 <b id="pvDeleted">5</b>　|　규정 미준수 <b id="pvRule">0</b></div><div class="sort">최신순</div><div id="cp"></div></section></article></div></div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>
const names=['좋아요','응원해요','축하해요','기대해요','놀랐어요','슬퍼요'],defaults={publisher:'기사일보',title:'제목을 입력하세요',date:'입력 2026.09.07. 오후 12:22',body:'여기에 기사 본문을 입력하세요.\n\n굵게 하고 싶은 부분은 아래 버튼을 누른 뒤 선택 영역에 적용할 수 있습니다.',r:[16,19,406,5,215,11],total:103,current:98,deleted:5,rule:0,comments:[{n:'stee****',t:'2026.09.07 11:23',x:'쇼츠의 시대에 핵심만 보여주는 능력이 대단하네요.'},{n:'heav****',t:'2026.09.07 11:20',x:'정치판에서 사라져야 할 사람들, 서로 잘잘못만 따지네요.'}]};let d=structuredClone(defaults),photoSrc='./이미지/image_02.png',gridOn=false;
const $=x=>document.getElementById(x), esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderRe(){let p=$('rg'),e=$('reEdit');p.innerHTML=d.r.map((n,i)=>`<div class="ri"><div class="sprite"></div><div class="rname">${names[i]}</div><div class="rnum">${n.toLocaleString()}</div></div>`).join('');e.innerHTML=d.r.map((n,i)=>`<label>${names[i]}<input type="number" min="0" value="${n}" data-r="${i}"></label>`).join('');document.querySelectorAll('[data-r]').forEach(x=>x.oninput=()=>{d.r[+x.dataset.r]=+x.value||0;renderRe()})}
function renderCEdit(){let e=$('ce');e.innerHTML=d.comments.map((c,i)=>`<div class="ce"><h4>댓글 ${i+1}<button class="del" data-d="${i}">×</button></h4><div class="row"><input data-n="${i}" value="${esc(c.n)}"><input data-t="${i}" value="${esc(c.t)}"></div><textarea data-x="${i}">${esc(c.x)}</textarea></div>`).join('');document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{d.comments.splice(+x.dataset.d,1);renderCEdit();render()});document.querySelectorAll('[data-n]').forEach(x=>x.oninput=()=>{d.comments[+x.dataset.n].n=x.value;render()});document.querySelectorAll('[data-t]').forEach(x=>x.oninput=()=>{d.comments[+x.dataset.t].t=x.value;render()});document.querySelectorAll('[data-x]').forEach(x=>x.oninput=()=>{d.comments[+x.dataset.x].x=x.value;render()})}
function render(){ $('pvPub').textContent=d.publisher;$('pvTitle').textContent=d.title;$('pvDate').textContent=d.date;$('pvSource').style.display=$('source').value==='숨김'?'none':'inline-block';$('pvBody').innerHTML=esc(d.body).replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/\n/g,'<br>');$('pvTotal').textContent=d.total;$('pvCurrent').textContent=d.current;$('pvDeleted').textContent=d.deleted;$('pvRule').textContent=d.rule;$('photo').src=photoSrc;renderRe();$('cp').innerHTML=d.comments.map(c=>`<div class="comment"><div class="user"><span class="avatar"></span><div><div class="uname">${esc(c.n)}</div><div class="time">${esc(c.t)}</div></div></div><div class="ctext">${esc(c.x).replace(/\n/g,'<br>')}</div><div class="reply">답글</div></div>`).join('')}
function zoom(v){v=Math.max(20,Math.min(150,v));$('zoom').value=v;$('zt').textContent=v+'%';$('scale').style.transform=`scale(${v/100})`}
function fit(){let w=$('stage').clientWidth-20,n=$('news').offsetWidth;zoom(Math.max(20,Math.min(100,Math.floor(w/n*100))))}
['publisher','title','date','body','total','current','deleted','rule'].forEach(id=>$(id).addEventListener('input',()=>{d.publisher=$('publisher').value;d.title=$('title').value;d.date=$('date').value;d.body=$('body').value;d.total=+$('total').value||0;d.current=+$('current').value||0;d.deleted=+$('deleted').value||0;d.rule=+$('rule').value||0;render()}));$('source').onchange=render;$('zoom').oninput=e=>zoom(+e.target.value);$('minus').onclick=()=>zoom(+$('zoom').value-10);$('plus').onclick=()=>zoom(+$('zoom').value+10);$('fit').onclick=fit;$('mode').onchange=e=>{$('news').classList.toggle('pc',e.target.value==='pc');fit()};$('grid').onclick=()=>{gridOn=!gridOn;$('grid').textContent='격자 '+(gridOn?'ON':'OFF');$('news').classList.toggle('grid-on',gridOn)};$('add').onclick=()=>{d.comments.push({n:'new*****',t:'2026.09.08 19:05',x:'새 댓글을 입력하세요.'});renderCEdit();render()};$('bold').onclick=()=>{let a=$('body'),s=a.selectionStart,e=a.selectionEnd;if(s!==e){a.value=a.value.slice(0,s)+'**'+a.value.slice(s,e)+'**'+a.value.slice(e);a.dispatchEvent(new Event('input'))}};$('photoFile').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader;r.onload=()=>{photoSrc=r.result;render()};r.readAsDataURL(f)}};$('reset').onclick=()=>{if(confirm('모든 입력을 기본값으로 되돌릴까요?')){d=structuredClone(defaults);photoSrc='./이미지/image_02.png';$('photoFile').value='';$('source').value='기사원문';renderCEdit();render()}};$('save').onclick=async()=>{let old=gridOn;gridOn=false;$('news').classList.remove('grid-on');let tr=$('scale').style.transform;$('scale').style.transform='none';let c=await html2canvas($('news'),{scale:2,useCORS:true,backgroundColor:'#fffdf9'});$('scale').style.transform=tr;if(old)$('news').classList.add('grid-on');let a=document.createElement('a');a.download='news-edit.png';a.href=c.toDataURL('image/png');a.click()};
renderCEdit();render();zoom(60);
</script></body></html>
