function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
function render(){ $('pvPublisher').textContent=d.publisher;$('pvTitle').textContent=d.title;$('pvDate').textContent=d.date;$('pvBody').innerHTML=md(d.body);$('pvBody').style.fontSize=(+d.bodySize||19)+'px';$('pvTitle').style.fontSize=(+d.titleSize||26)+'px';$('pvTotal').textContent=d.total;$('pvCurrent').textContent=d.current;$('pvDeleted').textContent=d.deleted;$('pvRule').textContent=d.rule;$('pvSource').style.display=sourceOn?'inline-block':'none';$('pvReactions').innerHTML=d.r.map((v,i)=>`<div class="reactnum">${v}</div>`).join('');$('pvComments').innerHTML=d.comments.map(c=>`<div class="comment"><div class="user"><span class="avatar"></span><div><div class="uname">${esc(c.n)}</div><div class="time">${esc(c.t)}</div></div></div><div class="ctext">${esc(c.x)}</div><div class="reply">답글</div></div>`).join('');$('pvPhoto').src=photo;$('pvPhoto').classList.toggle('show',!!photo);$('pubLogo').style.backgroundImage=logo?`url("${logo}")`:'';renderGuides()}
function fill(){['publisher','title','date','bodyText','bodySize','titleSize','total','current','deleted','rule'].forEach(k=>$(k).value=d[k]);$('reactionEditor').innerHTML=N.map((n,i)=>`<label>${n}<input type="number" data-i="${i}" value="${d.r[i]}"></label>`).join('');$('commentEditor').innerHTML=d.comments.map((c,i)=>`<div class="comment-editor"><div class="comment-head"><b>댓글 ${i+1}</b><button class="remove" data-i="${i}">×</button></div><input class="cn" data-i="${i}" value="${esc(c.n)}"><input class="ct" data-i="${i}" value="${esc(c.t)}"><textarea class="cx" data-i="${i}">${esc(c.x)}</textarea></div>`).join('');}
function reactions(){document.querySelectorAll('#reactionEditor input').forEach(x=>x.oninput=()=>{d.r[+x.dataset.i]=+x.value||0;render()})}

function bind(){['publisher','title','date','bodyText','bodySize','titleSize','total','current','deleted','rule'].forEach(k=>$(k).oninput=()=>{if(k==='bodySize')d.bodySize=Math.max(10,Math.min(50,+$(k).value||19));else if(k==='titleSize')d.titleSize=Math.max(18,Math.min(70,+$(k).value||26));else d[k]=$(k).value;render()});$('bold').onclick=()=>{const ta=$('bodyText'),a=ta.selectionStart,b=ta.selectionEnd;if(a!==b){d.body=ta.value.slice(0,a)+'**'+ta.value.slice(a,b)+'**'+ta.value.slice(b);fill();render()}};$('source').onclick=()=>{sourceOn=!sourceOn;render()};$('mode').onchange=()=>{$('news').classList.toggle('pc',$('mode').value==='pc');render()};$('zoom').oninput=e=>zoom(e.target.value);$('minus').onclick=()=>zoom(+$('zoom').value-10);$('plus').onclick=()=>zoom(+$('zoom').value+10);$('fit').onclick=()=>zoom(50);$('guideBtn').onclick=()=>{guide=!guide;$('guideBtn').textContent=guide?'안내선 ON':'안내선 OFF';renderGuides()};$('add').onclick=()=>{d.comments.push({n:'user****',t:'2026.09.07 11:00',x:'댓글 내용을 입력하세요.'});fill();reactions();commentsBind();render()};$('reset').onclick=()=>{Object.assign(d,structuredClone(D));sourceOn=true;photo='';logo='';guide=false;guidesData=[];$('guideBtn').textContent='안내선 OFF';$('photoFile').value='';$('publisherFile').value='';fill();reactions();commentsBind();render()};$('save').onclick=savePNG;$('photoFile').onchange=e=>{const f=e.target.files?.[0];if(f){const r=new FileReader();r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)}};$('publisherFile').onchange=e=>{const f=e.target.files?.[0];if(f){const r=new FileReader();r.onload=()=>{logo=r.result;render()};r.readAsDataURL(f)}};reactions();commentsBind()}

function renderGuides(){const g=$('guides');g.innerHTML='';if(!guide)return;guidesData.forEach((x,i)=>{const el=document.createElement('div');el.className='guide '+(x.o==='v'?'gv':'gh');el.style[x.o==='v'?'left':'top']=x.p+'%';g.appendChild(el)})}
function dragFromRuler(o,e){if(!guide)return;e.preventDefault();const n=$('news'),r=n.getBoundingClientRect(),move=ev=>{let p=o==='v'?((ev.clientX-r.left)/r.width*100):((ev.clientY-r.top)/r.height*100);p=Math.max(0,Math.min(100,p));let x=guidesData.find(g=>g.id===activeGuide);if(!x){x={id:Date.now(),o,p};guidesData.push(x)}else x.p=p;renderGuides()},up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};let activeGuide=null;window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}
$('rulerTop').onpointerdown=e=>dragFromRuler('v',e);$('rulerLeft').onpointerdown=e=>dragFromRuler('h',e);fill();bind();render();zoom(50);

</script><script>
let pinchStart=0,pinchZoom=50;const stageEl=document.getElementById('stage');stageEl.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchZoom=+document.getElementById('zoom').value}}, {passive:true});stageEl.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchStart){e.preventDefault();const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom(pinchZoom*(dist/pinchStart))}}, {passive:false});stageEl.addEventListener('touchend',e=>{if(e.touches.length<2)pinchStart=0});
