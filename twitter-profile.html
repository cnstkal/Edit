<script>(function(){const $=id=>document.getElementById(id),KEY='twitter-profile-v1';let S={name:'',handle:'@username',bio:'',website:'',joined:'',following:'',followers:'',theme:'white',cover:'',avatar:'',postName:'',postHandle:'',postText:''};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function file(id,key){$(id).addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S[key]=r.result;save();render()};r.readAsDataURL(f)})}function render(){$('pvName').textContent=S.name;$('pvHandle').textContent=S.handle;$('pvBio').textContent=S.bio;$('pvMeta').textContent=[S.website,S.joined].filter(Boolean).join('   ·   ');$('pvFollowing').textContent=S.following;$('pvFollowers').textContent=S.followers;$('pvPostName').textContent=S.postName;$('pvPostHandle').textContent=S.postHandle;$('pvPostText').textContent=S.postText;$('screen').classList.toggle('theme-black',S.theme==='black');$('screen').classList.toggle('theme-white',S.theme==='white');if(S.cover)$('pvCover').style.backgroundImage='url("'+S.cover+'")';if(S.avatar){$('pvAvatar').src=S.avatar;$('pvPostAvatar').src=S.avatar}else{$('pvAvatar').removeAttribute('src');$('pvPostAvatar').removeAttribute('src')}}['name','handle','bio','website','joined','following','followers','theme','postName','postHandle','postText'].forEach(id=>$(id).addEventListener('input',e=>{S[id]=e.target.value;save();render()}));file('coverFile','cover');file('avatarFile','avatar');$('save').addEventListener('click',async()=>{const c=await html2canvas($('screen'),{scale:3,useCORS:true,backgroundColor:S.theme==='black'?'#000':'#fff'});const a=document.createElement('a');a.download='twitter-profile.png';a.href=c.toDataURL('image/png');a.click()});render()})()</script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>(function(){const $=id=>document.getElementById(id),KEY='twitter-profile-posts-v3';const D=[{name:'⏰ 시계훈',handle:'@clockhoon · 2025. 11. 22.',text:'부정해도 이미 난\n꼭 네가 아님\n안되는 1인이야',image:'',linkTitle:'',linkDesc:'',linkSource:'',reply:'',repost:'173',like:'575',views:'5.9만',pinned:true},{name:'⏰ 시계훈',handle:'@clockhoon · 2시',text:'진짜 개빡센하루 시작',image:'',linkTitle:'잘하면 반차안쓰고 팬싸갔다 출근 가능(n)',linkDesc:'',linkSource:'spin-spin.com',reply:'',repost:'',like:'1',views:'424',pinned:false},{name:'⏰ 시계훈',handle:'@clockhoon · 2시',text:'거의 이 수준',image:'',linkTitle:'',linkDesc:'',linkSource:'',reply:'',repost:'1',like:'8',views:'1210',pinned:false}];let posts;try{posts=JSON.parse(localStorage.getItem(KEY)||'null')||D}catch(e){posts=D}const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){try{localStorage.setItem(KEY,JSON.stringify(posts))}catch(e){alert('이미지가 너무 큽니다. 더 작은 이미지를 선택해주세요.')}}function resize(f,max,q=.82){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);ok(c.toDataURL('image/jpeg',q))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}function profile(){return{name:$('name').value||'⏰ 시계훈',handle:$('handle').value||'@clockhoon',avatar:localStorage.getItem('twitter-profile-avatar-v3')||''}}function preview(){const sc=$('screen');let old=sc.querySelector('.pinned');if(old)old.remove();let box=sc.querySelector('.tw-posts');if(!box){box=document.createElement('div');box.className='tw-posts';sc.querySelector('.profile-tabs').after(box)}const pr=profile();box.innerHTML=posts.map(p=>'<article class="tw-post">'+(pr.avatar?'<img class="mini" src="'+pr.avatar+'">':'<div class="mini"></div>')+(p.pinned?'<div class="pin"><svg class="tw-pin-icon" viewBox="0 0 24 24"><path d="M8 3h8v4l2 3v2h-5v7l-1 2-1-2v-7H6v-2l2-3V3Z"/></svg> 메인에 올림</div>':'')+'<div class="tw-head"><span class="tw-name">'+esc(p.name||pr.name)+'</span> <span class="tw-handle">'+esc(p.handle)+'</span><span class="tw-x">𝕏</span></div><div class="tw-text">'+esc(p.text)+'</div>'+(p.image?'<img class="tw-media" src="'+p.image+'">':'')+((p.linkTitle||p.linkSource)?'<div class="tw-link"><div class="tw-link-body"><div class="tw-link-title">'+esc(p.linkTitle||'링크 제목')+'</div>'+(p.linkDesc?'<div class="tw-link-desc">'+esc(p.linkDesc)+'</div>':'')+'<div class="tw-link-source">'+esc(p.linkSource||'example.com')+'</div></div></div>':'')+'<div class="tw-action-icons"><span class="tw-action"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 3v-5.1A7.5 7.5 0 1 1 20 11.5Z"/></svg><span>'+esc(p.reply)+'</span></span><span class="tw-action"><svg viewBox="0 0 24 24"><path d="m8 8 4-4 4 4M12 4v11M16 16l-4 4-4-4M12 20V9"/></svg><span>'+esc(p.repost)+'</span></span><span class="tw-action"><svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"/></svg><span>'+esc(p.like)+'</span></span><span class="tw-action"><svg viewBox="0 0 24 24"><path d="M4 20V10M9 20V5M14 20v-8M19 20V2"/></svg><span>'+esc(p.views)+'</span></span><span class="tw-action"><svg viewBox="0 0 24 24"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4Z"/></svg></span><span class="tw-action"><svg viewBox="0 0 24 24"><path d="M12 16V3m0 0L7 8m5-5 5 5M5 13v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg></span></div></article>').join('')}function editor(){const b=$('tweetEditorList');b.innerHTML=posts.map((p,i)=>'<div class="tw-editor-post" data-i="'+i+'"><h3>게시글 '+(i+1)+'</h3><div class="tw-editor-grid"><input data-k="name" value="'+esc(p.name)+'" placeholder="예: ⏰ 시계훈"><input data-k="handle" value="'+esc(p.handle)+'" placeholder="예: @clockhoon · 2시"></div><textarea data-k="text" placeholder="예: 진짜 개빡센하루 시작">'+esc(p.text)+'</textarea><label class="tw-upload">게시글 이미지 추가<input data-file="image" type="file" accept="image/*"></label><div class="tw-editor-grid"><input data-k="linkTitle" value="'+esc(p.linkTitle)+'" placeholder="링크 제목"><input data-k="linkSource" value="'+esc(p.linkSource)+'" placeholder="사이트 주소"></div><input data-k="linkDesc" value="'+esc(p.linkDesc)+'" placeholder="링크 설명"><div class="tw-editor-grid"><input data-k="reply" value="'+esc(p.reply)+'" placeholder="댓글 수"><input data-k="repost" value="'+esc(p.repost)+'" placeholder="리포스트 수"><input data-k="like" value="'+esc(p.like)+'" placeholder="좋아요 수"><input data-k="views" value="'+esc(p.views)+'" placeholder="조회수"></div><label><input data-k="pinned" type="checkbox" '+(p.pinned?'checked':'')+'> 메인에 올림</label><div class="tw-editor-actions"><button class="tw-remove" data-remove="1">게시글 삭제</button></div></div>').join('')}function defaults(){const v={name:'⏰ 시계훈',handle:'@clockhoon',bio:'오늘도 무사히 살아남기',website:'https://example.com',joined:'2025년 6월에 가입함',following:'70',followers:'2,146'};Object.entries(v).forEach(([id,x])=>{const e=$(id);if(e&&!e.value)e.value=x})}async function files(){const a=$('avatarFile');if(a)a.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;const d=await resize(f,512,.84);localStorage.setItem('twitter-profile-avatar-v3',d);preview();e.target.value=''}) ;const c=$('coverFile');if(c)c.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;const d=await resize(f,1200,.84);$('pvCover').style.backgroundImage='url("'+d+'")';localStorage.setItem('twitter-profile-cover-v3',d);e.target.value=''}) ;const cv=localStorage.getItem('twitter-profile-cover-v3');if(cv)$('pvCover').style.backgroundImage='url("'+cv+'")'}$('tweetEditorList').addEventListener('input',e=>{const c=e.target.closest('.tw-editor-post');if(!c)return;const i=+c.dataset.i,k=e.target.dataset.k;if(k)posts[i][k]=e.target.value;save();preview()});$('tweetEditorList').addEventListener('change',async e=>{const c=e.target.closest('.tw-editor-post');if(!c)return;const i=+c.dataset.i;if(e.target.dataset.file==='image'){const f=e.target.files?.[0];if(f){posts[i].image=await resize(f,1200,.82);save();preview();editor();}}else if(e.target.dataset.k==='pinned'){posts[i].pinned=e.target.checked;save();preview()}});$('tweetEditorList').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;const i=+b.closest('.tw-editor-post').dataset.i;if(posts.length>1){posts.splice(i,1);save();editor();preview()}});$('addTweet').addEventListener('click',()=>{posts.push({name:'⏰ 시계훈',handle:'@clockhoon · 2시',text:'게시글',image:'',linkTitle:'',linkDesc:'',linkSource:'',reply:'',repost:'',like:'',views:'',pinned:false});save();editor();preview()});defaults();files();editor();preview()})();</script>

<style>

.profile-extra-photo{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin-top:9px;border:1px solid #e5e7e9}.profile-photo-editor{margin-top:8px;padding-top:8px;border-top:1px solid #eee}.profile-photo-editor input{width:100%;font-size:12px!important}
@media(min-width:901px){.layout{width:min(1180px,100%);display:grid;grid-template-columns:minmax(420px,520px) minmax(520px,760px);gap:24px;align-items:start}.stage{grid-column:1;grid-row:1;width:min(100%,420px);margin:0 auto}.section{grid-column:2;width:100%}}

<script>

(()=>{
  const KEY='twitter-profile-extra-photo-v1',read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}},write=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};let media=read();
  const fileToData=file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
  function ensureEditor(){const list=document.getElementById('tweetEditorList');if(list)list.querySelectorAll('.tw-editor-post').forEach((card,i)=>{if(card.querySelector('.profile-photo-editor'))return;const box=document.createElement('div');box.className='profile-photo-editor';box.innerHTML='<label>게시글 사진</label><input type="file" accept="image/*">';card.appendChild(box);box.querySelector('input').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;media['post'+i]=await fileToData(f);write(media);sync()})});const section=document.getElementById('postText');if(section&&!document.getElementById('pinnedPhotoEditor')){const host=section.closest('.section');if(host){const box=document.createElement('div');box.id='pinnedPhotoEditor';box.className='field profile-photo-editor';box.innerHTML='<label>메인 게시글 사진</label><input id="pinnedPhotoFile" type="file" accept="image/*">';host.appendChild(box);box.querySelector('input').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;media.pinned=await fileToData(f);write(media);sync()})}}}
  function sync(){const screen=document.getElementById('screen');if(!screen)return;const pinned=screen.querySelector('.pinned');if(pinned){let img=pinned.querySelector('.profile-extra-photo');if(media.pinned){if(!img){img=document.createElement('img');img.className='profile-extra-photo';pinned.appendChild(img)}img.src=media.pinned}else if(img)img.remove()}screen.querySelectorAll('.tw-post').forEach((post,i)=>{let img=post.querySelector('.profile-extra-photo'),src=media['post'+i];if(src){if(!img){img=document.createElement('img');img.className='profile-extra-photo';const text=post.querySelector('.tw-text');if(text)text.insertAdjacentElement('afterend',img);else post.appendChild(img)}img.src=src}else if(img)img.remove()})}
  function start(){ensureEditor();sync();const mo=new MutationObserver(()=>{ensureEditor();sync()});const list=document.getElementById('tweetEditorList'),screen=document.getElementById('screen');if(list)mo.observe(list,{childList:true,subtree:true});if(screen)mo.observe(screen,{childList:true,subtree:true})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

</script>

<script id="HIGH_QUALITY_PNG_EXPORT_V1">
(()=>{
  const TARGETS=['.stage','.screen','.preview-stage'];
  function target(){for(const s of TARGETS){const e=document.querySelector(s);if(e)return e}return null}
  function load(){return new Promise((ok,fail)=>{if(window.html2canvas)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)})}
  async function save(btn){
    const el=target();if(!el)return;
    const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='PNG 생성 중…'}
    try{
      await load();
      const w=el.scrollWidth||el.getBoundingClientRect().width,h=el.scrollHeight||el.getBoundingClientRect().height;
      const scale=Math.min(4,8192/Math.max(w,h));
      const canvas=await html2canvas(el,{scale:Math.max(2,scale),useCORS:true,allowTaint:false,backgroundColor:null,logging:false,imageTimeout:15000,windowWidth:Math.max(document.documentElement.clientWidth,w),windowHeight:Math.max(document.documentElement.clientHeight,h),scrollX:0,scrollY:-window.scrollY});
      canvas.toBlob(blob=>{
        if(!blob)throw new Error('PNG 생성 실패');
        const a=document.createElement('a');a.download='editor.png';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      },'image/png');
    }catch(e){console.error('High quality PNG export failed',e);alert('PNG 저장에 실패했습니다.');}
    finally{if(btn){btn.disabled=false;btn.textContent=old||'PNG로 저장'}}
  }
  function bind(){
    const btn=document.querySelector('#savePng,#save,.save');if(!btn||btn.dataset.hqBound)return;
    btn.dataset.hqBound='1';
    btn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();save(btn)},true);
  }
  window.addEventListener('DOMContentLoaded',bind);window.addEventListener('load',bind);setInterval(bind,1000);
})();
</script></body></html>
