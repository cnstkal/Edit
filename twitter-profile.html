<script>
(()=>{
  const icons={
    reply:'이미지/twitter-reply.webp',repost:'이미지/twitter-repost.webp',like:'이미지/twitter-like.webp',
    views:'이미지/twitter-views.webp',bookmark:'이미지/twitter-bookmark.webp',share:'이미지/twitter-share.webp'
  };
  const stateKey='twitter-profile-action-state-v2';
  let states={};try{states=JSON.parse(localStorage.getItem(stateKey)||'{}')}catch(e){}
  const save=()=>{try{localStorage.setItem(stateKey,JSON.stringify(states))}catch(e){}};
  function apply(){
    document.querySelectorAll('.tw-action-icons').forEach((bar,bi)=>{
      const acts=[...bar.querySelectorAll('.tw-action')];
      acts.forEach((a,i)=>{
        const key=bi+':'+i;
        const src=icons[['reply','repost','like','views','bookmark','share'][i]];
        let img=a.querySelector('.tw-profile-ui-icon');
        if(!img){img=document.createElement('img');img.className='tw-profile-ui-icon';a.insertBefore(img,a.firstChild)}
        img.src=src;
        a.querySelectorAll('svg').forEach(x=>x.style.display='none');
        const on=!!states[key];
        a.classList.toggle('tw-profile-active',on);
        a.classList.toggle('tw-profile-active-repost',on&&i===1);
        a.classList.toggle('tw-profile-active-like',on&&i===2);
        a.classList.toggle('tw-profile-active-bookmark',on&&i===4);
      });
    });
  }
  function bind(){
    document.querySelectorAll('.tw-action-icons').forEach((bar,bi)=>{
      if(bar.dataset.profileIconBound)return;bar.dataset.profileIconBound='1';
      bar.addEventListener('click',e=>{const a=e.target.closest('.tw-action');if(!a)return;const i=[...bar.querySelectorAll('.tw-action')].indexOf(a);if(![1,2,4].includes(i))return;const key=bi+':'+i;states[key]=!states[key];save();apply();});
    });
  }
  function start(){apply();bind();const mo=new MutationObserver(()=>{apply();bind()});mo.observe(document.body,{subtree:true,childList:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
