name: patch Kakao profile editor
on:
  push:
    paths:
      - '.github/workflows/fix-kakao-profile-final.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kakao-profile.html')
          s=p.read_text()
          s=s.replace('.cover{position:absolute;inset:0;background:#777 center/cover no-repeat}', '.cover{position:absolute;left:0;right:0;top:0;bottom:470px;background:#777 center/cover no-repeat;border-radius:0 0 34px 34px;overflow:hidden}')
          s=s.replace('.likes{position:absolute;z-index:3;top:405px;left:0;right:0;text-align:center;font-size:29px;font-weight:800;text-shadow:0 2px 5px #0008}.likes span{font-size:31px}.cup{margin-top:8px;font-size:27px}', '')
          s=s.replace('.action-icon{font-size:37px;line-height:1}', '.action-icon{width:30px;height:30px;display:block;flex:none}.action-icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}')
          s=s.replace('.profile-name{font-size:51px;font-weight:800;margin-bottom:40px}', '.profile-name{font-size:51px;font-weight:800;margin-bottom:40px}.music-toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:#555;margin:-4px 0 12px}.music-toggle input{width:16px;height:16px;flex:none}')
          s=s.replace('.action{font-size:25px}.action-icon{font-size:32px}', '.action{font-size:25px}.action-icon{width:28px;height:28px}')
          s=s.replace('<div class="music"><img id="pvMusicImg">', '<div class="music" id="pvMusic"><img id="pvMusicImg">')
          s=s.replace('<div class="action"><span class="action-icon">◯</span><span id="pvChat">1:1 채팅</span></div>', '<div class="action"><span class="action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H11l-4.5 3v-3H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/></svg></span><span id="pvChat">1:1 채팅</span></div>')
          s=s.replace('<div class="action"><span class="action-icon">⌕</span><span id="pvCall">통화</span></div>', '<div class="action"><span class="action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.5 9.5 3l2.4 4.2-2 1.6c.9 2 2.3 3.4 4.3 4.3l1.6-2 4.2 2.4-1.5 2.3c-.6.9-1.7 1.4-2.8 1.1-6-1.5-10.7-6.2-12.2-12.2-.3-1.1.2-2.2 1.1-2.8Z"/></svg></span><span id="pvCall">통화</span></div>')
          s=s.replace('<div class="group"><div class="gtitle">♫ 음악</div>', '<div class="group"><div class="gtitle">♫ 음악</div><label class="music-toggle"><input id="musicEnabled" type="checkbox" checked> 음악 표시</label>')
          s=s.replace('<div class="group"><div class="gtitle">♡ 반응</div><div class="field"><div class="sub">좋아요 수</div><input class="input" id="likes" type="number" min="0" value="196"></div></div>', '')
          s=s.replace("const D={name:'여기에 이름을 입력하세요.',musicTitle:'여기에 음악 제목을 입력하세요.',musicArtist:'여기에 가수명을 입력하세요.',likes:196,chat:'1:1 채팅',call:'통화',avatar:'',cover:'',musicImg:'',media:['','','','','','']};", "const D={name:'여기에 이름을 입력하세요.',musicTitle:'여기에 음악 제목을 입력하세요.',musicArtist:'여기에 가수명을 입력하세요.',musicEnabled:true,chat:'1:1 채팅',call:'통화',avatar:'',cover:'',musicImg:'',media:['','','','','','']};")
          s=s.replace("['name','musicTitle','musicArtist','likes','chat','call'].forEach(id=>sync(id,id));", "['name','musicTitle','musicArtist','chat','call'].forEach(id=>sync(id,id)); $('musicEnabled').checked=S.musicEnabled!==false; $('musicEnabled').addEventListener('change',()=>{S.musicEnabled=$('musicEnabled').checked;render();saveState()});")
          s=s.replace("function render(){ $('pvName').textContent=S.name;$('pvMusicTitle').textContent=S.musicTitle;$('pvMusicArtist').textContent=S.musicArtist;$('pvLikes').textContent=S.likes;$('pvChat').textContent=S.chat;$('pvCall').textContent=S.call;", "function render(){ $('pvName').textContent=S.name;$('pvMusicTitle').textContent=S.musicTitle;$('pvMusicArtist').textContent=S.musicArtist;$('pvChat').textContent=S.chat;$('pvCall').textContent=S.call;$('pvMusic').style.display=S.musicEnabled===false?'none':'flex';")
          s=s.replace("$('pvMusicImg').src=S.musicImg||$('pvAvatar').src;renderMedia()}", "$('pvMusicImg').src=S.musicImg||$('pvAvatar').src;renderMedia()}")
          s=s.replace("localStorage.getItem('kakao-profile-editor-v1')", "localStorage.getItem('kakao-profile-editor-v1')")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao-profile.html
          git commit -m 'fix: improve Kakao profile layout and media'
          git push
      - name: Remove patch workflow
        run: |
          git rm .github/workflows/fix-kakao-profile-final.yml
          git commit -m 'chore: remove temporary profile patch workflow'
          git push
