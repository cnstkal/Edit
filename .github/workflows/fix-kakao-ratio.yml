name: Fix Kakao ratio
on:
  push:
    paths:
      - .github/workflows/fix-kakao-ratio.yml
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Kakao layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kakao2.html')
          s=p.read_text()
          s=s.replace('value="2to3">모바일 · 2:3','value="3to2">모바일 · 3:2')
          s=s.replace('2to3','3to2')
          s=s.replace('2/3','3/2')
          s=s.replace('</style>/* PC 16:9 preview: enlarge chat content except room name */','/* PC 16:9 preview: enlarge chat content except room name */')
          marker='/* PC 16:9 preview: enlarge chat content except room name */'
          extra='''\n/* 3:2 preview: slightly smaller overall chat */\n.stage.ratio-3to2{aspect-ratio:3/2!important}\n.chat.ratio-3to2{width:720px!important;min-height:480px!important}\n.chat.ratio-3to2 .messages{padding:16px 22px 22px}\n.chat.ratio-3to2 .day{margin-bottom:22px}\n.chat.ratio-3to2 .day span{padding:8px 18px;font-size:17px}\n.chat.ratio-3to2 .msg{gap:18px;margin-bottom:20px}\n.chat.ratio-3to2 .avatar{width:52px;height:52px;border-radius:23px}\n.chat.ratio-3to2 .msgbody{max-width:510px}\n.chat.ratio-3to2 .name{font-size:18px;margin:1px 0 5px}\n.chat.ratio-3to2 .bubble{max-width:450px;padding:11px 16px;font-size:21px}\n.chat.ratio-3to2 .bubbletime{font-size:14px}\n.chat.ratio-3to2 .read{font-size:13px}\n.chat.ratio-3to2 .timebox{min-width:25px}\n.chat.ratio-3to2 .composer{height:86px;padding:10px 18px;gap:9px}\n.chat.ratio-3to2 .composer .circle{width:44px;height:44px;font-size:27px}\n.chat.ratio-3to2 .inputbar{height:50px;border-radius:25px;padding:0 17px;font-size:18px}\n.chat.ratio-3to2 .send{width:50px;height:50px}\n.tools{margin-bottom:18px}\n'''
          if marker in s and '/* 3:2 preview: slightly smaller overall chat */' not in s:
              s=s.replace(marker,extra+marker,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao2.html
          git commit -m 'fix: correct Kakao 3:2 preview and spacing'
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-kakao-ratio.yml
          git commit -m 'chore: remove temporary ratio workflow'
          git push
