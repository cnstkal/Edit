name: Fix Kakao Profile 9x16 Preview
on:
  push:
    paths:
      - '.github/workflows/fix-profile-ratio.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix preview ratio
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kakao-profile.html')
          s=p.read_text(encoding='utf-8')
          css='''\n/* strict 9:16 preview frame */\n.stage{width:min(100%,405px)!important;height:min(720px,calc((100vw - 20px)*1.7777778))!important;aspect-ratio:9/16!important;min-height:0!important;max-height:720px!important}\n.scale{width:auto!important;height:auto!important;flex:none!important;min-width:0!important;min-height:0!important}\n.profile{width:720px!important;height:1280px!important;flex:none!important}\n@media(max-width:760px){.stage{width:min(100%,405px)!important;height:min(720px,calc((100vw - 20px)*1.7777778))!important}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace("else if(i===0){d.innerHTML='<div class=\\\"media-label\\\">방금 본 미디어</div>'}","")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao-profile.html
          git diff --cached --quiet || git commit -m 'fix: keep kakao profile preview at 9:16'
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/fix-profile-ratio.yml
          git commit -m 'chore: remove temporary ratio workflow'
          git push
