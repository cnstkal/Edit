name: Refine news editor layout
on:
  push:
    branches: [main]
    paths: ['.news-layout-v3-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 50 50 preview and settings layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('news-editor.html')
          s=p.read_text(encoding='utf-8')
          marker='NEWS_EDITOR_LAYOUT_V3'
          if marker not in s:
              css=r'''
          <style id="NEWS_EDITOR_LAYOUT_V3">
          /* NEWS_EDITOR_LAYOUT_V3 */
          @media(min-width:901px){
            .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;width:100%!important;max-width:none!important;gap:0!important}
            .preview{width:100%!important;min-width:0!important;padding:20px 0 22px 0!important}
            .previewSticky{width:100%!important;top:12px!important}
            .settings{width:100%!important;max-width:none!important;height:calc(100vh - 68px)!important;max-height:calc(100vh - 68px)!important;overflow-y:auto!important;overflow-x:hidden!important;padding:24px 24px 60px 24px!important;border-left:1px solid #dedad4!important;border-radius:0!important;background:#fbfaf7!important;box-shadow:none!important;justify-self:stretch!important}
            .settings:before{margin-left:0!important}
            .tools{width:max-content!important;max-width:calc(100% - 24px)!important;margin:0 12px 10px auto!important;padding:6px 8px!important;min-height:44px!important;border-radius:10px!important;gap:5px!important;flex-wrap:nowrap!important}
            .tools select{height:32px!important;padding:0 8px!important;border-radius:8px!important;font-size:12px!important}
            .zoom{gap:4px!important;margin-left:4px!important;flex:none!important}
            .zoom button{height:32px!important;min-width:32px!important;border-radius:8px!important;font-size:17px!important}
            .zoom input{width:110px!important;height:24px!important;flex:none!important}
            .zoom span{font-size:10px!important;min-width:32px!important}
            .stage{width:100%!important;max-width:none!important;margin:0!important;border-radius:12px!important}
          }
          @media(max-width:900px){
            .preview{width:100%!important}
            .tools{width:max-content!important;max-width:100%!important;margin:0 0 10px auto!important;padding:6px 8px!important;min-height:42px!important;border-radius:10px!important;gap:5px!important}
            .tools select{height:32px!important;padding:0 8px!important;font-size:12px!important}
            .zoom{gap:4px!important;margin-left:4px!important}
            .zoom button{height:32px!important;min-width:32px!important;font-size:17px!important;border-radius:8px!important}
            .zoom input{height:24px!important}
            .zoom span{font-size:10px!important}
          }
          </style>
          '''
              s=s.replace('</head>',css+'</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f .news-layout-v3-trigger .github/workflows/news-layout-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-editor.html .news-layout-v3-trigger .github/workflows/news-layout-v3.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make news editor preview and settings 50 50'
          git push
