name: Final UI polish
on:
  push:
    paths:
      - '.github/workflows/final-ui-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          htmls=list(Path('.').glob('*.html'))
          replacements={
            '여기에 이름을 입력하세요.':'이름',
            '여기에 시간을 입력하세요.':'시간',
            '여기에 게시글을 입력하세요.':'게시글',
            '여기에 게시글을 입력하세요':'게시글',
            '여기에 기사 제목을 입력하세요.':'제목',
            '여기에 기사 작성일시를 입력하세요.':'작성일',
            '여기에 기사 사진을 추가하세요.':'사진',
            '여기에 기사 본문을 입력하세요.':'본문',
            '여기에 사진 출처를 입력하세요.':'출처',
            '여기에 로고 이미지를 추가하세요.':'로고',
            '여기에 상단 중앙에 표시할 로고를 추가하세요.':'로고',
            '여기에 원본 사진을 추가하세요.':'사진',
            '여기에 사진을 추가하세요.':'사진',
            '여기에 관련 기사 제목을 입력하세요.':'관련 기사',
            '여기에 커버 이미지를 추가하세요.':'커버',
            '여기에 프로필 사진을 추가하세요.':'프로필 사진',
            '여기에 웹사이트 주소를 입력하세요.':'웹사이트',
            '여기에 사진을 추가':'사진',
          }
          for p in htmls:
            s=p.read_text(encoding='utf-8')
            old=s
            for a,b in replacements.items(): s=s.replace(a,b)
            if s!=old: p.write_text(s,encoding='utf-8')

          # Dispatch: preview left / settings right, smaller preview controls,
          # and keep the mobile preview available when Mobile is selected.
          p=Path('dispatch.html'); s=p.read_text(encoding='utf-8')
          block=r'''
          <style id="FINAL_DISPATCH_LAYOUT_V2">
          @media(min-width:901px){
            .layout{grid-template-columns:minmax(420px,520px) minmax(0,1fr)!important;gap:24px!important;align-items:start!important}
            .layout>.panel{grid-column:2!important;grid-row:1!important;max-width:760px!important;justify-self:stretch!important}
            .layout>.preview-wrap,.layout>.preview,.layout>.previewSticky{grid-column:1!important;grid-row:1!important;min-width:0!important;width:100%!important}
          }
          .preview-tools{padding:8px 12px!important;border-width:1px!important;border-radius:14px!important;gap:8px!important;margin-bottom:8px!important}
          .preview-tools b{font-size:12px!important}
          .preview-tools .mode{padding:7px 11px!important;min-height:36px!important;border-width:1px!important;border-radius:12px!important;font-size:12px!important}
          .zoom{gap:6px!important}
          .zoom button{min-width:34px!important;height:34px!important;border-width:1px!important;border-radius:9px!important;font-size:19px!important}
          .zoom span{font-size:11px!important;min-width:34px!important}
          .zoom input{min-width:70px!important}
          @media(max-width:800px){
            .layout{display:flex!important;flex-direction:column!important}
            .layout>.preview-wrap,.layout>.preview,.layout>.previewSticky{order:1!important;width:100%!important}
            .layout>.panel,.layout>.settings{order:2!important;width:100%!important}
          }
          </style>
          <script>
          (()=>{
            function syncDispatchMode(){
              const sels=[...document.querySelectorAll('select')];
              const sel=sels.find(x=>[...x.options].some(o=>/PC|모바일|mobile/i.test(o.textContent||'')));
              if(!sel)return;
              const label=sel.options[sel.selectedIndex]?.textContent||'';
              const isPC=/PC/i.test(label)&&!/모바일|mobile/i.test(label);
              document.querySelectorAll('.stage').forEach(st=>st.classList.toggle('pc-frame',isPC));
            }
            function start(){
              syncDispatchMode();
              document.querySelectorAll('select').forEach(s=>s.addEventListener('change',syncDispatchMode));
              const mo=new MutationObserver(syncDispatchMode);mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
          })();
          </script>
          '''
          if 'FINAL_DISPATCH_LAYOUT_V2' not in s:
            s=s.replace('</body>',block+'</body>')
            p.write_text(s,encoding='utf-8')

          # Twitter profile: use the exact same WebP action icons and behavior.
          p=Path('twitter-profile.html'); s=p.read_text(encoding='utf-8')
          block=r'''
          <style id="FINAL_TWITTER_PROFILE_ICONS_V2">
          .tw-action-icons{grid-template-columns:repeat(4,minmax(0,1fr)) 20px 20px!important;column-gap:0!important;align-items:center!important}
          .tw-action{gap:3px!important;min-width:0!important}
          .tw-action .tw-profile-ui-icon{width:18px!important;height:18px!important;display:block!important;object-fit:contain!important;opacity:.92}
          .tw-action:nth-child(1){justify-content:flex-start!important}
          .tw-action:nth-child(2),.tw-action:nth-child(3),.tw-action:nth-child(4){justify-content:center!important}
          .tw-action:nth-child(5){justify-self:end!important;margin-right:0!important}
          .tw-action:nth-child(6){justify-self:start!important;margin-left:0!important}
          .tw-action.tw-profile-active-repost{color:#00ba7c!important;font-weight:600}
          .tw-action.tw-profile-active-like{color:#f91880!important;font-weight:600}
          .tw-action.tw-profile-active-bookmark{color:#1d9bf0!important;font-weight:600}
          .tw-action.tw-profile-active .tw-profile-ui-icon{opacity:1}
          .profile-tab{font-size:12px!important}
          </style>
          <script>
          (()=>{
            const icons={
              reply:'이미지/twitter-reply.webp',repost:'이미지/twitter-repost.webp',like:'이미지/twitter-like.webp',
              views:'이미지/twitter-views.webp',bookmark:'이미지/twitter-bookmark.webp',share:'이미지/twitter-share.webp'
            };
            const stateKey='twitter-profile-action-state-v2';
            let states={};try{states=JSON.parse(localStorage.getItem(stateKey)||'{}')}catch(e){}
            const save=()=>{try{localStorage.setItem(stateKey,JSON.stringify(states))}catch(e){}};
            function apply(){
              document.querySelectorAll('.tw-action-icons').forEach((bar,bi)=>{
                const acts=[...bar.querySelectorAll('.tw-action')];
                acts.forEach((a,i)=>{
                  const key=bi+':'+i;
                  const src=icons[['reply','repost','like','views','bookmark','share'][i]];
                  let img=a.querySelector('.tw-profile-ui-icon');
                  if(!img){img=document.createElement('img');img.className='tw-profile-ui-icon';a.insertBefore(img,a.firstChild)}
                  img.src=src;
                  a.querySelectorAll('svg').forEach(x=>x.style.display='none');
                  const on=!!states[key];
                  a.classList.toggle('tw-profile-active',on);
                  a.classList.toggle('tw-profile-active-repost',on&&i===1);
                  a.classList.toggle('tw-profile-active-like',on&&i===2);
                  a.classList.toggle('tw-profile-active-bookmark',on&&i===4);
                });
              });
            }
            function bind(){
              document.querySelectorAll('.tw-action-icons').forEach((bar,bi)=>{
                if(bar.dataset.profileIconBound)return;bar.dataset.profileIconBound='1';
                bar.addEventListener('click',e=>{const a=e.target.closest('.tw-action');if(!a)return;const i=[...bar.querySelectorAll('.tw-action')].indexOf(a);if(![1,2,4].includes(i))return;const key=bi+':'+i;states[key]=!states[key];save();apply();});
              });
            }
            function start(){apply();bind();const mo=new MutationObserver(()=>{apply();bind()});mo.observe(document.body,{subtree:true,childList:true});}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
          })();
          </script>
          '''
          if 'FINAL_TWITTER_PROFILE_ICONS_V2' not in s:
            s=s.replace('</body>',block+'</body>')
            p.write_text(s,encoding='utf-8')

          # Desktop consistency for every editor with the usual preview/settings class names.
          common=r'''
          <style id="FINAL_GLOBAL_PREVIEW_LAYOUT_V2">
          @media(min-width:901px){
            .layout{align-items:start!important}
            .layout>.preview,.layout>.preview-wrap,.layout>.previewSticky{grid-column:1!important;grid-row:1!important;min-width:0!important}
            .layout>.settings,.layout>.panel{grid-column:2!important;grid-row:1!important;min-width:0!important}
          }
          @media(max-width:900px){
            .layout>.preview,.layout>.preview-wrap,.layout>.previewSticky{order:1!important}
            .layout>.settings,.layout>.panel{order:2!important}
          }
          </style>
          '''
          for name in ['twitter.html','twitter-profile.html','news2.html','kakao2.html','kakao-profile.html']:
            p=Path(name)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            if 'FINAL_GLOBAL_PREVIEW_LAYOUT_V2' not in s:
              s=s.replace('</body>',common+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          test -f twitter.html
          test -f twitter-profile.html
          test -f dispatch.html
          grep -q 'FINAL_DISPATCH_LAYOUT_V2' dispatch.html
          grep -q 'FINAL_TWITTER_PROFILE_ICONS_V2' twitter-profile.html
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'feat: polish editor defaults layouts and Twitter profile icons' || true
          git rm .github/workflows/final-ui-polish.yml
          git commit -m 'chore: remove temporary UI polish workflow' || true
          git push
