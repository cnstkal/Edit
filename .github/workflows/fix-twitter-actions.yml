name: fix-twitter-actions
on:
  push:
    paths:
      - '.github/workflows/fix-twitter-actions.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Twitter action layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('twitter.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 22px 22px;', '.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 18px 18px;')
          s=s.replace('.more{position:absolute;right:14px;top:17px;color:#647783}', '.more{position:absolute;right:14px;top:17px;color:#53636d}')
          s=s.replace("$('feed').innerHTML=S.tweets.map(t=>", "$('feed').innerHTML=S.tweets.map((t,i)=>")
          s=s.replace("<span class=\"time\">· '+esc(t.time)+'</span>", "<span class=\"time\">'+(t.time?'· '+esc(t.time):'')+'</span>")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html
          git diff --cached --quiet || git commit -m 'Fix Twitter action layout'
          git push
          rm -f .github/workflows/fix-twitter-actions.yml
          git add .github/workflows/fix-twitter-actions.yml
          git commit -m 'Remove temporary Twitter fix workflow'
          git push
