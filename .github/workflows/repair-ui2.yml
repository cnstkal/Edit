name: repair ui 2
on:
  push:
    paths:
      - '.repair-ui2-trigger'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def strip_marker(s, marker):
              return re.sub(r'\n?<!-- '+re.escape(marker)+r' -->.*?(?=</body>)', '', s, flags=re.S)

          for fn in ['news2.html','dispatch.html']:
              p=Path(fn); s=p.read_text()
              for marker in ['SIMPLE_EDITOR_FIELDS_V1','SIMPLE_EDITOR_FIELDS_FINAL_V2']:
                  s=strip_marker(s,marker)
              p.write_text(s)

          p=Path('twitter.html'); s=p.read_text()
          for marker in ['TWITTER_ICON_LAYOUT_FILL_FIX_V4','TWITTER_FOUR_PHOTOS_V1','TWITTER_ACTIVE_CLICK_STABILITY_V1','TWITTER_ACTIVE_FINAL_V2']:
              s=strip_marker(s,marker)

          patch=r'''\n<!-- TWITTER_SAFE_ACTIVE_V3 -->
<style>
.act.active-repost .tw-ui-icon{filter:brightness(0) saturate(100%) invert(55%) sepia(91%) saturate(1051%) hue-rotate(119deg) brightness(89%) contrast(101%)!important}
.act.active-like .tw-ui-icon{filter:brightness(0) saturate(100%) invert(29%) sepia(93%) saturate(5486%) hue-rotate(323deg) brightness(101%) contrast(99%)!important}
.act.active-bookmark .tw-ui-icon{filter:brightness(0) saturate(100%) invert(48%) sepia(96%) saturate(1855%) hue-rotate(184deg) brightness(96%) contrast(101%)!important}
</style>
<script>
(()=>{
  const feed=document.getElementById('feed');
  if(!feed)return;
  feed.onclick=e=>{
    const btn=e.target.closest?.('[data-action]');
    if(!btn)return;
    const i=+btn.dataset.i, action=btn.dataset.action;
    if(!Number.isFinite(i))return;
    if(action==='repost'&&S.tweets[i].lock)return;
    if(action==='repost')S.tweets[i].reposted=!S.tweets[i].reposted;
    if(action==='like')S.tweets[i].liked=!S.tweets[i].liked;
    if(action==='bookmark')S.tweets[i].bookmarked=!S.tweets[i].bookmarked;
    persist();renderPreview();
  };
})();
</script>
'''
          s=s.replace('</body>',patch+'</body>')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in ['news2.html','dispatch.html']:
              s=Path(f).read_text()
              assert 'SIMPLE_EDITOR_FIELDS_V1' not in s
              assert 'SIMPLE_EDITOR_FIELDS_FINAL_V2' not in s
              assert '댓글 설정' in s if f=='news2.html' else True
          s=Path('twitter.html').read_text()
          assert 'TWITTER_SAFE_ACTIVE_V3' in s
          assert 'TWITTER_FOUR_PHOTOS_V1' not in s
          assert 'TWITTER_ACTIVE_FINAL_V2' not in s
          print('repair ok')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news2.html dispatch.html twitter.html
          git diff --cached --quiet || git commit -m 'fix: restore all editor settings and stop Twitter loading loop'
          git push
      - name: Cleanup
        if: always()
        run: |
          git rm -f .github/workflows/repair-ui2.yml .repair-ui2-trigger || true
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: remove temporary repair workflow' || true
          git push || true
