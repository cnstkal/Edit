name: Improve Kakao profile action icons
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('kakao-profile.html')
          s=p.read_text()
          # Replace chat and call SVGs with cleaner simple line icons.
          old_chat='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H11l-4.5 3v-3H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/></svg>'
          new_chat='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H11l-5 4v-4h-.5A2.5 2.5 0 0 1 3 13.5v-8Z"/></svg>'
          old_call='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.5 9.5 3l2.4 4.2-2 1.6c.9 2 2.3 3.4 4.3 4.3l1.6-2 4.2 2.4-1.5 2.3c-.6.9-1.7 1.4-2.8 1.1-6-1.5-10.7-6.2-12.2-12.2-.3-1.1.2-2.2 1.1-2.8Z"/></svg>'
          new_call='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.2 3.8 9 3l3 5.2-2.4 2c.9 1.8 2.4 3.3 4.2 4.2l2-2.4 5.2 3-0.8 2.8c-.4 1.4-1.8 2.2-3.2 1.9-6.2-1.4-11.1-6.3-12.5-12.5-.3-1.4.5-2.8 1.9-3.2Z"/></svg>'
          s=s.replace(old_chat,new_chat).replace(old_call,new_call)
          # Make icons the same visual size as the button text and tighten icon/text spacing.
          s=s.replace('.action{display:flex;align-items:center;justify-content:center;gap:14px;font-size:30px}', '.action{display:flex;align-items:center;justify-content:center;gap:9px;font-size:30px}')
          s=s.replace('.action-icon{width:30px;height:30px;display:block;flex:none}', '.action-icon{width:30px;height:30px;display:block;flex:none;font-size:30px}')
          s=s.replace('.action-icon{width:28px;height:28px}', '.action-icon{width:25px;height:25px}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao-profile.html
          git commit -m 'Refine chat and call icons' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: rm -f .github/workflows/patch-kakao-icons.yml && git add .github/workflows/patch-kakao-icons.yml && git commit -m 'Remove temporary icon patch workflow' || true
