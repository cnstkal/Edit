name: Fix Twitter profile vectors
on:
  push:
    paths:
      - '.github/workflows/fix-twitter-profile-vectors.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing profile file
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('twitter-profile.html')
          s=p.read_text(encoding='utf-8')
          css='''<style>
          .tw-action-icons{display:flex;justify-content:space-between;align-items:center;color:#53636d;margin-top:10px}
          .tw-action{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:28px;color:inherit}
          .tw-action svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
          .tw-action span{font-size:12px}
          .tw-pin-icon{width:14px;height:14px;vertical-align:-2px;fill:currentColor}
          .tw-x-icon{width:21px;height:21px;display:block}
          .profile-control-icon{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
          .back,.cover-more,.share{display:flex;align-items:center;justify-content:center}
          </style>'''
          if 'tw-action-icons{' not in s:
              s=s.replace('</style></head>',css+'</style></head>',1)
          s=s.replace('<button class="back">←</button>','<button class="back" aria-label="뒤로"><svg class="profile-control-icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>')
          s=s.replace('<button class="cover-more">•••</button>','<button class="cover-more" aria-label="더보기"><svg class="profile-control-icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></button>')
          s=s.replace('<button class="share">↑</button>','<button class="share" aria-label="공유"><svg class="profile-control-icon" viewBox="0 0 24 24"><path d="M12 16V3m0 0L7 8m5-5 5 5M5 13v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg></button>')
          s=s.replace('<div class="pin">📌 메인에 올림</div>','<div class="pin"><svg class="tw-pin-icon" viewBox="0 0 24 24"><path d="M8 3h8v4l2 3v2h-5v7l-1 2-1-2v-7H6v-2l2-3V3Z"/></svg> 메인에 올림</div>')
          old="<span>♡ '+esc(p.reply)+'</span><span>♻ '+esc(p.repost)+'</span><span>♡ '+esc(p.like)+'</span><span>▥ '+esc(p.views)+'</span><span>♡</span><span>↗</span>"
          new="<span class=\"tw-action\"><svg viewBox=\"0 0 24 24\"><path d=\"M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 3v-5.1A7.5 7.5 0 1 1 20 11.5Z\"/></svg><span>'+esc(p.reply)+'</span></span><span class=\"tw-action\"><svg viewBox=\"0 0 24 24\"><path d=\"m8 8 4-4 4 4M12 4v11M16 16l-4 4-4-4M12 20V9\"/></svg><span>'+esc(p.repost)+'</span></span><span class=\"tw-action\"><svg viewBox=\"0 0 24 24\"><path d=\"M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z\"/></svg><span>'+esc(p.like)+'</span></span><span class=\"tw-action\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 20V10M9 20V5M14 20v-8M19 20V2\"/></svg><span>'+esc(p.views)+'</span></span><span class=\"tw-action\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4Z\"/></svg></span><span class=\"tw-action\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 16V3m0 0L7 8m5-5 5 5M5 13v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7\"/></svg></span>"
          if old in s:
              s=s.replace(old,new)
          s=s.replace('<div class="tw-actions">','<div class="tw-action-icons">')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter-profile.html
          git diff --cached --quiet || git commit -m 'Use vector icons in Twitter profile posts'
          git push
