name: Fix profile remove elements
on:
  push:
    paths:
      - '.github/workflows/fix-profile-remove-elements.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove requested preview elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('kakao-profile.html')
          s=p.read_text()
          # Remove likes/DDay-style block from the preview.
          import re
          s=re.sub(r'<div class="likes">.*?</div>\s*', '', s, count=1, flags=re.S)
          # Remove the placeholder label text from the first empty media tile.
          s=s.replace("else if(i===0){d.innerHTML='<div class=\"media-label\">방금 본 미디어</div>'}", "")
          # Hide the now-unused label style without affecting the media grid.
          s=s.replace('.media-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:27px;text-shadow:0 2px 6px #000}', '')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao-profile.html
          git commit -m 'fix: remove profile likes and media placeholder' || true
          git push
      - name: Remove workflow
        run: |
          rm -f .github/workflows/fix-profile-remove-elements.yml
          git add .github/workflows/fix-profile-remove-elements.yml
          git commit -m 'chore: remove temporary profile cleanup workflow' || true
          git push
