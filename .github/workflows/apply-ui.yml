name: Apply preview UI updates
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update editor UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # General news: call the navigation button Home instead of Cancel.
          p = Path('news2.html')
          s = p.read_text()
          s = s.replace('>취소</button>', '>홈으로</button>')
          p.write_text(s)

          # Dispatch: use the same preview toolbar shape as the news editor.
          p = Path('dispatch.html')
          s = p.read_text()
          s = s.replace('<div class="top-right"><select class="mode" id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select></div>', '')
          old = '<div class="preview-tools"><div class="zoom"><button type="button" id="minus">−</button><button type="button" id="fit">맞춤</button><button type="button" id="plus">＋</button><input id="zoom" type="range" min="10" max="300" value="40"><span id="ztext">40%</span></div></div>'
          new = '<div class="preview-tools"><select class="mode" id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select><div class="zoom"><button type="button" id="minus">−</button><button type="button" id="fit">맞춤</button><button type="button" id="plus">＋</button><input id="zoom" type="range" min="10" max="300" value="40"><span id="ztext">40%</span></div></div>'
          s = s.replace(old, new)
          s = s.replace('.preview-tools b{font-size:12px}', '.preview-tools b{font-size:12px}.preview-tools .mode{border:1px solid #d8d1c6;background:#fffdf9;border-radius:10px;padding:8px 10px;font-size:11px}')
          p.write_text(s)

          # Kakao: reduce chat-room title, round avatars a little more, and add PC 16:9 mode.
          p = Path('kakao2.html')
          s = p.read_text()
          s = s.replace('.room{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 180px);text-align:center;font-size:34px;', '.room{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 180px);text-align:center;font-size:28px;')
          s = s.replace('.avatar{width:58px;height:58px;flex:none;border-radius:22px;', '.avatar{width:58px;height:58px;flex:none;border-radius:26px;')
          s = s.replace('.tools{padding:11px;display:flex;gap:8px;align-items:center;margin-bottom:10px}', '.tools{padding:10px 12px;display:flex;gap:8px;align-items:center;margin-bottom:10px}.tools select{width:auto;height:36px;padding:0 10px;border:1px solid #ddd9d2;border-radius:10px;background:#fff;font-size:12px}')
          s = s.replace('.stage{width:100%;max-width:429px;aspect-ratio:9/16;', '.stage{width:100%;max-width:429px;aspect-ratio:9/16;')
          s = s.replace('.chat{width:720px;height:1280px;position:relative;', '.chat{width:720px;height:1280px;position:relative;')
          marker = '.navicons,.back{display:none}'
          s = s.replace(marker, marker + '.stage.pc-frame{max-width:720px;aspect-ratio:16/9}.chat.pc{width:1600px;height:900px}')
          old_tools = '<div class="tools"><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="10" max="100" value="45"><span id="zt">45%</span></div></div>'
          new_tools = '<div class="tools"><select id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="10" max="100" value="45"><span id="zt">45%</span></div></div>'
          s = s.replace(old_tools, new_tools)
          s = s.replace('<section class="chat" id="chat">', '<section class="chat" id="chat">')
          old_fit = "function fit(){const r=$('stage').getBoundingClientRect(),z=Math.min((r.width-8)/720,(r.height-8)/1280)*100;"
          new_fit = "function fit(){const pc=$('chat').classList.contains('pc'),cw=pc?1600:720,ch=pc?900:1280,r=$('stage').getBoundingClientRect(),z=Math.min((r.width-8)/cw,(r.height-8)/ch)*100;"
          s = s.replace(old_fit, new_fit)
          s = s.replace("$('minus').onclick=()=>{$('zoom').value=Math.max(10,+$('zoom').value-5);applyTransform();persist()};", "$('mode').onchange=()=>{const pc=$('mode').value==='pc';$('chat').classList.toggle('pc',pc);$('stage').classList.toggle('pc-frame',pc);panX=panY=0;fit();render()};$('minus').onclick=()=>{$('zoom').value=Math.max(10,+$('zoom').value-5);applyTransform();persist()};")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news2.html dispatch.html kakao2.html
          git diff --cached --quiet || git commit -m 'fix: unify preview controls and kakao pc mode'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/apply-ui.yml
          git add .github/workflows/apply-ui.yml
          git commit -m 'chore: remove temporary update workflow' || true
          git push || true
