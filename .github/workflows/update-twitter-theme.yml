name: Update Twitter Theme
on:
  push:
    paths:
      - '.github/workflows/update-twitter-theme.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update twitter.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('twitter.html')
          s=p.read_text()
          reps = [
            ('.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 18px 18px;', '.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 18px 21px;'),
            ('.screen{width:100%;height:100%;overflow:hidden;background:#fff}', '.screen{width:100%;height:100%;overflow:hidden;background:#fff;color:#111}'),
            ('.act.active-repost{color:#00ba7c}.act.active-like{color:#f91880}.act.active-bookmark{color:#1d9bf0}.act.disabled{color:#b9c1c5;cursor:default}.empty{color:#aeb7bc}', '.act.active-repost{color:#00ba7c}.act.active-like{color:#f91880}.act.active-bookmark{color:#1d9bf0}.act.disabled{color:#b9c1c5;cursor:default}.empty{color:#53636d}.screen.theme-dark{background:#000;color:#f7f9f9}.screen.theme-dark .twitter-head{border-color:#2f3336}.screen.theme-dark .tweet{background:#000;border-color:#2f3336}.screen.theme-dark .tab{color:#8b98a5}.screen.theme-dark .tab.active{color:#f7f9f9}.screen.theme-dark .handle,.screen.theme-dark .time{color:#8b98a5}.screen.theme-dark .more{color:#8b98a5}.screen.theme-dark .actions{color:#8b98a5}.screen.theme-dark .empty{color:#8b98a5}.screen.theme-dark .avatar{background:#2f3336}'),
            ('<div class="section"><h2>화면 표시</h2><div class="row"><div class="field"><label>피드 배경색</label><input id="bg" type="color"></div><div class="field"><label>글 크기</label><select id="scale">', '<div class="section"><h2>화면 표시</h2><div class="row"><div class="field"><label>배경 테마</label><select id="theme"><option value="white">화이트</option><option value="black">블랙</option></select></div><div class="field"><label>글 크기</label><select id="scale">'),
            ("function defaults(){return{tab1:'추천',tab2:'팔로잉',activeTab:true,bg:'#ffffff',scale:'normal',tweets:[blank(),blank(),blank()]}}", "function defaults(){return{tab1:'추천',tab2:'팔로잉',activeTab:true,theme:'white',scale:'normal',tweets:[blank(),blank(),blank()]}}"),
            ("x.tab2=String(x.tab2??d.tab2);x.activeTab=x.activeTab!==false;x.bg=/^#[0-9a-fA-F]{6}$/.test(x.bg)?x.bg:d.bg;x.scale=x.scale==='large'?'large':'normal';return x}", "x.tab2=String(x.tab2??d.tab2);x.activeTab=x.activeTab!==false;x.theme=x.theme==='black'?'black':'white';x.scale=x.scale==='large'?'large':'normal';return x}"),
            ("$('tab1').value=S.tab1;$('tab2').value=S.tab2;$('activeTab').checked=S.activeTab;$('bg').value=S.bg;$('scale').value=S.scale;", "$('tab1').value=S.tab1;$('tab2').value=S.tab2;$('activeTab').checked=S.activeTab;$('theme').value=S.theme;$('scale').value=S.scale;"),
            ("$('pvTab1').textContent=S.tab1;$('pvTab2').textContent=S.tab2;$('pvTab1').classList.toggle('active',!S.activeTab);$('pvTab2').classList.toggle('active',S.activeTab);$('screen').dataset.scale=S.scale;$('screen').style.background=S.bg;$('feed').style.background=S.bg;", "$('pvTab1').textContent=S.tab1;$('pvTab2').textContent=S.tab2;$('pvTab1').classList.toggle('active',!S.activeTab);$('pvTab2').classList.toggle('active',S.activeTab);$('screen').dataset.scale=S.scale;$('screen').classList.toggle('theme-dark',S.theme==='black');$('screen').style.background=S.theme==='black'?'#000':'#fff';$('feed').style.background='transparent';"),
            ("<button class=\"act '+(t.views?'':'empty')+'\" type=\"button\"><i class=\"ico\">'+icon.views+'</i><span>'+esc(t.views)+'</span></button>", "<button class=\"act\" type=\"button\"><i class=\"ico\">'+icon.views+'</i><span>'+esc(t.views)+'</span></button>"),
            ("['tab1','tab2','bg','scale'].forEach(id=>$(id).addEventListener('input',e=>{S[id]=e.target.value;persist();renderPreview()}));", "['tab1','tab2','theme','scale'].forEach(id=>$(id).addEventListener('input',e=>{S[id]=e.target.value;persist();renderPreview()}));"),
          ]
          for a,b in reps:
              if a not in s:
                  raise SystemExit(f'MISSING: {a[:100]}')
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html
          git commit -m 'Update Twitter theme and action styling'
          git push
