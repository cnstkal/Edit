name: update-kakao-ratios
on:
  push:
    paths:
      - '.github/workflows/update-kakao-ratios.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch kakao2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kakao2.html')
          s=p.read_text()
          old='<option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option>'
          new='<option value="mobile">모바일 · 9:16</option><option value="2to3">모바일 · 2:3</option><option value="4to3">모바일 · 4:3</option><option value="pc">PC · 16:9</option>'
          if old not in s: raise SystemExit('mode options not found')
          s=s.replace(old,new,1)
          oldcss='.chat{width:720px;height:1280px;position:relative;overflow:hidden;background:#b8cbdc}'
          newcss='.chat{width:720px;height:auto;min-height:1280px;position:relative;overflow:hidden;background:#b8cbdc;display:flex;flex-direction:column}.chat.ratio-2to3{min-height:1080px}.chat.ratio-4to3{min-height:540px}.chat.pc{width:1600px;min-height:900px}.chat.ratio-9to16{min-height:1280px}.chat .messages{position:static;left:auto;right:auto;top:auto;bottom:auto;flex:0 0 auto;overflow:visible;padding:12px 25px 25px}.chat .composer{position:static;left:auto;right:auto;bottom:auto;flex:0 0 96px;margin-top:auto}'
          if oldcss not in s: raise SystemExit('chat css not found')
          s=s.replace(oldcss,newcss,1)
          oldpc='.chat.pc{width:1600px;height:900px}.stage.pc-frame{max-width:720px;aspect-ratio:16/9}.chat.pc{width:1600px;height:900px}'
          s=s.replace(oldpc,'.stage.pc-frame{max-width:720px;aspect-ratio:16/9}.chat.pc{width:1600px;min-height:900px}',1)
          marker='</style></head>'
          extra='<style>.stage.ratio-9-16{aspect-ratio:9/16!important}.stage.ratio-2to3{aspect-ratio:2/3!important}.stage.ratio-4to3{aspect-ratio:4/3!important}.stage.ratio-pc{aspect-ratio:16/9!important}.chat.ratio-9-16{min-height:1280px}.chat.ratio-2to3{min-height:1080px}.chat.ratio-4to3{min-height:540px}.chat.ratio-pc{width:1600px;min-height:900px}.chat:not(.pc){width:720px}</style></head>'
          if marker not in s: raise SystemExit('style marker not found')
          s=s.replace(marker,extra,1)
          oldopt="<select id=\"mode\"><option value=\"mobile\">모바일 · 9:16</option><option value=\"2to3\">모바일 · 2:3</option><option value=\"4to3\">모바일 · 4:3</option><option value=\"pc\">PC · 16:9</option></select>"
          if oldopt not in s: raise SystemExit('final mode block not found')
          marker='</body>'
          extra_script='''<script>\n(()=>{const m=document.getElementById('mode'),st=document.getElementById('stage'),ch=document.getElementById('chat');if(!m||!st||!ch)return;function applyRatio(){const v=m.value;st.classList.remove('pc-frame','ratio-9-16','ratio-2to3','ratio-4to3');ch.classList.remove('pc','ratio-9-16','ratio-2to3','ratio-4to3');if(v==='pc'){st.classList.add('pc-frame');ch.classList.add('pc')}else{const r=v==='2to3'?'ratio-2to3':v==='4to3'?'ratio-4to3':'ratio-9-16';st.classList.add(r);ch.classList.add(r)}}m.addEventListener('change',()=>setTimeout(applyRatio,0));applyRatio()})();\n</script></body>'''
          if marker not in s: raise SystemExit('body marker not found')
          s=s.replace(marker,extra_script,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao2.html
          git commit -m 'feat: add Kakao preview ratios and dynamic height'
          git push
