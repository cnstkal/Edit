name: Sync Kakao editor layout
on:
  push:
    branches: [main]
    paths: ['.kakao-layout-trigger']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unified preview and settings layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('kakao2.html')
          s=p.read_text(encoding='utf-8')
          marker='KAKAO_UNIFIED_EDITOR_LAYOUT_V1'
          if marker not in s:
              css=r'''
          <style id="KAKAO_UNIFIED_EDITOR_LAYOUT_V1">
          @media (min-width:901px){
            body{padding:0 14px 34px!important}
            .top{width:100%!important;max-width:none!important;height:68px!important;margin:0!important;padding:0 28px!important;border-bottom:1px solid #e2dfda!important;background:#fbfaf7!important}
            .top .home{left:0!important;position:relative!important}
            .layout{width:100%!important;max-width:none!important;margin:0!important;display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:0!important;align-items:start!important}
            .preview{width:100%!important;min-width:0!important;padding:28px 28px 22px 0!important;display:flex!important;flex-direction:column!important;align-items:stretch!important}
            .tools{width:100%!important;margin:0 0 12px!important;min-height:54px!important;padding:8px 10px!important;border-radius:12px!important;justify-content:center!important;box-shadow:0 1px 5px #7771!important}
            .tools .zoom{margin-left:auto!important;margin-right:auto!important;gap:5px!important}
            .tools .zoom input{width:100px!important}
            .stage{width:min(100%,520px)!important;max-width:520px!important;margin:0 auto!important}
            .stage.pc-frame{width:min(100%,720px)!important;max-width:720px!important;margin:0 auto!important}
            .panel{width:100%!important;max-width:none!important;margin:0!important;padding:28px 18px 70px!important;border:0!important;border-left:1px solid #dedad4!important;border-radius:0!important;box-shadow:none!important;background:#fbfaf7!important;align-self:start!important}
            .group{background:#fffdfa!important;border:1px solid #ddd9d3!important;border-radius:14px!important;box-shadow:0 1px 5px #7771!important;padding:18px!important;margin:0 0 14px!important}
          }
          @media (max-width:900px){
            body{padding:0 8px 28px!important}
            .top{height:64px!important;margin-bottom:0!important}
            .layout{display:flex!important;flex-direction:column!important;width:100%!important;max-width:none!important;gap:0!important}
            .preview{order:1!important;width:100%!important;padding:12px 0 0!important}
            .tools{width:100%!important;margin:0 0 10px!important;padding:8px!important;min-height:48px!important;justify-content:center!important}
            .tools .zoom{width:auto!important;margin:0 auto!important}
            .tools .zoom input{width:min(38vw,180px)!important}
            .stage{width:min(100%,620px)!important;max-width:620px!important;margin:0 auto!important}
            .stage.pc-frame{width:min(100%,900px)!important;max-width:900px!important}
            .panel{order:2!important;width:100%!important;max-width:none!important;margin:0!important;padding:22px 0 0!important;background:transparent!important;border:0!important;box-shadow:none!important}
            .group{background:#fffdfa!important;border:1px solid #ddd9d3!important;border-radius:14px!important;box-shadow:0 1px 5px #7771!important;padding:17px 15px!important;margin-bottom:14px!important}
          }
          </style>
          '''
              s=s.replace('</head>',css+'</head>')
          s=s.replace('?v=20260909h','?v=20260910m')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f .kakao-layout-trigger .github/workflows/kakao-editor-layout-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao2.html .kakao-layout-trigger .github/workflows/kakao-editor-layout-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: unify Kakao editor layout with news'
          git push
