name: News layout polish
on:
  push:
    paths:
      - '.news-layout-polish-trigger'
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix layout alignment and preview controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('news-editor.html')
          s=p.read_text(encoding='utf-8')
          if 'NEWS_LAYOUT_POLISH_V1' not in s:
            css='''<style id="news-layout-polish-v1">
/* NEWS_LAYOUT_POLISH_V1 */
@media (min-width:901px){
  html,body{height:100%;overflow:hidden}
  body{padding:0 12px 12px}
  .layout{width:min(1400px,100%);height:calc(100vh - 68px);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(520px,760px);gap:16px;align-items:stretch;min-height:0}
  .preview{min-width:0;min-height:0;height:100%;overflow:hidden}
  .previewSticky{position:static;height:100%;min-height:0;display:flex;flex-direction:column}
  .tools{width:100%;min-width:0;flex:0 0 auto;margin-bottom:10px;overflow:hidden;flex-wrap:nowrap}
  .tools select{flex:0 0 auto}
  .zoom{min-width:0;max-width:100%;overflow:hidden}
  .zoom input{min-width:60px;max-width:125px;flex:1 1 80px}
  .stage{width:100%;max-width:none;min-width:0;flex:1 1 auto;height:auto;min-height:0;margin:0;overflow:hidden}
  .settings{height:100%;max-height:none;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 8px 16px 0;align-self:stretch}
  .settings>.card:last-child{margin-bottom:0}
}
@media (max-width:900px){
  .tools{max-width:100%;overflow:hidden}
  .preview{min-width:0;overflow:hidden}
}
</style>'''
            s=s.replace('</head>',css+'</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
          rm -f .news-layout-polish-trigger .github/workflows/news-layout-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: align news editor panels and contain preview controls" || true
          git push
