name: Fix Twitter loading loop
on:
  push:
    paths:
      - '.github/workflows/fix-twitter-loading.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch mutation observers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('twitter.html')
          s=p.read_text()
          old="""function start(){addEditorControls();syncPreview();bindActions();const mo=new MutationObserver(()=>{addEditorControls();syncPreview()});const feed=document.getElementById('feed'),tweets=document.getElementById('tweets');if(feed)mo.observe(feed,{childList:true,subtree:true});if(tweets)mo.observe(tweets,{childList:true,subtree:true})}"""
          new="""function start(){addEditorControls();syncPreview();bindActions();const mo=new MutationObserver(records=>{let changed=false;for(const r of records){for(const n of r.addedNodes){if(n.nodeType===1&&(n.classList?.contains('tweet')||n.querySelector?.('.tweet'))){changed=true;break}}for(const n of r.removedNodes){if(n.nodeType===1&&(n.classList?.contains('tweet')||n.querySelector?.('.tweet'))){changed=true;break}}if(changed)break}if(changed){addEditorControls();syncPreview()}});const feed=document.getElementById('feed'),tweets=document.getElementById('tweets');if(feed)mo.observe(feed,{childList:true,subtree:true});if(tweets)mo.observe(tweets,{childList:true,subtree:true})}"""
          if old not in s: raise SystemExit('first observer pattern not found')
          s=s.replace(old,new,1)
          old2="""function start(){bind();sync();const mo=new MutationObserver(()=>{bind();sync()});const t=document.getElementById('tweets'),f=document.getElementById('feed');if(t)mo.observe(t,{childList:true,subtree:true});if(f)mo.observe(f,{childList:true,subtree:true})}"""
          new2="""function start(){bind();sync();const mo=new MutationObserver(records=>{let changed=false;for(const r of records){for(const n of r.addedNodes){if(n.nodeType===1&&(n.classList?.contains('tweet')||n.querySelector?.('.tweet'))){changed=true;break}}for(const n of r.removedNodes){if(n.nodeType===1&&(n.classList?.contains('tweet')||n.querySelector?.('.tweet'))){changed=true;break}}if(changed)break}if(changed){bind();sync()}});const t=document.getElementById('tweets'),f=document.getElementById('feed');if(t)mo.observe(t,{childList:true,subtree:true});if(f)mo.observe(f,{childList:true,subtree:true})}"""
          if old2 not in s: raise SystemExit('second observer pattern not found')
          s=s.replace(old2,new2,1)
          marker='<!-- TWITTER_LOADING_LOOP_FIX_V1 -->'
          if marker not in s: s=s.replace('</head>',marker+'\n</head>',1)
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html
          git commit -m 'fix: stop Twitter preview loading mutation loop'
          git rm .github/workflows/fix-twitter-loading.yml
          git commit -m 'chore: remove temporary Twitter fix workflow'
          git push
