name: Fix dispatch 50 50
on:
  push:
    branches: [main]
    paths: ['.dispatch-5050-trigger']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce exact 50 50 desktop frame
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dispatch-editor.html')
          s=p.read_text(encoding='utf-8')
          marker='DISPATCH_EXACT_5050_FINAL_V1'
          block=r'''<style id="DISPATCH_EXACT_5050_FINAL_V1">
          @media(min-width:901px){
            html,body{width:100%!important;min-width:0!important;margin:0!important;padding:0!important;overflow-x:hidden!important}
            .layout{width:100vw!important;max-width:none!important;margin:0!important;padding:0!important;display:grid!important;grid-template-columns:50% 50%!important;grid-template-rows:auto!important;gap:0!important;align-items:start!important}
            .preview,.preview-wrap{grid-column:1!important;width:50vw!important;max-width:50vw!important;min-width:0!important;margin:0!important;padding:24px 28px!important;justify-self:stretch!important;overflow:hidden!important}
            .previewSticky{width:100%!important;max-width:none!important;margin:0!important}
            .preview-tools,.tools{width:min(480px,100%)!important;max-width:480px!important;margin:0 auto 12px!important;box-sizing:border-box!important}
            .stage-wrap{width:100%!important;max-width:none!important;margin:0!important;box-sizing:border-box!important}
            .stage{max-width:100%!important;margin-left:auto!important;margin-right:auto!important}
            .settings,.panel{grid-column:2!important;width:50vw!important;max-width:50vw!important;min-width:0!important;margin:24px 0 0!important;justify-self:stretch!important;box-sizing:border-box!important;overflow-y:auto!important;overflow-x:hidden!important;border-radius:16px!important}
            .settings>*,.panel>*{max-width:100%!important;min-width:0!important}
          }
          @media(max-width:900px){
            .layout{width:100%!important;max-width:none!important;display:flex!important;flex-direction:column!important}
            .preview,.preview-wrap{width:100%!important;max-width:none!important;order:1!important}
            .settings,.panel{width:100%!important;max-width:none!important;order:2!important}
          }
          </style>'''
          if marker not in s:
              s=s.replace('</head>',block+'</head>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f .dispatch-5050-trigger .github/workflows/fix-dispatch-5050.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dispatch-editor.html .dispatch-5050-trigger .github/workflows/fix-dispatch-5050.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: enforce exact 50 50 dispatch editor layout'
          git push
