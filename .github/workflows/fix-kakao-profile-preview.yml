name: Fix Kakao Profile Preview
on:
  push:
    paths:
      - '.github/workflows/fix-kakao-profile-preview.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch preview sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kakao-profile.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(".scale{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}", ".scale{display:flex;align-items:center;justify-content:center;flex:none;min-width:0;min-height:0}")
          s=s.replace("else if(i===0){d.innerHTML='<div class=\\\"media-label\\\">방금 본 미디어</div>'}", "")
          old="let z=45;function applyZoom(){z=Math.max(30,Math.min(100,z));$('zoom').value=z;$('zt').textContent=z+'%';$('scale').style.transform=`scale(${z/100})`};"
          new="let z=45;function applyZoom(){z=Math.max(30,Math.min(100,z));$('zoom').value=z;$('zt').textContent=z+'%';$('scale').style.width=(720*z/100)+'px';$('scale').style.height=(1280*z/100)+'px';$('scale').style.transform=`scale(${z/100})`};"
          if old not in s:
              raise SystemExit('zoom function not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao-profile.html
          git diff --cached --quiet || git commit -m 'fix: center full kakao profile preview'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-kakao-profile-preview.yml
          git commit -m 'chore: remove temporary preview workflow'
          git push
