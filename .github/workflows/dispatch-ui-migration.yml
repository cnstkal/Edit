name: Apply unified editor UI to dispatch
on:
  push:
    branches: [main]
    paths: ['.dispatch-ui-migration-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply news editor UI to dispatch editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dispatch-editor.html')
          s=p.read_text(encoding='utf-8')
          marker='DISPATCH_UNIFIED_LAYOUT_V1'
          if marker not in s:
              css=r'''
          <style id="DISPATCH_UNIFIED_LAYOUT_V1">
          html,body{background:#f5f3ee!important;color:#171717!important}
          body{padding:0 14px 34px!important}
          .top{width:100%!important;max-width:none!important;height:68px!important;margin:0!important;padding:0 28px!important;border-bottom:1px solid #e2dfda!important;background:#fbfaf7!important;display:flex!important;align-items:center!important;justify-content:space-between!important;position:relative!important}
          .top .brand{display:none!important}
          .top:before{content:'↶   ↷';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;letter-spacing:14px;color:#b9b7b4;white-space:nowrap;pointer-events:none}
          .top:after{content:'PNG로 저장';display:flex;align-items:center;justify-content:center;width:190px;height:44px;border-radius:11px;background:#4b4948;color:#fff;font-size:15px;font-weight:650;order:3}
          .top .home{width:62px!important;height:44px!important;padding:0!important;border:1px solid #d9d6d1!important;border-radius:11px!important;background:#fff!important;color:#555!important;font-size:0!important;position:relative;z-index:1}
          .top .home:after{content:'⌂';font-size:24px;line-height:1;color:#555}
          .layout{width:100%!important;max-width:none!important;margin:0!important;display:grid!important;grid-template-columns:minmax(0,1fr) minmax(420px,500px)!important;gap:0!important;align-items:stretch!important;min-height:calc(100vh - 68px)!important}
          .preview-wrap{grid-column:1!important;grid-row:1!important;min-width:0!important;padding:28px 28px 22px 0!important;display:flex!important;flex-direction:column!important}
          .preview-wrap{order:1!important}
          .panel{grid-column:2!important;grid-row:1!important;width:100%!important;max-width:none!important;height:calc(100vh - 68px)!important;overflow-y:auto!important;overflow-x:hidden!important;padding:28px 18px 70px!important;border:0!important;border-left:1px solid #dedad4!important;border-radius:0!important;background:#fbfaf7!important;box-shadow:none!important;justify-self:stretch!important}
          .panel h2{font-size:0!important;margin:0 0 18px!important}.panel h2:before{content:'설정';font-size:26px;font-weight:750;color:#202020}
          .group{background:#fffdfa!important;border:1px solid #ddd9d3!important;border-radius:14px!important;box-shadow:0 1px 5px #7771!important;padding:18px 18px 20px!important;margin:0 0 14px!important}
          .group label{color:#555!important;font-size:12px!important;font-weight:600!important}
          .group>label:first-child{font-size:17px!important;color:#202020!important;margin-bottom:14px!important;font-weight:700!important}
          input[type=text],textarea{height:44px!important;border:1px solid #dedad5!important;border-radius:9px!important;background:#fff!important;padding:0 13px!important;font-size:16px!important}
          textarea{padding:12px 13px!important;min-height:150px!important;line-height:1.6!important}
          .upload{border:1px dashed #d4d3cf!important;border-radius:12px!important;background:#f7f8fb!important;color:#2479e8!important;padding:10px!important;min-height:48px!important}
          .remove{height:44px!important;border:1px solid #d9d8d4!important;background:#fff!important;border-radius:9px!important;font-size:12px!important}
          .small{font-size:10px!important;color:#999!important}
          .mini-edit{border-top:1px solid #eee8de!important;padding-top:12px!important;margin-top:12px!important}
          .actions{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;margin-top:0!important}
          .action{height:44px!important;border-radius:9px!important;font-size:13px!important}
          .preview-tools{background:#fffdfa!important;border:1px solid #ddd9d3!important;border-radius:12px!important;box-shadow:0 1px 5px #7771!important;padding:10px 14px!important;margin:0 0 12px!important;min-height:54px!important}
          .preview-tools .mode{height:38px!important;min-height:38px!important;padding:0 10px!important;border:1px solid #dedad5!important;border-radius:9px!important;background:#fff!important;font-size:13px!important}
          .zoom{gap:6px!important}.zoom button{height:38px!important;min-width:38px!important;border:1px solid #ddd!important;border-radius:9px!important;font-size:20px!important}.zoom input{height:28px!important}.zoom span{font-size:11px!important;min-width:38px!important}
          .stage-wrap{background:#e2ded6!important;border:1px solid #d8d4ce!important;border-radius:12px!important;padding:12px!important;box-shadow:none!important;overflow:hidden!important}
          .stage{border-radius:12px!important;box-shadow:none!important}
          @media(max-width:900px){
            body{padding:0 8px 28px!important}
            .top{height:64px!important;padding:0 12px!important}
            .top:before{display:none!important}
            .top:after{width:116px!important;height:38px!important;font-size:12px!important}
            .top .home{width:50px!important;height:38px!important}
            .top .home:after{font-size:24px!important}
            .layout{display:flex!important;flex-direction:column!important;min-height:0!important}
            .preview-wrap{order:1!important;padding:12px 0 0!important}
            .panel{order:2!important;height:auto!important;overflow:visible!important;border-left:0!important;padding:22px 0 0!important;background:transparent!important}
            .panel h2{margin:0 0 14px!important}.panel h2:before{font-size:23px!important}
            .group{padding:17px 15px!important}
            .preview-tools{margin-bottom:10px!important}
            .preview-tools .zoom{width:100%!important;margin-left:0!important}
            .stage-wrap{padding:8px!important}
          }
          </style>
          '''
              s=s.replace('</head>',css+'</head>')
          # Give the dispatch preview the same semantic ratio classes used by the unified news editor.
          if 'EDITOR_RATIO_RULES_FINAL_JS' not in s:
              js=r'''\n          <script id="EDITOR_RATIO_RULES_FINAL_JS">(function(){function f(){var q=document.getElementById('mode');if(!q)return;var t=q.options[q.selectedIndex]?.textContent||'';var st=document.getElementById('stage');if(!st)return;st.classList.toggle('editor-mobile',/모바일 비율/.test(t));st.classList.toggle('editor-pc',/PC 비율/.test(t));}document.addEventListener('change',f,true);window.addEventListener('load',f);setTimeout(f,100)})();</script>\n          '''
              s=s.replace('</body>',js+'</body>')
          # Ensure the actual controls remain free of numeric ratio labels.
          s=s.replace('모바일 · 9:16','모바일 비율').replace('PC · 16:9','PC 비율').replace('모바일 / 9:16','모바일 비율').replace('PC / 16:9','PC 비율')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove migration files
        run: |
          rm -f .dispatch-ui-migration-trigger .github/workflows/dispatch-ui-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dispatch-editor.html .dispatch-ui-migration-trigger .github/workflows/dispatch-ui-migration.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: unify dispatch editor UI with news editor'
          git push
