name: Fix input zoom
on:
  push:
    paths:
      - '.github/workflows/fix-input-zoom.yml'
      - 'twitter.html'
      - 'news2.html'
      - 'dispatch.html'
      - 'kakao2.html'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch editor input zoom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = ['twitter.html','news2.html','dispatch.html','kakao2.html']
          css = '<style id="no-input-zoom">input:not([type="checkbox"]):not([type="radio"]),textarea,select{font-size:16px!important}</style>'
          for name in files:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              if 'id="no-input-zoom"' not in s:
                  s=s.replace('</head>', css+'</head>', 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html news2.html dispatch.html kakao2.html
          git diff --cached --quiet || git commit -m 'Prevent mobile input auto zoom'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-input-zoom.yml || true
          git commit -m 'Remove temporary input zoom workflow' || true
          git push || true