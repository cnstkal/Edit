name: Lazy load generator apps
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable lazy app loading
        run: |
          cat > js/loader.js <<'JS'
          (()=>{const loaded=new Set(),map={google:'google',googleResults:'google-results',dispatch:'dispatch',dcinside:'dcinside',story:'instagram-story',kakao:'kakao',everytime:'everytime',notification:'notification',gpt:'gpt',twitter:'twitter',windows:'windows',tinder:'tinder',discord:'discord',instagramDm:'instagram-dm',instagram:'instagram',naver:'naver',naverBlog:'naver-blog',naverSearch:'naver-search',youtube:'youtube',netflix:'netflix'};const load=n=>{const f=map[n];if(!f||loaded.has(f))return;loaded.add(f);const l=document.createElement('link');l.rel='stylesheet';l.href='css/'+f+'.css';document.head.appendChild(l);const s=document.createElement('script');s.src='js/'+f+'.js';s.async=false;s.onload=()=>{};document.body.appendChild(s)};const old=window.showScreen;window.showScreen=n=>{old(n);load(n)};})();
          JS
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          t=re.sub(r'<script\s+src=["\']js/[^"\']+["\'][^>]*></script>\s*','',t,flags=re.I)
          t=t.replace('</body>','<script src="js/core.js" defer></script>\n<script src="js/loader.js" defer></script>\n</body>',1)
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/loader.js
          git diff --cached --quiet || (git commit -m 'perf: lazy load generator apps' && git push)
