name: Apply preview layout fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, label):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing pattern: {label}')
              p.write_text(s.replace(old,new,1))

          # News home button
          p=Path('news2.html'); s=p.read_text(); s=s.replace('>취소</button>','>홈으로</button>'); p.write_text(s)

          # Dispatch preview toolbar: mode selector belongs inside the same toolbar as zoom.
          p=Path('dispatch.html'); s=p.read_text()
          s=s.replace('<div class="top-right"><select class="mode" id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select></div>','')
          s=s.replace('<div class="preview-tools"><div class="zoom">','<div class="preview-tools"><select class="mode" id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select><div class="zoom">',1)
          s=s.replace('.preview-tools b{font-size:12px}', '.preview-tools b{font-size:12px}.preview-tools .mode{border:1px solid #d8d1c6;background:#fffdf9;border-radius:10px;padding:8px 10px;font-size:11px}',1)
          p.write_text(s)

          # Kakao title/avatar and preview mode.
          p=Path('kakao2.html'); s=p.read_text()
          s=s.replace('text-align:center;font-size:34px;font-weight:800','text-align:center;font-size:28px;font-weight:800',1)
          s=s.replace('.avatar{width:58px;height:58px;flex:none;border-radius:22px;','.avatar{width:58px;height:58px;flex:none;border-radius:26px;',1)
          s=s.replace('<div class="tools"><div class="zoom">','<div class="tools"><select id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select><div class="zoom">',1)
          s=s.replace('.navicons,.back{display:none}', '.navicons,.back{display:none}.tools select{width:auto;height:36px;padding:0 10px;border:1px solid #ddd9d2;border-radius:10px;background:#fff;font-size:12px}.stage.pc-frame{max-width:720px;aspect-ratio:16/9}.chat.pc{width:1600px;height:900px}',1)
          s=re.sub(r'function fit\(\)\{const r=\$\(\'stage\'\)\.getBoundingClientRect\(\),z=Math\.min\(\(r\.width-8\)/720,\(r\.height-8\)/1280\)\*100;', "function fit(){const pc=$('chat').classList.contains('pc'),cw=pc?1600:720,ch=pc?900:1280,r=$('stage').getBoundingClientRect(),z=Math.min((r.width-8)/cw,(r.height-8)/ch)*100;", s, count=1)
          s=s.replace("$('minus').onclick=()=>{$('zoom').value=Math.max(10,+$('zoom').value-5);applyTransform();persist()};", "$('mode').onchange=()=>{const pc=$('mode').value==='pc';$('chat').classList.toggle('pc',pc);$('stage').classList.toggle('pc-frame',pc);panX=panY=0;fit();render()};$('minus').onclick=()=>{$('zoom').value=Math.max(10,+$('zoom').value-5);applyTransform();persist()};",1)
          p.write_text(s)
          PY
          grep -o 'font-size:28px;font-weight:800' kakao2.html
          grep -o 'border-radius:26px' kakao2.html
          grep -o 'id="mode"' kakao2.html | head -1
          grep -o '>홈으로</button>' news2.html | head -1
          grep -o 'preview-tools"><select class="mode"' dispatch.html | head -1
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news2.html dispatch.html kakao2.html
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'fix: unify preview controls and add kakao pc mode'
          git push
          rm -f .github/workflows/apply-ui2.yml
          git add .github/workflows/apply-ui2.yml
          git commit -m 'chore: remove temporary workflow'
          git push
