name: Refine Kakao header
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update header
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kakao2.html')
          s=p.read_text()
          marker='/* PC 16:9 preview: enlarge chat content except room name */'
          css='''<style>\n/* Final Kakao header refinement */\n.room{font-size:26px}\n.nav{border-bottom-color:#aab7c4}\n.messages{padding-top:22px}\n.chat.pc .room{font-size:22px}\n.chat.pc .nav{border-bottom-color:#aab7c4}\n.chat.pc .messages{padding-top:26px}\n</style>'''
          if '/* Final Kakao header refinement */' in s:
              raise SystemExit('already applied')
          if marker not in s:
              raise SystemExit('marker not found')
          p.write_text(s.replace(marker,css+marker,1))
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao2.html
          git commit -m 'fix: refine Kakao header spacing'
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/refine-kakao-header.yml
          git commit -m 'chore: remove temporary header workflow'
          git push
