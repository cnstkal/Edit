name: Fit news preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/news-preview-fit.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply preview fit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('news-editor.html')
          s=p.read_text(encoding='utf-8')
          marker='/* NEWS_PREVIEW_FIT_V2 */'
          css='''\n<style>\n/* NEWS_PREVIEW_FIT_V2 */\n@media (min-width:901px){\n  .settings{height:calc(100vh - 92px)!important;max-height:calc(100vh - 92px)!important;overflow-y:auto!important;overflow-x:hidden!important;padding-bottom:70px!important;scrollbar-gutter:stable!important}\n  .preview{padding-right:28px!important}\n  .stage{width:calc(100% - 32px)!important;max-width:calc(100% - 32px)!important;margin-left:auto!important;margin-right:auto!important}\n}\n</style>\n'''
          if marker not in s:
              s=s.replace('</head>',css+'</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add news-editor.html
          git commit -m 'fix: keep news settings fully scrollable and reduce preview' || true
          rm -f .github/workflows/news-preview-fit.yml
          git add .github/workflows/news-preview-fit.yml
          git commit -m 'chore: remove temporary preview fit workflow' || true
          git push
