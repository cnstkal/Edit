name: Twitter profile spacing v3
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CSS
        run: |
          python3 -c "from pathlib import Path; p=Path('twitter-profile.html'); s=p.read_text(encoding='utf-8'); marker='TW_PROFILE_SPACING_V3'; patch='<style id=\"TW_PROFILE_SPACING_V3\">.tw-action-icons{width:100%!important;max-width:none!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:0!important;align-items:center!important;justify-items:center!important}.tw-action-icons>.tw-action{width:100%!important;display:flex!important;justify-content:center!important;align-items:center!important;margin:0!important}.tw-action-icons>.tw-bookmark-share-group{width:100%!important;display:flex!important;justify-content:flex-end!important;align-items:center!important;gap:8px!important;margin:0!important}.tw-action-icons>.tw-bookmark-share-group .tw-action{width:auto!important;min-width:20px!important}.tw-action-icons img.tw-supplied-action-icon{width:20px!important;height:20px!important;object-fit:contain!important}.tw-action-icons>.tw-action img.tw-supplied-action-icon{filter:drop-shadow(.3px 0 0 #536471) drop-shadow(-.3px 0 0 #536471)!important}.tw-action-icons>.tw-bookmark-share-group img.tw-supplied-action-icon{filter:none!important}</style>'; s=s if marker in s else s.replace('</head>',patch+'</head>',1); p.write_text(s,encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add twitter-profile.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: align Twitter profile action icons"
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-twitter-profile-spacing-v3.yml
          git add .github/workflows/fix-twitter-profile-spacing-v3.yml
          git diff --cached --quiet || git commit -m "chore: remove temporary Twitter spacing workflow"
          git push || true
