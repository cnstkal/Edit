name: Common editor chrome sync
on:
  push:
    branches: [main]
    paths: ['.editor-common-chrome-trigger']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one fixed editor chrome
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['news-editor.html','dispatch-editor.html','kakao.html','kakao2.html','kakao-profile.html','twitter-post.html','twitter-profile.html']
          css=r'''<style id="EDITOR_COMMON_CHROME_FIXED_V1">
          .top{height:64px!important;min-height:64px!important;width:100%!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:0 24px!important;margin:0!important;background:#fffdf9!important;border-bottom:1px solid #ddd7cc!important;z-index:100!important}
          .top a,.top .home,.top .unified-home{position:absolute!important;left:20px!important;right:auto!important;top:10px!important;height:44px!important;min-width:82px!important;padding:0 14px!important;display:flex!important;align-items:center!important;justify-content:center!important;border:1px solid #d8d4ce!important;border-radius:11px!important;background:#fff!important;color:#4b4948!important;text-decoration:none!important;font-size:13px!important;font-weight:700!important;line-height:1!important;box-shadow:none!important}
          .top h1{margin:0!important;font-size:18px!important;font-weight:750!important;color:#222!important;line-height:1!important}
          .top .editor-save-wrap{position:absolute!important;right:20px!important;top:10px!important;height:44px!important;display:flex!important;align-items:center!important}
          .top .editor-save-wrap button,.top .editor-save-wrap .save,.top .editor-save-wrap #save,.top .editor-save-wrap #savePng{width:190px!important;height:44px!important;margin:0!important;border:0!important;border-radius:11px!important;background:#4b4948!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:14px!important;font-weight:750!important;line-height:1!important}
          .layout{width:100%!important;max-width:none!important;box-sizing:border-box!important}
          .settings{box-sizing:border-box!important;background:#fffdf9!important;border:1px solid #dedbd6!important;border-radius:16px!important;box-shadow:none!important;overflow-y:auto!important;overflow-x:hidden!important}
          .settings>.section:last-of-type{margin-bottom:0!important}
          .settings .editor-reset-fixed{width:100%!important;height:44px!important;margin:18px 0 0!important;border:1px solid #d8d4ce!important;border-radius:11px!important;background:#fff!important;color:#333!important;font-weight:700!important}
          .preview-wrap .toolbar:has(#reset),.preview .toolbar:has(#reset){display:none!important}
          @media(max-width:900px){
            .top{height:58px!important;min-height:58px!important;padding:0 10px!important}
            .top a,.top .home,.top .unified-home{left:10px!important;top:9px!important;height:40px!important;min-width:72px!important;font-size:12px!important}
            .top .editor-save-wrap{right:10px!important;top:9px!important;height:40px!important}
            .top .editor-save-wrap button,.top .editor-save-wrap .save,.top .editor-save-wrap #save,.top .editor-save-wrap #savePng{width:130px!important;height:40px!important;font-size:12px!important}
            .settings{border-radius:14px!important}
          }
          </style>'''
          js=r'''<script id="EDITOR_COMMON_CHROME_FIXED_JS">
          (()=>{
            const q=(s,r=document)=>r.querySelector(s);
            const qa=(s,r=document)=>Array.from(r.querySelectorAll(s));
            function fixed(){
              const top=q('.top'); if(!top)return;
              const home=qa('.top a,.top .home,.top .unified-home',top)[0];
              if(home){home.textContent='홈으로';home.classList.add('unified-home');}
              let save=qa('button,a',document).find(x=>((x.textContent||'').replace(/\\s/g,'').includes('PNG로저장'))||x.id==='save'||x.id==='savePng');
              if(save){let wrap=q('.editor-save-wrap',top);if(!wrap){wrap=document.createElement('div');wrap.className='editor-save-wrap';top.appendChild(wrap)}wrap.appendChild(save);save.textContent='PNG로 저장';}
              const settings=q('.settings');
              if(settings){
                let reset=qa('button',document).find(x=>((x.textContent||'').includes('기본값 복원')));
                if(reset){reset.classList.add('editor-reset-fixed');settings.appendChild(reset);}
                const preview=q('.preview-wrap,.preview');
                if(preview && window.matchMedia('(min-width:901px)').matches){
                  settings.style.height=Math.max(0,preview.scrollHeight)+'px';
                }else if(settings){settings.style.height='auto';}
              }
            }
            window.addEventListener('DOMContentLoaded',fixed);window.addEventListener('load',fixed);window.addEventListener('resize',fixed);setTimeout(fixed,250);setTimeout(fixed,1000);
          })();
          </script>'''
          for fn in files:
            p=Path(fn)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            if 'EDITOR_COMMON_CHROME_FIXED_V1' in s: continue
            s=s.replace('</head>',css+js+'</head>')
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .editor-common-chrome-trigger .github/workflows/editor-common-chrome.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-editor.html dispatch-editor.html kakao.html kakao2.html kakao-profile.html twitter-post.html twitter-profile.html .editor-common-chrome-trigger .github/workflows/editor-common-chrome.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: unify editor topbar and bounded settings panel'
          git push
