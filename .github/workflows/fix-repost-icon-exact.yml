name: Fix Twitter repost icon exact
on:
  push:
    paths:
      - '.github/workflows/fix-repost-icon-exact.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repost icon with exact two-arrow shape
        run: |
          python - <<'PY'
          from pathlib import Path
          old='M6 7h12m0 0-3-3m3 3-3 3M18 17H6m0 0 3-3m-3 3 3 3'
          new='M7 7h11v2l3-3-3-3v2H7c-1.1 0-2 .9-2 2v4h2V7zm10 10H6v-2l-3 3 3 3v-2h11c1.1 0 2-.9 2-2v-4h-2v4c0 .55-.45 1-1 1z'
          for name in ['twitter.html','twitter-profile.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html twitter-profile.html
          git diff --cached --quiet || git commit -m 'Use exact two-arrow repost icon'
          git push
