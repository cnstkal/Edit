name: Dispatch mobile UI fix
on:
  push:
    paths:
      - '.github/workflows/dispatch-mobile-ui-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dispatch mobile styles
        shell: python
        run: |
          from pathlib import Path
          p=Path('dispatch-editor.html')
          s=p.read_text(encoding='utf-8')
          marker='/* DISPATCH_MOBILE_UI_FIX_V2 */'
          if marker not in s:
              css='''\n<style>\n/* DISPATCH_MOBILE_UI_FIX_V2 */\n@media(max-width:800px){\n  .stage:not(.pc-frame) .brand-row{height:78px;justify-content:flex-start!important}\n  .stage:not(.pc-frame) .brand-row .logo{left:0!important;transform:none!important;width:220px!important;height:68px!important;object-position:left center!important}\n  .stage:not(.pc-frame) .nav{width:720px!important;margin-left:0!important;justify-content:flex-start!important;gap:42px!important;font-size:22px!important;height:54px!important;overflow:visible!important}\n  .stage:not(.pc-frame) .nav span{padding-bottom:8px!important}\n  .stage:not(.pc-frame) .pc-main{padding:34px 3% 52px!important}\n  .stage:not(.pc-frame) .article-head{padding-bottom:12px!important;margin-bottom:24px!important;border-bottom:1px solid #d8d8d8!important;width:94%!important}\n  .stage:not(.pc-frame) .title{font-size:38px!important;line-height:1.22!important;margin-bottom:12px!important;font-weight:550!important}\n  .stage:not(.pc-frame) .date{font-size:16px!important;margin-bottom:0!important;color:#999!important}\n  .stage:not(.pc-frame) .body{font-size:21px!important;line-height:1.82!important}\n  .stage:not(.pc-frame) .body p{margin-bottom:28px!important}\n}\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          else:
              print('already patched')
      - name: Update cache version
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('dispatch-editor.html?dispatch=1&v=20260910j','dispatch-editor.html?dispatch=1&v=20260910k')
          p.write_text(s,encoding='utf-8')
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dispatch-editor.html index.html
          git commit -m 'fix: improve Dispatch mobile article layout' || true
          rm -f .github/workflows/dispatch-mobile-ui-fix.yml
          git add -A
          git commit -m 'chore: remove temporary Dispatch UI workflow' || true
          git push
