name: Unify news editor layout
on:
  workflow_dispatch:
  push:
    paths:
      - '.news-layout-unify-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual-only layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('news-editor.html')
          s=p.read_text(encoding='utf-8')
          marker='/* NEWS_EDITOR_UNIFIED_LAYOUT_V1 */'
          if marker not in s:
              css=r'''<style>
          /* NEWS_EDITOR_UNIFIED_LAYOUT_V1 */
          html,body{background:#f5f3ee!important;color:#171717}
          body{padding:0 14px 34px!important}
          .top{width:100%!important;max-width:none!important;height:92px!important;margin:0!important;padding:0 28px!important;border-bottom:1px solid #e2dfda!important;background:#fbfaf7!important;display:flex!important;align-items:center!important;justify-content:space-between!important}
          .top:after{content:'PNG로 저장';display:flex;align-items:center;justify-content:center;width:235px;height:54px;border-radius:12px;background:#4b4948;color:#fff;font-size:17px;font-weight:650;order:3}
          .top:before{content:'↶   ↷';position:absolute;left:50%;transform:translateX(-50%);font-size:30px;letter-spacing:18px;color:#b9b7b4;white-space:nowrap;pointer-events:none}
          .top button{width:72px!important;height:52px!important;padding:0!important;border:1px solid #d9d6d1!important;border-radius:12px!important;background:#fff!important;color:#555!important;font-size:0!important;position:relative;z-index:1}
          .top button:after{content:'⌂';font-size:28px;line-height:1;color:#555}
          .layout{width:100%!important;max-width:none!important;margin:0!important;display:grid!important;grid-template-columns:minmax(0,2fr) minmax(420px,520px)!important;gap:0!important;align-items:stretch!important;min-height:calc(100vh - 92px)!important}
          .preview{grid-column:1!important;grid-row:1!important;min-width:0!important;padding:28px 14px 22px 0!important;display:flex!important;flex-direction:column!important}
          .previewSticky{position:sticky!important;top:16px!important;width:100%!important}
          .tools{background:#fffdfa!important;border:1px solid #ddd9d3!important;border-radius:12px!important;box-shadow:0 1px 5px #7771!important;padding:10px 14px!important;margin:0 0 12px!important;min-height:54px!important}
          .tools select{height:38px!important;border-radius:9px!important}
          .zoom{gap:6px!important}
          .zoom button{height:38px!important;min-width:38px!important;border-radius:9px!important}
          .zoom input{height:28px!important}
          .stage{width:100%!important;max-width:none!important;height:auto!important;aspect-ratio:16/10!important;margin:0!important;padding:12px!important;border:1px solid #d8d4ce!important;border-radius:12px!important;background:#e2ded6!important;box-shadow:none!important}
          .settings{grid-column:2!important;grid-row:1!important;width:100%!important;max-width:none!important;height:calc(100vh - 92px)!important;overflow:auto!important;padding:28px 12px 30px 18px!important;border-left:1px solid #dedad4!important;background:#fbfaf7!important;justify-self:stretch!important}
          .settings:before{content:'설정';display:block;font-size:26px;font-weight:750;margin:0 0 18px 2px;color:#202020}
          .card{background:#fffdfa!important;border:1px solid #ddd9d3!important;border-radius:14px!important;box-shadow:0 1px 5px #7771!important;padding:18px 18px 20px!important;margin-bottom:14px!important}
          .cardHead h2{font-size:17px!important}
          .hint{font-size:10px!important}
          input,textarea,select{border-color:#dedad5!important;border-radius:9px!important;background:#fff!important}
          .actions{margin-bottom:10px!important}
          @media(min-width:901px){
            .layout{grid-template-columns:minmax(0,1fr) minmax(420px,500px)!important}
          }
          @media(max-width:900px){
            body{padding:0 8px 28px!important}
            .top{height:76px!important;padding:0 14px!important}
            .top:before{display:none}
            .top:after{width:120px;height:42px;font-size:13px}
            .top button{width:54px!important;height:42px!important}
            .top button:after{font-size:24px}
            .layout{display:flex!important;flex-direction:column!important;min-height:0!important}
            .preview{order:1!important;padding:12px 0 0!important}
            .settings{order:2!important;height:auto!important;overflow:visible!important;border-left:0!important;padding:22px 0 0!important;background:transparent!important}
            .settings:before{font-size:23px;margin-bottom:14px}
            .stage{aspect-ratio:9/16!important}
          }
          </style>'''
              s=s.replace('</head>',css+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-editor.html
          git diff --cached --quiet || git commit -m 'style: unify news editor layout'
          git push
          rm -f .github/workflows/news-layout-unify.yml .news-layout-unify-trigger
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary news layout workflow'
          git push
