name: Fix Twitter UI v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-twitter-ui-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested Twitter fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # POST: connect the six supplied WebP icons and swap to the supplied filled files
          # when an action is active. This removes the built-in SVG icon layer.
          p=Path('twitter-post.html')
          s=p.read_text(encoding='utf-8')
          block=r'''
          <style id="TWITTER_POST_USER_ICONS_FINAL_20260912">
          .actions .act{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:3px!important}
          .actions .act .ico,.actions .act svg{display:none!important}
          .actions .act img.tw-user-action-icon{display:block!important;width:20px!important;height:20px!important;object-fit:contain!important;flex:0 0 20px!important}
          </style>
          <script id="TWITTER_POST_USER_ICONS_FINAL_20260912_JS">
          (()=>{
            const normal=['twitter-reply.webp','twitter-repost.webp','twitter-like.webp','twitter-views.webp','twitter-bookmark.webp','twitter-share.webp'];
            const filled={1:'twitter-repost-filled.webp',2:'twitter-like-filled.webp',4:'twitter-bookmark-filled.webp'};
            function apply(){
              document.querySelectorAll('.actions').forEach(row=>{
                const acts=[...row.children].filter(x=>x.classList.contains('act'));
                acts.slice(0,6).forEach((a,i)=>{
                  let img=a.querySelector('img.tw-user-action-icon');
                  const active=a.classList.contains('active-repost')||a.classList.contains('active-like')||a.classList.contains('active-bookmark');
                  const file=active&&filled[i]?filled[i]:normal[i];
                  if(!img){img=document.createElement('img');img.className='tw-user-action-icon';img.alt='';a.insertBefore(img,a.firstChild)}
                  const wanted='이미지/'+file;
                  if(img.getAttribute('src')!==wanted) img.src=wanted;
                  a.querySelectorAll('svg,.ico').forEach(n=>n.style.display='none');
                });
              });
            }
            window.addEventListener('DOMContentLoaded',apply);window.addEventListener('load',apply);setTimeout(apply,300);
            new MutationObserver(apply).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
          })();
          </script>
          '''
          # Remove earlier supplied-icon final layers so this one is authoritative.
          s=re.sub(r'<style id="TWITTER_POST_(?:SUPPLIED_ICONS_FINAL_V1|USER_ICONS_FINAL_[^"]+)">.*?</style>\s*<script id="TWITTER_POST_(?:SUPPLIED_ICONS_FINAL_V1|USER_ICONS_FINAL_[^"]+)_JS">.*?</script>\s*','',s,flags=re.S)
          s=s.replace('</head>',block+'\n</head>',1)
          p.write_text(s,encoding='utf-8')

          # PROFILE: remove the X mark beside each post, then make the first four actions
          # evenly distributed and treat bookmark+share as one combined fifth unit.
          p=Path('twitter-profile.html')
          s=p.read_text(encoding='utf-8')
          block=r'''
          <style id="TWITTER_PROFILE_ACTION_LAYOUT_FINAL_20260912">
          .tw-x{display:none!important}
          .tw-action-icons{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1fr)!important;align-items:center!important;width:100%!important;gap:0!important}
          .tw-action-icons>.tw-action{min-width:0!important;width:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;margin:0!important}
          .tw-action-icons>.tw-bookmark-share-group{grid-column:5!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;width:100%!important}
          .tw-action-icons>.tw-bookmark-share-group>.tw-action{width:auto!important;min-width:20px!important;margin:0!important}
          </style>
          <script id="TWITTER_PROFILE_ACTION_LAYOUT_FINAL_20260912_JS">
          (()=>{
            function apply(){
              document.querySelectorAll('.tw-x').forEach(n=>n.remove());
              document.querySelectorAll('.tw-action-icons').forEach(row=>{
                let group=row.querySelector(':scope > .tw-bookmark-share-group');
                const acts=[...row.children].filter(x=>x.classList.contains('tw-action'));
                if(!group && acts.length>=6){
                  group=document.createElement('div');group.className='tw-bookmark-share-group';
                  row.appendChild(group); group.appendChild(acts[4]); group.appendChild(acts[5]);
                }
                row.style.display='grid';row.style.gridTemplateColumns='repeat(4,minmax(0,1fr)) minmax(0,1fr)';row.style.gap='0';
                [...row.children].filter(x=>x.classList.contains('tw-action')).forEach((a,i)=>{a.style.gridColumn=String(i+1);a.style.margin='0';a.style.width='100%'});
                if(group){group.style.gridColumn='5';group.style.display='flex';group.style.alignItems='center';group.style.justifyContent='center';group.style.gap='8px';group.style.width='100%';group.querySelectorAll(':scope > .tw-action').forEach(a=>{a.style.gridColumn='auto';a.style.width='auto';a.style.margin='0'})}
              });
            }
            window.addEventListener('DOMContentLoaded',apply);window.addEventListener('load',apply);setTimeout(apply,300);
            new MutationObserver(apply).observe(document.documentElement,{subtree:true,childList:true});
          })();
          </script>
          '''
          s=re.sub(r'<style id="TWITTER_PROFILE_ACTION_LAYOUT_FINAL_[^"]+">.*?</style>\s*<script id="TWITTER_PROFILE_ACTION_LAYOUT_FINAL_[^"]+_JS">.*?</script>\s*','',s,flags=re.S)
          s=s.replace('</head>',block+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit requested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twitter-post.html twitter-profile.html
          git diff --cached --quiet && { echo "NO_CHANGES"; exit 0; }
          git commit -m "fix: connect Twitter icons and refine profile actions"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-twitter-ui-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-twitter-ui-v2.yml
          git diff --cached --quiet || git commit -m "chore: remove temporary Twitter UI v2 workflow"
          git push || true
