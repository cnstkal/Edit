name: Fix Dispatch Preview Controls
on:
  push:
    paths:
      - '.github/workflows/fix-dispatch-preview-controls.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update preview controls
        run: |
          python - <<'PY'
          p='dispatch.html'
          s=open(p,encoding='utf-8').read()
          old='''.preview-tools{background:#fffdf9;border:1px solid #ddd7cc;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-bottom:10px}.preview-tools b{font-size:12px}.preview-tools .mode{border:1px solid #d8d1c6;background:#fffdf9;border-radius:10px;padding:8px 10px;font-size:11px}.preview-tools .mode{border:1px solid #d8d1c6;background:#fffdf9;border-radius:10px;padding:8px 10px;font-size:11px}.zoom{display:flex;align-items:center;gap:5px;margin-left:auto}.zoom button{min-width:34px;padding:7px;border:1px solid #ddd6ca;background:#fffdf9;border-radius:8px}.zoom input{width:130px}.zoom span{font-size:11px;color:#888}'''
          new='''.preview-tools{background:#fffdf9;border:2px solid #ddd7cc;border-radius:24px;padding:16px 20px;display:flex;align-items:center;gap:12px;margin-bottom:10px;box-shadow:0 2px 8px #7771}.preview-tools b{font-size:15px}.preview-tools .mode{border:2px solid #d8d1c6;background:#fffdf9;border-radius:20px;padding:14px 22px;font-size:18px;min-height:58px}.zoom{display:flex;align-items:center;gap:12px;margin-left:auto;flex:1}.zoom button{min-width:58px;height:58px;padding:7px;border:2px solid #ddd6ca;background:#fffdf9;border-radius:20px;font-size:28px;line-height:1;color:#2d8fe8}.zoom input{width:auto;flex:1;min-width:100px;accent-color:#2d8fe8}.zoom span{font-size:18px;color:#777;min-width:48px;text-align:right}.zoom input[type=range]{height:6px}'''
          if old not in s:
              raise SystemExit('target CSS not found')
          s=s.replace(old,new,1)
          old2='<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">'
          new2='<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">'
          s=s.replace(old2,new2,1)
          marker='</style>\n<style id="no-input-zoom">'
          if marker in s and 'touch-action:pan-x pan-y' not in s:
              s=s.replace(marker,'.preview-tools,.preview-tools *{touch-action:manipulation}\n</style>\n<style id="no-input-zoom">',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dispatch.html
          git commit -m 'Improve Dispatch preview zoom controls'
          git push
