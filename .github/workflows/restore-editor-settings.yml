name: Restore editor settings
on:
  push:
    paths:
      - '.github/workflows/restore-editor-settings.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and clean editor files
        shell: python
        run: |
          import re, subprocess
          base='3294803f25468fd3c96a3437fd18c3fbaa9a14e9'
          subprocess.run(['git','checkout',base,'--','news-editor.html','dispatch-editor.html'],check=True)
          for path in ['news-editor.html','dispatch-editor.html']:
              text=open(path,encoding='utf-8').read()
              text=re.sub(r'<!-- SIMPLE_EDITOR_FIELDS_V1 -->.*?(?=<!-- DISPATCH_MOBILE_916_STABLE_V4 -->|</body>)','',text,flags=re.S)
              open(path,'w',encoding='utf-8').write(text)
      - name: Commit cleaned editors
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add news-editor.html dispatch-editor.html
          git commit -m "fix: restore full news and dispatch editor settings"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/restore-editor-settings.yml
          git commit -m "chore: remove temporary restore workflow"
          git push