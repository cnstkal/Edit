name: Fix Twitter Gap
on:
  push:
    paths:
      - '.github/workflows/fix-twitter-gap.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gap
        run: |
          python - <<'PY'
          p='twitter.html'
          s=open(p,encoding='utf-8').read()
          old='grid-template-columns:repeat(4,minmax(0,1fr)) 18px 21px'
          new='grid-template-columns:repeat(4,minmax(0,1fr)) 24px 30px'
          if old not in s:
              raise SystemExit('target CSS not found')
          s=s.replace(old,new,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html
          git commit -m 'Adjust Twitter bookmark share spacing'
          git push
