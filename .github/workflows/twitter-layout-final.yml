name: Twitter editor layout finalization
on:
  push:
    branches: [main]
    paths: ['.twitter-layout-final-trigger']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize Twitter editor layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css='''<style id="TWITTER_EDITOR_LAYOUT_FINAL_V1">
          .layout{width:100%!important;max-width:none!important;margin:0!important;display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:0!important;align-items:start!important}
          .layout>.stage,.layout>.preview-wrap,.layout>.preview{grid-column:1!important;grid-row:1!important;width:100%!important;min-width:0!important}
          .layout>.settings,.layout>.section,.layout>button.save{grid-column:2!important;width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important}
          .layout>.settings{grid-row:1!important;padding:24px 28px 70px!important;border-left:1px solid #ddd9d3!important;background:#f5f3ee!important}
          .layout>.section{grid-row:auto!important;border-radius:14px!important;margin:0 28px 14px!important;width:calc(100% - 56px)!important}
          .layout>button.save{grid-row:auto!important;margin:0 28px 50px!important;width:calc(100% - 56px)!important;height:44px!important}
          .top a,.top .home{left:28px!important;right:auto!important;top:12px!important;height:44px!important;min-width:76px!important;border:1px solid #d8d4ce!important;border-radius:11px!important;background:#fff!important;color:#4d4b49!important;display:flex!important;align-items:center!important;justify-content:center!important;text-decoration:none!important;font-size:13px!important;font-weight:700!important}
          .top #savePng,.top #save,.top .save{width:190px!important;height:44px!important;margin:0!important;border:0!important;border-radius:11px!important;background:#4b4948!important;color:#fff!important;font-size:14px!important;font-weight:750!important;display:flex!important;align-items:center!important;justify-content:center!important}
          @media(max-width:900px){.layout{display:flex!important;flex-direction:column!important}.layout>.stage,.layout>.preview-wrap,.layout>.preview{order:1!important;width:100%!important}.layout>.settings,.layout>.section,.layout>button.save{order:2!important;width:100%!important;margin:0 0 14px!important}.layout>.settings{padding:20px 8px 50px!important;border-left:0!important}.layout>.section{width:100%!important}.layout>button.save{width:calc(100% - 16px)!important;margin:0 8px 40px!important}.top a,.top .home{left:10px!important;top:10px!important;height:40px!important;min-width:68px!important;font-size:12px!important}.top #savePng,.top #save,.top .save{width:125px!important;height:40px!important;font-size:12px!important}}
          </style>'''
          js='''<script id="TWITTER_EDITOR_LAYOUT_FINAL_JS">(()=>{function f(){const t=document.querySelector('.top');if(!t)return;let h=t.querySelector('a,.home');if(h)h.textContent='홈으로';let b=document.querySelector('#savePng,#save');if(b){b.textContent='PNG로 저장';let r=t.querySelector('.top-right');if(!r){r=document.createElement('div');r.className='top-right';t.appendChild(r)}if(!r.contains(b))r.appendChild(b)}}window.addEventListener('DOMContentLoaded',f);window.addEventListener('load',f);setTimeout(f,250)})();</script>'''
          for fn in ['twitter-post.html','twitter-profile.html']:
              p=Path(fn);s=p.read_text(encoding='utf-8')
              if 'TWITTER_EDITOR_LAYOUT_FINAL_V1' not in s:
                  s=s.replace('</head>',css+js+'</head>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f .twitter-layout-final-trigger .github/workflows/twitter-layout-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter-post.html twitter-profile.html .twitter-layout-final-trigger .github/workflows/twitter-layout-final.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: finalize Twitter editor layout'
          git push
