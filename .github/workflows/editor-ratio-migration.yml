name: Editor ratio migration
on:
  push:
    paths:
      - '.editor-ratio-migration-trigger'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply strict PC/mobile ratio rules
        run: python -c "import base64;exec(base64.b64decode(' '))"
      - name: Remove temporary migration files
        run: |
          rm -f .editor-ratio-migration-trigger .github/workflows/editor-ratio-migration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: enforce distinct PC and mobile preview ratios" || true
          git push
