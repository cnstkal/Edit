name: Final editor UI sync
on:
  push:
    branches: [main]
    paths: ['.editor-ui-final-sync-trigger']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify editor chrome and Twitter layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['news-editor.html','dispatch-editor.html','kakao2.html','kakao-profile.html','twitter-post.html','twitter-profile.html']
          css=r'''
          <style id="EDITOR_CHROME_UNIFIED_V3">
          html,body{background:#f5f3ee!important}
          body{padding:0!important}
          .top{position:relative!important;height:68px!important;min-height:68px!important;width:100%!important;max-width:none!important;margin:0!important;padding:0 28px!important;background:#fbfaf7!important;border-bottom:1px solid #e2dfda!important;display:flex!important;align-items:center!important;justify-content:center!important;z-index:20!important}
          .top a,.top .home{position:absolute!important;left:28px!important;top:12px!important;height:44px!important;min-width:76px!important;padding:0 15px!important;display:flex!important;align-items:center!important;justify-content:center!important;border:1px solid #d8d4ce!important;border-radius:11px!important;background:#fff!important;color:#4d4b49!important;text-decoration:none!important;font-size:13px!important;font-weight:700!important;line-height:1!important}
          .top h1{margin:0!important;font-size:18px!important;font-weight:750!important;color:#222!important}
          .top .brand{display:none!important}
          .top .top-right{position:absolute!important;right:28px!important;top:12px!important;display:flex!important;align-items:center!important;gap:8px!important}
          .top #savePng,.top #save,.top .save{width:190px!important;height:44px!important;margin:0!important;border:0!important;border-radius:11px!important;background:#4b4948!important;color:#fff!important;font-size:14px!important;font-weight:750!important;display:flex!important;align-items:center!important;justify-content:center!important}
          .top .save{position:absolute!important;right:0!important;top:0!important}
          .layout{width:100%!important;max-width:none!important;margin:0!important;display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:0!important;align-items:start!important}
          .preview-wrap,.preview{grid-column:1!important;grid-row:1!important;width:100%!important;min-width:0!important;padding:24px 28px!important;margin:0!important;display:flex!important;flex-direction:column!important;align-items:center!important}
          .settings,.panel{grid-column:2!important;grid-row:1!important;width:100%!important;max-width:none!important;margin:0!important;padding:24px 28px 70px!important;border:0!important;border-left:1px solid #ddd9d3!important;border-radius:0!important;background:#f5f3ee!important;box-shadow:none!important}
          .preview-tools,.tools,.toolbar{width:min(100%,760px)!important;max-width:760px!important;margin:0 auto 12px!important}
          .preview-tools{padding:8px 12px!important;border-radius:12px!important;min-height:52px!important}
          .preview-tools .mode{min-height:36px!important;height:36px!important;padding:0 11px!important;border-radius:9px!important;font-size:12px!important}
          .preview-tools .zoom{gap:6px!important}
          .preview-tools .zoom button{min-width:36px!important;height:36px!important;border-radius:9px!important;font-size:18px!important}
          .preview-tools .zoom span{font-size:11px!important;min-width:34px!important}
          .stage-wrap{width:min(100%,920px)!important;margin:0 auto!important}
          .stage{margin-left:auto!important;margin-right:auto!important}
          .settings .section,.panel .group,.settings .group,.panel .section{width:100%!important;max-width:none!important}
          .settings>h2,.panel>h2{margin-top:0!important}
          @media(max-width:900px){
            .top{height:60px!important;min-height:60px!important;padding:0 10px!important}
            .top a,.top .home{left:10px!important;top:10px!important;height:40px!important;min-width:68px!important;padding:0 12px!important;font-size:12px!important}
            .top #savePng,.top #save,.top .save{width:125px!important;height:40px!important;font-size:12px!important}
            .top .top-right{right:10px!important;top:10px!important}
            .layout{display:flex!important;flex-direction:column!important}
            .preview-wrap,.preview{order:1!important;width:100%!important;padding:12px 8px 0!important}
            .settings,.panel{order:2!important;width:100%!important;padding:20px 8px 50px!important;border-left:0!important}
            .stage-wrap{width:100%!important}
          }
          </style>
          '''
          js=r'''
          <script id="EDITOR_CHROME_UNIFIED_V3_JS">
          (()=>{function moveSave(){const top=document.querySelector('.top');if(!top)return;const btn=document.querySelector('#savePng,#save');if(!btn)return;if(!top.contains(btn)){let box=top.querySelector('.top-right');if(!box){box=document.createElement('div');box.className='top-right';top.appendChild(box)}box.appendChild(btn)}btn.textContent='PNG로 저장';btn.style.display='flex'}function home(){const top=document.querySelector('.top');if(!top)return;let a=top.querySelector('a,.home');if(!a)return;a.textContent='홈으로';a.classList.add('unified-home')}function run(){moveSave();home()}window.addEventListener('DOMContentLoaded',run);window.addEventListener('load',run);setTimeout(run,300)})();
          </script>
          '''
          for fn in files:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              if 'EDITOR_CHROME_UNIFIED_V3' in s: continue
              s=s.replace('</head>',css+js+'</head>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f .editor-ui-final-sync-trigger .github/workflows/editor-ui-final-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-editor.html dispatch-editor.html kakao2.html kakao-profile.html twitter-post.html twitter-profile.html .editor-ui-final-sync-trigger .github/workflows/editor-ui-final-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: unify editor home and save controls'
          git push
