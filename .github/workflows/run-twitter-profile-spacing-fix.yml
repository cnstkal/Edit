name: Twitter profile spacing fix
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix-twitter-profile-spacing.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 tools/fix-twitter-profile-spacing.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add twitter-profile.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: align Twitter profile action icons"
          git push
      - name: Cleanup
        if: always()
        run: |
          rm -f tools/fix-twitter-profile-spacing.py .github/workflows/run-twitter-profile-spacing-fix.yml .github/workflows/fix-twitter-profile-spacing.yml .github/workflows/fix-twitter-profile-spacing-v2.yml .github/workflows/fix-twitter-profile-spacing-v3.yml
          git add -A tools/fix-twitter-profile-spacing.py .github/workflows/run-twitter-profile-spacing-fix.yml .github/workflows/fix-twitter-profile-spacing.yml .github/workflows/fix-twitter-profile-spacing-v2.yml .github/workflows/fix-twitter-profile-spacing-v3.yml
          git diff --cached --quiet || git commit -m "chore: remove temporary Twitter spacing files"
          git push || true
