name: Fix news comments
on:
  push:
    paths:
      - '.github/workflows/fix-news-comments.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and refresh news editor
        shell: bash
        run: |
          set -e
          grep -q 'commentsOn' news-editor.html
          grep -q 'addComment' news-editor.html
          grep -q 'pvComments' news-editor.html
          printf '\n<!-- NEWS_COMMENTS_V2 -->\n' >> news-editor.html
          sed -i "s/news-editor.html?v=20260910j/news-editor.html?v=20260910k/" index.html
      - name: Commit and clean workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-editor.html index.html .github/workflows/fix-news-comments.yml
          git commit -m 'fix: restore news comments editor' || exit 0
          git rm .github/workflows/fix-news-comments.yml
          git commit -m 'chore: remove temporary news fix workflow'
          git push
