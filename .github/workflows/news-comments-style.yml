name: News comments style
on:
  push:
    paths:
      - '.news-comments-style-trigger'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update comment fields and typography
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('news-editor.html')
          s=p.read_text(encoding='utf-8')
          if 'NEWS_COMMENTS_STYLE_V1' not in s:
              s=s.replace('</head>', '''<style>\n/* NEWS_COMMENTS_STYLE_V1 */\n.comments-editor input[placeholder*="댓글"],.comments-editor input[placeholder*="작성자"]{font-size:16px!important}\n.uname{font-size:12px!important}\n.ctext{font-size:11px!important;line-height:1.55!important}\n.ctime{font-size:10px!important}\n</style>\n</head>''')
          # Keep the comment editor wording compact and field-like.
          s=re.sub(r'placeholder="[^"]*(?:댓글|작성자)[^"]*"', 'placeholder="닉네임"', s)
          s=re.sub(r'placeholder="[^"]*시간[^"]*"', 'placeholder="시간"', s)
          s=re.sub(r'placeholder="[^"]*(?:댓글|본문|내용)[^"]*"', 'placeholder="내용"', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add news-editor.html
          git commit -m "fix: refine news comment fields and typography" || true
          git push
          rm -f .github/workflows/news-comments-style.yml .news-comments-style-trigger
          git add -A
          git commit -m "chore: remove temporary news comment workflow" || true
          git push || true
