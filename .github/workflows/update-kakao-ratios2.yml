name: patch Kakao ratios
on:
  push:
    paths:
      - '.github/workflows/update-kakao-ratios2.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kakao2.html')
          s=p.read_text()
          s=s.replace('<option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option>', '<option value="mobile">모바일 · 9:16</option><option value="2to3">모바일 · 2:3</option><option value="4to3">모바일 · 4:3</option><option value="pc">PC · 16:9</option>', 1)
          extra_css='''
          .nav{border-bottom:1px solid #d4d4d4}
          .chat{height:auto!important;min-height:1280px!important;overflow:visible!important;display:flex;flex-direction:column}
          .messages{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;flex:none;overflow:visible!important}
          .composer{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;flex:none;margin-top:auto}
          .chat.pc{width:1600px!important;height:auto!important;min-height:900px!important}
          .stage.ratio-2to3{aspect-ratio:2/3!important}
          .stage.ratio-4to3{aspect-ratio:4/3!important}
          .chat.ratio-2to3{width:720px!important;min-height:1080px!important}
          .chat.ratio-4to3{width:720px!important;min-height:540px!important}
          '''
          marker='</style>'
          if marker not in s: raise SystemExit('style target not found')
          s=s.replace(marker,extra_css+marker,1)
          js='''<script>
          (()=>{
            const m=document.getElementById('mode'),st=document.getElementById('stage'),ch=document.getElementById('chat');
            if(!m||!st||!ch)return;
            function applyKakaoRatio(){
              const v=m.value;
              st.classList.remove('pc-frame','ratio-2to3','ratio-4to3');
              ch.classList.remove('pc','ratio-2to3','ratio-4to3');
              if(v==='pc'){st.classList.add('pc-frame');ch.classList.add('pc')}
              else if(v==='2to3'){st.classList.add('ratio-2to3');ch.classList.add('ratio-2to3')}
              else if(v==='4to3'){st.classList.add('ratio-4to3');ch.classList.add('ratio-4to3')}
            }
            m.addEventListener('change',applyKakaoRatio);
            applyKakaoRatio();
          })();
          </script>\n</body>'''
          if '</body>' not in s: raise SystemExit('body target not found')
          s=s.replace('</body>',js,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao2.html
          git commit -m 'feat: add Kakao ratios and flexible chat height'
          git push
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/update-kakao-ratios.yml .github/workflows/update-kakao-ratios2.yml || true
          git commit -m 'chore: remove temporary ratio workflows' || true
          git push || true
