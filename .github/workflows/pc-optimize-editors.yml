name: PC optimize editors
on:
  push:
    paths:
      - '.github/workflows/pc-optimize-editors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop editor layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = r'''
          /* PC_EDITOR_OPTIMIZATION_V1 */
          @media (min-width: 1251px){
            .layout{width:min(1320px,calc(100% - 32px));grid-template-columns:minmax(460px,520px) minmax(640px,760px);gap:32px;align-items:start}
            .panel,.settings{width:100%;max-width:760px}
            .preview,.preview-wrap{width:100%;min-width:0}
            .previewSticky{width:100%}
            .stage{max-width:480px}
            .tools{width:100%;flex-wrap:nowrap}
            .preview-tools{width:100%;flex-wrap:nowrap}
            .zoom{min-width:0}
            .zoom input{min-width:120px}
          }
          @media (min-width: 901px) and (max-width: 1250px){
            .layout{width:min(1120px,calc(100% - 24px));grid-template-columns:minmax(360px,1fr) minmax(520px,760px);gap:22px}
            .panel,.settings{max-width:760px}
            .preview,.preview-wrap{min-width:0}
            .tools,.preview-tools{max-width:100%;}
          }
          @media (min-width: 901px){
            .panel{justify-self:stretch}
            .settings{justify-self:stretch}
            .card,.section{overflow:visible}
            input,textarea,select{max-width:100%;min-width:0}
          }
          @media (min-width: 1251px){
            .card{padding-left:22px;padding-right:22px}
            .group{min-width:0}
            .grid2,.grid3,.row{min-width:0}
            .field{min-width:0}
            .previewSticky{top:16px}
            .preview-tools{margin-bottom:12px}
            .stage-wrap{padding:12px}
          }
          @media (max-width: 1250px) and (min-width: 901px){
            .preview-tools{gap:8px;padding:12px 14px}
            .preview-tools .mode{padding:10px 14px;min-height:48px;font-size:15px}
            .preview-tools .zoom{gap:7px}
            .preview-tools .zoom button{min-width:44px;height:44px;font-size:22px}
            .preview-tools .zoom span{font-size:13px;min-width:38px}
          }
          '''
          for fn in ['kakao2.html','news2.html','dispatch.html']:
              p=Path(fn)
              s=p.read_text(encoding='utf-8')
              if 'PC_EDITOR_OPTIMIZATION_V1' not in s:
                  s=s.replace('</head>', '<style>\n'+css+'\n</style></head>', 1)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kakao2.html news2.html dispatch.html
          git rm .github/workflows/pc-optimize-editors.yml
          git commit -m "Optimize editor layouts for desktop"
          git push
