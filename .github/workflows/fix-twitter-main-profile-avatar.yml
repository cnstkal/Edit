name: Fix Twitter main profile avatar
on:
  push:
    paths:
      - '.github/workflows/fix-twitter-main-profile-avatar.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Twitter main
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('twitter.html')
          s=p.read_text(encoding='utf-8')
          css='''
          <style>
          /* Match the original Twitter feed geometry/icons */
          .twitter-head{height:13%;min-height:78px}
          .tabs{padding:0 10%;gap:30px}
          .tab{font-size:clamp(18px,4vw,25px);height:57%}
          .tab.active:after{height:5px;border-radius:4px}
          .tweet{padding:18px 18px 16px 78px;min-height:18.2%;font-size:14px}
          .avatar{left:18px;top:20px;width:48px;height:48px}
          .identity{gap:5px;padding-right:22px}
          .name{font-size:16px}
          .handle,.time{font-size:14px}
          .more{right:17px;top:20px;font-size:16px;letter-spacing:3px}
          .tweet-text{font-size:17px;line-height:1.38;margin-top:9px}
          .actions{grid-template-columns:1.05fr 1fr 1fr 1.15fr 1fr 1fr;margin-top:13px}
          .act{justify-content:center;gap:4px;font-size:13px}
          .ico{width:21px;height:21px;flex-basis:21px}
          .ico svg{width:20px;height:20px;stroke-width:1.7}
          @media(max-width:560px){.tweet{padding-left:72px}.tweet-text{font-size:16px}.actions{gap:0}.act{font-size:11px}.num{font-size:11px}.tab{font-size:18px}}
          </style>
          '''
          if '/* Match the original Twitter feed geometry/icons */' not in s:
              s=s.replace('</head>',css+'</head>',1)
          old="$('screen').style.background=S.theme==='black'?'#000':'#fff';$('feed').style.background='transparent';"
          new=old+"\nconst profileData=(()=>{try{return JSON.parse(localStorage.getItem('twitter-profile-v1')||'{}')}catch(e){return{}}})();\nconst profileAvatar=profileData.avatar||'';"
          if 'const profileAvatar=' not in s:
              s=s.replace(old,new,1)
          s=s.replace("(t.avatar?'<img class=\"avatar\" src=\"'+esc(t.avatar)+'\" alt=\"\">':'<div class=\"avatar\" aria-hidden=\"true\"></div>')", "((t.avatar||profileAvatar)?'<img class=\"avatar\" src=\"'+esc(t.avatar||profileAvatar)+'\" alt=\"\">':'<div class=\"avatar\" aria-hidden=\"true\"></div>')")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html
          git diff --cached --quiet || git commit -m 'Match original Twitter feed and use profile avatar'
          git push
