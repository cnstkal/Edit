name: twitter final stable
on:
  push:
    paths:
      - '.twitter-final-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Twitter from known stable base
        run: |
          git checkout 6ed63a4b354e8b18eae2c4f4aa842bd3ff7776bd -- twitter.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('twitter.html'); s=p.read_text()
          # Keep the stable UI refinement/photo implementation, but remove the later
          # action/4-photo observer layers that were added after the loading-loop fix.
          for marker in ['TWITTER_FINAL_ACTION_FIX_V3','TWITTER_ICON_LAYOUT_FILL_FIX_V4','TWITTER_FOUR_PHOTOS_V1']:
              s=re.sub(r'\n?<!-- '+re.escape(marker)+r' -->.*?(?=</body>)','',s,flags=re.S)
          patch=r'''
          <!-- TWITTER_ACTIVE_ICON_STABLE_V4 -->
          <style>
          .act.active-repost .tw-ui-icon{filter:brightness(0) saturate(100%) invert(55%) sepia(91%) saturate(1051%) hue-rotate(119deg) brightness(89%) contrast(101%)!important}
          .act.active-like .tw-ui-icon{filter:brightness(0) saturate(100%) invert(29%) sepia(93%) saturate(5486%) hue-rotate(323deg) brightness(101%) contrast(99%)!important}
          .act.active-bookmark .tw-ui-icon{filter:brightness(0) saturate(100%) invert(48%) sepia(96%) saturate(1855%) hue-rotate(184deg) brightness(96%) contrast(101%)!important}
          </style>
          '''
          s=s.replace('</body>',patch+'</body>')
          p.write_text(s)
          PY
          grep -q 'TWITTER_LOADING_LOOP_FIX_V1' twitter.html
          grep -q 'TWITTER_ACTIVE_ICON_STABLE_V4' twitter.html
          ! grep -q 'TWITTER_FOUR_PHOTOS_V1' twitter.html
          ! grep -q 'TWITTER_FINAL_ACTION_FIX_V3' twitter.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html
          git commit -m 'fix: restore Twitter loading stability' || true
          git push
      - name: Cleanup
        if: always()
        run: |
          git rm -f .github/workflows/twitter-final-stable.yml .twitter-final-trigger || true
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: remove temporary Twitter workflow' || true
          git push || true
