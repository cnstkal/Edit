name: Fix Twitter repost icon
on:
  push:
    paths:
      - '.github/workflows/fix-repost-icon.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repost SVG paths
        run: |
          python - <<'PY'
          from pathlib import Path
          old='M7 7h10l-3-3m3 3-3 3M17 17H7l3 3m-3-3 3-3'
          new='M6 7h12m0 0-3-3m3 3-3 3M18 17H6m0 0 3-3m-3 3 3 3'
          for name in ['twitter.html','twitter-profile.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if old in s:
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html twitter-profile.html
          git diff --cached --quiet || git commit -m 'Use correct Twitter repost icon'
          git push
