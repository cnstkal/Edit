name: Fix dispatch editor layout
on:
  push:
    branches: [main]
    paths: ['.dispatch-layout-fix-trigger']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact 50 50 editor layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dispatch-editor.html')
          s=p.read_text(encoding='utf-8')
          marker='DISPATCH_5050_LAYOUT_FINAL'
          if marker not in s:
              css='''\n<style id="DISPATCH_5050_LAYOUT_FINAL">\n@media(min-width:801px){\n  .layout{width:100%!important;max-width:none!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:0!important;align-items:start!important}\n  .layout>.preview-wrap{grid-column:1!important;width:100%!important;min-width:0!important;align-self:start!important;padding:28px 28px 22px 0!important}\n  .layout>.panel{grid-column:2!important;width:100%!important;max-width:none!important;justify-self:stretch!important;align-self:start!important;margin:0!important;border-radius:0!important;border-left:1px solid #dedad4!important;box-shadow:none!important;min-width:0!important}\n  .layout>.preview-wrap .preview-tools{width:min(100%,720px)!important;margin:0 auto 12px!important}\n  .layout>.preview-wrap .stage-wrap{width:100%!important;margin:0!important}\n}\n@media(max-width:800px){\n  .layout{width:100%!important;max-width:none!important}\n  .layout>.preview-wrap{width:100%!important;padding:10px 0 0!important}\n  .layout>.preview-wrap .preview-tools{width:100%!important;margin:0 auto 10px!important}\n  .layout>.preview-wrap .stage-wrap{width:100%!important;padding:6px!important}\n  .layout>.preview-wrap .stage.editor-mobile{width:min(520px,calc(100vw - 12px))!important;max-width:520px!important;margin:0 auto!important}\n}\n</style>\n'''
              s=s.replace('</head>',css+'</head>')
              p.write_text(s,encoding='utf-8')
          PY
          rm -f .dispatch-layout-fix-trigger .github/workflows/dispatch-layout-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dispatch-editor.html .dispatch-layout-fix-trigger .github/workflows/dispatch-layout-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make dispatch editor exactly 50 50'
          git push
