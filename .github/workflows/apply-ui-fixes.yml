name: Apply editor UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-ui-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('.')

          news = repo / 'news-editor.html'
          if news.exists():
              text = news.read_text(encoding='utf-8')
              marker = '<!-- NEWS_PNG_BUTTON_FIX_V1 -->'
              if marker not in text:
                  patch = r'''\n<!-- NEWS_PNG_BUTTON_FIX_V1 -->\n<style>\n.top .editor-save-wrap{position:absolute!important;right:28px!important;top:12px!important;height:44px!important;display:flex!important;align-items:center!important;z-index:30!important}\n.top .editor-save-wrap button,.top .editor-save-wrap .save,.top #newsSavePng{width:190px!important;height:44px!important;margin:0!important;padding:0!important;border:0!important;border-radius:11px!important;background:#4b4948!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:14px!important;font-weight:750!important;cursor:pointer!important}\n@media(max-width:900px){.top .editor-save-wrap{right:10px!important;top:10px!important;height:40px!important}.top .editor-save-wrap button,.top #newsSavePng{width:125px!important;height:40px!important;font-size:12px!important}}\n</style>\n<script id="NEWS_PNG_BUTTON_FIX_V1_JS">\n(()=>{\n  async function save(btn){\n    const el=document.querySelector('.stage,.screen,.preview-stage');\n    if(!el||!window.html2canvas){alert('PNG 저장을 준비하지 못했습니다.');return}\n    const old=btn.textContent;btn.disabled=true;btn.textContent='PNG 생성 중…';\n    try{\n      const w=el.scrollWidth||el.getBoundingClientRect().width;\n      const h=el.scrollHeight||el.getBoundingClientRect().height;\n      const scale=Math.min(4,8192/Math.max(w,h));\n      const canvas=await html2canvas(el,{scale:Math.max(2,scale),useCORS:true,allowTaint:false,backgroundColor:null,logging:false,imageTimeout:15000,windowWidth:Math.max(document.documentElement.clientWidth,w),windowHeight:Math.max(document.documentElement.clientHeight,h),scrollX:0,scrollY:-window.scrollY});\n      canvas.toBlob(blob=>{\n        if(!blob)throw new Error('PNG 생성 실패');\n        const a=document.createElement('a');a.download='news-editor.png';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);\n      },'image/png');\n    }catch(e){console.error(e);alert('PNG 저장에 실패했습니다.')}\n    finally{btn.disabled=false;btn.textContent=old}\n  }\n  function init(){\n    const top=document.querySelector('.top');if(!top)return;\n    let btn=document.querySelector('#savePng,#save,.save');\n    if(!btn){\n      btn=document.createElement('button');btn.id='newsSavePng';btn.type='button';btn.textContent='PNG로 저장';\n      let wrap=top.querySelector('.editor-save-wrap');\n      if(!wrap){wrap=document.createElement('div');wrap.className='editor-save-wrap';top.appendChild(wrap)}\n      wrap.appendChild(btn);\n    }else{\n      btn.textContent='PNG로 저장';\n      let wrap=top.querySelector('.editor-save-wrap');\n      if(!wrap){wrap=document.createElement('div');wrap.className='editor-save-wrap';top.appendChild(wrap)}\n      if(!wrap.contains(btn))wrap.appendChild(btn);\n    }\n    if(!btn.dataset.newsPngBound){btn.dataset.newsPngBound='1';btn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();save(btn)},true)}\n  }\n  window.addEventListener('DOMContentLoaded',init);window.addEventListener('load',init);setTimeout(init,300);\n})();\n</script>\n'''
                  text += patch
                  news.write_text(text, encoding='utf-8')

          targets = ['dispatch-editor.html','kakao.html','kakao2.html','kakao-profile.html']
          for name in targets:
              path = repo / name
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              marker = '<!-- HOME_BUTTON_LABEL_FIX_V1 -->'
              if marker in text:
                  continue
              patch = r'''\n<!-- HOME_BUTTON_LABEL_FIX_V1 -->\n<style>\n.top .home,.top a.home,.top #cancel,.top button.cancel,.top>a:first-child{font-size:13px!important;color:#4d4b49!important;text-indent:0!important}\n.top .home:before,.top .home:after,.top a.home:before,.top a.home:after,.top #cancel:before,.top #cancel:after,.top button.cancel:before,.top button.cancel:after,.top>a:first-child:before,.top>a:first-child:after{content:none!important;display:none!important}\n@media(max-width:900px){.top .home,.top a.home,.top #cancel,.top button.cancel,.top>a:first-child{font-size:12px!important}}\n</style>\n<script id="HOME_BUTTON_LABEL_FIX_V1_JS">\n(()=>{\n  function fix(){\n    document.querySelectorAll('.top').forEach(top=>{\n      const home=top.querySelector('.home,#cancel,button.cancel,a:first-child');\n      if(home){home.textContent='홈으로';home.setAttribute('aria-label','홈으로')}\n    });\n  }\n  window.addEventListener('DOMContentLoaded',fix);window.addEventListener('load',fix);setTimeout(fix,300);setTimeout(fix,1000);\n})();\n</script>\n'''
              text += patch
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-editor.html dispatch-editor.html kakao.html kakao2.html kakao-profile.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: add news PNG save button and home labels'
          git push
