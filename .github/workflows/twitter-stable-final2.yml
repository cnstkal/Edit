name: twitter stable final 2
on:
  push:
    paths:
      - '.twitter-stable-final2-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Twitter
        run: |
          git checkout 6ed63a4b354e8b18eae2c4f4aa842bd3ff7776bd -- twitter.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('twitter.html'); s=p.read_text()
          for marker in ['TWITTER_FINAL_ACTION_FIX_V3','TWITTER_ICON_LAYOUT_FILL_FIX_V4','TWITTER_FOUR_PHOTOS_V1']:
              s=re.sub(r'\n?<!-- '+re.escape(marker)+r' -->.*?(?=</body>)','',s,flags=re.S)
          patch='''\n<!-- TWITTER_ACTIVE_ICON_STABLE_V5 -->\n<style>\n.act.active-repost .tw-ui-icon{filter:brightness(0) saturate(100%) invert(55%) sepia(91%) saturate(1051%) hue-rotate(119deg) brightness(89%) contrast(101%)!important}\n.act.active-like .tw-ui-icon{filter:brightness(0) saturate(100%) invert(29%) sepia(93%) saturate(5486%) hue-rotate(323deg) brightness(101%) contrast(99%)!important}\n.act.active-bookmark .tw-ui-icon{filter:brightness(0) saturate(100%) invert(48%) sepia(96%) saturate(1855%) hue-rotate(184deg) brightness(96%) contrast(101%)!important}\n</style>\n'''
          s=s.replace('</body>',patch+'</body>')
          p.write_text(s)
          PY
          grep -q 'TWITTER_LOADING_LOOP_FIX_V1' twitter.html
          grep -q 'TWITTER_ACTIVE_ICON_STABLE_V5' twitter.html
          ! grep -q 'TWITTER_FOUR_PHOTOS_V1' twitter.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html
          git commit -m 'fix: make Twitter preview stable' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/twitter-stable-final2.yml .twitter-stable-final2-trigger 2>/dev/null || true
          git rm -f .github/workflows/twitter-stable-final2.yml .twitter-stable-final2-trigger || true
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: remove temporary Twitter stable workflow' || true
          git push origin HEAD:main || true
