name: Fix Kakao Profile UI
on:
  push:
    paths:
      - '.github/workflows/fix-profile-ui.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix profile preview structure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kakao-profile.html')
          s=p.read_text()
          old='''<div class="music"><img id="pvMusicImg"><div class="music-info"><div class="music-title" id="pvMusicTitle">여기에 음악 제목을 입력하세요.</div><div class="music-artist" id="pvMusicArtist">여기에 가수명을 입력하세요.</div></div><div class="play">▷</div></div></div><div class="profile-content">'''
          new='''<div class="music"><img id="pvMusicImg"><div class="music-info"><div class="music-title" id="pvMusicTitle">여기에 음악 제목을 입력하세요.</div><div class="music-artist" id="pvMusicArtist">여기에 가수명을 입력하세요.</div></div><div class="play">▷</div></div><div class="profile-content">'''
          if old not in s:
              raise SystemExit('profile structure target not found')
          s=s.replace(old,new,1)
          old_likes='''<div class="likes">♥ +<span id="pvLikes">196</span><div class="cup">☕</div></div>'''
          s=s.replace(old_likes,'',1)
          old_css='''.profile-content{position:relative;z-index:2;margin-top:auto;padding:0 38px 38px}'''
          new_css='''.profile-content{position:absolute;z-index:4;left:0;right:0;bottom:470px;padding:0 38px 38px}'''
          if old_css not in s:
              raise SystemExit('profile content css target not found')
          s=s.replace(old_css,new_css,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao-profile.html
          git commit -m 'fix: restore Kakao profile buttons and avatar layout'
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/fix-profile-ui.yml
          git commit -m 'chore: remove temporary profile UI workflow'
          git push
