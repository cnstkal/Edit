name: Fix Kakao Profile UI
on:
  push:
    paths:
      - '.github/workflows/fix-profile-ui.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch profile through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = 'kakao-profile.html';
            const { data } = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
            let s = Buffer.from(data.content, 'base64').toString('utf8');
            const oldStructure = '<div class="music"><img id="pvMusicImg"><div class="music-info"><div class="music-title" id="pvMusicTitle">여기에 음악 제목을 입력하세요.</div><div class="music-artist" id="pvMusicArtist">여기에 가수명을 입력하세요.</div></div><div class="play">▷</div></div></div><div class="profile-content">';
            const newStructure = '<div class="music"><img id="pvMusicImg"><div class="music-info"><div class="music-title" id="pvMusicTitle">여기에 음악 제목을 입력하세요.</div><div class="music-artist" id="pvMusicArtist">여기에 가수명을 입력하세요.</div></div><div class="play">▷</div></div><div class="profile-content">';
            if (!s.includes(oldStructure)) core.setFailed('profile structure target not found');
            else {
              s = s.replace(oldStructure, newStructure);
              s = s.replace('<div class="likes">♥ +<span id="pvLikes">196</span><div class="cup">☕</div></div>', '');
              s = s.replace('.profile-content{position:relative;z-index:2;margin-top:auto;padding:0 38px 38px}', '.profile-content{position:absolute;z-index:4;left:0;right:0;bottom:470px;padding:0 38px 38px}');
              const content = Buffer.from(s, 'utf8').toString('base64');
              await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, message: 'fix: restore Kakao profile buttons and avatar layout', content, sha: data.sha, branch: 'main'});
            }
            const wf = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: '.github/workflows/fix-profile-ui.yml', ref: 'main'});
            await github.rest.repos.deleteFile({owner: context.repo.owner, repo: context.repo.repo, path: '.github/workflows/fix-profile-ui.yml', message: 'chore: remove temporary profile UI workflow', sha: wf.data.sha, branch: 'main'});
