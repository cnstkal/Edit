name: Restore index.html

on:
  push:
    branches: [main]

jobs:
  restore:
    if: github.event.head_commit.message == 'fix: restore index.html'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index from known-good commit
        run: |
          git checkout f29f1b7e0d310947fecaeee5a4cecfb8abdcb28d -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore index.html' || exit 0
          git push
