name: Fix Twitter profile editor
on:
  push:
    paths:
      - '.github/workflows/fix-twitter-profile-v3.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('twitter-profile.html')
          s=p.read_text(encoding='utf-8')
          css='''<style>.tw-posts{background:#fff}.tw-post{padding:13px 15px 14px 61px;position:relative;border-bottom:1px solid #e5e7e9;overflow:hidden}.tw-post:last-child{border-bottom:0}.tw-post .mini{position:absolute;left:15px;top:15px;width:38px;height:38px;border-radius:50%;object-fit:cover;background:#d8dadd}.tw-post .pin{font-size:11px;color:#53636d;font-weight:700;margin-bottom:5px}.tw-head{font-size:14px;line-height:1.35}.tw-name{font-weight:800}.tw-handle{color:#53636d}.tw-x{float:right;font-size:22px;color:#111}.tw-text{font-size:15px;line-height:1.4;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}.tw-media{display:block;width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin-top:9px}.tw-link{border:1px solid #dfe3e8;border-radius:14px;overflow:hidden;margin-top:9px}.tw-link-body{padding:9px 10px}.tw-link-title{font-size:13px;font-weight:700}.tw-link-desc,.tw-link-source{font-size:11px;color:#66757f;margin-top:3px}.tw-actions{display:flex;justify-content:space-between;color:#66757f;font-size:12px;margin-top:9px}.tw-editor-post{border:1px solid #e5e1db;border-radius:12px;padding:12px;margin:10px 0;background:#faf9f7}.tw-editor-post h3{margin:0 0 10px;font-size:14px}.tw-editor-post input,.tw-editor-post textarea{width:100%;border:1px solid #d8dce0;border-radius:9px;padding:9px;margin:5px 0;background:#fff;font-size:16px!important}.tw-editor-post textarea{min-height:64px;resize:vertical}.tw-editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tw-editor-actions{margin-top:8px}.tw-editor-actions button,.tw-add{height:38px;border:1px solid #d8dce0;border-radius:9px;background:#fff;padding:0 12px;font-weight:700}.tw-add{width:100%;background:#111;color:#fff;border:0;margin-top:8px}.tw-upload{display:block;border:1px dashed #cfc8bc;border-radius:9px;padding:9px;text-align:center;font-size:12px;color:#777;background:#faf8f3;margin:5px 0}.tw-upload input{display:block;width:100%;margin-top:6px}.tw-remove{color:#c62828!important}.theme-black .tw-posts{background:#000}.theme-black .tw-post{border-color:#2f3336}.theme-black .tw-handle,.theme-black .tw-link-desc,.theme-black .tw-link-source,.theme-black .tw-actions,.theme-black .tw-post .pin{color:#8b98a5}.theme-black .tw-x{color:#f7f9f9}.theme-black .tw-link{border-color:#2f3336}.theme-black .tw-editor-post{background:#111;border-color:#2f3336}.theme-black .tw-editor-post input,.theme-black .tw-editor-post textarea{background:#000;color:#f7f9f9;border-color:#2f3336}</style>'''
          if '.tw-posts{' not in s:s=s.replace('</style>',css+'</style>',1)
          editor='<section class="section" id="tweetEditor"><h2>게시글</h2><div id="tweetEditorList"></div><button class="tw-add" id="addTweet">＋ 게시글 추가</button></section>'
          marker='<button class="save" id="save">PNG로 저장</button>'
          if 'id="tweetEditor"' not in s:s=s.replace(marker,editor+marker,1)
          js='''<script>(function(){const $=id=>document.getElementById(id),KEY='twitter-profile-posts-v3';const D=[{name:'⏰ 시계훈',handle:'@clockhoon · 2025. 11. 22.',text:'부정해도 이미 난\\n꼭 네가 아님\\n안되는 1인이야',image:'',linkTitle:'',linkDesc:'',linkSource:'',reply:'',repost:'173',like:'575',views:'5.9만',pinned:true},{name:'⏰ 시계훈',handle:'@clockhoon · 2시',text:'진짜 개빡센하루 시작',image:'',linkTitle:'잘하면 반차안쓰고 팬싸갔다 출근 가능(n)',linkDesc:'',linkSource:'spin-spin.com',reply:'',repost:'',like:'1',views:'424',pinned:false},{name:'⏰ 시계훈',handle:'@clockhoon · 2시',text:'거의 이 수준',image:'',linkTitle:'',linkDesc:'',linkSource:'',reply:'',repost:'1',like:'8',views:'1210',pinned:false}];let posts;try{posts=JSON.parse(localStorage.getItem(KEY)||'null')||D}catch(e){posts=D}const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function save(){try{localStorage.setItem(KEY,JSON.stringify(posts))}catch(e){alert('이미지가 너무 큽니다. 더 작은 이미지를 선택해주세요.')}}function resize(f,max,q=.82){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);ok(c.toDataURL('image/jpeg',q))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}function profile(){return{name:$('name').value||'⏰ 시계훈',handle:$('handle').value||'@clockhoon',avatar:localStorage.getItem('twitter-profile-avatar-v3')||''}}function preview(){const sc=$('screen');let old=sc.querySelector('.pinned');if(old)old.remove();let box=sc.querySelector('.tw-posts');if(!box){box=document.createElement('div');box.className='tw-posts';sc.querySelector('.profile-tabs').after(box)}const pr=profile();box.innerHTML=posts.map(p=>'<article class="tw-post">'+(pr.avatar?'<img class="mini" src="'+pr.avatar+'">':'<div class="mini"></div>')+(p.pinned?'<div class="pin">📌 메인에 올림</div>':'')+'<div class="tw-head"><span class="tw-name">'+esc(p.name||pr.name)+'</span> <span class="tw-handle">'+esc(p.handle)+'</span><span class="tw-x">𝕏</span></div><div class="tw-text">'+esc(p.text)+'</div>'+(p.image?'<img class="tw-media" src="'+p.image+'">':'')+((p.linkTitle||p.linkSource)?'<div class="tw-link"><div class="tw-link-body"><div class="tw-link-title">'+esc(p.linkTitle||'링크 제목')+'</div>'+(p.linkDesc?'<div class="tw-link-desc">'+esc(p.linkDesc)+'</div>':'')+'<div class="tw-link-source">'+esc(p.linkSource||'example.com')+'</div></div></div>':'')+'<div class="tw-actions"><span>♡ '+esc(p.reply)+'</span><span>♻ '+esc(p.repost)+'</span><span>♡ '+esc(p.like)+'</span><span>▥ '+esc(p.views)+'</span><span>♡</span><span>↗</span></div></article>').join('')}function editor(){const b=$('tweetEditorList');b.innerHTML=posts.map((p,i)=>'<div class="tw-editor-post" data-i="'+i+'"><h3>게시글 '+(i+1)+'</h3><div class="tw-editor-grid"><input data-k="name" value="'+esc(p.name)+'" placeholder="예: ⏰ 시계훈"><input data-k="handle" value="'+esc(p.handle)+'" placeholder="예: @clockhoon · 2시"></div><textarea data-k="text" placeholder="예: 진짜 개빡센하루 시작">'+esc(p.text)+'</textarea><label class="tw-upload">게시글 이미지 추가<input data-file="image" type="file" accept="image/*"></label><div class="tw-editor-grid"><input data-k="linkTitle" value="'+esc(p.linkTitle)+'" placeholder="링크 제목"><input data-k="linkSource" value="'+esc(p.linkSource)+'" placeholder="사이트 주소"></div><input data-k="linkDesc" value="'+esc(p.linkDesc)+'" placeholder="링크 설명"><div class="tw-editor-grid"><input data-k="reply" value="'+esc(p.reply)+'" placeholder="댓글 수"><input data-k="repost" value="'+esc(p.repost)+'" placeholder="리포스트 수"><input data-k="like" value="'+esc(p.like)+'" placeholder="좋아요 수"><input data-k="views" value="'+esc(p.views)+'" placeholder="조회수"></div><label><input data-k="pinned" type="checkbox" '+(p.pinned?'checked':'')+'> 메인에 올림</label><div class="tw-editor-actions"><button class="tw-remove" data-remove="1">게시글 삭제</button></div></div>').join('')}function defaults(){const v={name:'⏰ 시계훈',handle:'@clockhoon',bio:'오늘도 무사히 살아남기',website:'https://example.com',joined:'2025년 6월에 가입함',following:'70',followers:'2,146'};Object.entries(v).forEach(([id,x])=>{const e=$(id);if(e&&!e.value)e.value=x})}async function files(){const a=$('avatarFile');if(a)a.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;const d=await resize(f,512,.84);localStorage.setItem('twitter-profile-avatar-v3',d);preview();e.target.value=''}) ;const c=$('coverFile');if(c)c.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;const d=await resize(f,1200,.84);$('pvCover').style.backgroundImage='url("'+d+'")';localStorage.setItem('twitter-profile-cover-v3',d);e.target.value=''}) ;const cv=localStorage.getItem('twitter-profile-cover-v3');if(cv)$('pvCover').style.backgroundImage='url("'+cv+'")'}$('tweetEditorList').addEventListener('input',e=>{const c=e.target.closest('.tw-editor-post');if(!c)return;const i=+c.dataset.i,k=e.target.dataset.k;if(k)posts[i][k]=e.target.value;save();preview()});$('tweetEditorList').addEventListener('change',async e=>{const c=e.target.closest('.tw-editor-post');if(!c)return;const i=+c.dataset.i;if(e.target.dataset.file==='image'){const f=e.target.files?.[0];if(f){posts[i].image=await resize(f,1200,.82);save();preview();editor();}}else if(e.target.dataset.k==='pinned'){posts[i].pinned=e.target.checked;save();preview()}});$('tweetEditorList').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;const i=+b.closest('.tw-editor-post').dataset.i;if(posts.length>1){posts.splice(i,1);save();editor();preview()}});$('addTweet').addEventListener('click',()=>{posts.push({name:'⏰ 시계훈',handle:'@clockhoon · 2시',text:'여기에 게시글을 입력하세요.',image:'',linkTitle:'',linkDesc:'',linkSource:'',reply:'',repost:'',like:'',views:'',pinned:false});save();editor();preview()});defaults();files();editor();preview()})();</script>'''
          if 'twitter-profile-posts-v3' not in s:s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter-profile.html
          git diff --cached --quiet || git commit -m 'Fix Twitter profile editor images and posts'
          git push
