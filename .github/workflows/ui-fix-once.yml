name: Apply requested UI fixes
on:
  push:
    paths:
      - '.github/workflows/ui-fix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch editors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          # General news: add a real, functional PNG button to the top-right.
          p=Path('news-editor.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            marker='NEWS_REAL_PNG_BUTTON_V2'
            if marker not in s:
              patch=r'''\n<style id="NEWS_REAL_PNG_BUTTON_V2">\n.top .news-png-save{position:absolute!important;right:28px!important;top:12px!important;width:190px!important;height:44px!important;border:0!important;border-radius:11px!important;background:#4b4948!important;color:#fff!important;font-size:15px!important;font-weight:750!important;display:flex!important;align-items:center!important;justify-content:center!important;z-index:50!important;cursor:pointer!important}\n@media(max-width:900px){.top .news-png-save{right:10px!important;top:10px!important;width:116px!important;height:38px!important;font-size:12px!important}}\n</style>\n<script id="NEWS_REAL_PNG_BUTTON_V2_JS">\n(()=>{\n  async function save(btn){\n    const el=document.querySelector('.stage');\n    if(!el||!window.html2canvas){alert('PNG 저장을 준비하지 못했습니다.');return}\n    const old=btn.textContent;btn.disabled=true;btn.textContent='PNG 생성 중…';\n    try{\n      const w=el.scrollWidth||el.getBoundingClientRect().width,h=el.scrollHeight||el.getBoundingClientRect().height;\n      const scale=Math.min(4,8192/Math.max(w,h));\n      const c=await html2canvas(el,{scale:Math.max(2,scale),useCORS:true,allowTaint:false,backgroundColor:null,logging:false,imageTimeout:15000,windowWidth:Math.max(document.documentElement.clientWidth,w),windowHeight:Math.max(document.documentElement.clientHeight,h),scrollX:0,scrollY:-window.scrollY});\n      c.toBlob(blob=>{if(!blob)throw new Error('PNG 생성 실패');const a=document.createElement('a');a.download='news-editor.png';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},'image/png');\n    }catch(e){console.error(e);alert('PNG 저장에 실패했습니다.')}finally{btn.disabled=false;btn.textContent=old}\n  }\n  function init(){\n    const top=document.querySelector('.top');if(!top||top.querySelector('.news-png-save'))return;\n    const b=document.createElement('button');b.type='button';b.className='news-png-save';b.textContent='PNG로 저장';b.addEventListener('click',()=>save(b));top.appendChild(b);\n  }\n  window.addEventListener('DOMContentLoaded',init);window.addEventListener('load',init);setTimeout(init,300);\n})();\n</script>\n'''
              p.write_text(s+patch,encoding='utf-8')
          
          # Dispatch + Kakao: force the existing upper-left home control to display exactly "홈으로".
          for fn in ['dispatch-editor.html','kakao.html']:
            p=Path(fn)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            marker='HOME_LABEL_EXACT_V2'
            if marker not in s:
              patch=r'''\n<style id="HOME_LABEL_EXACT_V2">\n.top .home,.top a.home,.top #cancel,.top button.cancel,.top>a:first-child{font-size:13px!important;color:#4d4b49!important;text-indent:0!important}\n@media(max-width:900px){.top .home,.top a.home,.top #cancel,.top button.cancel,.top>a:first-child{font-size:12px!important}}\n</style>\n<script id="HOME_LABEL_EXACT_V2_JS">\n(()=>{function fix(){document.querySelectorAll('.top').forEach(t=>{let h=t.querySelector('.home,#cancel,button.cancel,a:first-child');if(h){h.textContent='홈으로';h.setAttribute('aria-label','홈으로')}})}window.addEventListener('DOMContentLoaded',fix);window.addEventListener('load',fix);setTimeout(fix,300);setTimeout(fix,1000)})();\n</script>\n'''
              p.write_text(s+patch,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-editor.html dispatch-editor.html kakao.html
          git commit -m 'fix: add news PNG button and set home labels'
          git rm .github/workflows/ui-fix-once.yml
          git commit -m 'chore: remove temporary UI fix workflow'
          git push
