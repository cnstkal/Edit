name: Twitter profile filled icon sync
on:
  push:
    branches: [main]
    paths: ['.twitter-profile-icons-trigger']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply filled action icons without changing preview ratio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('twitter-profile.html')
          s=p.read_text(encoding='utf-8')
          marker='TWITTER_PROFILE_FILLED_ICONS_V1'
          if marker not in s:
              block=r'''
          <style id="TWITTER_PROFILE_FILLED_ICONS_V1">
          /* TWITTER_PROFILE_FILLED_ICONS_V1: fixed icon box, never affects preview dimensions */
          .tw-action{width:28px!important;min-width:28px!important;height:28px!important;min-height:28px!important;max-height:28px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:4px!important;box-sizing:border-box!important;flex-shrink:0!important;position:relative!important}
          .tw-action .tw-filled-icon{width:20px!important;height:20px!important;min-width:20px!important;max-width:20px!important;min-height:20px!important;max-height:20px!important;display:block!important;object-fit:contain!important;flex:none!important}
          .tw-action .tw-filled-icon.tw-bookmark,.tw-action .tw-filled-icon.tw-like{width:20px!important;height:20px!important}
          .tw-action svg{width:20px!important;height:20px!important;flex:none!important}
          .tw-action span{line-height:1!important;white-space:nowrap!important}
          </style>
          <script id="TWITTER_PROFILE_FILLED_ICONS_V1_JS">
          (()=>{
            const urls={repost:'이미지/twitter-repost-filled.webp',like:'이미지/twitter-like-filled.webp',bookmark:'이미지/twitter-bookmark-filled.webp'};
            const state=new Map();
            function kind(btn){
              const all=[...btn.parentElement.querySelectorAll('.tw-action')];
              const i=all.indexOf(btn);
              return i===1?'repost':i===2?'like':i===4?'bookmark':null;
            }
            function key(btn,k){const post=btn.closest('.tw-post,.pinned');const posts=[...document.querySelectorAll('.tw-post,.pinned')];return (posts.indexOf(post))+'-'+k}
            function paint(){
              document.querySelectorAll('.tw-action').forEach(btn=>{
                const k=kind(btn); if(!k)return;
                const img=btn.querySelector('.tw-filled-icon');
                const active=state.get(key(btn,k))===true;
                if(active){
                  if(!img){
                    const svg=btn.querySelector('svg');
                    if(svg)svg.style.display='none';
                    const n=document.createElement('img');n.className='tw-filled-icon tw-'+k;n.src=urls[k];n.alt='';n.setAttribute('aria-hidden','true');btn.insertBefore(n,btn.firstChild);
                  }
                }else if(img){img.remove();const svg=btn.querySelector('svg');if(svg)svg.style.display='block'}
              });
            }
            document.addEventListener('click',e=>{
              const btn=e.target.closest?.('.tw-action'); if(!btn)return;
              const k=kind(btn);if(!k)return;
              const ky=key(btn,k);state.set(ky,!state.get(ky));
              requestAnimationFrame(paint);
            },true);
            const mo=new MutationObserver(()=>requestAnimationFrame(paint));
            function start(){paint();mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','aria-pressed']})}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
          })();
          </script>
          '''
              s=s.replace('</head>',block+'</head>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f .twitter-profile-icons-trigger .github/workflows/twitter-profile-icons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter-profile.html .twitter-profile-icons-trigger .github/workflows/twitter-profile-icons.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use filled Twitter profile action icons'
          git push
