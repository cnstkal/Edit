name: Update Kakao header 2
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/update-kakao-header2.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Shorten header
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kakao2.html')
          s=p.read_text()
          marker='/* PC 16:9 preview: enlarge chat content except room name */'
          css='''/* Shorter Kakao chat header */
          .nav{height:68px!important}
          .chat.pc .nav{height:78px!important}
          '''
          if '/* Shorter Kakao chat header */' in s:
              raise SystemExit('already applied')
          if marker not in s:
              raise SystemExit('marker not found')
          p.write_text(s.replace(marker,css+marker,1))
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao2.html
          git commit -m 'fix: shorten Kakao chat header'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/update-kakao-header2.yml
          git commit -m 'chore: remove temporary Kakao header workflow'
          git push
