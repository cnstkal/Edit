name: Harden Kakao editors

on:
  push:
    paths:
      - '.github/workflows/harden-kakao.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden editors
        shell: python
        run: |
          from pathlib import Path

          profile = Path('kakao-profile.html')
          s = profile.read_text(encoding='utf-8')
          marker = '/* KAKAO_PROFILE_STABILITY_V1 */'
          if marker not in s:
              css = '''\n/* KAKAO_PROFILE_STABILITY_V1 */\nimg{max-width:100%;}\n.profile-sticker,.profile-text,.music{will-change:transform;}\n.profile.editing .profile-sticker,.profile.editing .profile-text,.profile.editing .music{touch-action:none;}\n@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}\n'''
              js = r'''\n<script>\n/* KAKAO_PROFILE_STABILITY_V1 */\n(function(){\n  const root=document.getElementById('profile');\n  if(!root)return;\n  const STORAGE='kakao-profile-editor-v1';\n  const POSITION='kakao-profile-editmode-v2';\n  function cleanState(v){\n    if(!v||typeof v!=='object')return null;\n    if(!Array.isArray(v.media))v.media=['','','','','',''];\n    v.media=Array.from({length:6},(_,i)=>typeof v.media[i]==='string'?v.media[i]:'');\n    if(!Array.isArray(v.stickers))v.stickers=[];\n    if(!Array.isArray(v.texts))v.texts=[];\n    v.stickers=v.stickers.filter(x=>x&&typeof x==='object'&&typeof x.src==='string').slice(-50);\n    v.texts=v.texts.filter(x=>x&&typeof x==='object').slice(-50);\n    return v;\n  }\n  try{\n    const raw=localStorage.getItem(STORAGE);\n    const parsed=raw?JSON.parse(raw):null;\n    const fixed=cleanState(parsed);\n    if(fixed)Object.assign(window.S||{},fixed);\n  }catch(e){\n    try{localStorage.removeItem(STORAGE)}catch(_){}\n  }\n  const originalSave=window.saveState;\n  window.saveState=function(){\n    try{\n      if(typeof originalSave==='function'){originalSave();return;}\n      localStorage.setItem(STORAGE,JSON.stringify(window.S));\n    }catch(e){\n      try{\n        const data=Object.assign({},window.S||{});\n        if(Array.isArray(data.media))data.media=data.media.map((x,i)=>i<3?x:'');\n        if(Array.isArray(data.stickers))data.stickers=data.stickers.slice(-10);\n        if(Array.isArray(data.texts))data.texts=data.texts.slice(-20);\n        localStorage.setItem(STORAGE,JSON.stringify(data));\n      }catch(_){/* keep current state in memory */}\n    }\n  };\n  window.addEventListener('error',e=>{\n    if(e&&e.message&&/quota|storage/i.test(e.message)){try{e.preventDefault()}catch(_){}}\n  });\n  window.addEventListener('unhandledrejection',e=>{\n    if(e&&e.reason&&/quota|storage/i.test(String(e.reason))){try{e.preventDefault()}catch(_){}}\n  });\n  window.addEventListener('beforeunload',()=>{try{window.saveState()}catch(_){}});\n  const mo=new MutationObserver(()=>{\n    document.querySelectorAll('img').forEach(img=>{\n      if(!img.dataset.safeLoad){\n        img.dataset.safeLoad='1';\n        img.addEventListener('error',()=>{img.removeAttribute('src');},{once:true});\n      }\n    });\n  });\n  mo.observe(root,{childList:true,subtree:true});\n})();\n</script>\n'''
              s=s.replace('</style>',css+'</style>',1)
              s=s.replace('</body>',js+'</body>',1)
              profile.write_text(s,encoding='utf-8')

          chat = Path('kakao2.html')
          s = chat.read_text(encoding='utf-8')
          marker = '/* KAKAO_CHAT_STABILITY_V1 */'
          if marker not in s:
              css='''\n/* KAKAO_CHAT_STABILITY_V1 */\nimg{max-width:100%;}\n.msg,.msgbody,.bubble{min-width:0;}\n.profile,.chat,.stage{contain:layout paint;}\n@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}\n'''
              js=r'''\n<script>\n/* KAKAO_CHAT_STABILITY_V1 */\n(function(){\n  const root=document.getElementById('chat');\n  if(!root)return;\n  const KEY='kakao-editor-v7';\n  function safeSave(){\n    try{\n      if(typeof window.save==='function' && !window.save.__stable){\n        const original=window.save;\n        const wrapped=function(){\n          try{return original.apply(this,arguments)}catch(e){\n            try{\n              if(window.S&&typeof window.S==='object'){\n                const copy=JSON.parse(JSON.stringify(window.S));\n                if(Array.isArray(copy.messages))copy.messages=copy.messages.slice(-80);\n                if(Array.isArray(copy.profiles))copy.profiles=copy.profiles.slice(0,30);\n                localStorage.setItem(KEY,JSON.stringify(copy));\n              }\n            }catch(_){}\n          }\n        };\n        wrapped.__stable=true;\n        window.save=wrapped;\n      }\n    }catch(_){}\n  }\n  safeSave();\n  try{\n    const raw=localStorage.getItem(KEY);\n    if(raw)JSON.parse(raw);\n  }catch(e){try{localStorage.removeItem(KEY)}catch(_){}}\n  window.addEventListener('error',e=>{\n    if(e&&e.message&&/quota|storage/i.test(e.message)){try{e.preventDefault()}catch(_){}}\n  });\n  window.addEventListener('unhandledrejection',e=>{\n    if(e&&e.reason&&/quota|storage/i.test(String(e.reason))){try{e.preventDefault()}catch(_){}}\n  });\n  window.addEventListener('beforeunload',()=>{try{safeSave();if(typeof window.save==='function')window.save()}catch(_){}});\n  document.querySelectorAll('input[type=file]').forEach(input=>{\n    input.addEventListener('change',()=>{\n      const f=input.files&&input.files[0];\n      if(f&&f.size>12*1024*1024){alert('이미지가 너무 큽니다. 12MB 이하의 이미지를 사용해주세요.');input.value='';}\n    });\n  });\n})();\n</script>\n'''
              s=s.replace('</style>',css+'</style>',1)
              s=s.replace('</body>',js+'</body>',1)
              chat.write_text(s,encoding='utf-8')

      - name: Commit hardened files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao-profile.html kakao2.html
          git diff --cached --quiet || git commit -m 'Harden Kakao profile and chat editors'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/harden-kakao.yml
          git add .github/workflows/harden-kakao.yml
          git diff --cached --quiet || git commit -m 'Remove temporary Kakao hardening workflow'
          git push
