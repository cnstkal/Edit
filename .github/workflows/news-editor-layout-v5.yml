name: Refine news editor layout v5
on:
  push:
    branches: [main]
    paths: ['.news-layout-v5-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine preview area and mobile size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('news-editor.html')
          s=p.read_text(encoding='utf-8')
          marker='NEWS_EDITOR_LAYOUT_V5'
          if marker not in s:
              css=r'''
          <style id="NEWS_EDITOR_LAYOUT_V5">
          /* Keep the two-column workspace, but let the preview column end with its actual preview content. */
          @media(min-width:901px){
            .layout{grid-template-columns:50% 50%!important;align-items:start!important;min-height:0!important}
            .preview{height:auto!important;min-height:0!important;padding:22px 0 28px!important;align-self:start!important}
            .previewSticky{position:static!important;height:auto!important}
            .tools{margin:0 auto 12px!important;width:max-content!important;max-width:calc(100% - 24px)!important}
            .stage{width:calc(100% - 24px)!important;max-width:none!important;height:auto!important;margin:0 auto!important;align-self:flex-start!important}
            .settings{min-height:calc(100vh - 68px)!important;height:auto!important;max-height:none!important;overflow:visible!important;align-self:start!important}
          }
          /* On mobile the preview gets substantially more room while remaining a standalone preview block. */
          @media(max-width:900px){
            .preview{padding:10px 0 18px!important}
            .previewSticky{width:100%!important}
            .tools{margin:0 auto 10px!important;max-width:calc(100% - 8px)!important;padding:6px 8px!important}
            .stage{width:calc(100% - 4px)!important;max-width:none!important;margin:0 auto!important;padding:8px!important}
          }
          @media(max-width:600px){
            .preview{padding-top:8px!important}
            .tools{max-width:100%!important}
            .stage{width:100%!important;padding:6px!important;border-radius:12px!important}
          }
          </style>
          '''
              s=s.replace('</head>',css+'</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f .news-layout-v5-trigger .github/workflows/news-editor-layout-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-editor.html .news-layout-v5-trigger .github/workflows/news-editor-layout-v5.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: refine news preview area and mobile size'
          git push
