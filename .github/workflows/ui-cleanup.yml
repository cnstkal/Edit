name: UI cleanup
on:
  push:
    paths:
      - '.github/workflows/ui-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch editors
        run: |
          python - <<'PY'
          from pathlib import Path

          # 뉴스: 설정을 제목 / 시간 / 본문 중심으로 단순화
          p=Path('news2.html'); s=p.read_text()
          marker='<!-- SIMPLE_EDITOR_FIELDS_V1 -->'
          if marker not in s:
              patch=r'''\n<!-- SIMPLE_EDITOR_FIELDS_V1 -->
<style>
/* 설정은 제목 / 시간 / 본문만 남긴다. */
.settings .card:first-child{display:none!important}
.settings .card:nth-child(2) .field:has(#subtitle),
.settings .card:nth-child(2) .photoRow{display:none!important}
.settings .card:nth-child(n+3){display:none!important}
.settings .card:nth-child(2) .cardHead{display:none!important}
.settings .card:nth-child(2) .field:has(#title){display:block!important}
.settings .card:nth-child(2) .field:has(#body){display:block!important}
.simple-time-wrap{display:block!important}
</style>
<script>
(()=>{
  function clean(){
    const cards=document.querySelectorAll('.settings .card');
    if(!cards[0]||!cards[1])return;
    const tf=cards[0].querySelector('.field:has(#time)');
    const body=cards[1].querySelector('.field:has(#body)');
    if(tf&&body&&!tf.dataset.moved){
      tf.dataset.moved='1';
      const lab=tf.querySelector('.label'); if(lab) lab.textContent='시간';
      const inp=tf.querySelector('#time'); if(inp) inp.placeholder='시간';
      cards[1].insertBefore(tf,body);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean);else clean();
})();
</script>
'''
              s=s.replace('</body>',patch+'</body>')
              p.write_text(s)

          # 디스패치: 제목 / 시간 / 본문만 보이게 단순화
          p=Path('dispatch.html'); s=p.read_text()
          marker='<!-- SIMPLE_EDITOR_FIELDS_V1 -->'
          if marker not in s:
              patch=r'''\n<!-- SIMPLE_EDITOR_FIELDS_V1 -->
<style>
.panel>h2{display:none!important}
.panel .group:has(#logoFile),
.panel .group:has(#photoFile),
.panel .group:has(#credit),
.panel .group:has(#miniFile1),
.panel .group:has(#miniFile2),
.panel .group:has(#miniFile3){display:none!important}
.panel .group:has(#title),.panel .group:has(#date),.panel .group:has(#body){display:block!important}
.panel .group:has(#date) label{font-size:11px!important}
</style>
<script>
(()=>{function clean(){const g=document.querySelector('.panel .group:has(#date)');const l=g&&g.querySelector('label');if(l)l.textContent='시간';const d=document.getElementById('date');if(d)d.placeholder='시간'}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean);else clean()})();
</script>
'''
              s=s.replace('</body>',patch+'</body>')
              p.write_text(s)

          # 트위터: 캡처 단계에서 기존 클릭 핸들러를 막아버리던 문제 제거 + 활성 아이콘은 실제 현재 DOM에도 적용
          p=Path('twitter.html'); s=p.read_text()
          s=s.replace("window.addEventListener('click',handle,true);", "window.addEventListener('click',handle,false);")
          marker='<!-- TWITTER_ACTIVE_CLICK_STABILITY_V1 -->'
          if marker not in s:
              patch=r'''\n<!-- TWITTER_ACTIVE_CLICK_STABILITY_V1 -->
<style>
/* 활성화 시 아이콘 자체가 색을 갖도록 한다. */
.act.tw-icon-repost-active .tw-ui-icon{filter:brightness(0) saturate(100%) invert(55%) sepia(91%) saturate(1051%) hue-rotate(119deg) brightness(89%) contrast(101%)!important}
.act.tw-icon-like-active .tw-ui-icon{filter:brightness(0) saturate(100%) invert(29%) sepia(93%) saturate(5486%) hue-rotate(323deg) brightness(101%) contrast(99%)!important}
.act.tw-icon-bookmark-active .tw-ui-icon{filter:brightness(0) saturate(100%) invert(48%) sepia(96%) saturate(1855%) hue-rotate(184deg) brightness(96%) contrast(101%)!important}
.act.tw-icon-like-active .ico,.act.tw-icon-bookmark-active .ico{background:none!important;mask:none!important;-webkit-mask:none!important}
.act.tw-icon-like-active .tw-ui-icon,.act.tw-icon-bookmark-active .tw-ui-icon{opacity:1!important}
</style>
<script>
(()=>{
  function paint(){
    document.querySelectorAll('#feed .tweet').forEach((tweet,i)=>tweet.querySelectorAll('.act').forEach((b,j)=>{
      const on=localStorage.getItem('twitter-final-action-state-v4');let st={};try{st=JSON.parse(on||'{}')}catch(e){}
      const active=!!st[i+':'+j];
      b.classList.toggle('tw-icon-repost-active',active&&j===1);
      b.classList.toggle('tw-icon-like-active',active&&j===2);
      b.classList.toggle('tw-icon-bookmark-active',active&&j===4);
    }));
  }
  function afterClick(e){
    const b=e.target.closest?.('#feed .actions .act');if(!b)return;
    const tweet=b.closest('.tweet');if(!tweet)return;
    const j=[...tweet.querySelectorAll('.act')].indexOf(b);if(![1,2,4].includes(j))return;
    setTimeout(paint,0);
  }
  document.addEventListener('click',afterClick,false);
  const mo=new MutationObserver(()=>setTimeout(paint,0));
  if(document.body)mo.observe(document.body,{childList:true,subtree:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',paint);else paint();
})();
</script>
'''
              s=s.replace('</body>',patch+'</body>')
              p.write_text(s)
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in ['news2.html','dispatch.html','twitter.html']:
              s=Path(f).read_text()
              assert 'SIMPLE_EDITOR_FIELDS_V1' in s or f=='twitter.html'
          s=Path('twitter.html').read_text()
          assert "window.addEventListener('click',handle,false);" in s
          assert 'TWITTER_ACTIVE_CLICK_STABILITY_V1' in s
          print('verification ok')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news2.html dispatch.html twitter.html
          git diff --cached --quiet || git commit -m 'fix: simplify editor fields and stabilize Twitter actions'
          git push
      - name: Cleanup workflow
        if: always()
        run: |
          git rm -f .github/workflows/ui-cleanup.yml || true
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: remove temporary ui cleanup workflow' || true
          git push || true
