name: Fix dispatch editor heading
on:
  push:
    branches: [main]
    paths: ['.dispatch-heading-fix-trigger']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize dispatch settings heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('dispatch-editor.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'(<h2[^>]*>)\s*디스패치\s*기사\s*설정\s*(</h2>)', r'\1설정\2', s, count=1, flags=re.S)
          s=s.replace('.panel h2:before{content:\'설정\';', '.panel h2:before{content:\'\';')
          # The shared heading should be visually compact and never concatenate with page-specific text.
          s=s.replace('.panel>h2{font-size:26px!important;', '.panel>h2{font-size:24px!important;')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f .dispatch-heading-fix-trigger .github/workflows/dispatch-heading-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dispatch-editor.html .dispatch-heading-fix-trigger .github/workflows/dispatch-heading-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: normalize dispatch settings heading'
          git push
