name: Twitter action icons fix
on:
  push:
    branches: [main]
    paths: ['.twitter-action-icons-fix-trigger']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install supplied filled WebP icons and fix interactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          assets={
          '이미지/twitter-like-filled.webp':'',
          '이미지/twitter-repost-filled.webp':'',
          '이미지/twitter-bookmark-filled.webp':''
          }
          for path,b64 in assets.items():
              p=Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(b64))
          fix=r'''<style id="TWITTER_ACTION_ICONS_FINAL_V4">
          .tw-action .tw-profile-ui-icon,.act .tw-action-state-icon{width:20px!important;height:20px!important;min-width:20px!important;min-height:20px!important;max-width:20px!important;max-height:20px!important;object-fit:contain!important;display:block!important;flex:0 0 20px!important;pointer-events:none!important}
          .tw-action.tw-profile-active,.act.active-repost,.act.active-like,.act.active-bookmark{font-weight:600!important}
          </style>
          <script id="TWITTER_ACTION_ICONS_FINAL_V4_JS">(()=>{
          const base='이미지/';
          const filled={repost:base+'twitter-repost-filled.webp',like:base+'twitter-like-filled.webp',bookmark:base+'twitter-bookmark-filled.webp'};
          const normal={repost:base+'twitter-repost.webp',like:base+'twitter-like.webp',bookmark:base+'twitter-bookmark.webp'};
          function profile(){document.querySelectorAll('.tw-action-icons').forEach((bar)=>{const a=[...bar.querySelectorAll('.tw-action')];[1,2,4].forEach(i=>{const el=a[i];if(!el)return;let im=el.querySelector('.tw-profile-ui-icon');if(!im){im=document.createElement('img');im.className='tw-profile-ui-icon';el.insertBefore(im,el.firstChild)}const key=i===1?'repost':i===2?'like':'bookmark';im.src=(el.classList.contains('tw-profile-active')?filled[key]:normal[key]);im.alt='';el.querySelectorAll('svg').forEach(x=>x.style.display='none')})})}
          function post(){document.querySelectorAll('.actions').forEach(bar=>{const a=[...bar.querySelectorAll('.act')];[1,2,4].forEach(i=>{const el=a[i];if(!el)return;let im=el.querySelector('.tw-action-state-icon');if(!im){const box=el.querySelector('.ico');if(!box)return;im=document.createElement('img');im.className='tw-action-state-icon';box.replaceChildren(im)}const key=i===1?'repost':i===2?'like':'bookmark';im.src=(el.classList.contains('active-repost')||el.classList.contains('active-like')||el.classList.contains('active-bookmark'))?filled[key]:normal[key];im.alt=''})})}
          function run(){profile();post()}
          const mo=new MutationObserver(run);const start=()=>{run();if(document.body)mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']})};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
          })();</script>'''
          for fn in ['twitter-profile.html','twitter-post.html']:
              p=Path(fn);s=p.read_text(encoding='utf-8')
              if 'TWITTER_ACTION_ICONS_FINAL_V4' not in s:s=s.replace('</head>',fix+'</head>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f .twitter-action-icons-fix-trigger .github/workflows/twitter-action-icons-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter-profile.html twitter-post.html 이미지/twitter-like-filled.webp 이미지/twitter-repost-filled.webp 이미지/twitter-bookmark-filled.webp .twitter-action-icons-fix-trigger .github/workflows/twitter-action-icons-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use filled Twitter action icons without layout shift'
          git push
