name: Fill active Twitter icons
on:
  push:
    paths:
      - '.github/workflows/fill-twitter-icons.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('twitter.html')
          s=p.read_text()
          old='.act.active-repost{color:#00ba7c}.act.active-like{color:#f91880}.act.active-bookmark{color:#1d9bf0}'
          new=old+'.act.active-like .ico svg,.act.active-bookmark .ico svg{fill:currentColor}'
          if new not in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html
          git commit -m 'fill active like and bookmark icons' || true
          rm -f .github/workflows/fill-twitter-icons.yml
          git add -A
          git commit -m 'remove temporary icon fix workflow' || true
          git push