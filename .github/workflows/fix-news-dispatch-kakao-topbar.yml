name: Fix editor topbars
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-news-dispatch-kakao-topbar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch topbars
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('news-editor.html')
          s = p.read_text(encoding='utf-8')
          marker = 'NEWS_REAL_PNG_BUTTON_V1'
          block = r'''
          <style id="NEWS_REAL_PNG_BUTTON_V1">
          .top .news-save-png{display:flex!important;align-items:center!important;justify-content:center!important;width:190px!important;height:44px!important;border:0!important;border-radius:11px!important;background:#4b4948!important;color:#fff!important;font-size:15px!important;font-weight:650!important;cursor:pointer!important;order:3!important;position:relative!important;z-index:3!important}
          .top:after{display:none!important}
          </style>
          <script id="NEWS_REAL_PNG_BUTTON_V1_JS">
          (()=>{
            function install(){
              const top=document.querySelector('.top');
              if(!top || top.querySelector('.news-save-png')) return;
              const b=document.createElement('button');
              b.type='button'; b.className='news-save-png'; b.textContent='PNG로 저장';
              b.addEventListener('click',async()=>{
                const target=document.querySelector('.news.pc, .news');
                if(!target || typeof html2canvas!=='function') return;
                try{
                  b.disabled=true; b.textContent='저장 중…';
                  const canvas=await html2canvas(target,{backgroundColor:null,scale:2,useCORS:true});
                  const a=document.createElement('a');
                  a.download='news.png'; a.href=canvas.toDataURL('image/png'); a.click();
                }finally{b.disabled=false; b.textContent='PNG로 저장';}
              });
              top.appendChild(b);
            }
            window.addEventListener('DOMContentLoaded',install);
            window.addEventListener('load',install);
            setTimeout(install,300);
          })();
          </script>
          '''
          if marker not in s:
              s=s.replace('</head>', block+'\n</head>', 1)
              p.write_text(s,encoding='utf-8')

          for name, marker in [('dispatch-editor.html','DISPATCH_HOME_LABEL_FINAL_V1'),('kakao2.html','KAKAO_HOME_LABEL_FINAL_V1')]:
              p=Path(name); s=p.read_text(encoding='utf-8')
              block = f'''
          <style id="{marker}">
          .top .home{{position:absolute!important;left:28px!important;top:12px!important;display:flex!important;align-items:center!important;justify-content:center!important;min-width:76px!important;height:44px!important;padding:0 15px!important;z-index:5!important}}
          @media(max-width:900px){{.top .home{{left:10px!important;top:10px!important;min-width:68px!important;height:40px!important;padding:0 12px!important}}}}
          </style>
          <script id="{marker}_JS">
          (()=>{{function fix(){{const h=document.querySelector('.top .home');if(h)h.textContent='홈으로';}}window.addEventListener('DOMContentLoaded',fix);window.addEventListener('load',fix);setTimeout(fix,300);}})();
          </script>
          '''
              if marker not in s:
                  s=s.replace('</head>', block+'\n</head>', 1)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-editor.html dispatch-editor.html kakao2.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: add news PNG button and normalize home labels"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-news-dispatch-kakao-topbar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-news-dispatch-kakao-topbar.yml
          git diff --cached --quiet || git commit -m "chore: remove temporary topbar workflow"
          git push || true
