name: repair twitter post
on:
  push:
    paths:
      - '.repair-twitter-post-trigger'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Twitter post from stable base
        run: |
          git checkout 6ed63a4b354e8b18eae2c4f4aa842bd3ff7776bd -- twitter.html
          cp twitter.html twitter-post.html
          python - <<'PY'
          from pathlib import Path
          p=Path('twitter-post.html')
          s=p.read_text()
          s=s.replace('<title>트위터 설정</title>','<title>트위터 게시글 설정</title>')
          s=s.replace('<!-- TWITTER_LOADING_LOOP_FIX_V1 -->','<!-- TWITTER_POST_STABLE_V1 -->')
          p.write_text(s)
          p=Path('twitter-menu.html'); s=p.read_text()
          s=s.replace("twitter.html?v=20260910f","twitter-post.html?v=20260910h")
          p.write_text(s)
          # remove the obsolete trigger workflow so it cannot overwrite the stable post again
          wf=Path('.github/workflows/twitter-final-stable.yml')
          if wf.exists(): wf.unlink()
          Path('.repair-twitter-post-trigger').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter-post.html twitter-menu.html .github/workflows/twitter-final-stable.yml .repair-twitter-post-trigger
          git commit -m 'fix: rebuild Twitter post editor from stable version'
          git push
