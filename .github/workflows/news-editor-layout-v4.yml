name: Refine news editor layout v4
on:
  push:
    branches: [main]
    paths: ['.news-layout-v4-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply true 50 50 workspace layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('news-editor.html')
          s=p.read_text(encoding='utf-8')
          marker='NEWS_EDITOR_LAYOUT_V4'
          if marker not in s:
              css=r'''
          <style id="NEWS_EDITOR_LAYOUT_V4">
          /* NEWS_EDITOR_LAYOUT_V4 */
          @media(min-width:901px){
            /* The editor workspace itself is exactly two equal columns. */
            .layout{width:100%!important;max-width:none!important;grid-template-columns:50% 50%!important;gap:0!important;margin:0!important;align-items:start!important}
            /* Treat the left half as a standalone preview canvas. */
            .preview{grid-column:1!important;width:100%!important;min-width:0!important;padding:22px 0 40px!important;display:block!important}
            .previewSticky{position:static!important;width:100%!important}
            .tools{width:max-content!important;max-width:calc(100% - 32px)!important;margin:0 auto 12px!important;padding:6px 8px!important;min-height:44px!important;border-radius:10px!important;gap:5px!important;flex-wrap:nowrap!important}
            .tools select{height:32px!important;padding:0 8px!important;border-radius:8px!important;font-size:12px!important}
            .zoom{gap:4px!important;margin-left:4px!important;flex:none!important}
            .zoom button{height:32px!important;min-width:32px!important;border-radius:8px!important;font-size:17px!important}
            .zoom input{width:110px!important;height:24px!important;flex:none!important}
            .zoom span{font-size:10px!important;min-width:32px!important}
            .stage{width:calc(100% - 32px)!important;max-width:none!important;margin:0 auto!important}
            /* Settings is a full-height page column, not a card with its own clipped viewport. */
            .settings{grid-column:2!important;width:100%!important;max-width:none!important;height:auto!important;max-height:none!important;min-height:calc(100vh - 68px)!important;overflow:visible!important;overflow-y:visible!important;padding:28px 24px 80px!important;border-left:1px solid #dedad4!important;border-radius:0!important;background:#fbfaf7!important;box-shadow:none!important;justify-self:stretch!important}
            .settings:before{margin-left:0!important}
            .card{width:100%!important;max-width:none!important}
          }
          @media(max-width:900px){
            .tools{width:max-content!important;max-width:calc(100% - 16px)!important;margin:0 auto 10px!important;padding:6px 8px!important;min-height:42px!important;border-radius:10px!important;gap:5px!important;flex-wrap:nowrap!important}
          }
          </style>
          '''
              s=s.replace('</head>',css+'</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f .news-layout-v4-trigger .github/workflows/news-editor-layout-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-editor.html .news-layout-v4-trigger .github/workflows/news-editor-layout-v4.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make news editor workspace true 50 50'
          git push
