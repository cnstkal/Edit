name: Twitter final fix run
on:
  push:
    paths:
      - '.github/workflows/twitter-final-fix-run.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Twitter files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, marker, block):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if marker not in s:
                  p.write_text(s.replace('</body>',block+'</body>'),encoding='utf-8')
          patch('twitter.html','TWITTER_FINAL_ACTION_FIX_V3',r'''<!-- TWITTER_FINAL_ACTION_FIX_V3 -->
          <style>
          .actions{grid-template-columns:repeat(4,minmax(0,1fr)) 48px!important;column-gap:0!important;align-items:center!important}
          .act{min-width:0!important;gap:3px!important;justify-content:center!important;overflow:visible!important}
          .act:nth-child(1){justify-content:flex-start!important}
          .act:nth-child(5){grid-column:5!important;grid-row:1!important;justify-self:start!important;margin:0 2px 0 0!important;padding:0!important}
          .act:nth-child(6){grid-column:5!important;grid-row:1!important;justify-self:end!important;margin:0 0 0 2px!important;padding:0!important}
          .act .tw-ui-icon{width:18px!important;height:18px!important;min-width:18px!important;min-height:18px!important;max-width:18px!important;max-height:18px!important;flex:0 0 18px!important;object-fit:contain!important;pointer-events:none!important;display:block!important}
          .act span,.act b,.act strong,#feed,#tweets,.tweet-card,.tweet-card *{font-family:Pretendard,sans-serif!important}
          </style>
          <script>
          (()=>{const k='twitter-extra-action-state-v1';let s={};try{s=JSON.parse(localStorage.getItem(k)||'{}')}catch(e){};const save=()=>{try{localStorage.setItem(k,JSON.stringify(s))}catch(e){}};
          const ai=a=>{const b=a.closest('.actions');return b?[...b.querySelectorAll('.act')].indexOf(a):-1};
          const apply=()=>document.querySelectorAll('.actions').forEach((b,bi)=>[...b.querySelectorAll('.act')].forEach((a,i)=>{const on=!!s[bi+':'+i];a.classList.toggle('tw-extra-active',on);a.classList.toggle('tw-extra-repost',on&&i===1);a.classList.toggle('tw-extra-like',on&&i===2);a.classList.toggle('tw-extra-bookmark',on&&i===4)}));
          document.addEventListener('click',e=>{const a=e.target.closest?.('.actions .act');if(!a)return;const i=ai(a);if(![1,2,4].includes(i))return;const b=a.closest('.actions'),bi=[...document.querySelectorAll('.actions')].indexOf(b);e.preventDefault();e.stopImmediatePropagation();const key=bi+':'+i;s[key]=!s[key];save();apply()},true);
          function normalize(){document.querySelectorAll('input,textarea').forEach(el=>{const q=((el.id||'')+' '+(el.name||'')+' '+(el.placeholder||'')).toLowerCase();if(!/handle|username|아이디/.test(q)||el.dataset.atRequired==='1')return;el.dataset.atRequired='1';const n=()=>{const r=(el.value||'').trim();if(r)el.value='@'+r.replace(/^@+/,'')};el.addEventListener('input',()=>{if(el.value&&!el.value.startsWith('@'))el.value='@'+el.value.replace(/^@+/,'')});el.addEventListener('blur',n);el.addEventListener('change',n);n()})}
          function start(){normalize();apply();new MutationObserver(()=>{normalize();apply()}).observe(document.body,{subtree:true,childList:true})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()})();
          </script>
          ''')
          patch('twitter-profile.html','TWITTER_PROFILE_FINAL_ACTION_FIX_V3',r'''<!-- TWITTER_PROFILE_FINAL_ACTION_FIX_V3 -->
          <style>
          .tw-action-icons{grid-template-columns:repeat(4,minmax(0,1fr)) 48px!important;column-gap:0!important;align-items:center!important}
          .tw-action{min-width:0!important;gap:3px!important;justify-content:center!important;overflow:visible!important}
          .tw-action:nth-child(1){justify-content:flex-start!important}
          .tw-action:nth-child(5){grid-column:5!important;grid-row:1!important;justify-self:start!important;margin:0 2px 0 0!important;padding:0!important}
          .tw-action:nth-child(6){grid-column:5!important;grid-row:1!important;justify-self:end!important;margin:0 0 0 2px!important;padding:0!important}
          .tw-action .tw-profile-ui-icon{width:18px!important;height:18px!important;min-width:18px!important;min-height:18px!important;max-width:18px!important;max-height:18px!important;flex:0 0 18px!important;object-fit:contain!important;pointer-events:none!important;display:block!important}
          .tw-action span,.tw-action b,.tw-action strong,#screen,#screen *{font-family:Pretendard,sans-serif!important}
          </style>
          <script>
          (()=>{const k='twitter-profile-action-state-v2';let s={};try{s=JSON.parse(localStorage.getItem(k)||'{}')}catch(e){};const save=()=>{try{localStorage.setItem(k,JSON.stringify(s))}catch(e){}},ai=a=>{const b=a.closest('.tw-action-icons');return b?[...b.querySelectorAll('.tw-action')].indexOf(a):-1};
          const apply=()=>document.querySelectorAll('.tw-action-icons').forEach((b,bi)=>[...b.querySelectorAll('.tw-action')].forEach((a,i)=>{const on=!!s[bi+':'+i];a.classList.toggle('tw-profile-active',on);a.classList.toggle('tw-profile-active-repost',on&&i===1);a.classList.toggle('tw-profile-active-like',on&&i===2);a.classList.toggle('tw-profile-active-bookmark',on&&i===4)}));
          document.addEventListener('click',e=>{const a=e.target.closest?.('.tw-action-icons .tw-action');if(!a)return;const i=ai(a);if(![1,2,4].includes(i))return;const b=a.closest('.tw-action-icons'),bi=[...document.querySelectorAll('.tw-action-icons')].indexOf(b);e.preventDefault();e.stopImmediatePropagation();const key=bi+':'+i;s[key]=!s[key];save();apply()},true);
          function normalize(){document.querySelectorAll('input,textarea').forEach(el=>{const q=((el.id||'')+' '+(el.name||'')+' '+(el.placeholder||'')).toLowerCase();if(!/handle|username|아이디/.test(q)||el.dataset.atRequired==='1')return;el.dataset.atRequired='1';const n=()=>{const r=(el.value||'').trim();if(r)el.value='@'+r.replace(/^@+/,'')};el.addEventListener('input',()=>{if(el.value&&!el.value.startsWith('@'))el.value='@'+el.value.replace(/^@+/,'')});el.addEventListener('blur',n);el.addEventListener('change',n);n()})}
          function start(){normalize();apply();new MutationObserver(()=>{normalize();apply()}).observe(document.body,{subtree:true,childList:true})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()})();
          </script>
          ''')
          PY
      - name: Validate
        run: grep -q 'TWITTER_FINAL_ACTION_FIX_V3' twitter.html && grep -q 'TWITTER_PROFILE_FINAL_ACTION_FIX_V3' twitter-profile.html
      - name: Commit and remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html twitter-profile.html
          git commit -m 'fix: Twitter action spacing handles and fonts' || true
          git rm .github/workflows/twitter-final-fix.yml .github/workflows/twitter-final-fix-run.yml
          git commit -m 'chore: remove temporary Twitter fix workflows' || true
          git push