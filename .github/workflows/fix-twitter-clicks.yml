name: Fix Twitter Preview Clicks
on:
  push:
    paths:
      - '.github/workflows/fix-twitter-clicks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix click handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('twitter.html')
          s=p.read_text()
          old="$('feed').querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{const i=+btn.dataset.i,action=btn.dataset.action;if(action==='repost'&&S.tweets[i].lock)return;if(action==='repost')S.tweets[i].reposted=!S.tweets[i].reposted;if(action==='like')S.tweets[i].liked=!S.tweets[i].liked;if(action==='bookmark')S.tweets[i].bookmarked=!S.tweets[i].bookmarked;persist();renderPreview()}));"
          new="$('feed').onclick=e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const i=+btn.dataset.i,action=btn.dataset.action;if(action==='repost'&&S.tweets[i].lock)return;if(action==='repost')S.tweets[i].reposted=!S.tweets[i].reposted;if(action==='like')S.tweets[i].liked=!S.tweets[i].liked;if(action==='bookmark')S.tweets[i].bookmarked=!S.tweets[i].bookmarked;persist();renderPreview()};"
          if old not in s:
              raise SystemExit('click handler not found')
          s=s.replace(old,new,1)
          s=s.replace('.actions{display:grid;', '.actions{pointer-events:auto;display:grid;',1)
          s=s.replace('.act{display:flex;', '.act{pointer-events:auto;display:flex;',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitter.html
          git commit -m 'Fix Twitter preview action clicks'
          git push
