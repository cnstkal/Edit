<style>
*{box-sizing:border-box}
body{margin:0;background:#f3efe7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.top{height:64px;background:#fffdf9;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:5}
.top a{color:#111;text-decoration:none;font-weight:700}
.top h1{margin:auto;font-size:18px}
.layout{width:min(760px,100%);margin:auto;padding:18px 10px 50px;display:flex;flex-direction:column;gap:18px}
.preview-wrap{order:1}.settings{order:2}
.stage{width:min(100%,390px);aspect-ratio:9/16;margin:auto;background:#fff;overflow:hidden;border:1px solid #ddd;box-shadow:0 8px 30px #0001}
.screen{width:100%;height:100%;overflow:hidden;background:#fff;color:#111}
.twitter-head{height:13%;min-height:70px;border-bottom:1px solid #e5e7e9}
.tabs{height:100%;display:flex;align-items:flex-end;justify-content:space-around}
.tab{font-size:18px;color:#5f707b;font-weight:500;height:58%;display:flex;align-items:center;position:relative}
.tab.active{font-weight:800;color:#111}.tab.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:#1d9bf0;border-radius:4px}
.feed{height:87%;overflow:hidden}
.tweet{position:relative;padding:17px 15px 15px 72px;border-bottom:1px solid #e3e5e7;min-height:18%;background:#fff}
.avatar{position:absolute;left:15px;top:18px;width:45px;height:45px;border-radius:50%;object-fit:cover;background:#e9ecef;display:block}
.identity{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;padding-right:18px}
.name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.handle,.time{color:#60727d;font-size:13px}
.lock{width:16px;height:16px;display:inline-block;flex:0 0 16px;margin-left:0;object-fit:contain;vertical-align:middle}
.more{position:absolute;right:14px;top:17px;color:#53636d}
.tweet-text{font-size:16px;line-height:1.4;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{pointer-events:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 24px 30px;margin-top:11px;color:#53636d;align-items:center}
.act{pointer-events:auto;display:flex;justify-content:flex-start;align-items:center;gap:3px;font-size:11px;min-width:0;white-space:nowrap;border:0;background:transparent;padding:0;color:inherit}
.act:nth-child(5),.act:nth-child(6){justify-content:center;gap:0}
.ico{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 19px}
.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act.active-repost{color:#00ba7c}.act.active-like{color:#f91880}.act.active-bookmark{color:#1d9bf0}.act.active-like .ico svg,.act.active-bookmark .ico svg{fill:currentColor}.act.disabled{color:#b9c1c5;cursor:default}.empty{color:#53636d}.screen.theme-dark{background:#000;color:#f7f9f9}.screen.theme-dark .twitter-head{border-color:#2f3336}.screen.theme-dark .tweet{background:#000;border-color:#2f3336}.screen.theme-dark .tab{color:#8b98a5}.screen.theme-dark .tab.active{color:#f7f9f9}.screen.theme-dark .handle,.screen.theme-dark .time{color:#8b98a5}.screen.theme-dark .more{color:#8b98a5}.screen.theme-dark .actions{color:#8b98a5}.screen.theme-dark .empty{color:#8b98a5}.screen.theme-dark .avatar{background:#2f3336}
.section{background:#fff;border:1px solid #dedbd6;border-radius:16px;padding:18px 15px;margin-bottom:12px}
.section h2{font-size:15px;margin:0 0 13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid #d8dce0;border-radius:10px;padding:10px;outline:none;background:#fff}
.field textarea{min-height:75px;resize:vertical}
.check{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:9px}
.tweet-card{border:1px solid #e5e1db;border-radius:10px;padding:12px;margin:10px 0;background:#faf9f7}
.tweet-head{display:flex;justify-content:space-between;align-items:center}
.danger{color:#c62828;background:#fff0f0;border:1px solid #ffd4d4;border-radius:8px;padding:6px 9px;font-size:12px}
.add,.save,.tool{width:100%;height:42px;border-radius:9px;border:1px solid #ddd;background:#fff;font-weight:700}
.save{background:#111;color:#fff;border:0}.toolbar{display:flex;justify-content:flex-end;margin-bottom:8px}.tool{width:auto;padding:0 12px;height:36px;font-size:12px}
input:not([type="checkbox"]):not([type="radio"]),textarea,select{font-size:16px!important}
@media(max-width:560px){.row{grid-template-columns:1fr}.top{height:56px}.section{padding:16px 14px}.tweet-text{font-size:16px}}
.tw-ui-icon{width:21px;height:21px;display:block;object-fit:contain;flex:0 0 21px}
</style>

<script>
(()=>{
  const K='twitter-final-action-state-v4';
  let state={};try{state=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(state))}catch(e){}};
  function paint(){
    document.querySelectorAll('#feed .tweet').forEach((tweet,i)=>{
      tweet.querySelectorAll('.act').forEach((b,j)=>{
        const on=!!state[i+':'+j];
        b.classList.toggle('tw-icon-repost-active',on&&j===1);
        b.classList.toggle('tw-icon-like-active',on&&j===2);
        b.classList.toggle('tw-icon-bookmark-active',on&&j===4);
        if(j===1)b.disabled=false;
      });
    });
  }
  function handle(e){
    const b=e.target.closest?.('#feed .actions .act');
    if(!b)return;
    const tweet=b.closest('.tweet');
    if(!tweet)return;
    const j=[...tweet.querySelectorAll('.act')].indexOf(b);
    if(![1,2,4].includes(j))return;
    const i=[...document.querySelectorAll('#feed .tweet')].indexOf(tweet);
    if(i<0)return;
    e.preventDefault();e.stopImmediatePropagation();
    const k=i+':'+j;state[k]=!state[k];save();paint();
  }
  function normalizeHandles(){
    document.querySelectorAll('input,textarea').forEach(el=>{
      const q=((el.id||'')+' '+(el.name||'')+' '+(el.placeholder||'')).toLowerCase();
      if(!/handle|username|아이디/.test(q)||el.dataset.atRequired==='1')return;
      el.dataset.atRequired='1';
      const n=()=>{const r=(el.value||'').trim();if(r)el.value='@'+r.replace(/^@+/,'')};
      el.addEventListener('input',()=>{if(el.value&&!el.value.startsWith('@'))el.value='@'+el.value.replace(/^@+/,'')});
      el.addEventListener('blur',n);el.addEventListener('change',n);n();
    });
  }
  function start(){
    normalizeHandles();paint();
    window.addEventListener('click',handle,true);
    const mo=new MutationObserver(()=>{normalizeHandles();paint()});
    mo.observe(document.body,{subtree:true,childList:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>

<script>
(()=>{
  const K='twitter-extra-photos-v2';
  const read=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return{}}};
  const write=v=>{try{localStorage.setItem(K,JSON.stringify(v))}catch(e){}};
  let photos=read();
  const toData=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
  async function bind(){
    document.querySelectorAll('#tweets .tweet-photo-editor').forEach((box,i)=>{
      const input=box.querySelector('input[type=file]');if(!input||input.dataset.multiBound==='1')return;
      input.multiple=true;input.dataset.multiBound='1';
      input.addEventListener('change',async()=>{
        const fs=[...(input.files||[])].slice(0,4);if(!fs.length)return;
        const arr=[];for(const f of fs)arr.push(await toData(f));
        photos[i]=arr;write(photos);sync();
      });
      const clear=box.querySelector('.tweet-photo-clear');
      if(clear&&clear.dataset.multiBound!=='1'){
        clear.dataset.multiBound='1';clear.addEventListener('click',()=>{delete photos[i];write(photos);sync();input.value=''});
      }
    });
    document.querySelectorAll('#tweets .tweet-photo-editor input[type=file]').forEach(i=>i.title='최대 4장까지 선택 가능');
  }
  function sync(){
    const feed=document.getElementById('feed');if(!feed)return;
    feed.querySelectorAll('.tweet').forEach((tweet,i)=>{
      const arr=Array.isArray(photos[i])?photos[i].slice(0,4):(photos[i]?[photos[i]]:[]);
      const old=[...tweet.querySelectorAll('.tweet-extra-photo')];
      old.slice(arr.length).forEach(x=>x.remove());
      const text=tweet.querySelector('.tweet-text');
      arr.forEach((src,j)=>{
        let img=old[j]||tweet.querySelectorAll('.tweet-extra-photo')[j];
        if(!img){img=document.createElement('img');img.className='tweet-extra-photo';if(text)text.insertAdjacentElement('afterend',img);else tweet.appendChild(img)}
        img.src=src;img.alt='';
      });
      tweet.dataset.photoCount=String(arr.length);
      if(!arr.length)delete tweet.dataset.photoCount;
    });
  }
  function start(){bind();sync();const mo=new MutationObserver(records=>{let changed=false;for(const r of records){for(const n of r.addedNodes){if(n.nodeType===1&&(n.classList?.contains('tweet')||n.querySelector?.('.tweet'))){changed=true;break}}for(const n of r.removedNodes){if(n.nodeType===1&&(n.classList?.contains('tweet')||n.querySelector?.('.tweet'))){changed=true;break}}if(changed)break}if(changed){bind();sync()}});const t=document.getElementById('tweets'),f=document.getElementById('feed');if(t)mo.observe(t,{childList:true,subtree:true});if(f)mo.observe(f,{childList:true,subtree:true})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
<script id="HIGH_QUALITY_PNG_EXPORT_V1">
(()=>{
  const TARGETS=['.stage','.screen','.preview-stage'];
  function target(){for(const s of TARGETS){const e=document.querySelector(s);if(e)return e}return null}
  function load(){return new Promise((ok,fail)=>{if(window.html2canvas)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)})}
  async function save(btn){
    const el=target();if(!el)return;
    const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='PNG 생성 중…'}
    try{
      await load();
      const w=el.scrollWidth||el.getBoundingClientRect().width,h=el.scrollHeight||el.getBoundingClientRect().height;
      const scale=Math.min(4,8192/Math.max(w,h));
      const canvas=await html2canvas(el,{scale:Math.max(2,scale),useCORS:true,allowTaint:false,backgroundColor:null,logging:false,imageTimeout:15000,windowWidth:Math.max(document.documentElement.clientWidth,w),windowHeight:Math.max(document.documentElement.clientHeight,h),scrollX:0,scrollY:-window.scrollY});
      canvas.toBlob(blob=>{
        if(!blob)throw new Error('PNG 생성 실패');
        const a=document.createElement('a');a.download='editor.png';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      },'image/png');
    }catch(e){console.error('High quality PNG export failed',e);alert('PNG 저장에 실패했습니다.');}
    finally{if(btn){btn.disabled=false;btn.textContent=old||'PNG로 저장'}}
  }
  function bind(){
    const btn=document.querySelector('#savePng,#save,.save');if(!btn||btn.dataset.hqBound)return;
    btn.dataset.hqBound='1';
    btn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();save(btn)},true);
  }
  window.addEventListener('DOMContentLoaded',bind);window.addEventListener('load',bind);setInterval(bind,1000);
})();
</script></body>
