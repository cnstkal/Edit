<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>에딧 소스 생성기 · 카톡</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box;letter-spacing:-.04em;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f3efe7;color:#222;font-family:Pretendard,sans-serif}body{padding:12px 10px 40px}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{width:min(1120px,100%);margin:0 auto 10px;display:flex;align-items:center;justify-content:space-between}.home{border:1px solid #d8d2c8;border-radius:10px;background:#fffdf9;padding:9px 13px;font-size:12px;font-weight:700;color:#333}.brand{font-size:15px;font-weight:700}.time{font-size:11px;color:#999}.layout{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.preview{min-width:0}.tools,.panel{background:#fffdf8;border:1px solid #dfd9ce;border-radius:16px;box-shadow:0 5px 18px #7771}.tools{padding:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools b{font-size:13px}.zoom{display:flex;align-items:center;gap:5px;margin-left:auto}.zoom button{min-width:34px;padding:7px;border:1px solid #ddd6ca;background:#fffdf8;border-radius:8px}.zoom input{width:130px}.zoom span{font-size:11px;color:#888}.stage{width:100%;max-width:520px;aspect-ratio:9/16;margin:auto;overflow:hidden;background:#d9d4ca;border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}.stage.dragging{cursor:grabbing}.scale{transform-origin:center;flex:none}.chat{width:720px;min-width:720px;height:1280px;background:#a1b9cb;position:relative;overflow:hidden;color:#111}.chat-head{height:115px;display:flex;align-items:flex-start;justify-content:center;padding-top:20px}.chat-brand{background:#fff;border-radius:34px;padding:16px 22px;font-size:25px;font-weight:650;min-width:138px;text-align:center}.chat-scroll{position:absolute;left:0;right:0;top:115px;bottom:95px;overflow:hidden;padding:0 0 28px}.day{display:flex;justify-content:center;margin:18px 0 28px}.day span{background:#9ab3c5;border-radius:30px;padding:11px 26px;font-size:22px;font-weight:500}.message{display:grid;grid-template-columns:86px 1fr;column-gap:10px;margin:0 34px 34px}.profile{width:76px;height:76px;border-radius:27px;background:#333 center/cover no-repeat;grid-row:1 / span 2}.msg-right{min-width:0}.msg-name{font-size:21px;margin:1px 0 9px;color:#222}.bubble{position:relative;display:table;max-width:calc(100% - 25px);background:#fff;border-radius:0 28px 28px 28px;padding:14px 19px;font-size:24px;line-height:1.38;white-space:pre-wrap;word-break:keep-all;margin-bottom:9px}.bubble:before{content:"";position:absolute;left:-11px;top:0;border-top:12px solid #fff;border-left:12px solid transparent}.bubble .time{display:block;font-size:13px;color:#999;margin-top:7px;text-align:right}.composer{position:absolute;left:0;right:0;bottom:0;height:95px;background:#fff;display:flex;align-items:center;padding:15px 34px;gap:14px}.circle{width:54px;height:54px;border-radius:50%;background:#f1f1f1;display:flex;align-items:center;justify-content:center;font-size:31px;flex:none}.inputbar{height:58px;flex:1;background:#f1f1f1;border-radius:31px;display:flex;align-items:center;padding:0 22px;color:#aaa;font-size:22px}.hash{font-weight:700;color:#222;font-size:31px}.panel{padding:16px;align-self:start;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}.group{border-top:1px solid #eee8de;padding:18px 0}.group:first-child{border-top:0;padding-top:0}.label{font-size:14px;font-weight:650;color:#555;margin-bottom:9px}.sub{font-size:11px;color:#999;margin-bottom:7px}.field{margin-bottom:11px}input,textarea,select{width:100%;padding:9px 10px;border:1px solid #ddd6ca;border-radius:9px;background:#f9f6ef;color:#222;outline:0}textarea{min-height:90px;resize:vertical;line-height:1.55}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #d9d2c7;background:#fffdf8;border-radius:9px;padding:9px;font-size:12px}.dark{background:#171717;color:#fff;border-color:#171717}.message-editor{border:1px solid #e7e0d5;border-radius:10px;padding:10px;margin-top:8px;background:#fcfaf5}.message-editor>*{margin-bottom:7px}.message-editor button{border:0;background:#eee8df;border-radius:7px;padding:6px 9px;font-size:10px}.file{font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.color{height:40px;padding:4px}@media(max-width:760px){.layout{display:flex;flex-direction:column}.preview{order:1}.panel{order:2;position:static;max-height:none}.zoom{width:100%;margin-left:0}.zoom input{flex:1}.stage{max-width:100%}.top{padding:0 2px}}
</style>
</head>
<body>
<div class="top"><button class="home" type="button" onclick="location.href='index.html'">← 홈으로</button><div class="brand">카톡 편집기</div><div class="time" id="updatedAt">KST --:--</div></div>
<main class="layout">
<section class="preview">
<div class="tools"><b>프리뷰</b><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="10" max="100" value="40"><span id="ztext">40%</span></div></div>
<div class="stage" id="stage"><div class="scale" id="scale"><section class="chat" id="chat"><header class="chat-head"><div class="chat-brand" id="pvBrand">치킨시와</div></header><div class="chat-scroll" id="pvMessages"></div><footer class="composer"><div class="circle">＋</div><div class="inputbar" id="pvPlaceholder">메시지 입력</div><div class="circle">☻</div><div class="hash">#</div></footer></section></div></div>
</section>
<section class="panel">
<div class="group"><div class="label">채팅 기본 설정</div><div class="field"><div class="sub">채팅방 이름</div><input id="brand" value="치킨시와"></div><div class="field"><div class="sub">프로필 사진</div><input id="profileFile" class="file" type="file" accept="image/*"></div><div class="row field"><div><div class="sub">배경색</div><input id="bg" class="color" type="color" value="#a1b9cb"></div><div><div class="sub">입력창 문구</div><input id="placeholder" value="메시지 입력"></div></div></div>
<div class="group"><div class="label">메시지</div><div class="sub">날짜 · 이름 · 메시지 · 시간을 각각 설정할 수 있습니다.</div><div id="messageEditor"></div><button class="btn" id="add" style="width:100%">＋ 메시지 추가</button></div>
<div class="actions"><button class="btn" id="reset">기본값 복원</button><button class="btn dark" id="save">PNG로 저장</button></div>
</section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),STORE='kakao-editor-local-v1';
const D={brand:'치킨시와',bg:'#a1b9cb',placeholder:'메시지 입력',profile:'',messages:[
{date:'2026년 3월 25일 수요일',name:'송민기',text:'작실 ㄱ\n\n저녁 먹지 말고 와',time:['','']},
{date:'2026년 3월 26일 목요일',name:'송민기',text:'작실 ㄱ',time:['','']},
{date:'2026년 3월 29일 일요일',name:'송민기',text:'ㅈㅅ ㄱ',time:['','']},
{date:'2026년 4월 1일 수요일',name:'송민기',text:'ㄱ',time:['','']},
{date:'2026년 4월 9일 목요일',name:'송민기',text:'쇼미에 너 전남친 나오는데\n\n뭐냐 이거',time:['','']}
]};
let d=JSON.parse(JSON.stringify(D)),panX=0,panY=0;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify({d,panX,panY,zoom:+$('zoom').value}))}catch(e){}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(!x)return;if(x.d)d=Object.assign(JSON.parse(JSON.stringify(D)),x.d);panX=+x.panX||0;panY=+x.panY||0;if(Number.isFinite(+x.zoom))$('zoom').value=Math.max(10,Math.min(100,+x.zoom))}catch(e){localStorage.removeItem(STORE)}}
function render(){
$('pvBrand').textContent=d.brand;$('chat').style.background=d.bg;$('pvPlaceholder').textContent=d.placeholder;
$('pvMessages').innerHTML=d.messages.map((m,i)=>'<div class="day"><span>'+esc(m.date)+'</span></div><div class="message"><span class="profile" style="background-image:'+((d.profile)?'url("'+d.profile+'")':'none')+'"></span><div class="msg-right"><div class="msg-name">'+esc(m.name)+'</div>'+m.text.split('\n\n').filter(x=>x!=='').map((x,j)=>'<div class="bubble">'+esc(x).replace(/\n/g,'<br>')+(m.time&&m.time[j]?'<span class="time">'+esc(m.time[j])+'</span>':'')+'</div>').join('')+'</div></div>').join('');
$('brand').value=d.brand;$('bg').value=d.bg;$('placeholder').value=d.placeholder;
}
function editors(){const ed=$('messageEditor');ed.innerHTML=d.messages.map((m,i)=>'<div class="message-editor"><b>메시지 '+(i+1)+'</b><input data-date="'+i+'" value="'+esc(m.date)+'"><input data-name="'+i+'" value="'+esc(m.name)+'"><textarea data-text="'+i+'">'+esc(m.text)+'</textarea><div class="row"><input data-t0="'+i+'" placeholder="첫 말풍선 시간" value="'+esc((m.time||[])[0]||'')+'"><input data-t1="'+i+'" placeholder="둘째 말풍선 시간" value="'+esc((m.time||[])[1]||'')+'"></div><button data-del="'+i+'">삭제</button></div>').join('');
ed.querySelectorAll('[data-date]').forEach(e=>e.oninput=()=>{d.messages[+e.dataset.date].date=e.value;render();saveLocal()});ed.querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>{d.messages[+e.dataset.name].name=e.value;render();saveLocal()});ed.querySelectorAll('[data-text]').forEach(e=>e.oninput=()=>{d.messages[+e.dataset.text].text=e.value;render();saveLocal()});ed.querySelectorAll('[data-t0]').forEach(e=>e.oninput=()=>{d.messages[+e.dataset.t0].time=d.messages[+e.dataset.t0].time||[];d.messages[+e.dataset.t0].time[0]=e.value;render();saveLocal()});ed.querySelectorAll('[data-t1]').forEach(e=>e.oninput=()=>{d.messages[+e.dataset.t1].time=d.messages[+e.dataset.t1].time||[];d.messages[+e.dataset.t1].time[1]=e.value;render();saveLocal()});ed.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{d.messages.splice(+e.dataset.del,1);editors();render();saveLocal()})}
function clamp(){const st=$('stage'),n=$('chat'),z=+$('zoom').value/100,mx=Math.max(0,(n.offsetWidth*z-st.clientWidth)/2),my=Math.max(0,(n.offsetHeight*z-st.clientHeight)/2);panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY))}
function transform(){const z=+$('zoom').value/100;$('ztext').textContent=Math.round(z*100)+'%';$('scale').style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+z+')'}
function zoom(v,reset){const old=+$('zoom').value||v;v=Math.max(10,Math.min(100,+v||10));$('zoom').value=v;if(reset){panX=panY=0}else{const r=v/old;panX*=r;panY*=r}clamp();transform();saveLocal()}
function fit(){const s=$('stage');zoom(Math.max(10,Math.min(100,Math.min((s.clientWidth-20)/720,(s.clientHeight-20)/1280)*100*.92)),true)}
$('brand').oninput=()=>{d.brand=$('brand').value;render();saveLocal()};$('bg').oninput=()=>{d.bg=$('bg').value;render();saveLocal()};$('placeholder').oninput=()=>{d.placeholder=$('placeholder').value;render();saveLocal()};
$('zoom').oninput=e=>zoom(e.target.value);$('minus').onclick=()=>zoom(+$('zoom').value-5);$('plus').onclick=()=>zoom(+$('zoom').value+5);$('fit').onclick=fit;
$('add').onclick=()=>{d.messages.push({date:'2026년 4월 10일 금요일',name:'새로운 친구',text:'메시지를 입력하세요.',time:['12:00']});editors();render();saveLocal()};
$('profileFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('이미지 파일만 사용할 수 있습니다.');if(f.size>15*1024*1024)return alert('15MB 이하 이미지를 사용해주세요.');const r=new FileReader;r.onload=()=>{d.profile=r.result;render();saveLocal();requestAnimationFrame(fit)};r.readAsDataURL(f)};
$('reset').onclick=()=>{if(!confirm('기본값으로 복원할까요?'))return;d=JSON.parse(JSON.stringify(D));panX=panY=0;localStorage.removeItem(STORE);$('zoom').value=40;$('profileFile').value='';render();editors();requestAnimationFrame(fit)};
$('save').onclick=async()=>{const b=$('save');if(b.disabled)return;b.disabled=true;try{if(typeof html2canvas!=='function')throw new Error();const c=await html2canvas($('chat'),{backgroundColor:d.bg,scale:2});const a=document.createElement('a');a.download='kakao-preview.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장에 실패했습니다.')}finally{b.disabled=false}};
let drag=false,sx=0,sy=0,ox=0,oy=0;$('stage').onpointerdown=e=>{if(e.target.closest('button,input,textarea,select'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=panX;oy=panY;$('stage').setPointerCapture(e.pointerId);$('stage').classList.add('dragging')};$('stage').onpointermove=e=>{if(!drag)return;panX=ox+e.clientX-sx;panY=oy+e.clientY-sy;clamp();transform()};$('stage').onpointerup=e=>{drag=false;try{$('stage').releasePointerCapture(e.pointerId)}catch(_){}$('stage').classList.remove('dragging');saveLocal()};$('stage').onpointercancel=()=>{drag=false};
loadLocal();render();editors();$('updatedAt').textContent='KST '+new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date());requestAnimationFrame(fit);
})();
</script>
</body>
</html>
