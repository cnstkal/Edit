<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>디스패치 기사 편집기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box;letter-spacing:-.03em;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f3efe7;color:#222;font-family:Pretendard,sans-serif}
body{padding:18px 14px 40px}.top{width:min(1180px,100%);margin:0 auto 14px;display:flex;align-items:center;gap:10px}
.home{border:1px solid #d8d1c6;background:#fffdf9;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer;color:#222}.top h1{font-size:15px;margin:0;font-weight:750}
.layout{width:min(1180px,100%);margin:auto;display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}.panel{background:#fffdf9;border:1px solid #ddd7cc;border-radius:14px;padding:17px;box-shadow:0 3px 12px #7771}.panel h2{font-size:14px;margin:0 0 15px}.group{margin-bottom:16px}.group:last-child{margin-bottom:0}label{display:block;font-size:11px;color:#777;margin-bottom:6px;font-weight:650}input[type=text],textarea{width:100%;border:1px solid #d9d3c9;border-radius:8px;background:#fff;padding:9px 10px;font:inherit;font-size:12px;outline:none}textarea{min-height:150px;resize:vertical;line-height:1.7}.row{display:flex;gap:7px}.row>*{flex:1}.upload{display:block;width:100%;border:1px dashed #cfc8bc;border-radius:8px;padding:10px;text-align:center;font-size:11px;color:#777;cursor:pointer;background:#faf8f3}.upload input{display:none}.small{font-size:10px;color:#aaa;margin-top:5px}.actions{display:flex;gap:7px;margin-top:15px}.action{flex:1;border:0;border-radius:8px;padding:10px;font-size:11px;font-weight:700;cursor:pointer;background:#222;color:#fff}.action.light{background:#ece8df;color:#222}
.stage-wrap{background:#d9d4ca;border:1px solid #d0c9be;border-radius:14px;padding:20px;min-height:600px;display:flex;justify-content:center;overflow:hidden}.stage{width:min(100%,520px);background:#fff;box-shadow:0 8px 28px #3332;overflow:hidden}.dispatch{width:100%;background:#fff;color:#111}.header{padding:18px 20px 0}.brand-row{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d1d1d1}.logo{width:250px;height:72px;object-fit:contain;object-position:left center;display:block}.logo.empty{border:1px dashed #ccc;border-radius:4px}.search{width:28px;height:28px;position:relative;margin-right:2px}.search:before{content:'';position:absolute;width:15px;height:15px;border:3px solid #111;border-radius:50%;left:1px;top:1px}.search:after{content:'';position:absolute;width:10px;height:3px;background:#111;transform:rotate(48deg);left:17px;top:19px;border-radius:2px}.nav{height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #cfcfcf;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:800}.nav span:nth-child(3){color:#f0a51b}.article{padding:27px 20px 50px}.title{font-size:27px;line-height:1.28;font-weight:500;margin:0 0 20px;word-break:keep-all}.date{font-size:12px;color:#aaa;margin-bottom:18px}.photo{width:100%;aspect-ratio:16/9;object-fit:cover;display:none;margin-bottom:26px;background:#eee}.photo.show{display:block}.body{font-size:16px;line-height:1.8;word-break:keep-all;white-space:normal}.body p{margin:0 0 26px}.credit{font-size:14px;margin-top:38px}.credit:empty{display:none}
@media(max-width:800px){body{padding:12px 10px 28px}.layout{grid-template-columns:1fr}.panel{order:2}.stage-wrap{order:1;padding:10px;min-height:0}.stage{width:100%;max-width:520px}.top{margin-bottom:10px}.panel{padding:15px}}
</style>
</head>
<body>
<div class="top"><button class="home" type="button" onclick="location.href='index.html'">← 홈으로</button><h1>디스패치 기사 편집기</h1></div>
<div class="layout">
<section class="panel">
<h2>기사 설정</h2>
<div class="group"><label>디스패치 로고</label><label class="upload">이미지 업로드<input id="logoFile" type="file" accept="image/*"></label><div class="small">상단 로고 영역에 맞춰 표시됩니다.</div></div>
<div class="group"><label>기사 제목</label><textarea id="title" style="min-height:80px">이수지, 악플러 법적 대응… "선처나 합의, 없습니다"</textarea></div>
<div class="group"><label>작성일시</label><input id="date" type="text" value="2026.09.08 오후 04:49 | 2026.09.08 오후 04:50"></div>
<div class="group"><label>기사 사진</label><label class="upload">사진 업로드<input id="photoFile" type="file" accept="image/*"></label></div>
<div class="group"><label>기사 본문</label><textarea id="body">SNS 등에서 이수지를 향한 인신공격, 허위사실 유포, 명예훼손 등의 게시물이 지속적으로 확산되고 있다고 밝혔다.\n\n소속사 관계자는 "이는 아티스트의 명예와 권익을 침해하는 중대한 사안"이라며 "당사는 관련된 모든 사항을 면밀히 확인하며 철저하게 대응하고 있다"고 전했다.\n\n악성 게시물 작성자를 상대로 법적 대응을 진행한다. 소속사 측은 "민·형사상 필요한 모든 조치를 취할 것"이라며 "선처나 합의 없는 무관용 원칙으로 엄정하게 대응하겠다"고 강조했다.\n\n이수지는 지난 7월 자신의 유튜브 '핫이슈지'에 공무원들의 애로사항을 풍자한 영상을 공개했다. "재선거"를 외치는 민원인에게 "여기서 그러시면 안 된다"고 만류하는 장면이 그려졌다.\n\n이에 6·3 지방선거 투표용지 부족 사태와 관련해 재선거를 요구하는 시민들을 희화화했다는 비판이 제기됐다. 제작진은 정치적 의도가 없었다고 해명하며 해당 장면을 수정했다.\n\n이수지는 "웃음을 만들겠다는 의도와 별개로, 누군가에게 상처와 불편함을 드렸다는 점을 무겁게 받아들인다"며 "제 자신을 깊이 돌아보고, 건강한 웃음을 전하는 희극인이 되겠다"고 사과했다.</textarea></div>
<div class="group"><label>사진 출처</label><input id="credit" type="text" placeholder="예: &lt;사진=디스패치DB&gt;"></div>
<div class="actions"><button class="action light" id="reset" type="button">초기화</button><button class="action" id="save" type="button">PNG 저장</button></div>
</section>
<section class="stage-wrap"><div class="stage" id="stage"><article class="dispatch" id="dispatch">
<header class="header"><div class="brand-row"><img id="pvLogo" class="logo empty" alt="디스패치 로고"><div class="search"></div></div><nav class="nav"><span>EXCLUSIVE</span><span>FEATURE</span><span>NEWS</span><span>PHOTOS</span><span>VIDEO</span></nav></header>
<main class="article"><h2 id="pvTitle" class="title"></h2><div id="pvDate" class="date"></div><img id="pvPhoto" class="photo" alt="기사 사진"><div id="pvBody" class="body"></div><div id="pvCredit" class="credit"></div></main>
</article></div></section>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id), STORE='dispatch-editor-v1';
const fields=['title','date','body','credit'];let logo='',photo='';
function render(){
 $('pvTitle').textContent=$('title').value;
 $('pvDate').textContent=$('date').value;
 $('pvBody').innerHTML=$('body').value.split(/\n\s*\n/).map(x=>'<p>'+esc(x).replace(/\n/g,'<br>')+'</p>').join('');
 $('pvCredit').textContent=$('credit').value;
 $('pvLogo').src=logo||'';$('pvLogo').classList.toggle('empty',!logo);
 $('pvPhoto').src=photo||'';$('pvPhoto').classList.toggle('show',!!photo);
 saveLocal();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify({fields:Object.fromEntries(fields.map(x=>[x,$(x).value])),logo,photo}))}catch(e){}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(!x)return;fields.forEach(k=>{if(x.fields&&x.fields[k]!=null)$(k).value=x.fields[k]});logo=x.logo||'';photo=x.photo||''}catch(e){}}
fields.forEach(id=>$(id).addEventListener('input',render));
$('logoFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{logo=r.result;render()};r.readAsDataURL(f)});
$('photoFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)});
$('reset').onclick=()=>{if(confirm('작성한 내용을 초기화할까요?')){localStorage.removeItem(STORE);location.reload()}};
$('save').onclick=async()=>{const btn=$('save');btn.textContent='저장 중…';try{const c=await html2canvas($('dispatch'),{scale:2,useCORS:true,backgroundColor:'#fff'});const a=document.createElement('a');a.download='dispatch-article.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장에 실패했습니다.')}btn.textContent='PNG 저장'};
loadLocal();render();
})();
</script>
</body>
</html>
