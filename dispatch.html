<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>디스패치 기사 편집기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box;letter-spacing:-.03em;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f3efe7;color:#111;font-family:Pretendard,sans-serif}body{padding:12px 10px 40px}button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{width:min(1180px,100%);margin:0 auto 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.home{border:1px solid #d8d1c6;background:#fffdf9;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:700}.brand{font-size:15px;font-weight:750}.mode{border:1px solid #d8d1c6;background:#fffdf9;border-radius:10px;padding:8px 10px;font-size:11px}
.layout{width:min(1180px,100%);margin:auto;display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}.panel{background:#fffdf9;border:1px solid #ddd7cc;border-radius:14px;padding:15px;box-shadow:0 3px 12px #7771}.panel h2{font-size:14px;margin:0 0 14px}.group{margin-bottom:15px}.group:last-child{margin-bottom:0}label{display:block;font-size:11px;color:#777;margin-bottom:6px;font-weight:650}input[type=text],textarea{width:100%;border:1px solid #d9d3c9;border-radius:8px;background:#fff;padding:9px 10px;font:inherit;font-size:12px;outline:none}textarea{min-height:120px;resize:vertical;line-height:1.55}.upload{display:block;width:100%;border:1px dashed #cfc8bc;border-radius:8px;padding:10px;text-align:center;font-size:11px;color:#777;cursor:pointer;background:#faf8f3}.upload input{display:none}.small{font-size:10px;color:#aaa;margin-top:5px}.row{display:flex;gap:7px}.row>*{flex:1}.actions{display:flex;gap:7px;margin-top:15px}.action{flex:1;border:0;border-radius:8px;padding:10px;font-size:11px;font-weight:700;background:#222;color:#fff}.action.light{background:#ece8df;color:#222}.mini-edit{border-top:1px solid #eee8de;padding-top:10px;margin-top:10px}
.stage-wrap{background:#d9d4ca;border:1px solid #d0c9be;border-radius:14px;padding:12px;display:flex;justify-content:center;overflow:hidden}.stage{width:100%;max-width:920px;aspect-ratio:9/16;overflow:auto;background:#fff;box-shadow:0 8px 28px #3332}.stage.pc-frame{aspect-ratio:16/9;width:min(100%,920px);overflow:hidden}.dispatch{width:100%;background:#fff;color:#111}.header{padding:0 3.8%}.brand-row{height:86px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #d0d0d0;position:relative}.logo{width:260px;height:76px;object-fit:contain;object-position:center;display:block}.search{position:absolute;right:2px;width:28px;height:28px}.search:before{content:'';position:absolute;width:15px;height:15px;border:3px solid #111;border-radius:50%;left:1px;top:1px}.search:after{content:'';position:absolute;width:10px;height:3px;background:#111;transform:rotate(48deg);left:17px;top:19px;border-radius:2px}.nav{height:54px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid #cfcfcf;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:600}.nav span{flex:0 0 auto}.nav span:nth-child(3){color:#e8a51a}.pc-main{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:28px;padding:34px 3.8% 50px}.article{min-width:0}.title{font-size:28px;line-height:1.25;font-weight:500;margin:0 0 8px;word-break:keep-all}.date{font-size:12px;color:#aaa;margin-bottom:15px}.photo{width:100%;height:auto;aspect-ratio:auto;object-fit:contain;display:none;margin:0 0 25px;background:#eee}.photo.show{display:block}.body{font-size:16px;line-height:1.8;word-break:keep-all;white-space:normal}.body p{margin:0 0 24px}.credit{font-size:14px;margin-top:34px}.credit:empty{display:none}.side{border-left:1px solid #e1e1e1;padding-left:20px}.side h3{font-size:16px;margin:0 0 15px}.mini{margin-bottom:18px}.mini img{width:100%;aspect-ratio:1/1;height:auto;object-fit:cover;border-radius:8px;display:none;background:#eee}.mini img.show{display:block}.mini-title{font-size:13px;line-height:1.4;font-weight:500;margin-top:7px;word-break:keep-all}
@media(max-width:800px){body{padding:10px 8px 28px}.top{margin-bottom:9px}.brand{font-size:14px}.layout{display:flex;flex-direction:column}.panel{order:2;width:100%}.stage-wrap{order:1;padding:8px;width:100%}.stage{max-width:520px}.stage.pc-frame{width:100%;max-width:920px}.pc-main{display:block;padding:28px 6.5% 45px}.side{display:none}.title{font-size:27px;margin-bottom:7px}.date{margin-bottom:14px}.nav{font-size:13px;height:52px;justify-content:flex-start;gap:14px}.brand-row{height:76px;justify-content:flex-start}.logo{width:220px;height:68px}.search{display:none}.stage.pc-frame .pc-main{display:grid;grid-template-columns:minmax(0,1fr) 28%;gap:4%;padding:24px 4% 32px}.stage.pc-frame .side{display:block;padding-left:10px}.stage.pc-frame .side h3{font-size:13px;margin-bottom:10px}.stage.pc-frame .mini{margin-bottom:12px}.stage.pc-frame .mini-title{font-size:10px;margin-top:5px}.stage.pc-frame .title{font-size:20px}.stage.pc-frame .date{font-size:10px;margin-bottom:10px}.stage.pc-frame .body{font-size:12px;line-height:1.65}.stage.pc-frame .credit{font-size:10px}.stage.pc-frame .photo{margin-bottom:16px}}
</style>
</head>
<body>
<div class="top"><button class="home" type="button" onclick="location.href='index.html'">← 홈으로</button><div class="brand">에딧 소스 생성기 · 디스패치</div><select class="mode" id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select></div>
<div class="layout">
<section class="panel">
<h2>디스패치 기사 설정</h2>
<div class="group"><label>디스패치 로고</label><label class="upload">이미지 업로드<input id="logoFile" type="file" accept="image/*"></label><div class="small">상단 중앙에 표시됩니다.</div></div>
<div class="group"><label>기사 제목</label><textarea id="title" style="min-height:76px">[단독] “누가 봐도 평범한 사이는 아니었다”…마스♥정윤호, 심야 데이트 포착</textarea></div>
<div class="group"><label>작성일시</label><input id="date" type="text" value="2026.09.03 오후 02:22"></div>
<div class="group"><label>기사 사진</label><label class="upload">사진 업로드<input id="photoFile" type="file" accept="image/*"></label><div class="small">원본 사진 비율 그대로 표시됩니다. 강제 비율/크롭 없음.</div></div>
<div class="group"><label>기사 본문</label><textarea id="body">본문을 입력하세요.</textarea></div>
<div class="group"><label>사진 출처</label><input id="credit" type="text" placeholder="예: <사진=디스패치DB>"></div>
<div class="group"><label>PC 오른쪽 미니 기사 3개</label>
<div class="mini-edit"><label>1번 사진</label><label class="upload">사진 업로드<input id="miniFile1" type="file" accept="image/*"></label><input id="miniTitle1" type="text" value="관련 기사 제목을 입력하세요"></div>
<div class="mini-edit"><label>2번 사진</label><label class="upload">사진 업로드<input id="miniFile2" type="file" accept="image/*"></label><input id="miniTitle2" type="text" value="관련 기사 제목을 입력하세요"></div>
<div class="mini-edit"><label>3번 사진</label><label class="upload">사진 업로드<input id="miniFile3" type="file" accept="image/*"></label><input id="miniTitle3" type="text" value="관련 기사 제목을 입력하세요"></div>
</div>
<div class="actions"><button class="action light" id="reset" type="button">초기화</button><button class="action" id="save" type="button">PNG 저장</button></div>
</section>
<section class="stage-wrap"><div class="stage" id="stage"><article class="dispatch" id="dispatch"><header class="header"><div class="brand-row"><img id="pvLogo" class="logo" alt="디스패치 로고"><div class="search"></div></div><nav class="nav"><span>EXCLUSIVE</span><span>FEATURE</span><span>NEWS</span><span>PHOTOS</span><span>VIDEOS</span><span>FASHION</span></nav></header><div class="pc-main"><main class="article"><h2 id="pvTitle" class="title"></h2><div id="pvDate" class="date"></div><img id="pvPhoto" class="photo" alt="기사 사진"><div id="pvBody" class="body"></div><div id="pvCredit" class="credit"></div></main><aside class="side"><h3>NEWS</h3><div class="mini"><img id="pvMini1"><div id="pvMiniTitle1" class="mini-title"></div></div><div class="mini"><img id="pvMini2"><div id="pvMiniTitle2" class="mini-title"></div></div><div class="mini"><img id="pvMini3"><div id="pvMiniTitle3" class="mini-title"></div></div></aside></div></article></div></section>
</div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),STORE='dispatch-editor-v2';let logo='',photo='',mini=['','',''];const fields=['title','date','body','credit','miniTitle1','miniTitle2','miniTitle3'];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){ $('pvTitle').textContent=$('title').value;$('pvDate').textContent=$('date').value;$('pvBody').innerHTML=$('body').value.split(/\n\s*\n/).map(x=>'<p>'+esc(x).replace(/\n/g,'<br>')+'</p>').join('');$('pvCredit').textContent=$('credit').value;$('pvLogo').src=logo||'';$('pvPhoto').src=photo||'';$('pvPhoto').classList.toggle('show',!!photo);for(let i=1;i<=3;i++){const im=$('pvMini'+i),ti=$('pvMiniTitle'+i);im.src=mini[i-1]||'';im.classList.toggle('show',!!mini[i-1]);ti.textContent=$('miniTitle'+i).value}const pc=$('mode').value==='pc';$('stage').classList.toggle('pc-frame',pc);saveLocal()}
function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify({fields:Object.fromEntries(fields.map(k=>[k,$(k).value])),logo,photo,mini,mode:$('mode').value}))}catch(e){}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(!x)return;fields.forEach(k=>{if(x.fields&&x.fields[k]!=null)$(k).value=x.fields[k]});logo=x.logo||'';photo=x.photo||'';mini=Array.isArray(x.mini)?x.mini:['','',''];if(x.mode)$('mode').value=x.mode}catch(e){}}
fields.forEach(id=>$(id).addEventListener('input',render));
function file(id,cb){$(id).addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{cb(r.result);render()};r.readAsDataURL(f)})}
file('logoFile',x=>logo=x);file('photoFile',x=>photo=x);file('miniFile1',x=>mini[0]=x);file('miniFile2',x=>mini[1]=x);file('miniFile3',x=>mini[2]=x);$('mode').onchange=render;$('reset').onclick=()=>{if(confirm('작성한 내용을 초기화할까요?')){localStorage.removeItem(STORE);location.reload()}};$('save').onclick=async()=>{const b=$('save');b.textContent='저장 중…';try{const c=await html2canvas($('dispatch'),{backgroundColor:'#fff',scale:2,useCORS:true});const a=document.createElement('a');a.download='dispatch-article.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장에 실패했습니다.')}b.textContent='PNG 저장'};loadLocal();render();})();
</script>
</body></html>
