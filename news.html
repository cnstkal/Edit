@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');*{box-sizing:border-box;letter-spacing:-.04em;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f3efe7;color:#222;font-family:Pretendard,sans-serif}body{padding:12px 10px 40px}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{width:min(1120px,100%);margin:0 auto 10px;display:flex;align-items:center;justify-content:space-between}.home{border:1px solid #d8d2c8;border-radius:10px;background:#fffdf9;padding:9px 13px;font-size:12px;font-weight:700;color:#333}.brand{font-size:15px;font-weight:700}.time{font-size:11px;color:#999}.layout{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.tools,.panel{background:#fffdf8;border:1px solid #dfd9ce;border-radius:16px;box-shadow:0 5px 18px #7771}.tools{padding:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools b{font-size:13px}.tools select{width:auto}.zoom{display:flex;align-items:center;gap:5px;margin-left:auto}.zoom button{min-width:34px;padding:7px;border:1px solid #ddd6ca;background:#fffdf8;border-radius:8px}.zoom input{width:130px}.zoom span{font-size:11px;color:#888}.stage{width:100%;max-width:520px;aspect-ratio:3/4;margin:auto;overflow:hidden;background:#d9d4ca;border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}.stage.dragging{cursor:grabbing}.scale{transform-origin:center;flex:none}.news{width:720px;min-width:720px;min-height:1280px;height:auto;background:#fff;box-shadow:0 5px 24px #7772}.news.pc{width:1600px;min-width:1600px;min-height:900px}.article{padding:24px 28px 0}.publisher{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:650}.publogo,.avatar{border-radius:50%;background:#111 center/cover no-repeat;flex:none}.publogo{width:26px;height:26px}.title{font-size:26px;line-height:1.18;font-weight:650;margin:12px 0 9px;word-break:keep-all}.meta{display:flex;gap:6px;align-items:center;color:#aaa;font-size:14px}.pill{border:1px solid #ddd6ca;border-radius:18px;padding:2px 6px;font-size:9px}.photo{display:none;width:100%;aspect-ratio:16/9;object-fit:cover;margin:17px 0}.photo.show{display:block}.body{padding:21px 0 25px;border-bottom:1px solid #eee8de;font-size:19px;line-height:1.72;white-space:pre-wrap;word-break:keep-all}.body strong{font-weight:700}.comments{padding:17px 24px 24px}.chead{display:flex;justify-content:space-between;align-items:center}.count{font-size:13px;font-weight:600}.my{border:0;background:#171717;color:#fff;border-radius:20px;padding:6px 12px;font-size:11px}.stats{font-size:13px;color:#aaa;margin:4px 0 11px;line-height:1.2}.stats b{color:#555}.sort{font-size:10px;font-weight:600;padding-bottom:8px;border-bottom:1px solid #eee8de}.comment{padding:13px 0;border-bottom:1px solid #eee8de}.user{display:flex;align-items:center;gap:9px}.avatar{width:30px;height:30px}.uname{font-size:14px;font-weight:600}.ctime{font-size:11px;color:#aaa}.ctext{font-size:8px;line-height:1.45;margin:6px 0 0}.reply{font-size:9px;line-height:1;margin-top:4px}.panel{padding:16px;align-self:start;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}.group{border-top:1px solid #eee8de;padding:18px 0}.group:first-child{border-top:0;padding-top:0}.label{font-size:14px;font-weight:650;color:#555;margin-bottom:9px}.sub{font-size:11px;color:#999;margin-bottom:7px}.field{margin-bottom:11px}input,textarea,select{width:100%;padding:9px 10px;border:1px solid #ddd6ca;border-radius:9px;background:#f9f6ef;color:#222;outline:0}textarea{min-height:120px;resize:vertical;line-height:1.55}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #d9d2c7;background:#fffdf8;border-radius:9px;padding:9px;font-size:12px}.dark{background:#171717;color:#fff;border-color:#171717}.comment-editor{border:1px solid #e7e0d5;border-radius:10px;padding:9px;margin-top:8px;background:#fcfaf </style></head><body><div class="top"><button class="home" type="button" onclick="location.href='index.html'">← 홈으로</button><div class="brand">에딧 소스 생성기 · 뉴스</div><div class="time" id="updatedAt">KST --:--</div></div><main class="layout"><section class="preview"><div class="tools"><b>프리뷰</b><select id="mode"><option value="mobile">모바일 · 9:16</option><option value="pc">PC · 16:9</option></select><div class="zoom"><button type="button" id="minus">−</button><button type="button" id="fit">맞춤</button><button type="button" id="plus">＋</button><input id="zoom" type="range" min="10" max="300" value="40"><span id="ztext">40%</span></div></div><div class="stage" id="stage"><div class="scale" id="scale"><article class="news" id="news"><div class="article"><div class="publisher"><span class="publogo" id="pubLogo"></span><span id="pvPublisher">기사일보</span></div><h1 class="title" id="pvTitle">제목을 입력하세요</h1><div class="meta"><span id="pvDate">입력 2026.09.07. 오후 12:22</span><span class="pill" id="pvSource">기사원문</span></div><img id="pvPhoto" class="photo"><div class="body" id="pvBody">여기에 기사 본문을 입력하세요.</div></div><section class="comments"><div class="chead"><div class="count"><span id="pvTotal">103</span>개의 댓글</div><button class="my" type="button">MY댓글</button></div><div class="stats">현재 댓글 <b id="pvCurrent">98</b>　|　작성자 삭제 <b id="pvDeleted">5</b>　|　규정 미준수 <b id="pvRule">0</b></div><div class="sort">최신순</div><div id="pvComments"></div></section></article></div></div></section><section class="panel"><div class="group"><div class="label">기본 정보</div><div class="field"><input id="publisher" value="기사일보"></div><div class="field"><div class="sub">언론사 프로필 사진</div><input id="publisherFile" class="file" type="file" accept="image/*"></div><div class="field"><input id="title" value="제목을 입력하세요"></div><div class="field"><input id="date" value="입력 2026.09.07. 오후 12:22"></div><div class="field"><div class="sub">기사 사진</div><input id="photoFile" class="file" type="file" accept="image/*"></div></div><div class="group"><div class="label">기사 본문</div><textarea id="bodyText">여기에 기사 본문을 입력하세요.</textarea><div class="row field"><input id="bodySize" type="number" min="10" max="50" value="19"><input id="titleSize" type="number" min="18" max="70" value="26"></div><div class="row"><button class="btn" id="bold" type="button">B 굵게</button><button class="btn" id="source" type="button">기사원문 ON/OFF</button></div></div><div class="group"><div class="label">댓글 설정</div><div class="row field"><input id="total" type="number" value="103"><input id="current" type="number" value="98"></div><div class="row field"><input id="deleted" type="number" value="5"><input id="rule" type="number" value="0"></div><div id="commentEditor"></div><button class="btn" id="add" type="button" style="width:100%">＋ 댓글 추가</button></div><div class="actions"><button class="btn" id="reset" type="button">기본값 복원</button><button class="btn dark" id="save" type="button">PNG로 저장</button></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),STORE='news-editor-local-v3';const D={publisher:'기사일보',title:'제목을 입력하세요',date:'입력 2026.09.07. 오후 12:22',body:'여기에 기사 본문을 입력하세요.',bodySize:19,titleSize:26,total:103,current:98,deleted:5,rule:0,comments:[{n:'stee****',t:'2026.09.07 11:23',x:'쇼츠의 시대에 핵심만 보여주는 능력이 대단하네요.'},{n:'heav****',t:'2026.09.07 11:20',x:'정치판에서 사라져야 할 사람들, 서로 잘잘못만 따지네요.'}]};let d=JSON.parse(JSON.stringify(D)),logo='',photo='',sourceOn=true,panX=0,panY=0;const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify({d,logo,photo,sourceOn,panX,panY,zoom:+$('zoom').value,mode:$('mode').value}))}catch(e){}}function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(!x)return;if(x.d)d=Object.assign(JSON.parse(JSON.stringify(D)),x.d);logo=x.logo||'';photo=x.photo||'';sourceOn=x.sourceOn!==false;panX=+x.panX||0;panY=+x.panY||0;if(x.mode)$('mode').value=x.mode;if(Number.isFinite(+x.zoom))$('zoom').value=Math.max(10,Math.min(300,+x.zoom))}catch(e){}}function render(){
$('pvPublisher').textContent=d.publisher;$('pvTitle').textContent=d.title;$('pvTitle').style.fontSize=d.titleSize+'px';$('pvDate').textContent=d.date;$('pvBody').style.fontSize=d.bodySize+'px';$('pvBody').innerHTML=esc(d.body).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');$('pvTotal').textContent=d.total;$('pvCurrent').textContent=d.current;$('pvDeleted').textContent=d.deleted;$('pvRule').textContent=d.rule;$('pvSource').style.display=sourceOn?'inline-block':'none';$('pvPhoto').src=photo;$('pvPhoto').classList.toggle('show',!!photo);$('pubLogo').style.backgroundImage=logo?'url("'+logo+'")':'';$('pvComments').innerHTML=d.comments.map(c=>'<div class="comment"><div class="user"><span class="avatar"></span><div><div class="uname">'+esc(c.n)+'</div><div class="ctime">'+esc(c.t)+'</div></div></div><div class="ctext">'+esc(c.x)+'</div><div class="reply">답글</div></div>').join('');$('publisher').value=d.publisher;$('title').value=d.title;$('date').value=d.date;$('bodyText').value=d.body;$('bodySize').value=d.bodySize;$('titleSize').value=d.titleSize;$('total').value=d.total;$('current').value=d.current;$('deleted').value=d.deleted;$('rule').value=d.rule}function comments(){const ed=$('commentEditor');ed.innerHTML=d.comments.map((c,i)=>'<div class="comment-editor"><b>댓글 '+(i+1)+'</b><input data-n="'+i+'" value="'+esc(c.n)+'"><input data-t="'+i+'" value="'+esc(c.t)+'"><textarea data-x="'+i+'">'+esc(c.x)+'</textarea><button type="button" data-del="'+i+'">삭제</button></div>').join('');ed.querySelectorAll('[data-n]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.n].n=e.value;render();comments();saveLocal()});ed.querySelectorAll('[data-t]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.t].t=e.value;render();comments();saveLocal()});ed.querySelectorAll('[data-x]').forEach(e=>e.oninput=()=>{d.comments[+e.dataset.x].x=e.value;render();comments();saveLocal()});ed.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{d.comments.splice(+e.dataset.del,1);comments();render();saveLocal()})}function clamp(){const st=$('stage'),n=$('news'),z=+$('zoom').value/100,mx=Math.max(0,(n.offsetWidth*z-st.clientWidth)/2),my=Math.max(0,(n.offsetHeight*z-st.clientHeight)/2);panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY))}function transform(){const z=+$('zoom').value/100;$('ztext').textContent=Math.round(z*100)+'%';$('scale').style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+z+')'}function zoom(v,reset){const old=+$('zoom').value||v;v=Math.max(10,Math.min(300,+v||10));$('zoom').value=v;if(reset){panX=panY=0}else{const r=v/old;panX*=r;panY*=r}clamp();transform();saveLocal()}function fit(){const n=$('news'),s=$('stage'),w=n.classList.contains('pc')?1600:720,h=n.offsetHeight||1280;zoom(Math.min(100,Math.max(10,Math.min((s.clientWidth-20)/w,(s.clientHeight-20)/h)*100*.92)),true)}function mode(){const pc=$('mode').value==='pc';$('news').classList.toggle('pc',pc);$('scale').style.width=pc?'1600px':'720px';requestAnimationFrame(fit)}function update(){d.publisher=$('publisher').value;d.title=$('title').value;d.date=$('date').value;d.body=$('bodyText').value;d.bodySize=Math.max(10,Math.min(50,+$('bodySize').value||19));d.titleSize=Math.max(18,Math.min(70,+$('titleSize').value||26));d.total=Math.max(0,+$('total').value||0);d.current=Math.max(0,+$('current').value||0);d.deleted=Math.max(0,+$('deleted').value||0);d.rule=Math.max(0,+$('rule').value||0);render();saveLocal()}['publisher','title','date','bodyText','bodySize','titleSize','total','current','deleted','rule'].forEach(id=>$(id).addEventListener('input',update));$('mode').onchange=mode;$('zoom').oninput=e=>zoom(e.target.value,false);$('minus').onclick=()=>zoom(+$('zoom').value-10,false);$('plus').onclick=()=>zoom(+$('zoom').value+10,false);$('fit').onclick=()=>fit();$('add').onclick=()=>{d.comments.push({n:'새댓글****',t:'2026.09.09 12:00',x:'댓글 내용을 입력하세요.'});comments();render();saveLocal()};$('source').onclick=()=>{sourceOn=!sourceOn;render();saveLocal()};$('bold').onclick=()=>{const t=$('bodyText'),a=t.selectionStart,b=t.selectionEnd;if(a!==b){t.setRangeText('**'+t.value.slice(a,b)+'**',a,b,'select');t.dispatchEvent(new Event('input',{bubbles:true}))}};$('photoFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{photo=r.result;render();requestAnimationFrame(fit);saveLocal()};r.readAsDataURL(f)};$('publisherFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{logo=r.result;render();saveLocal()};r.readAsDataURL(f)};$('reset').onclick=()=>{d=JSON.parse(JSON.stringify(D));logo='';photo='';sourceOn=true;panX=panY=0;localStorage.removeItem(STORE);$('mode').value='mobile';$('zoom').value=40;comments();render();requestAnimationFrame(fit)};$('save').onclick=async()=>{try{const c=await html2canvas($('news'),{backgroundColor:'#fff',scale:2,useCORS:true});const a=document.createElement('a');a.download='news-preview.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장에 실패했습니다.')}};let dragging=false,sx=0,sy=0,ox=0,oy=0;$('stage').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(e.target.closest('button,input,textarea,select'))return;dragging=true;sx=e.clientX;sy=e.clientY;ox=panX;oy=panY;$('stage').setPointerCapture(e.pointerId);$('stage').classList.add('dragging')});$('stage').addEventListener('pointermove',e=>{if(!dragging)return;panX=ox+e.clientX-sx;panY=oy+e.clientY-sy;clamp();transform()});function end(e){if(!dragging)return;dragging=false;try{$('stage').releasePointerCapture(e.pointerId)}catch(_){}$('stage').classList.remove('dragging');saveLocal()}$('stage').addEventListener('pointerup',end);$('stage').addEventListener('pointercancel',end);window.addEventListener('resize',()=>{clamp();transform()});loadLocal();comments();render();const pc=$('mode').value==='pc';$('news').classList.toggle('pc',pc);$('scale').style.width=pc?'1600px':'720px';$('updatedAt').textContent='KST '+new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date());requestAnimationFrame(()=>{fit();const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&Number.isFinite(+s.zoom))zoom(+s.zoom,false)})})();
</script></body></html>
