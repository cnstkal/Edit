(()=>{
  function findText(root, rx){return [...root.querySelectorAll('button,a,[role="button"]')].find(x=>rx.test((x.textContent||'').trim()))}
  function run(){
    const top=document.querySelector('.top'); if(!top)return;
    let home=findText(top,/홈|home/i);
    if(home){home.classList.add('home');home.textContent='홈으로';home.setAttribute('aria-label','홈으로')}
    let save=findText(document,/PNG\s*로\s*저장|PNG\s*저장/i);
    if(save){let box=top.querySelector('.top-right');if(!box){box=document.createElement('div');box.className='top-right';top.appendChild(box)}box.appendChild(save);save.textContent='PNG로 저장';save.classList.add('save')}
    const settings=document.querySelector('.settings,.panel');
    const reset=findText(document,/기본값\s*복원|기본값\s*초기화|초기화/i);
    if(reset && settings && !settings.contains(reset)){reset.classList.add('reset');settings.appendChild(reset)}
    if(reset){reset.textContent='기본값 복원';reset.classList.add('reset')}
  }
  window.addEventListener('DOMContentLoaded',run);window.addEventListener('load',run);setTimeout(run,300);setTimeout(run,1000);
})();
