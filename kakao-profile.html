</style><script id="EDITOR_COMMON_CHROME_FIXED_JS">
(()=>{
  const q=(s,r=document)=>r.querySelector(s);
  const qa=(s,r=document)=>Array.from(r.querySelectorAll(s));
  function fixed(){
    const top=q('.top'); if(!top)return;
    const home=qa('.top a,.top .home,.top .unified-home',top)[0];
    if(home){home.textContent='홈으로';home.classList.add('unified-home');}
    let save=qa('button,a',document).find(x=>((x.textContent||'').replace(/\\s/g,'').includes('PNG로저장'))||x.id==='save'||x.id==='savePng');
    if(save){let wrap=q('.editor-save-wrap',top);if(!wrap){wrap=document.createElement('div');wrap.className='editor-save-wrap';top.appendChild(wrap)}wrap.appendChild(save);save.textContent='PNG로 저장';}
    const settings=q('.settings');
    if(settings){
      let reset=qa('button',document).find(x=>((x.textContent||'').includes('기본값 복원')));
      if(reset){reset.classList.add('editor-reset-fixed');settings.appendChild(reset);}
      const preview=q('.preview-wrap,.preview');
      if(preview && window.matchMedia('(min-width:901px)').matches){
        settings.style.height=Math.max(0,preview.scrollHeight)+'px';
      }else if(settings){settings.style.height='auto';}
    }
  }
  window.addEventListener('DOMContentLoaded',fixed);window.addEventListener('load',fixed);window.addEventListener('resize',fixed);setTimeout(fixed,250);setTimeout(fixed,1000);
})();

e" accept="image/*"><div class="hint">프로필 사진</div></div><div class="field"><div class="sub">배경 사진</div><input class="input file" id="cover" type="file" accept="image/*"><div class="hint">여기에 배경 사진을 추가하세요.</div></div></div><div class="group"><div class="gtitle">♫ 음악</div><label class="music-toggle"><input id="musicEnabled" type="checkbox" checked> 음악 표시</label><div class="music-position"><div><div class="sub">가로 위치</div><input id="musicX" type="range" min="0" max="650" value="38"></div><div><div class="sub">세로 위치</div><input id="musicY" type="range" min="0" max="500" value="55"></div></div><div class="row"><div class="field"><div class="sub">곡 제목</div><input class="input" id="musicTitle" value="여기에 음악 제목을 입력하세요."></div><div class="field"><div class="sub">가수</div><input class="input" id="musicArtist" value="여기에 가수명을 입력하세요."></div></div><div class="field"><div class="sub">앨범 이미지</div><input class="input file" id="musicImg" type="file" accept="image/*"></div></div><div class="group"><div class="gtitle">◯ 하단 버튼</div><div class="row"><div class="field"><div class="sub">왼쪽 버튼</div><input class="input" id="chat" value="1:1 채팅"></div><div class="field"><div class="sub">오른쪽 버튼</div><input class="input" id="call" value="통화"></div></div></div><div class="group"><div class="gtitle">▦ 최근 미디어</div><div class="media-editor" id="mediaEditor"></div><div class="hint">프로필 하단에 보일 사진을 최대 6장까지 추가할 수 있습니다.</div></div><div class="group"><div class="gtitle">✦ 스티커 / 텍스트</div><div class="actions-editor"><button class="btn" id="addSticker">＋ 스티커 추가</button><button class="btn" id="addText">＋ 텍스트 추가</button></div><div class="hint">사진을 스티커처럼 올리고 위치·크기를 자유롭게 조절할 수 있습니다. 개수 제한 없음.</div><div id="extraEditor"></div></div><div class="group"><div class="gtitle">저장</div><button class="btn dark save" id="save">PNG로 저장</button></div></section></main><script>

function renderMedia(){const m=$('media');m.innerHTML='';S.media.forEach((x,i)=>{const d=document.createElement('div');d.className='media-item'+(x?'':' placeholder');if(x)d.style.backgroundImage=`url(${x})`;m.appendChild(d)})}

let z=45;function applyZoom(){z=Math.max(30,Math.min(100,z));$('zoom').value=z;$('zt').textContent=z+'%';$('scale').style.width=(720*z/100)+'px';$('scale').style.height=(1280*z/100)+'px';$('scale').style.transform=`scale(${z/100})`};$('zoom').oninput=e=>{z=+e.target.value;applyZoom()};$('minus').onclick=()=>{z-=5;applyZoom()};$('plus').onclick=()=>{z+=5;applyZoom()};$('fit').onclick=()=>{z=45;applyZoom()};

<script>

  function editor(){const box=document.getElementById('extraEditor');if(!box)return;box.innerHTML='';
    S.stickers.forEach((o,i)=>{const d=document.createElement('div');d.className='extra-item';d.innerHTML='<div class="extra-head"><b>스티커 '+(i+1)+'</b><button class="btn extra-delete">삭제</button></div><input class="input" type="file" accept="image/*"><div class="extra-grid"><div class="range-wrap"><label><span>가로</span><span class="xv"></span></label><input class="x" type="range" min="0" max="680"></div><div class="range-wrap"><label><span>세로</span><span class="yv"></span></label><input class="y" type="range" min="0" max="1240"></div><div class="range-wrap"><label><span>크기</span><span class="sv"></span></label><input class="size" type="range" min="20" max="600"></div></div>';

      const x=d.querySelector('.x'),y=d.querySelector('.y'),z=d.querySelector('.size');x.value=o.x||0;y.value=o.y||0;z.value=o.size||160;d.querySelector('.xv').textContent=x.value+'px';d.querySelector('.yv').textContent=y.value+'px';d.querySelector('.sv').textContent=z.value+'px';x.oninput=()=>{o.x=+x.value;saveState();render()};y.oninput=()=>{o.y=+y.value;saveState();render()};z.oninput=()=>{o.size=+z.value;saveState();render()};d.querySelector('.extra-delete').onclick=()=>{S.stickers.splice(i,1);saveState();editor();render()};box.appendChild(d)});

<script>
(function(){
  const profile=document.getElementById('profile'),btn=document.getElementById('editMode');
  if(!profile||!btn)return;
  let editing=false,drag=null;
  const key='kakao-profile-editmode-v2';
  let saved={};
  try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}
  const pos=id=>saved[id]||{x:0,y:0};
  const save=(id,x,y)=>{saved[id]={x,y};localStorage.setItem(key,JSON.stringify(saved));};
  function ensureIds(){
    document.querySelectorAll('.profile-sticker,.profile-text').forEach((el,i)=>{
      if(!el.dataset.extraId)el.dataset.extraId=(el.classList.contains('profile-sticker')?'sticker-':'text-')+i;
    });
  }
  function apply(el,id){
    if(!el)return;
    const d=pos(id);
    el.style.transform=(d.x||d.y)?`translate(${d.x||0}px,${d.y||0}px)`:'';
  }
  function restore(){
    apply(document.getElementById('pvMusic'),'pvMusic');
    ensureIds();
    document.querySelectorAll('.profile-sticker,.profile-text').forEach(el=>apply(el,el.dataset.extraId));
  }
  function draggable(el){return !!el&&(el.id==='pvMusic'||el.classList.contains('profile-sticker')||el.classList.contains('profile-text'));}
  function down(e){
    if(!editing)return;
    const el=e.target.closest('.music,.profile-sticker,.profile-text');
    if(!draggable(el)||!profile.contains(el)||(e.pointerType==='mouse'&&e.button!==0))return;
    e.preventDefault();e.stopPropagation();
    if(el.classList.contains('profile-sticker')||el.classList.contains('profile-text'))el.style.pointerEvents='auto';
    const id=el.id==='pvMusic'?'pvMusic':(el.dataset.extraId||(el.classList.contains('profile-sticker')?'sticker-'+Date.now():'text-'+Date.now()));
    el.dataset.extraId=id;
    const d=pos(id);
    drag={el,id,startX:e.clientX,startY:e.clientY,x:Number(d.x)||0,y:Number(d.y)||0,pointerId:e.pointerId};
    try{el.setPointerCapture(e.pointerId)}catch(_){ }
  }
  function move(e){
    if(!drag||e.pointerId!==drag.pointerId)return;
    e.preventDefault();
    const stage=document.getElementById('stage');
    const ratio=stage&&stage.clientWidth?720/stage.clientWidth:1;
    const x=drag.x+(e.clientX-drag.startX)*ratio;
    const y=drag.y+(e.clientY-drag.startY)*ratio;
    drag.el.style.transform=`translate(${x}px,${y}px)`;
    drag.current={x,y};
  }
  function up(e){
    if(!drag)return;
    if(drag.current)save(drag.id,drag.current.x,drag.current.y);
    drag=null;
  }
  btn.addEventListener('click',()=>{
    editing=!editing;
    profile.classList.toggle('editing',editing);
    btn.classList.toggle('on',editing);
    btn.textContent=editing?'편집모드 ON':'편집모드 OFF';
    restore();
  });
  profile.addEventListener('pointerdown',down,true);
  profile.addEventListener('pointermove',move,true);
  profile.addEventListener('pointerup',up,true);
  profile.addEventListener('pointercancel',up,true);
  const observer=new MutationObserver(()=>{if(!drag)restore()});
  observer.observe(document.getElementById('overlayLayer')||profile,{childList:true,subtree:true});
  restore();
})();</script>\n<script>\n/* KAKAO_PROFILE_STABILITY_V1 */\n(function(){\n  const root=document.getElementById('profile');\n  if(!root)return;\n  const STORAGE='kakao-profile-editor-v1';\n  const POSITION='kakao-profile-editmode-v2';\n  function cleanState(v){\n    if(!v||typeof v!=='object')return null;\n    if(!Array.isArray(v.media))v.media=['','','','','',''];\n    v.media=Array.from({length:6},(_,i)=>typeof v.media[i]==='string'?v.media[i]:'');\n    if(!Array.isArray(v.stickers))v.stickers=[];\n    if(!Array.isArray(v.texts))v.texts=[];\n    v.stickers=v.stickers.filter(x=>x&&typeof x==='object'&&typeof x.src==='string').slice(-50);\n    v.texts=v.texts.filter(x=>x&&typeof x==='object').slice(-50);\n    return v;\n  }\n  try{\n    const raw=localStorage.getItem(STORAGE);\n    const parsed=raw?JSON.parse(raw):null;\n    const fixed=cleanState(parsed);\n    if(fixed)Object.assign(window.S||{},fixed);\n  }catch(e){\n    try{localStorage.removeItem(STORAGE)}catch(_){}\n  }\n  const originalSave=window.saveState;\n  window.saveState=function(){\n    try{\n      if(typeof originalSave==='function'){originalSave();return;}\n      localStorage.setItem(STORAGE,JSON.stringify(window.S));\n    }catch(e){\n      try{\n        const data=Object.assign({},window.S||{});\n        if(Array.isArray(data.media))data.media=data.media.map((x,i)=>i<3?x:'');\n        if(Array.isArray(data.stickers))data.stickers=data.stickers.slice(-10);\n        if(Array.isArray(data.texts))data.texts=data.texts.slice(-20);\n        localStorage.setItem(STORAGE,JSON.stringify(data));\n      }catch(_){/* keep current state in memory */}\n    }\n  };\n  window.addEventListener('error',e=>{\n    if(e&&e.message&&/quota|storage/i.test(e.message)){try{e.preventDefault()}catch(_){}}\n  });\n  window.addEventListener('unhandledrejection',e=>{\n    if(e&&e.reason&&/quota|storage/i.test(String(e.reason))){try{e.preventDefault()}catch(_){}}\n  });\n  window.addEventListener('beforeunload',()=>{try{window.saveState()}catch(_){}});\n  const mo=new MutationObserver(()=>{\n    document.querySelectorAll('img').forEach(img=>{\n      if(!img.dataset.safeLoad){\n        img.dataset.safeLoad='1';\n        img.addEventListener('error',()=>{img.removeAttribute('src');},{once:true});\n      }\n    });\n  });\n  mo.observe(root,{childList:true,subtree:true});\n})();\n</script>\n
