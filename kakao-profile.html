<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>카톡 프로필 편집기</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>
*{box-sizing:border-box;letter-spacing:-.04em}html,body{margin:0;background:#f3f1ed;color:#202124;font-family:Arial,'Noto Sans KR',sans-serif}body{padding:12px 10px 40px}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{width:min(1120px,100%);margin:auto auto 10px;display:flex;justify-content:center;align-items:center}.home{position:absolute;left:10px;border:1px solid #ddd9d2;border-radius:10px;background:#fff;padding:9px 13px;font-size:12px;font-weight:700}.layout{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(520px,760px);gap:28px}.tools,.panel{background:#fff;border:1px solid #dedbd6;border-radius:16px;box-shadow:0 4px 18px #0000000c}.tools{padding:10px 12px;display:flex;gap:8px;align-items:center;margin-bottom:22px}.zoom{margin-left:auto;display:flex;gap:5px;align-items:center}.zoom button{min-width:34px;padding:7px;border:1px solid #ddd9d2;background:#fff;border-radius:8px}.zoom input{width:130px}.stage{width:100%;max-width:405px;aspect-ratio:9/16;margin:auto;overflow:hidden;background:#ddd9d2;border-radius:14px;display:flex;align-items:center;justify-content:center;touch-action:none}.scale{transform-origin:center;flex:none}.profile{width:720px;height:1280px;position:relative;overflow:hidden;background:#999;display:flex;flex-direction:column;color:#fff}.cover{position:absolute;inset:0;background:#777 center/cover no-repeat}.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.02) 28%,rgba(0,0,0,.08) 48%,rgba(235,235,235,.78) 73%,#aaa 82%,#aaa 100%)}.profile-content{position:relative;z-index:2;margin-top:auto;padding:0 38px 38px}.music{position:absolute;z-index:3;top:55px;left:38px;width:390px;height:88px;border-radius:16px;background:rgba(255,255,255,.96);color:#222;display:flex;align-items:center;overflow:hidden;box-shadow:0 2px 8px #0002}.music img{width:88px;height:88px;object-fit:cover;background:#ddd}.music-info{padding:0 14px;min-width:0;flex:1}.music-title{font-size:25px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.music-artist{font-size:20px;color:#999;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play{font-size:38px;padding-right:18px;color:#333}.likes{position:absolute;z-index:3;top:405px;left:0;right:0;text-align:center;font-size:29px;font-weight:800;text-shadow:0 2px 5px #0008}.likes span{font-size:31px}.cup{margin-top:8px;font-size:27px}.avatar{width:118px;height:118px;border-radius:50%;object-fit:cover;background:#ddd;display:block;margin-bottom:25px;border:0}.profile-name{font-size:51px;font-weight:800;margin-bottom:40px}.actions{height:84px;border:2px solid rgba(255,255,255,.72);border-radius:18px;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;background:rgba(150,150,150,.28);backdrop-filter:blur(5px)}.actions .divider{height:58px;background:rgba(255,255,255,.72)}.action{display:flex;align-items:center;justify-content:center;gap:14px;font-size:30px}.action-icon{font-size:37px;line-height:1}.media{position:absolute;z-index:2;left:0;right:0;bottom:0;height:470px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#aaa}.media-item{position:relative;overflow:hidden;background:#777 center/cover no-repeat}.media-item.placeholder{background:#333}.media-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:27px;text-shadow:0 2px 6px #000}.panel{padding:14px;align-self:start;width:100%;max-width:760px;justify-self:center}.group{border-bottom:1px solid #eeeae4;padding:18px 8px}.group:first-child{padding-top:5px}.group:last-child{border-bottom:0}.gtitle{font-size:15px;font-weight:800;margin-bottom:14px}.field{margin-bottom:13px}.sub{font-size:12px;color:#777;margin-bottom:6px}.input,textarea,select{width:100%;padding:10px;border:1px solid #ddd9d2;border-radius:10px;background:#faf9f7}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file{font-size:11px}.btn{width:100%;border:1px solid #ddd9d2;background:#fff;border-radius:9px;padding:9px;font-size:12px}.dark{background:#171717;color:#fff;border-color:#171717}.actions-editor{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:11px;color:#999;line-height:1.5;margin-top:6px}.media-editor{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.media-box{border:1px solid #e5e1db;border-radius:10px;padding:8px}.media-box b{font-size:11px;display:block;margin-bottom:6px}.media-box input{font-size:10px;min-width:0}.save{margin-top:8px}.swatch{width:54px;height:54px;border-radius:9px;background:#ddd center/cover no-repeat;border:1px solid #ddd9d2}
@media(max-width:900px){.layout{display:flex;flex-direction:column}.preview{order:1}.panel{order:2;width:100%;max-width:760px;margin:auto}.zoom{width:100%;margin-left:0}.zoom input{flex:1}.home{left:10px}}
@media(max-width:760px){.layout{display:flex;flex-direction:column}.preview{order:1}.panel{order:2}.stage{max-width:min(100%,405px)}.music{transform:scale(.82);transform-origin:left top}.likes{top:360px}.profile-content{padding-left:30px;padding-right:30px}.profile-name{font-size:42px}.avatar{width:100px;height:100px}.action{font-size:25px}.action-icon{font-size:32px}}

html,body{width:100%;max-width:100%;overflow-x:hidden}
.layout{min-width:0}
.preview,.panel{min-width:0}
.scale{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.stage{width:min(100%,405px);min-width:0}
@media(max-width:900px){
  .layout{width:100%;max-width:100%;min-width:0;gap:18px}
  .preview{width:100%;min-width:0}
  .panel{width:100%;max-width:100%;min-width:0}
  .tools{width:100%;min-width:0;overflow:hidden}
  .zoom{min-width:0}
  .zoom input{min-width:0}
  .stage{width:min(100%,405px);max-width:405px}
}
</style></head><body><div class="top"><button class="home" onclick="location.href='kakao.html'">← 카톡</button><b>카톡 프로필</b></div><main class="layout"><section class="preview"><div class="tools"><span style="font-size:12px;font-weight:700">모바일 · 9:16</span><div class="zoom"><button id="minus">−</button><button id="fit">맞춤</button><button id="plus">＋</button><input id="zoom" type="range" min="30" max="100" value="45"><span id="zt">45%</span></div></div><div class="stage" id="stage"><div class="scale" id="scale"><section class="profile" id="profile"><div class="cover" id="pvCover"></div><div class="music"><img id="pvMusicImg"><div class="music-info"><div class="music-title" id="pvMusicTitle">여기에 음악 제목을 입력하세요.</div><div class="music-artist" id="pvMusicArtist">여기에 가수명을 입력하세요.</div></div><div class="play">▷</div></div><div class="likes">♥ +<span id="pvLikes">196</span><div class="cup">☕</div></div><div class="profile-content"><img class="avatar" id="pvAvatar"><div class="profile-name" id="pvName">여기에 이름을 입력하세요.</div><div class="actions"><div class="action"><span class="action-icon">◯</span><span id="pvChat">1:1 채팅</span></div><div class="divider"></div><div class="action"><span class="action-icon">⌕</span><span id="pvCall">통화</span></div></div></div><div class="media" id="media"></div></section></div></div></section><section class="panel"><div class="group"><div class="gtitle">✚ 기본 설정</div><div class="field"><div class="sub">이름</div><input class="input" id="name" value="여기에 이름을 입력하세요."></div><div class="field"><div class="sub">프로필 사진</div><input class="input file" id="avatar" type="file" accept="image/*"><div class="hint">여기에 프로필 사진을 추가하세요.</div></div><div class="field"><div class="sub">배경 사진</div><input class="input file" id="cover" type="file" accept="image/*"><div class="hint">여기에 배경 사진을 추가하세요.</div></div></div><div class="group"><div class="gtitle">♫ 음악</div><div class="row"><div class="field"><div class="sub">곡 제목</div><input class="input" id="musicTitle" value="여기에 음악 제목을 입력하세요."></div><div class="field"><div class="sub">가수</div><input class="input" id="musicArtist" value="여기에 가수명을 입력하세요."></div></div><div class="field"><div class="sub">앨범 이미지</div><input class="input file" id="musicImg" type="file" accept="image/*"></div></div><div class="group"><div class="gtitle">♡ 반응</div><div class="field"><div class="sub">좋아요 수</div><input class="input" id="likes" type="number" min="0" value="196"></div></div><div class="group"><div class="gtitle">◯ 하단 버튼</div><div class="row"><div class="field"><div class="sub">왼쪽 버튼</div><input class="input" id="chat" value="1:1 채팅"></div><div class="field"><div class="sub">오른쪽 버튼</div><input class="input" id="call" value="통화"></div></div></div><div class="group"><div class="gtitle">▦ 최근 미디어</div><div class="media-editor" id="mediaEditor"></div><div class="hint">프로필 하단에 보일 사진을 최대 6장까지 추가할 수 있습니다.</div></div><div class="group"><div class="gtitle">저장</div><button class="btn dark save" id="save">PNG로 저장</button></div></section></main><script>
const D={name:'여기에 이름을 입력하세요.',musicTitle:'여기에 음악 제목을 입력하세요.',musicArtist:'여기에 가수명을 입력하세요.',likes:196,chat:'1:1 채팅',call:'통화',avatar:'',cover:'',musicImg:'',media:['','','','','','']};
let S=JSON.parse(localStorage.getItem('kakao-profile-editor-v1')||'null')||D;
const $=id=>document.getElementById(id); const sync=(id,key)=>$(id).addEventListener('input',()=>{S[key]=$(id).value;render();saveState()});
['name','musicTitle','musicArtist','likes','chat','call'].forEach(id=>sync(id,id));
function file(id,key,cb){$(id).addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{S[key]=r.result;render();saveState();cb&&cb()};r.readAsDataURL(f)})}
file('avatar','avatar');file('cover','cover');file('musicImg','musicImg');
function saveState(){localStorage.setItem('kakao-profile-editor-v1',JSON.stringify(S))}
function render(){ $('pvName').textContent=S.name;$('pvMusicTitle').textContent=S.musicTitle;$('pvMusicArtist').textContent=S.musicArtist;$('pvLikes').textContent=S.likes;$('pvChat').textContent=S.chat;$('pvCall').textContent=S.call;$('pvAvatar').src=S.avatar||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22118%22 height=%22118%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23ddd%22/%3E%3C/svg%3E';$('pvCover').style.backgroundImage=S.cover?`url(${S.cover})`:'linear-gradient(135deg,#75806c,#38443c)';$('pvMusicImg').src=S.musicImg||$('pvAvatar').src;renderMedia()}
function renderMedia(){const m=$('media');m.innerHTML='';S.media.forEach((x,i)=>{const d=document.createElement('div');d.className='media-item'+(x?'':' placeholder');if(x)d.style.backgroundImage=`url(${x})`;else if(i===0){d.innerHTML='<div class="media-label">방금 본 미디어</div>'}m.appendChild(d)})}
function makeMediaEditor(){const box=$('mediaEditor');box.innerHTML='';S.media.forEach((x,i)=>{const d=document.createElement('div');d.className='media-box';d.innerHTML=`<b>사진 ${i+1}</b><input type="file" accept="image/*">`;d.querySelector('input').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.media[i]=r.result;render();saveState()};r.readAsDataURL(f)});box.appendChild(d)})}
$('save').onclick=async()=>{try{const c=await html2canvas($('profile'),{scale:1,useCORS:true,backgroundColor:null});const a=document.createElement('a');a.download='kakao-profile.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장에 실패했습니다.')}};
let z=45;function applyZoom(){z=Math.max(30,Math.min(100,z));$('zoom').value=z;$('zt').textContent=z+'%';$('scale').style.transform=`scale(${z/100})`};$('zoom').oninput=e=>{z=+e.target.value;applyZoom()};$('minus').onclick=()=>{z-=5;applyZoom()};$('plus').onclick=()=>{z+=5;applyZoom()};$('fit').onclick=()=>{z=45;applyZoom()};
makeMediaEditor();render();applyZoom();
</script></body></html>
