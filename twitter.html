<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>트위터 설정</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3efe7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.top{height:64px;background:#fffdf9;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:5}
.top a{color:#111;text-decoration:none;font-weight:700}
.top h1{margin:auto;font-size:18px}
.layout{width:min(760px,100%);margin:auto;padding:18px 10px 50px;display:flex;flex-direction:column;gap:18px}
.preview-wrap{order:1}.settings{order:2}
.stage{width:min(100%,390px);aspect-ratio:9/16;margin:auto;background:#fff;overflow:hidden;border:1px solid #ddd;box-shadow:0 8px 30px #0001}
.screen{width:100%;height:100%;overflow:hidden;background:#fff;color:#111}
.twitter-head{height:13%;min-height:70px;border-bottom:1px solid #e5e7e9}
.tabs{height:100%;display:flex;align-items:flex-end;justify-content:space-around}
.tab{font-size:18px;color:#5f707b;font-weight:500;height:58%;display:flex;align-items:center;position:relative}
.tab.active{font-weight:800;color:#111}.tab.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:#1d9bf0;border-radius:4px}
.feed{height:87%;overflow:hidden}
.tweet{position:relative;padding:17px 15px 15px 72px;border-bottom:1px solid #e3e5e7;min-height:18%;background:#fff}
.avatar{position:absolute;left:15px;top:18px;width:45px;height:45px;border-radius:50%;object-fit:cover;background:#e9ecef;display:block}
.identity{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;padding-right:18px}
.name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.handle,.time{color:#60727d;font-size:13px}
.lock{width:16px;height:16px;display:inline-block;flex:0 0 16px;margin-left:0;object-fit:contain;vertical-align:middle}
.more{position:absolute;right:14px;top:17px;color:#53636d}
.tweet-text{font-size:16px;line-height:1.4;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{pointer-events:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 24px 30px;margin-top:11px;color:#53636d;align-items:center}
.act{pointer-events:auto;display:flex;justify-content:flex-start;align-items:center;gap:3px;font-size:11px;min-width:0;white-space:nowrap;border:0;background:transparent;padding:0;color:inherit}
.act:nth-child(5),.act:nth-child(6){justify-content:center;gap:0}
.ico{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 19px}
.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act.active-repost{color:#00ba7c}.act.active-like{color:#f91880}.act.active-bookmark{color:#1d9bf0}.act.active-like .ico svg,.act.active-bookmark .ico svg{fill:currentColor}.act.disabled{color:#b9c1c5;cursor:default}.empty{color:#53636d}.screen.theme-dark{background:#000;color:#f7f9f9}.screen.theme-dark .twitter-head{border-color:#2f3336}.screen.theme-dark .tweet{background:#000;border-color:#2f3336}.screen.theme-dark .tab{color:#8b98a5}.screen.theme-dark .tab.active{color:#f7f9f9}.screen.theme-dark .handle,.screen.theme-dark .time{color:#8b98a5}.screen.theme-dark .more{color:#8b98a5}.screen.theme-dark .actions{color:#8b98a5}.screen.theme-dark .empty{color:#8b98a5}.screen.theme-dark .avatar{background:#2f3336}
.section{background:#fff;border:1px solid #dedbd6;border-radius:16px;padding:18px 15px;margin-bottom:12px}
.section h2{font-size:15px;margin:0 0 13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid #d8dce0;border-radius:10px;padding:10px;outline:none;background:#fff}
.field textarea{min-height:75px;resize:vertical}
.check{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:9px}
.tweet-card{border:1px solid #e5e1db;border-radius:10px;padding:12px;margin:10px 0;background:#faf9f7}
.tweet-head{display:flex;justify-content:space-between;align-items:center}
.danger{color:#c62828;background:#fff0f0;border:1px solid #ffd4d4;border-radius:8px;padding:6px 9px;font-size:12px}
.add,.save,.tool{width:100%;height:42px;border-radius:9px;border:1px solid #ddd;background:#fff;font-weight:700}
.save{background:#111;color:#fff;border:0}.toolbar{display:flex;justify-content:flex-end;margin-bottom:8px}.tool{width:auto;padding:0 12px;height:36px;font-size:12px}
input:not([type="checkbox"]):not([type="radio"]),textarea,select{font-size:16px!important}
@media(max-width:560px){.row{grid-template-columns:1fr}.top{height:56px}.section{padding:16px 14px}.tweet-text{font-size:16px}}
.tw-ui-icon{width:21px;height:21px;display:block;object-fit:contain;flex:0 0 21px}
</style>

<style>
/* Match the original Twitter feed geometry/icons */
.twitter-head{height:13%;min-height:78px}
.tabs{padding:0 10%;gap:30px}
.tab{font-size:clamp(18px,4vw,25px);height:57%}
.tab.active:after{height:5px;border-radius:4px}
.tweet{padding:18px 18px 16px 78px;min-height:18.2%;font-size:14px}
.avatar{left:18px;top:20px;width:48px;height:48px}
.identity{gap:5px;padding-right:22px}

.handle,.time{font-size:14px}

</style>

<style>
/* ORIGINAL TWITTER FEED GEOMETRY v2 */
.twitter-head{height:13%;min-height:78px}
.tabs{padding:0 10%;gap:30px}
.tab{font-size:clamp(18px,4vw,25px);height:57%}
.tab.active:after{height:5px;border-radius:4px}
.tweet{padding:18px 18px 16px 78px;min-height:18.2%;font-size:14px}

.name{font-size:16px}
.handle,.time{font-size:14px}
.more{right:17px;top:20px;font-size:16px;letter-spacing:3px}
.tweet-text{font-size:17px;line-height:1.38;margin-top:9px}

.act{justify-content:center;gap:4px;font-size:13px}
.ico{width:21px;height:21px;flex-basis:21px}
.ico svg{width:20px;height:20px;stroke-width:1.7}
@media(max-width:560px){.tweet{padding-left:72px}.tweet-text{font-size:16px}.actions{gap:0}.act{font-size:11px}.num{font-size:11px}.tab{font-size:18px}}

<body>
<header class="top"><a href="index.html">← 홈</a><h1>트위터 설정</h1><span style="width:34px"></span></header>
<main class="layout">
<section class="preview-wrap">
<div class="toolbar"><button class="tool" id="reset">기본값 복원</button></div>
<div class="stage"><div class="screen" id="screen"><div class="twitter-head"><div class="tabs"><div class="tab" id="pvTab1"></div><div class="tab active" id="pvTab2"></div></div></div><div class="feed" id="feed"></div></div></div>
</section>
<section class="settings">
<div class="section"><h2>기본 정보</h2><div class="row"><div class="field"><label>첫 번째 탭</label><input id="tab1"></div><div class="field"><label>두 번째 탭</label><input id="tab2"></div></div><label class="check"><input id="activeTab" type="checkbox"><span>두 번째 탭을 활성화</span></label></div>
<div class="section"><h2>게시글</h2><div id="tweets"></div><button class="add" id="addTweet">＋ 게시글 추가</button></div>
<div class="section"><h2>화면 표시</h2><div class="row"><div class="field"><label>배경 테마</label><select id="theme"><option value="white">화이트</option><option value="black">블랙</option></select></div><div class="field"><label>글 크기</label><select id="scale"><option value="normal">기본</option><option value="large">크게</option></select></div></div></div>
<button class="save" id="savePng">PNG로 저장</button>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),KEY='twitter-editor-v2';
const LOCK='이미지/img-f028c6992e04.webp';
const blank=()=>({name:'',handle:'@username***',time:'',text:'',reply:'',repost:'',like:'',views:'',avatar:'',lock:true,reposted:false,liked:false,bookmarked:false});
function defaults(){return{tab1:'추천',tab2:'팔로잉',activeTab:true,theme:'white',scale:'normal',tweets:[blank(),blank(),blank()]}}
function normalize(x){const d=defaults();if(!x||typeof x!=='object')return d;x.tweets=Array.isArray(x.tweets)&&x.tweets.length?x.tweets.map(t=>{const n=Object.assign(blank(),t||{});if(n.name==='이름')n.name='';if(n.time==='시간')n.time='';if(n.text==='게시글')n.text='';return n}):d.tweets;x.tab1=String(x.tab1??d.tab1);x.tab2=String(x.tab2??d.tab2);x.activeTab=x.activeTab!==false;x.theme=x.theme==='black'?'black':'white';x.scale=x.scale==='large'?'large':'normal';return x}
function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return defaults()}}
let S=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]||c))}
const icon={reply:'<img class="tw-ui-icon" src="이미지/twitter-reply.webp">',repost:'<img class="tw-ui-icon" src="이미지/twitter-repost.webp">',like:'<img class="tw-ui-icon" src="이미지/twitter-like.webp">',views:'<img class="tw-ui-icon" src="이미지/twitter-views.webp">',bookmark:'<img class="tw-ui-icon" src="이미지/twitter-bookmark.webp">',share:'<img class="tw-ui-icon" src="이미지/twitter-share.webp">'};
function renderEditor(){
$('tab1').value=S.tab1;$('tab2').value=S.tab2;$('activeTab').checked=S.activeTab;$('theme').value=S.theme;$('scale').value=S.scale;
const box=$('tweets');box.innerHTML='';
S.tweets.forEach((t,i)=>{
const c=document.createElement('div');c.className='tweet-card';
c.innerHTML='<div class="tweet-head"><b>게시글 '+(i+1)+'</b>'+(S.tweets.length>1?'<button class="danger" data-del="'+i+'">삭제</button>':'')+'</div><div class="row"><div class="field"><label>이름</label><input placeholder="이름" data-i="'+i+'" data-k="name"></div><div class="field"><label>아이디</label><input placeholder="@username" data-i="'+i+'" data-k="handle"></div></div><div class="row"><div class="field"><label>작성 시간</label><input placeholder="시간" data-i="'+i+'" data-k="time"></div><div class="field"><label>프로필 사진</label><input type="file" accept="image/*" data-i="'+i+'" data-k="avatar"></div></div><div class="field"><label>게시글 내용</label><textarea placeholder="게시글" data-i="'+i+'" data-k="text"></textarea></div><div class="row"><div class="field"><label>댓글 수</label><input data-i="'+i+'" data-k="reply"></div><div class="field"><label>리포스트 수</label><input data-i="'+i+'" data-k="repost"></div></div><div class="row"><div class="field"><label>좋아요 수</label><input data-i="'+i+'" data-k="like"></div><div class="field"><label>조회 수</label><input data-i="'+i+'" data-k="views"></div></div><label class="check"><input type="checkbox" data-i="'+i+'" data-k="lock"><span>비공개 계정 자물쇠 표시</span></label>';
box.appendChild(c);
c.querySelectorAll('[data-i][data-k]').forEach(el=>{
const k=el.dataset.k;
if(el.type==='checkbox')el.checked=!!t[k];
else if(el.type!=='file')el.value=t[k]??'';
el.addEventListener('input',e=>{if(e.target.type==='file')return;S.tweets[i][k]=e.target.type==='checkbox'?e.target.checked:e.target.value;persist();renderPreview()});
el.addEventListener('change',e=>{
if(k==='avatar'&&e.target.type==='file'){
const file=e.target.files&&e.target.files[0];if(!file)return;
const reader=new FileReader();reader.onload=ev=>{
const img=new Image();img.onload=()=>{const size=256,canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');const r=Math.min(img.width,img.height),sx=(img.width-r)/2,sy=(img.height-r)/2;ctx.drawImage(img,sx,sy,r,r,0,0,size,size);S.tweets[i].avatar=canvas.toDataURL('image/jpeg',0.88);persist();renderPreview()};img.src=ev.target.result};reader.readAsDataURL(file);return}
S.tweets[i][k]=e.target.type==='checkbox'?e.target.checked:e.target.value;persist();renderPreview()})
});
});
box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.tweets.splice(+b.dataset.del,1);persist();renderEditor();renderPreview()})
}
function renderPreview(){
$('pvTab1').textContent=S.tab1;$('pvTab2').textContent=S.tab2;$('pvTab1').classList.toggle('active',!S.activeTab);$('pvTab2').classList.toggle('active',S.activeTab);$('screen').dataset.scale=S.scale;$('screen').classList.toggle('theme-dark',S.theme==='black');$('screen').style.background=S.theme==='black'?'#000':'#fff';$('feed').style.background='transparent';
const profileData=(()=>{try{return JSON.parse(localStorage.getItem('twitter-profile-v1')||'{}')}catch(e){return{}}})();
const profileAvatar=profileData.avatar||'';
$('feed').innerHTML=S.tweets.map((t,i)=>'<article class="tweet">'+((t.avatar||profileAvatar)?'<img class="avatar" src="'+esc(t.avatar||profileAvatar)+'" alt="">':'<div class="avatar" aria-hidden="true"></div>')+'<div class="identity"><span class="name">'+esc(t.name)+'</span>'+(t.lock?'<img class="lock" src="'+LOCK+'" alt="">':'')+'<span class="handle">'+esc(t.handle)+'</span><span class="time">'+(t.time?'· '+esc(t.time):'')+'</span></div><span class="more">•••</span><div class="tweet-text">'+esc(t.text)+'</div><div class="actions"><button class="act '+(t.reply?'':'empty')+'" type="button"><i class="ico">'+icon.reply+'</i><span>'+esc(t.reply)+'</span></button><button class="act '+(t.reposted?'active-repost':'')+(t.lock?' disabled':'')+'" type="button" data-action="repost" data-i="'+i+'" '+(t.lock?'disabled':'')+'><i class="ico">'+icon.repost+'</i><span>'+esc(t.repost)+'</span></button><button class="act '+(t.liked?'active-like':'')+'" type="button" data-action="like" data-i="'+i+'"><i class="ico">'+icon.like+'</i><span>'+esc(t.like)+'</span></button><button class="act" type="button"><i class="ico">'+icon.views+'</i><span>'+esc(t.views)+'</span></button><button class="act '+(t.bookmarked?'active-bookmark':'')+'" type="button" data-action="bookmark" data-i="'+i+'"><i class="ico">'+icon.bookmark+'</i></button><button class="act" type="button"><i class="ico">'+icon.share+'</i></button></div></article>').join('')}
$('feed').onclick=e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const i=+btn.dataset.i,action=btn.dataset.action;if(action==='repost'&&S.tweets[i].lock)return;if(action==='repost')S.tweets[i].reposted=!S.tweets[i].reposted;if(action==='like')S.tweets[i].liked=!S.tweets[i].liked;if(action==='bookmark')S.tweets[i].bookmarked=!S.tweets[i].bookmarked;persist();renderPreview()};
function render(){renderEditor();renderPreview()}
['tab1','tab2','theme','scale'].forEach(id=>$(id).addEventListener('input',e=>{S[id]=e.target.value;persist();renderPreview()}));
$('activeTab').addEventListener('change',e=>{S.activeTab=e.target.checked;persist();renderPreview()});
$('addTweet').addEventListener('click',()=>{S.tweets.push(blank());persist();renderEditor();renderPreview()});
$('reset').addEventListener('click',()=>{if(confirm('기본값으로 복원할까요?')){S=defaults();persist();render()}});
$('savePng').addEventListener('click',async()=>{const c=await html2canvas($('screen'),{scale:3,useCORS:true,backgroundColor:'#fff'});const a=document.createElement('a');a.download='twitter.png';a.href=c.toDataURL('image/png');a.click()});
render()
})();
</script>

<style>

@media(min-width:901px){
  .layout{width:min(1280px,100%);display:grid;grid-template-columns:minmax(420px,520px) minmax(520px,760px);gap:24px;align-items:start}
  .preview-wrap{order:1;min-width:0}.settings{order:2;width:100%;max-width:760px;justify-self:center}.stage{width:min(100%,420px);margin:0 auto}
}
.actions{grid-template-columns:repeat(4,minmax(0,1fr)) 20px 20px!important;column-gap:0!important;align-items:center}
.act{gap:3px!important}.act .tw-ui-icon{width:18px!important;height:18px!important;flex-basis:18px!important;opacity:.92}
.act:nth-child(1){justify-content:flex-start!important}.act:nth-child(2),.act:nth-child(3),.act:nth-child(4){justify-content:center!important}
.act:nth-child(5){justify-self:end!important;justify-content:center!important;margin-right:0!important}.act:nth-child(6){justify-self:start!important;justify-content:center!important;margin-left:0!important}
.act.tw-extra-active{font-weight:600}.act.tw-extra-repost{color:#00ba7c!important}.act.tw-extra-like{color:#f91880!important}.act.tw-extra-bookmark{color:#1d9bf0!important}.act.tw-extra-active .tw-ui-icon{opacity:1}
.tweet-extra-photo{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-top:10px;border:1px solid #e5e7e9}
.tweet-photo-editor{display:flex;align-items:center;gap:8px;margin-top:7px}.tweet-photo-editor input{flex:1;min-width:0}.tweet-photo-clear{border:1px solid #ffd4d4;background:#fff0f0;color:#c62828;border-radius:8px;padding:6px 9px;font-size:11px;white-space:nowrap}

<script>

(()=>{
  const KEY='twitter-extra-photo-v1', STATE='twitter-extra-action-state-v1';
  const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch(e){return d}};
  const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  let photos=read(KEY,{}), states=read(STATE,{});
  const fileToData=file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
  function addEditorControls(){const cards=document.querySelectorAll('#tweets .tweet-card');cards.forEach((card,i)=>{if(card.querySelector('.tweet-photo-editor'))return;const box=document.createElement('div');box.className='field tweet-photo-editor';box.innerHTML='<label style="display:block;font-size:13px;font-weight:700;margin-bottom:6px">게시글 사진</label><input type="file" accept="image/*"><button type="button" class="tweet-photo-clear">사진 삭제</button>';card.appendChild(box);const input=box.querySelector('input'),clear=box.querySelector('button');input.addEventListener('change',async()=>{const f=input.files&&input.files[0];if(!f)return;photos[i]=await fileToData(f);write(KEY,photos);syncPreview()});clear.addEventListener('click',()=>{delete photos[i];write(KEY,photos);syncPreview();input.value=''})})}
  function syncPreview(){const feed=document.getElementById('feed');if(!feed)return;feed.querySelectorAll('.tweet').forEach((tweet,i)=>{let img=tweet.querySelector('.tweet-extra-photo'),src=photos[i];if(src){if(!img){img=document.createElement('img');img.className='tweet-extra-photo';const text=tweet.querySelector('.tweet-text');if(text)text.insertAdjacentElement('afterend',img);else tweet.appendChild(img)}img.src=src}else if(img)img.remove()});applyStates()}
  function applyStates(){const feed=document.getElementById('feed');if(!feed)return;feed.querySelectorAll('.tweet').forEach((tweet,i)=>tweet.querySelectorAll('.act').forEach((b,j)=>{const on=!!states[i+':'+j];b.classList.toggle('tw-extra-active',on);b.classList.toggle('tw-extra-repost',on&&j===1);b.classList.toggle('tw-extra-like',on&&j===2);b.classList.toggle('tw-extra-bookmark',on&&j===4)}))}
  function bindActions(){const feed=document.getElementById('feed');if(!feed||feed.dataset.extraBound)return;feed.dataset.extraBound='1';feed.addEventListener('click',e=>{const b=e.target.closest('.act');if(!b)return;const tweet=b.closest('.tweet');if(!tweet)return;const all=[...feed.querySelectorAll('.tweet')],i=all.indexOf(tweet),j=[...tweet.querySelectorAll('.act')].indexOf(b);if(j===1||j===2||j===4){const k=i+':'+j;states[k]=!states[k];write(STATE,states);setTimeout(applyStates,20)}})}
  function start(){addEditorControls();syncPreview();bindActions();const mo=new MutationObserver(()=>{addEditorControls();syncPreview()});const feed=document.getElementById('feed'),tweets=document.getElementById('tweets');if(feed)mo.observe(feed,{childList:true,subtree:true});if(tweets)mo.observe(tweets,{childList:true,subtree:true})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

</script>
