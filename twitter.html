<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>트위터 설정</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:5}.top a{color:#111;text-decoration:none;font-weight:700}.top h1{margin:auto;font-size:18px}.layout{width:min(760px,100%);margin:auto;padding:18px 10px 50px;display:flex;flex-direction:column;gap:18px}.preview-wrap{order:1}.settings{order:2}.stage{width:min(100%,390px);aspect-ratio:9/16;margin:auto;background:#fff;overflow:hidden;border:1px solid #ddd;box-shadow:0 8px 30px #0001}.screen{width:100%;height:100%;overflow:hidden;background:#fff}.twitter-head{height:13%;min-height:70px;border-bottom:1px solid #e5e7e9}.tabs{height:100%;display:flex;align-items:flex-end;justify-content:space-around}.tab{font-size:18px;color:#5f707b;font-weight:500;height:58%;display:flex;align-items:center;position:relative}.tab.active{font-weight:800;color:#111}.tab.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:#1d9bf0;border-radius:4px}.feed{height:87%;overflow:hidden}.tweet{position:relative;padding:17px 15px 15px 72px;border-bottom:1px solid #e3e5e7;min-height:18%;background:#fff}.avatar{position:absolute;left:15px;top:18px;width:45px;height:45px;border-radius:50%;object-fit:cover;background:#e9ecef}.identity{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;padding-right:18px}.name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis}.handle,.time{color:#60727d;font-size:13px}.lock{width:16px;height:16px;display:inline-block;flex:0 0 16px;position:relative;margin-left:1px}.lock:before{content:"";position:absolute;left:2px;top:6px;width:12px;height:9px;background:#111;border-radius:2px}.lock:after{content:"";position:absolute;left:4px;top:1px;width:8px;height:9px;border:3px solid #111;border-bottom:0;border-radius:7px 7px 0 0}.more{position:absolute;right:14px;top:17px;color:#647783}.tweet-text{font-size:16px;line-height:1.4;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:repeat(6,1fr);margin-top:11px;color:#647783}.act{display:flex;justify-content:center;align-items:center;gap:3px;font-size:11px;min-width:0}.ico{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center}.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.empty{color:#c8ced2}.section{background:#fff;border:1px solid #dedbd6;border-radius:16px;padding:18px 15px;margin-bottom:12px}.section h2{font-size:15px;margin:0 0 13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d8dce0;border-radius:10px;padding:10px;outline:none;background:#fff}.field textarea{min-height:75px;resize:vertical}.check{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:9px}.tweet-card{border:1px solid #e5e1db;border-radius:10px;padding:12px;margin:10px 0;background:#faf9f7}.tweet-head{display:flex;justify-content:space-between;align-items:center}.danger{color:#c62828;background:#fff0f0;border:1px solid #ffd4d4;border-radius:8px;padding:6px 9px;font-size:12px}.add,.save,.tool{width:100%;height:42px;border-radius:9px;border:1px solid #ddd;background:#fff;font-weight:700}.save{background:#111;color:#fff;border:0}.toolbar{display:flex;justify-content:flex-end;margin-bottom:8px}.tool{width:auto;padding:0 12px;height:36px;font-size:12px}input:not([type="checkbox"]):not([type="radio"]),textarea,select{font-size:16px!important}@media(max-width:560px){.row{grid-template-columns:1fr}.top{height:56px}.section{padding:16px 14px}.tweet-text{font-size:16px}}</style></head><body><header class="top"><a href="index.html">← 홈</a><h1>트위터 설정</h1><span style="width:34px"></span></header><main class="layout"><section class="preview-wrap"><div class="toolbar"><button class="tool" id="reset">기본값 복원</button></div><div class="stage"><div class="screen" id="screen"><div class="twitter-head"><div class="tabs"><div class="tab" id="pvTab1"></div><div class="tab active" id="pvTab2"></div></div></div><div class="feed" id="feed"></div></div></div></section><section class="settings"><div class="section"><h2>기본 정보</h2><div class="row"><div class="field"><label>첫 번째 탭</label><input id="tab1"></div><div class="field"><label>두 번째 탭</label><input id="tab2"></div></div><label class="check"><input id="activeTab" type="checkbox"><span>두 번째 탭을 활성화</span></label></div><div class="section"><h2>게시글</h2><div id="tweets"></div><button class="add" id="addTweet">＋ 게시글 추가</button></div><div class="section"><h2>화면 표시</h2><div class="row"><div class="field"><label>피드 배경색</label><input id="bg" type="color"></div><div class="field"><label>글 크기</label><select id="scale"><option value="normal">기본</option><option value="large">크게</option></select></div></div></div><button class="save" id="savePng">PNG로 저장</button></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>(function(){'use strict';const $=id=>document.getElementById(id),KEY='twitter-editor-v2';const blank=()=>({name:'여기에 이름을 입력하세요.',handle:'@username***',time:'여기에 시간을 입력하세요.',text:'여기에 게시글을 입력하세요.',reply:'',repost:'',like:'',views:'',avatar:'',lock:true});function defaults(){return{tab1:'추천',tab2:'팔로잉',activeTab:true,bg:'#ffffff',scale:'normal',tweets:[blank(),blank(),blank()]}}function normalize(x){const d=defaults();if(!x||typeof x!=='object')return d;x.tweets=Array.isArray(x.tweets)&&x.tweets.length?x.tweets.map(t=>Object.assign(blank(),t||{})):d.tweets;x.tab1=String(x.tab1??d.tab1);x.tab2=String(x.tab2??d.tab2);x.activeTab=x.activeTab!==false;x.bg=/^#[0-9a-fA-F]{6}$/.test(x.bg)?x.bg:d.bg;x.scale=x.scale==='large'?'large':'normal';return x}function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return defaults()}}let S=load();function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]||c))}const icon={reply:'<svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 3v-5.1A7.5 7.5 0 1 1 20 11.5Z"/></svg>',repost:'<svg viewBox="0 0 24 24"><path d="M7 7h10l-3-3m3 3-3 3M17 17H7l3 3m-3-3 3-3"/></svg>',like:'<svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"/></svg>',views:'<svg viewBox="0 0 24 24"><path d="M4 20V10M9 20V5M14 20v-8M19 20V2"/></svg>',bookmark:'<svg viewBox="0 0 24 24"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4Z"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="M12 16V3m0 0L7 8m5-5 5 5M5 13v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>'};function renderEditor(){$('tab1').value=S.tab1;$('tab2').value=S.tab2;$('activeTab').checked=S.activeTab;$('bg').value=S.bg;$('scale').value=S.scale;const box=$('tweets');box.innerHTML='';S.tweets.forEach((t,i)=>{const c=document.createElement('div');c.className='tweet-card';c.innerHTML='<div class="tweet-head"><b>게시글 '+(i+1)+'</b>'+(S.tweets.length>1?'<button class="danger" data-del="'+i+'">삭제</button>':'')+'</div><div class="row"><div class="field"><label>이름</label><input data-i="'+i+'" data-k="name"></div><div class="field"><label>아이디</label><input data-i="'+i+'" data-k="handle"></div></div><div class="row"><div class="field"><label>작성 시간</label><input data-i="'+i+'" data-k="time"></div><div class="field"><label>프로필 사진 URL</label><input data-i="'+i+'" data-k="avatar"></div></div><div class="field"><label>게시글 내용</label><textarea data-i="'+i+'" data-k="text"></textarea></div><div class="row"><div class="field"><label>댓글 수</label><input data-i="'+i+'" data-k="reply"></div><div class="field"><label>리포스트 수</label><input data-i="'+i+'" data-k="repost"></div></div><div class="row"><div class="field"><label>좋아요 수</label><input data-i="'+i+'" data-k="like"></div><div class="field"><label>조회 수</label><input data-i="'+i+'" data-k="views"></div></div><label class="check"><input type="checkbox" data-i="'+i+'" data-k="lock"><span>비공개 계정 자물쇠 표시</span></label>';box.appendChild(c);c.querySelectorAll('[data-i][data-k]').forEach(el=>{const k=el.dataset.k;if(el.type==='checkbox')el.checked=!!t[k];else el.value=t[k]??'';el.addEventListener('input',e=>{S.tweets[i][k]=e.target.type==='checkbox'?e.target.checked:e.target.value;persist();renderPreview()});el.addEventListener('change',e=>{S.tweets[i][k]=e.target.type==='checkbox'?e.target.checked:e.target.value;persist();renderPreview()})})});box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.tweets.splice(+b.dataset.del,1);persist();renderEditor();renderPreview()})}function renderPreview(){$('pvTab1').textContent=S.tab1;$('pvTab2').textContent=S.tab2;$('pvTab1').classList.toggle('active',!S.activeTab);$('pvTab2').classList.toggle('active',S.activeTab);$('screen').dataset.scale=S.scale;$('screen').style.background=S.bg;$('feed').style.background=S.bg;$('feed').innerHTML=S.tweets.map(t=>'<article class="tweet"><img class="avatar" src="'+esc(t.avatar)+'" onerror="this.style.display=\'none\'"><div class="identity"><span class="name">'+esc(t.name)+'</span>'+(t.lock?'<span class="lock" aria-label="비공개 계정"></span>':'')+'<span class="handle">'+esc(t.handle)+'</span><span class="time">· '+esc(t.time)+'</span></div><span class="more">•••</span><div class="tweet-text">'+esc(t.text)+'</div><div class="actions"><span class="act '+(t.reply?'':'empty')+'"><i class="ico">'+icon.reply+'</i><span>'+esc(t.reply)+'</span></span><span class="act '+(t.repost?'':'empty')+'"><i class="ico">'+icon.repost+'</i><span>'+esc(t.repost)+'</span></span><span class="act '+(t.like?'':'empty')+'"><i class="ico">'+icon.like+'</i><span>'+esc(t.like)+'</span></span><span class="act '+(t.views?'':'empty')+'"><i class="ico">'+icon.views+'</i><span>'+esc(t.views)+'</span></span><span class="act"><i class="ico">'+icon.bookmark+'</i></span><span class="act"><i class="ico">'+icon.share+'</i></span></div></article>').join('')}function render(){renderEditor();renderPreview()}['tab1','tab2','bg','scale'].forEach(id=>$(id).addEventListener('input',e=>{S[id]=e.target.value;persist();renderPreview()}));$('activeTab').addEventListener('change',e=>{S.activeTab=e.target.checked;persist();renderPreview()});$('addTweet').addEventListener('click',()=>{S.tweets.push(blank());persist();renderEditor();renderPreview()});$('reset').addEventListener('click',()=>{if(confirm('기본값으로 복원할까요?')){S=defaults();persist();render()}});$('savePng').addEventListener('click',async()=>{const c=await html2canvas($('screen'),{scale:3,useCORS:true,backgroundColor:'#fff'});const a=document.createElement('a');a.download='twitter.png';a.href=c.toDataURL('image/png');a.click()});render()})();</script></body></html>
